#config_version=6

##############################################################################
# BALL SAVE CONFIGURATION - Top Gun Pinball
##############################################################################
#
# This file defines two ball save devices:
#   1. new_ball_save - 10-second save at start of each ball (single use)
#   2. mode_ball_save - Variable duration save triggered by modes
#
# ADD THIS FILE TO config.yaml:
#   config:
#     - config_ball_saves.yaml
#
# ALSO ADD ball_save to modes list in config.yaml:
#   modes:
#     - ball_save
#
##############################################################################

ball_saves:
  ##############################################################################
  # NEW BALL BALL SAVE
  # - Activates at start of each ball
  # - 10 second duration
  # - Single use (ends after first save)
  # - Plays "ball_saved" Godot scene when triggered
  ##############################################################################
  new_ball_save:
    active_time: 20s
    hurry_up_time: 2s             # Last 2 seconds = grace period (light off)
    grace_period: 500ms           # Brief window after drain detection
    auto_launch: false             # Handled by 1s delay timer in ball_save.yaml
    balls_to_save: -1             # Unlimited saves for full 20s duration
    enable_events: ball_save_new_ball_enable
    early_ball_save_events: s_outlane_left_active, s_outlane_right_active
    # s_mode_start_active: any scoop entry = player made a deliberate shot,
    # so the new-ball "get it to a flipper" save is no longer needed.
    # mode_ball_save takes over on the scoop kick-out.
    # (Training missions end it from ball_save.yaml event_player.)
    disable_events: ball_save_new_ball_disable, s_mode_start_active
    timer_start_events: ball_save_new_ball_timer_start
    debug: true

  ##############################################################################
  # MODE BALL SAVE
  # - Variable duration (controlled by separate timer in ball_save mode)
  # - Can be triggered by any mode (multiball, mode start fairness, etc.)
  # - No scene played (silent save)
  # - UNLIMITED saves during active time (good for multiball)
  # - Max active_time is 60s, actual duration controlled by mode timer
  ##############################################################################
  mode_ball_save:
    active_time: 60s              # Maximum duration - actual controlled by timer
    hurry_up_time: 2s             # Last 2 seconds = grace period (light off)
    grace_period: 500ms           # Brief window after drain detection
    auto_launch: false             # Handled by 1s delay timer in ball_save.yaml
    balls_to_save: -1             # UNLIMITED saves during active time
    enable_events: ball_save_mode_timer_start
    early_ball_save_events: s_outlane_left_active, s_outlane_right_active
    disable_events: ball_save_mode_disable, timer_mode_ball_save_countdown_complete
    debug: true

  ##############################################################################
  # SCOOP EJECT SAFETY SAVE
  # - 5 second ball save after EVERY mode scoop eject
  # - Prevents unfair drains from slingshot deflections or weak kick-outs
  # - Fully automatic: enables + starts when scoop kicks ball out
  # - Single save per eject (re-enables on next eject)
  # - Silent save (no "ball saved" scene) - just a safety net
  # - Stacks safely with new_ball_save and mode_ball_save
  ##############################################################################
  scoop_eject_save:
    active_time: 5s
    grace_period: 500ms
    auto_launch: false             # Handled by 1s delay timer in ball_save.yaml
    balls_to_save: 1
    # Enabled by: scoop kickout (start of mode) OR virtual lock award (ball
    # unexpectedly returns to player since lock position was already occupied)
    # OR pilot_training_mission_inverted dropping to its last ball (gives the
    # player a window to get back to normal flippers without losing the ball).
    enable_events: balldevice_bd_mode_scoop_ejecting_ball, lock_goose_virtual_locked, lock_mav_virtual_locked, pilot_training_mission_inverted_last_ball_scoop_save
    # Gated to stand down whenever mode_ball_save is also enabled — otherwise
    # a single outlane drain satisfies BOTH devices' early_ball_save condition
    # at once (they were both listening to the same raw switch), and each one
    # independently commands the trough to eject a ball, kicking out two balls
    # for one drain. mode_ball_save is "the real one" (see priority note in
    # ball_save.yaml's SCOOP EJECT SAVE LIGHT FLASH section), so it wins.
    # Also stands down while new_ball_save is enabled — a virtual lock award
    # (lock_goose/mav_virtual_locked) in the first 20s of a ball enables this
    # device while new_ball_save is still armed, and one outlane hit would
    # otherwise trigger BOTH early saves (two trough ejects, two videos).
    #
    # FORMAT WARNING: each conditional event MUST be a single-line YAML list
    # item. MPF splits string event lists with a regex whose '.' does not
    # match newlines, so a condition wrapped across lines (e.g. with '>')
    # silently degrades into the BARE event with no condition at all.
    early_ball_save_events:
      - s_outlane_left_active{device.ball_saves.mode_ball_save.enabled==False and device.ball_saves.new_ball_save.enabled==False}
      - s_outlane_right_active{device.ball_saves.mode_ball_save.enabled==False and device.ball_saves.new_ball_save.enabled==False}
    debug: true

  ##############################################################################
  # LEFT ORBIT SAFE RETURN - OUTLANE SAVE
  # - Global routine, lives in base.yaml (not a mode-scoped file)
  # - Armed the instant the right lane post drops after a lit left-orbit
  #   safe-return shot (timer_right_lane_post_hold_complete in base.yaml)
  # - If s_outlane_right is the FIRST switch to fire after that: SAVE
  #   (base.yaml posts right_lane_ball_save_hit)
  # - If any OTHER switch fires first: CANCEL, no save
  #   (base.yaml posts right_lane_ball_save_cancel)
  # - No visual warning — silent save, hurry_up/grace kept minimal on purpose
  ##############################################################################
  orbit_left_safe_return_save:
    active_time: 5s
    hurry_up_time: 0s
    grace_period: 0s
    auto_launch: true
    balls_to_save: 1
    # Enabled at ARM (post drop), not HIT (outlane switch) — enabling on the
    # hit event is always one event too late to also catch that same switch
    # as an early_ball_save_event. Arming here means the device is already
    # listening by the time the outlane switch can possibly fire.
    enable_events: right_lane_ball_save_watch_armed
    # Fires the replacement immediately on the outlane hit instead of waiting
    # for the ball to physically reach the trough. Gated to the armed window
    # (matches base.yaml's own pending check) and stands down if new_ball_save
    # or mode_ball_save are also currently enabled, so we don't stack a third
    # independent early-save claim onto the same switch event.
    # Single-line list item on purpose — see FORMAT WARNING in scoop_eject_save.
    early_ball_save_events:
      - s_outlane_right_active{current_player.right_lane_ball_save_pending==1 and device.ball_saves.new_ball_save.enabled==False and device.ball_saves.mode_ball_save.enabled==False}
    # Custom disable_events overrides (doesn't merge with) the default list,
    # so ball_will_end is added back explicitly as a safety net.
    disable_events: right_lane_ball_save_cancel, ball_will_end
    debug: true