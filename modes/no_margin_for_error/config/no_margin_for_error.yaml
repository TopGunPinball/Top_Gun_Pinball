          color: FFFF00
        l_gi_light_9:
          color: FFFF00
        l_gi_light_10:
          color: FFFF00
        l_gi_light_11:
          color: FFFF00
        l_gi_light_12:
          color: FFFF00
        l_gi_light_13:
          color: FFFF00
        l_gi_light_14:
