#config_version=6

####################################################################################
# NO MARGIN FOR ERROR - PILOT MISSION MODE
# Timer: 180 seconds countdown | Steps: 11 | GI: Yellow
# Scoring: Direct to score (multiplier applied)
# Flipper Mechanic: Bad shots = no-hold flippers for 10s (resets on each bad shot)
#                   Good shot = immediately restores normal flippers
# Music: Controlled in base.yaml
#
# STEP SEQUENCE (nmfe_step = steps completed):
# Step 1  (step==0):  ALL Phase 1 shots lit — Phase 1 begins
# Steps 2-6 (step==1..5): Phase 1 — DYNAMIC BURNING SYSTEM
#                     Each shot hit becomes BAD (red) for the rest of Phase 1.
#                     EXCEPTION: hitting the spinner makes it DARK (neutral,
#                     no penalty) — not bad. Forces variety in shot selection.
# Step 7  (step==6):  LR, SP, LO lit only — Phase 2 begins (lighting fully reset)
# Step 8  (step==7):  TWR, TL, TO, RR lit; TOP RAMP UP
# Step 9  (step==8):  SP, CNT, TWR lit; TOP RAMP DOWN
# Step 10 (step==9):  LO, LR lit only
# Step 11 (step==10): SP, TL, RO lit; RIGHT RAMP UP (final shot)
#                     Won when shot made; video plays when ball enters left lane
#
# PHASE 1 BURN FLAGS (player vars, reset on mode_started):
#   nmfe_ll_burned, nmfe_lo_burned, nmfe_lr_burned, nmfe_sp_burned, nmfe_cnt_burned,
#   nmfe_twr_burned, nmfe_tl_burned, nmfe_tr_burned, nmfe_rr_burned
#   (TO/RO can't physically fire in Phase 1; no flags needed)
#
# MISSILES PERK in Phase 1: burns one shot from priority list (skipping already
#   burned shots). Order: SP → LL → RR → LO → LR → CNT → TWR
#
# SCORING (direct, multiplier applied):
# 1: 200K  2: 375K  3: 525K  4: 650K  5: 725K  6: 800K
# 7: 875K  8: 950K  9: 1,025K  10: 1,125K  11: 1,250K  TOTAL: 8,500,000
#
# SLIDES (Godot):
#   no_margin_for_error_intro       — intro video (43s, skippable)
#   no_margin_for_error_timer       — var: device.timers.nmfe_timer.ticks
#   no_margin_for_error_shots_remaining — var: player nmfe_shots_remaining
#   no_margin_for_error_step_1 through step_10 — step videos
#   no_margin_for_error_no_hold_penalty — var: player nmfe_no_hold_timer_ticks
#   no_margin_for_error_won         — won video (18s, ball held by post)
#   no_margin_for_error_lost        — lost video (14s)
#   mode_points_scored              — var: player mode_points_scored
#
# PENALTY GI STROBE LIGHTS (red during no-hold penalty):
#   l_gi_light_1, l_gi_light_2, l_gi_light_3, l_gi_light_4
#   l_gi_light_18, l_gi_light_19, l_gi_light_20, l_gi_light_21
#
# ADJUSTABLE TIMING:
#   Mode timer:         180s  (nmfe_timer start_value)
#   Intro video:         43s  (nmfe_intro_video_delay end_value)
#   No-hold penalty:     10s  (nmfe_no_hold_timer start_value)
#   Left diverter hold:   3s  (nmfe_left_diverter_timer end_value)
#   Won video hold:      18s  (nmfe_complete_delay end_value)
#   Lost video:          14s  (nmfe_failed_delay end_value)
#   Drain delay:          5s  (nmfe_drain_delay end_value)
####################################################################################

mode:
  start_events: start_mode_no_margin_for_error
  stop_events:
    - timer_nmfe_complete_delay_complete
    - timer_nmfe_failed_delay_complete
    - nmfe_drain_cleanup_complete
  priority: 600
  game_mode: true
  use_wait_queue: true

mode_settings:
  can_stack_with_multiball: true

####################################################################################
# BALL HOLDS
####################################################################################

ball_holds:
  nmfe_scoop_hold:
    balls_to_hold: 1
    hold_devices: bd_mode_scoop
    enable_events:
      - mode_no_margin_for_error_started
    release_one_events:
      - nmfe_ball_released
    release_all_events:
      - mode_no_margin_for_error_will_stop

####################################################################################
# TIMERS
####################################################################################

timers:

  # Main mode countdown — starts on ball release (NOT mode start, avoids scoop bounce)
  nmfe_timer:
    start_value: 180
    end_value: 0
    direction: down
    tick_interval: 1s
    control_events:
      - event: nmfe_ball_released
        action: start
      - event: nmfe_step_11_complete
        action: stop
      - event: nmfe_failed
        action: stop
      - event: nmfe_drain_detected
        action: stop
      - event: afterburner_extend_nmfe_timer
        action: jump
        value: 9999
      - event: lock_sequence_timer_pause
        action: pause
      - event: lock_sequence_timer_resume
        action: start

  # Intro video — 43 seconds, skippable via both flippers
  nmfe_intro_video_delay:
    start_value: 0
    end_value: 43
    direction: up
    tick_interval: 1s
    control_events:
      - event: mode_no_margin_for_error_started
        action: start
      - event: nmfe_skip_intro
        action: stop

  # Barrier release delay — ensures barrier physically drops before ball arrives
  nmfe_barrier_delay:
    start_value: 0
    end_value: 2
    direction: up
    tick_interval: 1s
    control_events:
      - event: nmfe_ball_released
        action: restart

  # No-hold penalty countdown — 10s, restarts on each additional bad shot
  nmfe_no_hold_timer:
    start_value: 10
    end_value: 0
    direction: down
    tick_interval: 1s
    control_events:
      - event: nmfe_penalty_activate
        action: restart
      - event: nmfe_no_hold_end
        action: stop
      - event: nmfe_cleanup
        action: stop

  # Left orbit diverter hold — 3s, restarts on each step 11 re-shot attempt
  nmfe_left_diverter_timer:
    start_value: 0
    end_value: 3
    direction: up
    tick_interval: 1s
    control_events:
      - event: nmfe_activate_won_catch
        action: restart
      - event: nmfe_preemptive_open_diverter
        action: restart

  # Won video hold — 18s, ball held by left lane post
  nmfe_complete_delay:
    start_value: 0
    end_value: 18
    direction: up
    tick_interval: 1s
    control_events:
      - event: nmfe_won
        action: start

  # Lost video delay — 14s
  nmfe_failed_delay:
    start_value: 0
    end_value: 14
    direction: up
    tick_interval: 1s
    control_events:
      - event: nmfe_failed
        action: start

  # Drain cleanup delay — holds ball_ending queue while lost video plays
  nmfe_drain_delay:
    start_value: 0
    end_value: 5
    direction: up
    tick_interval: 1s
    control_events:
      - event: nmfe_drain_detected
        action: start

  # Servo stagger — fires top_ramp_down 500ms after nmfe_cleanup
  # (right_ramp_down fires immediately on nmfe_cleanup in event_player)
  nmfe_servo_cleanup_delay:
    start_value: 0
    end_value: 1
    direction: up
    tick_interval: 500ms
    control_events:
      - event: nmfe_cleanup
        action: restart

####################################################################################
# QUEUE RELAY PLAYER
####################################################################################

queue_relay_player:
  ball_ending{mode.no_margin_for_error.active==True}:
    post: nmfe_ball_ending_hold
    wait_for: nmfe_drain_cleanup_complete
    priority: 1000


####################################################################################
# VARIABLE PLAYER
####################################################################################

variable_player:

  mode_no_margin_for_error_started:
    pilot_mode_active:
      action: set
      int: 1
    letter_collection_paused:
      action: set
      int: 1
    pilot_missions_played:
      action: add
      int: 1
    mode_no_margin_for_error_played:
      action: set
      int: 1
    missiles_perk_blocked:
      action: set
      int: 0
    bonus_delay_time:
      action: set
      int: 5
    nmfe_step:
      action: set
      int: 0
    nmfe_complete_flag:
      action: set
      int: 0
    nmfe_shots_remaining:
      action: set
      int: 11
    nmfe_no_hold_active:
      action: set
      int: 0
    nmfe_no_hold_timer_ticks:
      action: set
      int: 10
    mode_points_scored:
      action: set
      int: 0
    # Phase 1 burn flags — each shot becomes "burned" (bad, or dark for spinner)
    # once it has been hit successfully during steps 1-6
    nmfe_ll_burned:
      action: set
      int: 0
    nmfe_lo_burned:
      action: set
      int: 0
    nmfe_lr_burned:
      action: set
      int: 0
    nmfe_sp_burned:
      action: set
      int: 0
    nmfe_cnt_burned:
      action: set
      int: 0
    nmfe_twr_burned:
      action: set
      int: 0
    nmfe_tl_burned:
      action: set
      int: 0
    nmfe_tr_burned:
      action: set
      int: 0
    nmfe_rr_burned:
      action: set
      int: 0

  # Phase 1 burn variable handlers — each event sets its own burn flag
  nmfe_burn_ll:
    nmfe_ll_burned:
      action: set
      int: 1
  nmfe_burn_lo:
    nmfe_lo_burned:
      action: set
      int: 1
  nmfe_burn_lr:
    nmfe_lr_burned:
      action: set
      int: 1
  nmfe_burn_sp:
    nmfe_sp_burned:
      action: set
      int: 1
  nmfe_burn_cnt:
    nmfe_cnt_burned:
      action: set
      int: 1
  nmfe_burn_twr:
    nmfe_twr_burned:
      action: set
      int: 1
  nmfe_burn_tl:
    nmfe_tl_burned:
      action: set
      int: 1
  nmfe_burn_tr:
    nmfe_tr_burned:
      action: set
      int: 1
  nmfe_burn_rr:
    nmfe_rr_burned:
      action: set
      int: 1

  # Penalty timer display variable — updates every tick for Godot slide
  timer_nmfe_no_hold_timer_tick:
    nmfe_no_hold_timer_ticks:
      action: set
      int: device.timers.nmfe_no_hold_timer.ticks

  # Main mode timer display variable — updates every tick for Godot slide
  timer_nmfe_timer_tick:
    nmfe_timer_ticks:
      action: set
      int: device.timers.nmfe_timer.ticks

  # Track no-hold active state
  nmfe_penalty_activate:
    nmfe_no_hold_active:
      action: set
      int: 1

  nmfe_no_hold_end:
    nmfe_no_hold_active:
      action: set
      int: 0

  # Mark drain pending so qualifier routes bonus correctly
  ball_will_end{mode.no_margin_for_error.active==True}:
    pilot_mode_drain_pending:
      action: set
      int: 1

  # Safety clear of no-hold flag on timer expiry
  timer_nmfe_timer_complete:
    nmfe_no_hold_active:
      action: set
      int: 0

  ##############################################
  ## STEP COMPLETIONS — Direct to score
  ##############################################

  nmfe_step_1_complete:
    nmfe_step:
      action: set
      int: 1
    score:
      action: add
      int: 250000 * current_player.total_scoring_multiplier
    mode_points_scored:
      action: set
      int: 250000 * current_player.total_scoring_multiplier
    nmfe_shots_remaining:
      action: add
      int: -1

  nmfe_step_2_complete:
    nmfe_step:
      action: set
      int: 2
    score:
      action: add
      int: 475000 * current_player.total_scoring_multiplier
    mode_points_scored:
      action: set
      int: 475000 * current_player.total_scoring_multiplier
    nmfe_shots_remaining:
      action: add
      int: -1

  nmfe_step_3_complete:
    nmfe_step:
      action: set
      int: 3
    score:
      action: add
      int: 675000 * current_player.total_scoring_multiplier
    mode_points_scored:
      action: set
      int: 675000 * current_player.total_scoring_multiplier
    nmfe_shots_remaining:
      action: add
      int: -1

  nmfe_step_4_complete:
    nmfe_step:
      action: set
      int: 4
    score:
      action: add
      int: 850000 * current_player.total_scoring_multiplier
    mode_points_scored:
      action: set
      int: 850000 * current_player.total_scoring_multiplier
    nmfe_shots_remaining:
      action: add
      int: -1

  nmfe_step_5_complete:
    nmfe_step:
      action: set
      int: 5
    score:
      action: add
      int: 950000 * current_player.total_scoring_multiplier
    mode_points_scored:
      action: set
      int: 950000 * current_player.total_scoring_multiplier
    nmfe_shots_remaining:
      action: add
      int: -1

  nmfe_step_6_complete:
    nmfe_step:
      action: set
      int: 6
    score:
      action: add
      int: 1050000 * current_player.total_scoring_multiplier
    mode_points_scored:
      action: set
      int: 1050000 * current_player.total_scoring_multiplier
    nmfe_shots_remaining:
      action: add
      int: -1

  nmfe_step_7_complete:
    nmfe_step:
      action: set
      int: 7
    score:
      action: add
      int: 1150000 * current_player.total_scoring_multiplier
    mode_points_scored:
      action: set
      int: 1150000 * current_player.total_scoring_multiplier
    nmfe_shots_remaining:
      action: add
      int: -1

  nmfe_step_8_complete:
    nmfe_step:
      action: set
      int: 8
    score:
      action: add
      int: 1250000 * current_player.total_scoring_multiplier
    mode_points_scored:
      action: set
      int: 1250000 * current_player.total_scoring_multiplier
    nmfe_shots_remaining:
      action: add
      int: -1

  nmfe_step_9_complete:
    nmfe_step:
      action: set
      int: 9
    score:
      action: add
      int: 1350000 * current_player.total_scoring_multiplier
    mode_points_scored:
      action: set
      int: 1350000 * current_player.total_scoring_multiplier
    nmfe_shots_remaining:
      action: add
      int: -1

  nmfe_step_10_complete:
    nmfe_step:
      action: set
      int: 10
    score:
      action: add
      int: 1450000 * current_player.total_scoring_multiplier
    mode_points_scored:
      action: set
      int: 1450000 * current_player.total_scoring_multiplier
    nmfe_shots_remaining:
      action: add
      int: -1

  # Step 11: sets step=11 (won-but-waiting for ball to reach left lane)
  nmfe_step_11_complete:
    nmfe_step:
      action: set
      int: 11
    nmfe_complete_flag:
      action: set
      int: 1
    score:
      action: add
      int: 1550000 * current_player.total_scoring_multiplier
    mode_points_scored:
      action: set
      int: 1550000 * current_player.total_scoring_multiplier
    nmfe_shots_remaining:
      action: add
      int: -1

  # Won confirmed — ball entered left lane while step==11
  nmfe_won:
    pilot_missions_won:
      action: add
      int: 1
    mode_no_margin_for_error_won:
      action: set
      int: 1
    mode_no_margin_for_error_complete:
      action: set
      int: 1
    modes_completed_count:
      action: add
      int: 1
    missiles_perk_saved:
      action: set
      int: current_player.missiles_perk_active
    missiles_perk_active:
      action: set
      int: 0


####################################################################################
# EVENT PLAYER
####################################################################################

event_player:

  ##############################################
  ## MODE START — GI yellow after 200ms settle, raise barrier during intro
  ##############################################
  mode_no_margin_for_error_started:
    - nmfe_set_gi_yellow|200ms
    - barrier_raise

  ##############################################
  ## SKIP INTRO — Both flippers during 43s intro
  ##############################################
  s_flipper_left_active{current_player.nmfe_step==0 and device.timers.nmfe_intro_video_delay.running}:
    - nmfe_check_skip_intro
  s_flipper_right_active{current_player.nmfe_step==0 and device.timers.nmfe_intro_video_delay.running}:
    - nmfe_check_skip_intro

  nmfe_check_skip_intro{device.switches.s_flipper_left.state and device.switches.s_flipper_right.state}:
    - nmfe_skip_intro

  # SKIP PATH — drop barrier first, kick ball 400ms later once barrier is physically down
  nmfe_skip_intro:
    - barrier_drop
    - scoop_ball_release|400ms
    - nmfe_ball_released|400ms
    - nmfe_setup_step_1|400ms

  # NORMAL PATH — drop barrier first, kick ball 400ms later
  timer_nmfe_intro_video_delay_complete:
    - barrier_drop
    - scoop_ball_release|400ms
    - nmfe_ball_released|400ms
    - nmfe_setup_step_1|400ms

  ##############################################
  ## BALL RELEASED — Ensure normal flippers active
  ##############################################
  nmfe_ball_released:
    - disable_no_hold_flippers
    - enable_normal_flippers

  nmfe_ball_released{current_player.afterburner_perk_active==1}:
    - afterburner_extend_nmfe_timer|500ms

  ##############################################
  ## NO-HOLD PENALTY SYSTEM
  ## nmfe_bad_shot fires nmfe_penalty_activate
  ## First activation (no_hold_active==0): swap flippers, show slide, start GI strobe
  ## Subsequent bad shots: timer restarts (variable_player handles this via nmfe_penalty_activate)
  ## Good shot or timer expire: nmfe_no_hold_end restores normal flippers
  ##############################################
  nmfe_bad_shot{current_player.nmfe_complete_flag==0}:
    - nmfe_penalty_activate

  nmfe_penalty_activate{current_player.nmfe_no_hold_active==0}:
    - disable_normal_flippers
    - enable_no_hold_flippers
    - nmfe_show_penalty_slide
    - nmfe_penalty_gi_start

  timer_nmfe_no_hold_timer_complete:
    - nmfe_no_hold_end

  nmfe_good_shot_hit{current_player.nmfe_no_hold_active==1}:
    - nmfe_no_hold_end

  nmfe_no_hold_end:
    - disable_no_hold_flippers
    - enable_normal_flippers

  ##############################################
  ## DRAIN HANDLING
  ##############################################
  nmfe_ball_ending_hold:
    - nmfe_failed
    - nmfe_drain_detected

  timer_nmfe_drain_delay_complete:
    - nmfe_drain_cleanup_complete
    - nmfe_cleanup

  ##############################################
  ## TIMER EXPIRED
  ##############################################
  timer_nmfe_timer_complete:
    - nmfe_failed

  ##############################################
  ## MODE WON — Ball enters left lane at step==11
  ## NOTE: nmfe_cleanup is NOT on nmfe_won — would kill won video same tick
  ## Cleanup fires AFTER 18s won video via timer_nmfe_complete_delay_complete
  ##############################################
  nmfe_won:
    - timer_nmfe_complete_delay_start
    - missiles_perk_unload
    - right_ramp_down

  timer_nmfe_complete_delay_complete:
    - nmfe_cleanup
    - pilot_mode_cleanup_complete

  ##############################################
  ## MODE FAILED
  ##############################################
  nmfe_failed:
    - nmfe_cleanup
    - timer_nmfe_failed_delay_start

  timer_nmfe_failed_delay_complete:
    - pilot_mode_cleanup_complete

  ##############################################
  ## STEP 11 WON-BUT-WAITING SEQUENCE
  ## Good shot at step==10: score, open diverter+post, wait for ball in left lane
  ## s_lane_left at step==11 confirms won, starts video timer
  ## Player re-shoots SP/TL/RO to retry until ball physically enters left lane
  ##############################################

  # Pre-emptive diverter open when right orbit switch fires at step==10
  # (ball already in orbit heading left, need diverter open before it arrives)
  s_orbit_right_active{current_player.nmfe_step==10}:
    - nmfe_preemptive_open_diverter

  # Same pre-emptive for re-shot attempts at step==11
  s_orbit_right_active{current_player.nmfe_step==11}:
    - nmfe_preemptive_open_diverter

  # Step 11 shot confirmed — opens diverter AND raises left lane post
  nmfe_step_11_complete:
    - nmfe_good_shot_hit
    - nmfe_step_11_shot_hit
    - nmfe_activate_won_catch

  # Diverter closes after 3s (timer fires nmfe_close_left_diverter)
  timer_nmfe_left_diverter_timer_complete:
    - nmfe_close_left_diverter

  # Ball confirmed in left lane — won video starts
  s_lane_left_active{current_player.nmfe_step==11}:
    - nmfe_won

  # Re-shots while waiting for ball: reopen diverter without scoring again
  spinner_shot_made{current_player.nmfe_step==11 and current_player.spinner_shot_locked==0}:
    - nmfe_activate_won_catch
  s_orbit_upper_active{current_player.nmfe_step==11}:
    - nmfe_activate_won_catch
  right_orbit_shot_hit{current_player.nmfe_step==11}:
    - nmfe_activate_won_catch

  ##############################################
  ## CLEANUP — Ramps down, flippers restored, coils off
  ## Servo stagger: right_ramp_down fires immediately on nmfe_cleanup
  ##               top_ramp_down fires 500ms later via nmfe_servo_cleanup_delay timer
  ##############################################
  nmfe_cleanup:
    - right_ramp_down
    - enable_normal_flippers
    - disable_no_hold_flippers
    - nmfe_close_left_diverter

  timer_nmfe_servo_cleanup_delay_complete:
    - top_ramp_down

  ##############################################
  ## SERVO EVENTS — Individual step ramp changes
  ##############################################
  nmfe_setup_step_8:
    - top_ramp_up

  nmfe_setup_step_9:
    - top_ramp_down

  nmfe_setup_step_11:
    - right_ramp_up

  ##############################################
  ## MISSILES PERK — Spots current step's primary good shot
  ## Phase 1 (steps 1-6): advances the step AND burns one shot from a priority list.
  ##   Priority order: SP, LL, RR, LO, LR, CNT, TWR (skips any already burned).
  ##   The lowest-tier non-burned shot in the list is burned.
  ## Phase 2 (steps 7-11): LR for step 7, TWR for step 8, SP for steps 9 and 11, LR for step 10.
  ## Step 11 also fires nmfe_complete to trigger the victory sequence.
  ##############################################

  # PHASE 1 perk handlers — advance step and trigger priority burn
  missiles_perk_complete_shot{current_player.nmfe_step==0 and current_player.nmfe_complete_flag==0}:
    - nmfe_step_1_complete
    - nmfe_good_shot_hit
    - nmfe_step_1_shot_hit
    - nmfe_perk_burn_phase1

  missiles_perk_complete_shot{current_player.nmfe_step==1 and current_player.nmfe_complete_flag==0}:
    - nmfe_step_2_complete
    - nmfe_good_shot_hit
    - nmfe_step_2_shot_hit
    - nmfe_perk_burn_phase1

  missiles_perk_complete_shot{current_player.nmfe_step==2 and current_player.nmfe_complete_flag==0}:
    - nmfe_step_3_complete
    - nmfe_good_shot_hit
    - nmfe_step_3_shot_hit
    - nmfe_perk_burn_phase1

  missiles_perk_complete_shot{current_player.nmfe_step==3 and current_player.nmfe_complete_flag==0}:
    - nmfe_step_4_complete
    - nmfe_good_shot_hit
    - nmfe_step_4_shot_hit
    - nmfe_perk_burn_phase1

  missiles_perk_complete_shot{current_player.nmfe_step==4 and current_player.nmfe_complete_flag==0}:
    - nmfe_step_5_complete
    - nmfe_good_shot_hit
    - nmfe_step_5_shot_hit
    - nmfe_perk_burn_phase1

  missiles_perk_complete_shot{current_player.nmfe_step==5 and current_player.nmfe_complete_flag==0}:
    - nmfe_step_6_complete
    - nmfe_good_shot_hit
    - nmfe_step_6_shot_hit
    - nmfe_perk_burn_phase1
    - nmfe_setup_step_7

  # PHASE 1 PERK BURN PRIORITY — finds the lowest-tier non-burned shot and burns it.
  # Conditions are mutually exclusive: each tier requires all higher-priority shots
  # to already be burned. At most one of these will match per perk use.
  nmfe_perk_burn_phase1{current_player.nmfe_sp_burned==0}:
    - nmfe_burn_sp
  nmfe_perk_burn_phase1{current_player.nmfe_sp_burned==1 and current_player.nmfe_ll_burned==0}:
    - nmfe_burn_ll
  nmfe_perk_burn_phase1{current_player.nmfe_sp_burned==1 and current_player.nmfe_ll_burned==1 and current_player.nmfe_rr_burned==0}:
    - nmfe_burn_rr
  nmfe_perk_burn_phase1{current_player.nmfe_sp_burned==1 and current_player.nmfe_ll_burned==1 and current_player.nmfe_rr_burned==1 and current_player.nmfe_lo_burned==0}:
    - nmfe_burn_lo
  nmfe_perk_burn_phase1{current_player.nmfe_sp_burned==1 and current_player.nmfe_ll_burned==1 and current_player.nmfe_rr_burned==1 and current_player.nmfe_lo_burned==1 and current_player.nmfe_lr_burned==0}:
    - nmfe_burn_lr
  nmfe_perk_burn_phase1{current_player.nmfe_sp_burned==1 and current_player.nmfe_ll_burned==1 and current_player.nmfe_rr_burned==1 and current_player.nmfe_lo_burned==1 and current_player.nmfe_lr_burned==1 and current_player.nmfe_cnt_burned==0}:
    - nmfe_burn_cnt
  nmfe_perk_burn_phase1{current_player.nmfe_sp_burned==1 and current_player.nmfe_ll_burned==1 and current_player.nmfe_rr_burned==1 and current_player.nmfe_lo_burned==1 and current_player.nmfe_lr_burned==1 and current_player.nmfe_cnt_burned==1 and current_player.nmfe_twr_burned==0}:
    - nmfe_burn_twr

  missiles_perk_complete_shot{current_player.nmfe_step==6 and current_player.nmfe_complete_flag==0}:
    - nmfe_step_7_complete
    - nmfe_good_shot_hit
    - nmfe_step_7_shot_hit
    - nmfe_setup_step_8

  missiles_perk_complete_shot{current_player.nmfe_step==7 and current_player.nmfe_complete_flag==0}:
    - nmfe_step_8_complete
    - nmfe_good_shot_hit
    - nmfe_step_8_shot_hit
    - nmfe_setup_step_9

  missiles_perk_complete_shot{current_player.nmfe_step==8 and current_player.nmfe_complete_flag==0}:
    - nmfe_step_9_complete
    - nmfe_good_shot_hit
    - nmfe_step_9_shot_hit
    - nmfe_setup_step_10

  missiles_perk_complete_shot{current_player.nmfe_step==9 and current_player.nmfe_complete_flag==0}:
    - nmfe_step_10_complete
    - nmfe_good_shot_hit
    - nmfe_step_10_shot_hit
    - nmfe_setup_step_11

  # Step 11 (nmfe_step==10) intentionally omitted — completion requires
  # ball to physically enter the left lane via diverter catch sequence.

  ##############################################
  ## PHASE 1 (STEPS 1-6) — DYNAMIC BURNING SYSTEM
  ##
  ## Each shot starts LIT (yellow). Hitting any shot in steps 1-6:
  ##   - Non-spinner shots: shot becomes BAD (red) for the rest of Phase 1
  ##   - Spinner: shot becomes DARK (not lit, not bad — neutral) for rest of Phase 1
  ##
  ## Each shot has a per-step "good" handler (advances step + burns the shot) and
  ## a "burned/bad" handler that fires nmfe_bad_shot regardless of step.
  ## Spinner has no bad handler — burned spinner simply does nothing.
  ##
  ## nmfe_advance_step is a helper that fires step_(N+1)_complete based on current step.
  ## At step==5 it also fires nmfe_setup_step_7 to transition into Phase 2.
  ##############################################

  ##############################################
  ## STEP ADVANCEMENT HELPER — fires correct step_N_complete based on current step
  ##############################################
  nmfe_advance_step{current_player.nmfe_step==0}:
    - nmfe_step_1_complete
    - nmfe_good_shot_hit
    - nmfe_step_1_shot_hit
  nmfe_advance_step{current_player.nmfe_step==1}:
    - nmfe_step_2_complete
    - nmfe_good_shot_hit
    - nmfe_step_2_shot_hit
  nmfe_advance_step{current_player.nmfe_step==2}:
    - nmfe_step_3_complete
    - nmfe_good_shot_hit
    - nmfe_step_3_shot_hit
  nmfe_advance_step{current_player.nmfe_step==3}:
    - nmfe_step_4_complete
    - nmfe_good_shot_hit
    - nmfe_step_4_shot_hit
  nmfe_advance_step{current_player.nmfe_step==4}:
    - nmfe_step_5_complete
    - nmfe_good_shot_hit
    - nmfe_step_5_shot_hit
  nmfe_advance_step{current_player.nmfe_step==5}:
    - nmfe_step_6_complete
    - nmfe_good_shot_hit
    - nmfe_step_6_shot_hit
    - nmfe_setup_step_7

  ##############################################
  ## LL — Left Lane (s_lane_left)
  ##############################################
  s_lane_left_active{current_player.nmfe_step<6 and current_player.nmfe_ll_burned==0}:
    - nmfe_advance_step
    - nmfe_burn_ll
  s_lane_left_active{current_player.nmfe_step<6 and current_player.nmfe_ll_burned==1}:
    - nmfe_bad_shot

  ##############################################
  ## LO — Left Orbit (composite shot)
  ##############################################
  left_orbit_shot_hit{current_player.nmfe_step<6 and current_player.nmfe_lo_burned==0}:
    - nmfe_advance_step
    - nmfe_burn_lo
  left_orbit_shot_hit{current_player.nmfe_step<6 and current_player.nmfe_lo_burned==1}:
    - nmfe_bad_shot

  ##############################################
  ## LR — Left Ramp (s_ramp_left_exit)
  ##############################################
  s_ramp_left_exit_active{current_player.nmfe_step<6 and current_player.nmfe_lr_burned==0}:
    - nmfe_advance_step
    - nmfe_burn_lr
  s_ramp_left_exit_active{current_player.nmfe_step<6 and current_player.nmfe_lr_burned==1}:
    - nmfe_bad_shot

  ##############################################
  ## SP — Spinner (composite — 3 spins)
  ## SPECIAL: when burned, the spinner becomes neutral (dark, no penalty)
  ## No bad handler — burned spinner hits do nothing.
  ##############################################
  spinner_shot_made{current_player.nmfe_step<6 and current_player.spinner_shot_locked==0 and current_player.nmfe_sp_burned==0}:
    - nmfe_advance_step
    - nmfe_burn_sp

  ##############################################
  ## CNT — Center Target / Barrier (s_barrier_target, barrier UP)
  ##############################################
  s_barrier_target_active{current_player.nmfe_step<6 and current_player.nmfe_cnt_burned==0}:
    - nmfe_advance_step
    - nmfe_burn_cnt
  s_barrier_target_active{current_player.nmfe_step<6 and current_player.nmfe_cnt_burned==1}:
    - nmfe_bad_shot

  ##############################################
  ## TWR — Tower Ramp (s_ramp_tower_exit)
  ##############################################
  s_ramp_tower_exit_active{current_player.nmfe_step<6 and current_player.nmfe_twr_burned==0}:
    - nmfe_advance_step
    - nmfe_burn_twr
  s_ramp_tower_exit_active{current_player.nmfe_step<6 and current_player.nmfe_twr_burned==1}:
    - nmfe_bad_shot

  ##############################################
  ## TL — Upper Orbit / Top Left (s_orbit_upper)
  ##############################################
  s_orbit_upper_active{current_player.nmfe_step<6 and current_player.nmfe_tl_burned==0}:
    - nmfe_advance_step
    - nmfe_burn_tl
  s_orbit_upper_active{current_player.nmfe_step<6 and current_player.nmfe_tl_burned==1}:
    - nmfe_bad_shot

  ##############################################
  ## TR — Top Ramp Inner Exit (s_ramp_inner_exit, top ramp DOWN)
  ## Shares light (l_shot_middle_ramp) with TO — burn uses nmfe_r_to_tr key.
  ##############################################
  s_ramp_inner_exit_active{current_player.nmfe_step<6 and current_player.nmfe_tr_burned==0}:
    - nmfe_advance_step
    - nmfe_burn_tr
  s_ramp_inner_exit_active{current_player.nmfe_step<6 and current_player.nmfe_tr_burned==1}:
    - nmfe_bad_shot

  ##############################################
  ## RR — Right Ramp (s_ramp_right_exit, right ramp DOWN)
  ## Shares light (l_shot_right_orbit) with RO — burn uses nmfe_r_ro_rr key.
  ## RO can't physically fire in Phase 1 (right ramp is down), so no handler.
  ##############################################
  s_ramp_right_exit_active{current_player.nmfe_step<6 and current_player.nmfe_rr_burned==0}:
    - nmfe_advance_step
    - nmfe_burn_rr
  s_ramp_right_exit_active{current_player.nmfe_step<6 and current_player.nmfe_rr_burned==1}:
    - nmfe_bad_shot

  ##############################################
  ## STEP 7 — LR SP LO lit only; rest bad
  ##############################################
  s_ramp_left_exit_active{current_player.nmfe_step==6}:
    - nmfe_step_7_complete
    - nmfe_good_shot_hit
    - nmfe_step_7_shot_hit
    - nmfe_setup_step_8
  spinner_shot_made{current_player.nmfe_step==6 and current_player.spinner_shot_locked==0}:
    - nmfe_step_7_complete
    - nmfe_good_shot_hit
    - nmfe_step_7_shot_hit
    - nmfe_setup_step_8
  left_orbit_shot_hit{current_player.nmfe_step==6}:
    - nmfe_step_7_complete
    - nmfe_good_shot_hit
    - nmfe_step_7_shot_hit
    - nmfe_setup_step_8
  # BAD
  s_lane_left_active{current_player.nmfe_step==6}:
    - nmfe_bad_shot
  s_barrier_target_active{current_player.nmfe_step==6}:
    - nmfe_bad_shot
  s_ramp_tower_exit_active{current_player.nmfe_step==6}:
    - nmfe_bad_shot
  s_orbit_upper_active{current_player.nmfe_step==6}:
    - nmfe_bad_shot
  s_orbit_lower_active{current_player.nmfe_step==6}:
    - nmfe_bad_shot
  s_ramp_inner_exit_active{current_player.nmfe_step==6}:
    - nmfe_bad_shot
  right_orbit_shot_hit{current_player.nmfe_step==6}:
    - nmfe_bad_shot
  s_ramp_right_exit_active{current_player.nmfe_step==6}:
    - nmfe_bad_shot

  ##############################################
  ## STEP 8 — TWR TL TO RR lit; TOP RAMP UP; rest bad
  ## nmfe_setup_step_8 raises top ramp (event_player handles servo above)
  ##############################################
  s_ramp_tower_exit_active{current_player.nmfe_step==7}:
    - nmfe_step_8_complete
    - nmfe_good_shot_hit
    - nmfe_step_8_shot_hit
    - nmfe_setup_step_9
  s_orbit_upper_active{current_player.nmfe_step==7}:
    - nmfe_step_8_complete
    - nmfe_good_shot_hit
    - nmfe_step_8_shot_hit
    - nmfe_setup_step_9
  s_orbit_lower_active{current_player.nmfe_step==7}:
    - nmfe_step_8_complete
    - nmfe_good_shot_hit
    - nmfe_step_8_shot_hit
    - nmfe_setup_step_9
  s_ramp_right_exit_active{current_player.nmfe_step==7}:
    - nmfe_step_8_complete
    - nmfe_good_shot_hit
    - nmfe_step_8_shot_hit
    - nmfe_setup_step_9
  # BAD
  s_lane_left_active{current_player.nmfe_step==7}:
    - nmfe_bad_shot
  left_orbit_shot_hit{current_player.nmfe_step==7}:
    - nmfe_bad_shot
  s_ramp_left_exit_active{current_player.nmfe_step==7}:
    - nmfe_bad_shot
  spinner_shot_made{current_player.nmfe_step==7 and current_player.spinner_shot_locked==0}:
    - nmfe_bad_shot
  s_barrier_target_active{current_player.nmfe_step==7}:
    - nmfe_bad_shot
  right_orbit_shot_hit{current_player.nmfe_step==7}:
    - nmfe_bad_shot

  ##############################################
  ## STEP 9 — SP CNT TWR lit; TOP RAMP DOWN; rest bad
  ## nmfe_setup_step_9 lowers top ramp (event_player handles servo above)
  ##############################################
  spinner_shot_made{current_player.nmfe_step==8 and current_player.spinner_shot_locked==0}:
    - nmfe_step_9_complete
    - nmfe_good_shot_hit
    - nmfe_step_9_shot_hit
    - nmfe_setup_step_10
  s_barrier_target_active{current_player.nmfe_step==8}:
    - nmfe_step_9_complete
    - nmfe_good_shot_hit
    - nmfe_step_9_shot_hit
    - nmfe_setup_step_10
  s_ramp_tower_exit_active{current_player.nmfe_step==8}:
    - nmfe_step_9_complete
    - nmfe_good_shot_hit
    - nmfe_step_9_shot_hit
    - nmfe_setup_step_10
  # BAD
  s_lane_left_active{current_player.nmfe_step==8}:
    - nmfe_bad_shot
  left_orbit_shot_hit{current_player.nmfe_step==8}:
    - nmfe_bad_shot
  s_ramp_left_exit_active{current_player.nmfe_step==8}:
    - nmfe_bad_shot
  s_orbit_upper_active{current_player.nmfe_step==8}:
    - nmfe_bad_shot
  s_orbit_lower_active{current_player.nmfe_step==8}:
    - nmfe_bad_shot
  s_ramp_inner_exit_active{current_player.nmfe_step==8}:
    - nmfe_bad_shot
  right_orbit_shot_hit{current_player.nmfe_step==8}:
    - nmfe_bad_shot
  s_ramp_right_exit_active{current_player.nmfe_step==8}:
    - nmfe_bad_shot

  ##############################################
  ## STEP 10 — LO LR lit only; rest bad
  ##############################################
  left_orbit_shot_hit{current_player.nmfe_step==9}:
    - nmfe_step_10_complete
    - nmfe_good_shot_hit
    - nmfe_step_10_shot_hit
    - nmfe_setup_step_11
  s_ramp_left_exit_active{current_player.nmfe_step==9}:
    - nmfe_step_10_complete
    - nmfe_good_shot_hit
    - nmfe_step_10_shot_hit
    - nmfe_setup_step_11
  # BAD
  s_lane_left_active{current_player.nmfe_step==9}:
    - nmfe_bad_shot
  spinner_shot_made{current_player.nmfe_step==9 and current_player.spinner_shot_locked==0}:
    - nmfe_bad_shot
  s_barrier_target_active{current_player.nmfe_step==9}:
    - nmfe_bad_shot
  s_ramp_tower_exit_active{current_player.nmfe_step==9}:
    - nmfe_bad_shot
  s_orbit_upper_active{current_player.nmfe_step==9}:
    - nmfe_bad_shot
  s_orbit_lower_active{current_player.nmfe_step==9}:
    - nmfe_bad_shot
  s_ramp_inner_exit_active{current_player.nmfe_step==9}:
    - nmfe_bad_shot
  right_orbit_shot_hit{current_player.nmfe_step==9}:
    - nmfe_bad_shot
  s_ramp_right_exit_active{current_player.nmfe_step==9}:
    - nmfe_bad_shot

  ##############################################
  ## STEP 11 — SP TL RO lit; RIGHT RAMP UP; rest bad
  ## nmfe_setup_step_11 raises right ramp (event_player handles servo above)
  ## Won shot fires nmfe_step_11_complete (handled above in won-but-waiting section)
  ##############################################
  spinner_shot_made{current_player.nmfe_step==10 and current_player.spinner_shot_locked==0}:
    - nmfe_step_11_complete
  s_orbit_upper_active{current_player.nmfe_step==10}:
    - nmfe_step_11_complete
  right_orbit_shot_hit{current_player.nmfe_step==10}:
    - nmfe_step_11_complete
  # BAD
  s_lane_left_active{current_player.nmfe_step==10}:
    - nmfe_bad_shot
  left_orbit_shot_hit{current_player.nmfe_step==10}:
    - nmfe_bad_shot
  s_ramp_left_exit_active{current_player.nmfe_step==10}:
    - nmfe_bad_shot
  s_barrier_target_active{current_player.nmfe_step==10}:
    - nmfe_bad_shot
  s_ramp_tower_exit_active{current_player.nmfe_step==10}:
    - nmfe_bad_shot
  s_orbit_lower_active{current_player.nmfe_step==10}:
    - nmfe_bad_shot
  s_ramp_inner_exit_active{current_player.nmfe_step==10}:
    - nmfe_bad_shot
  s_ramp_right_exit_active{current_player.nmfe_step==10}:
    - nmfe_bad_shot


####################################################################################
# COIL PLAYER
####################################################################################

  # Shaker — fires on every good shot
  nmfe_good_shot_hit:
    - shaker_soft

coil_player:

  # Pre-emptive diverter open — fires when right orbit switch hits at step 10/11
  # Ball is in orbit heading left, needs diverter open before it arrives
  nmfe_preemptive_open_diverter:
    c_left_orbit_diverter:
      action: enable

  # Won catch — opens diverter AND raises left lane post
  # Fires after step 11 shot confirmed; also fires on re-shots at step==11
  nmfe_activate_won_catch:
    c_left_orbit_diverter:
      action: enable
    c_left_lane_up_post:
      action: enable

  # Close diverter only (post stays up to hold ball during won video)
  nmfe_close_left_diverter:
    c_left_orbit_diverter:
      action: disable

  # Release ball after 18s won video completes
  timer_nmfe_complete_delay_complete:
    c_left_lane_up_post:
      action: disable

  # Safety cleanup — both coils off
  nmfe_cleanup:
    c_left_orbit_diverter:
      action: disable
    c_left_lane_up_post:
      action: disable

####################################################################################
# SLIDE PLAYER
####################################################################################

slide_player:

  # Mode start — show intro video only (timer/HUD show after ball released)
  mode_no_margin_for_error_started:
    no_margin_for_error_intro:
      action: play
      priority: 900

  # Ball released — intro done, start HUD slides + instructions
  # Normal path: show countdown timer
  nmfe_ball_released{current_player.afterburner_perk_active==0}:
    no_margin_for_error_intro:
      action: remove
    no_margin_for_error_timer:
      action: play
      priority: 800
    no_margin_for_error_shots_remaining:
      action: play
      priority: 800
    no_margin_for_error_instructions:
      action: play
      priority: 800

  # Afterburner perk active: show infinity slide instead of countdown timer
  nmfe_ball_released{current_player.afterburner_perk_active==1}:
    no_margin_for_error_intro:
      action: remove
    timer_perk_activated:
      action: play
      priority: 800
    no_margin_for_error_shots_remaining:
      action: play
      priority: 800
    no_margin_for_error_instructions:
      action: play
      priority: 800

  # Penalty slide on/off
  nmfe_show_penalty_slide:
    no_margin_for_error_no_hold_penalty:
      action: play
      priority: 870

  nmfe_no_hold_end:
    no_margin_for_error_no_hold_penalty:
      action: remove

  # STEP VIDEOS — play on shot hit, remove when next step video plays
  # Previous step video is removed by the NEXT step's shot_hit event
  nmfe_step_1_shot_hit:
    no_margin_for_error_step_1:
      action: play
      priority: 810
    mode_points_scored:
      action: play
      priority: 840
      expire: 2s

  nmfe_step_2_shot_hit:
    no_margin_for_error_step_1:
      action: remove
    no_margin_for_error_step_2:
      action: play
      priority: 810
    mode_points_scored:
      action: play
      priority: 840
      expire: 2s

  nmfe_step_3_shot_hit:
    no_margin_for_error_step_2:
      action: remove
    no_margin_for_error_step_3:
      action: play
      priority: 810
    mode_points_scored:
      action: play
      priority: 840
      expire: 2s

  nmfe_step_4_shot_hit:
    no_margin_for_error_step_3:
      action: remove
    no_margin_for_error_step_4:
      action: play
      priority: 810
    mode_points_scored:
      action: play
      priority: 840
      expire: 2s

  nmfe_step_5_shot_hit:
    no_margin_for_error_step_4:
      action: remove
    no_margin_for_error_step_5:
      action: play
      priority: 810
    mode_points_scored:
      action: play
      priority: 840
      expire: 2s

  nmfe_step_6_shot_hit:
    no_margin_for_error_step_5:
      action: remove
    no_margin_for_error_step_6:
      action: play
      priority: 810
    mode_points_scored:
      action: play
      priority: 840
      expire: 2s

  nmfe_step_7_shot_hit:
    no_margin_for_error_step_6:
      action: remove
    no_margin_for_error_step_7:
      action: play
      priority: 810
    mode_points_scored:
      action: play
      priority: 840
      expire: 2s

  nmfe_step_8_shot_hit:
    no_margin_for_error_step_7:
      action: remove
    no_margin_for_error_step_8:
      action: play
      priority: 810
    mode_points_scored:
      action: play
      priority: 840
      expire: 2s

  nmfe_step_9_shot_hit:
    no_margin_for_error_step_8:
      action: remove
    no_margin_for_error_step_9:
      action: play
      priority: 810
    mode_points_scored:
      action: play
      priority: 840
      expire: 2s

  nmfe_step_10_shot_hit:
    no_margin_for_error_step_9:
      action: remove
    no_margin_for_error_step_10:
      action: play
      priority: 810
    mode_points_scored:
      action: play
      priority: 840
      expire: 2s

  # Step 11 shot made — remove step 10 video, remove HUD
  # Won video plays when ball physically enters left lane (nmfe_won)
  nmfe_step_11_shot_hit:
    no_margin_for_error_step_10:
      action: remove
    no_margin_for_error_timer:
      action: remove
    no_margin_for_error_shots_remaining:
      action: remove
    no_margin_for_error_instructions:
      action: remove
    mode_points_scored:
      action: play
      priority: 840
      expire: 2s

  # Won — ball entered left lane, play won video
  nmfe_won:
    no_margin_for_error_won:
      action: play
      priority: 900
    no_margin_for_error_no_hold_penalty:
      action: remove

  # Failed — timer expired or drain, play lost video
  nmfe_failed:
    no_margin_for_error_timer:
      action: remove
    no_margin_for_error_shots_remaining:
      action: remove
    no_margin_for_error_no_hold_penalty:
      action: remove
    no_margin_for_error_instructions:
      action: remove
    no_margin_for_error_lost:
      action: play
      priority: 900

  # Safety cleanup on mode stop
  mode_no_margin_for_error_stopped:
    no_margin_for_error_timer:
      action: remove
    no_margin_for_error_shots_remaining:
      action: remove
    no_margin_for_error_no_hold_penalty:
      action: remove
    no_margin_for_error_intro:
      action: remove
    no_margin_for_error_instructions:
      action: remove


####################################################################################
# SHOW PLAYER
####################################################################################
# Shot lights: Yellow flash (sync_flash_mode) for lit shots, solid red for bad shots
# At each step setup ALL previous shows are explicitly stopped then new ones started.
# This clean-slate approach handles shots going bad then good again (e.g. LO at step 7)
#
# Show keys used:
#   nmfe_y_ll, nmfe_y_lo, nmfe_y_lr, nmfe_y_sp, nmfe_y_cnt, nmfe_y_twr
#   nmfe_y_tl, nmfe_y_to_tr, nmfe_y_ro_rr
#   nmfe_r_ll, nmfe_r_lo, nmfe_r_lr, nmfe_r_sp, nmfe_r_cnt, nmfe_r_twr
#   nmfe_r_tl, nmfe_r_to_tr, nmfe_r_ro_rr
####################################################################################

show_player:

  ##############################################
  ## SHOT FEEDBACK SHOWS
  ##############################################
  nmfe_good_shot_hit:
    nmfe_made_show:
      show: no_margin_for_error_made
      speed: 30
      loops: 0

  nmfe_bad_shot:
    nmfe_miss_show:
      show: no_margin_for_error_miss
      speed: 30
      loops: 0

  ##############################################
  ## GI — Yellow at mode start
  ##############################################
  nmfe_set_gi_yellow:
    nmfe_gi_mode:
      show: nmfe_gi_yellow
      key: nmfe_gi_mode
      loops: -1

  ##############################################
  ## PENALTY GI STROBE — Red flash on penalty lights
  ##############################################
  nmfe_penalty_gi_start:
    nmfe_penalty_gi:
      show: nmfe_gi_penalty_strobe
      key: nmfe_penalty_gi_effect
      loops: -1

  nmfe_no_hold_end:
    stop_penalty_gi:
      show: nmfe_gi_penalty_strobe
      action: stop
      key: nmfe_penalty_gi_effect
    restore_gi_yellow:
      show: nmfe_gi_yellow
      key: nmfe_gi_mode
      loops: -1

  ##############################################
  ## STEP 1 SETUP — All 9 shots yellow flash
  ##############################################
  nmfe_setup_step_1:
    nmfe_y_ll:
      show: sync_flash_mode
      key: nmfe_y_ll
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_left_lane, color: FFFF00 }
    nmfe_y_lo:
      show: sync_flash_mode
      key: nmfe_y_lo
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_left_orbit, color: FFFF00 }
    nmfe_y_lr:
      show: sync_flash_mode
      key: nmfe_y_lr
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_left_ramp, color: FFFF00 }
    nmfe_y_sp:
      show: sync_flash_mode
      key: nmfe_y_sp
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_spinner, color: FFFF00 }
    nmfe_y_cnt:
      show: sync_flash_mode
      key: nmfe_y_cnt
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_barrier, color: FFFF00 }
    nmfe_y_twr:
      show: sync_flash_mode
      key: nmfe_y_twr
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_tower_ramp, color: FFFF00 }
    nmfe_y_tl:
      show: sync_flash_mode
      key: nmfe_y_tl
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_upper_orbit, color: FFFF00 }
    nmfe_y_to_tr:
      show: sync_flash_mode
      key: nmfe_y_to_tr
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_middle_ramp, color: FFFF00 }
    nmfe_y_ro_rr:
      show: sync_flash_mode
      key: nmfe_y_ro_rr
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_right_orbit, color: FFFF00 }

  ##############################################
  ## PHASE 1 BURN EVENTS — Each event turns one shot from yellow flash to red
  ## Spinner is special: yellow stops but no red (light just goes dark)
  ##############################################
  nmfe_burn_ll:
    stop_y_ll_burn:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_ll
    start_r_ll_burn:
      show: nmfe_solid_red
      key: nmfe_r_ll
      loops: -1
      show_tokens: { led: l_shot_left_lane }

  nmfe_burn_lo:
    stop_y_lo_burn:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_lo
    start_r_lo_burn:
      show: nmfe_solid_red
      key: nmfe_r_lo
      loops: -1
      show_tokens: { led: l_shot_left_orbit }

  nmfe_burn_lr:
    stop_y_lr_burn:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_lr
    start_r_lr_burn:
      show: nmfe_solid_red
      key: nmfe_r_lr
      loops: -1
      show_tokens: { led: l_shot_left_ramp }

  # Spinner — yellow stops, NO red. Light goes dark (neutral state).
  nmfe_burn_sp:
    stop_y_sp_burn:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_sp

  nmfe_burn_cnt:
    stop_y_cnt_burn:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_cnt
    start_r_cnt_burn:
      show: nmfe_solid_red
      key: nmfe_r_cnt
      loops: -1
      show_tokens: { led: l_shot_barrier }

  nmfe_burn_twr:
    stop_y_twr_burn:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_twr
    start_r_twr_burn:
      show: nmfe_solid_red
      key: nmfe_r_twr
      loops: -1
      show_tokens: { led: l_shot_tower_ramp }

  nmfe_burn_tl:
    stop_y_tl_burn:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_tl
    start_r_tl_burn:
      show: nmfe_solid_red
      key: nmfe_r_tl
      loops: -1
      show_tokens: { led: l_shot_upper_orbit }

  # TR shares light with TO — use the to_tr show keys (same as Phase 2 step 7+)
  nmfe_burn_tr:
    stop_y_to_tr_burn:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_to_tr
    start_r_to_tr_burn:
      show: nmfe_solid_red
      key: nmfe_r_to_tr
      loops: -1
      show_tokens: { led: l_shot_middle_ramp }

  # RR shares light with RO — use the ro_rr show keys (same as Phase 2 step 7+)
  nmfe_burn_rr:
    stop_y_ro_rr_burn:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_ro_rr
    start_r_ro_rr_burn:
      show: nmfe_solid_red
      key: nmfe_r_ro_rr
      loops: -1
      show_tokens: { led: l_shot_right_orbit }

  ##############################################
  ## STEP 7 SETUP — LR, SP, LO lit; rest bad
  ## FULL RESET: Phase 1 ends with any combination of burned/lit shots, so we
  ## explicitly stop EVERY Phase 1 show then start the step 7 state from scratch.
  ##############################################
  nmfe_setup_step_7:
    # Stop ALL Phase 1 yellow shows
    stop_y_ll_s7:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_ll
    stop_y_lo_s7:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_lo
    stop_y_lr_s7:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_lr
    stop_y_sp_s7:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_sp
    stop_y_cnt_s7:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_cnt
    stop_y_twr_s7:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_twr
    stop_y_tl_s7:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_tl
    stop_y_to_tr_s7:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_to_tr
    stop_y_ro_rr_s7:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_ro_rr
    # Stop ALL Phase 1 red shows
    stop_r_ll_s7:
      show: nmfe_solid_red
      action: stop
      key: nmfe_r_ll
    stop_r_lo_s7:
      show: nmfe_solid_red
      action: stop
      key: nmfe_r_lo
    stop_r_lr_s7:
      show: nmfe_solid_red
      action: stop
      key: nmfe_r_lr
    stop_r_cnt_s7:
      show: nmfe_solid_red
      action: stop
      key: nmfe_r_cnt
    stop_r_twr_s7:
      show: nmfe_solid_red
      action: stop
      key: nmfe_r_twr
    stop_r_tl_s7:
      show: nmfe_solid_red
      action: stop
      key: nmfe_r_tl
    stop_r_to_tr_s7:
      show: nmfe_solid_red
      action: stop
      key: nmfe_r_to_tr
    stop_r_ro_rr_s7:
      show: nmfe_solid_red
      action: stop
      key: nmfe_r_ro_rr
    # Start Phase 2 step 7 state — yellow: LR, SP, LO
    nmfe_y_lr_s7:
      show: sync_flash_mode
      key: nmfe_y_lr
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_left_ramp, color: FFFF00 }
    nmfe_y_sp_s7:
      show: sync_flash_mode
      key: nmfe_y_sp
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_spinner, color: FFFF00 }
    nmfe_y_lo_s7:
      show: sync_flash_mode
      key: nmfe_y_lo
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_left_orbit, color: FFFF00 }
    # Red: LL, CNT, TWR, TL, TO/TR, RO/RR
    nmfe_r_ll_s7:
      show: nmfe_solid_red
      key: nmfe_r_ll
      loops: -1
      show_tokens: { led: l_shot_left_lane }
    nmfe_r_cnt_s7:
      show: nmfe_solid_red
      key: nmfe_r_cnt
      loops: -1
      show_tokens: { led: l_shot_barrier }
    nmfe_r_twr_s7:
      show: nmfe_solid_red
      key: nmfe_r_twr
      loops: -1
      show_tokens: { led: l_shot_tower_ramp }
    nmfe_r_tl_s7:
      show: nmfe_solid_red
      key: nmfe_r_tl
      loops: -1
      show_tokens: { led: l_shot_upper_orbit }
    nmfe_r_to_tr_s7:
      show: nmfe_solid_red
      key: nmfe_r_to_tr
      loops: -1
      show_tokens: { led: l_shot_middle_ramp }
    nmfe_r_ro_rr_s7:
      show: nmfe_solid_red
      key: nmfe_r_ro_rr
      loops: -1
      show_tokens: { led: l_shot_right_orbit }

  ##############################################
  ## STEP 8 SETUP — TWR TL TO RR lit; TOP RAMP UP
  ## CLEAN SLATE: Many shots changing state
  ## LR, SP, LO were yellow — all go red
  ## TWR, TL, RO/RR were red — TWR, TL go yellow
  ## TO/TR: TO (s_orbit_lower) goes yellow; RR (s_ramp_right_exit) uses RO/RR light yellow
  ##############################################
  nmfe_setup_step_8:
    # Stop yellow shows from step 7
    stop_y_lr_s8:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_lr
    stop_y_sp_s8:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_sp
    stop_y_lo_s8:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_lo
    # Stop red shows that are now lit
    stop_r_twr_s8:
      show: nmfe_solid_red
      action: stop
      key: nmfe_r_twr
    stop_r_tl_s8:
      show: nmfe_solid_red
      action: stop
      key: nmfe_r_tl
    stop_r_to_tr_s8:
      show: nmfe_solid_red
      action: stop
      key: nmfe_r_to_tr
    stop_r_ro_rr_s8:
      show: nmfe_solid_red
      action: stop
      key: nmfe_r_ro_rr
    # Start yellow for lit shots
    nmfe_y_twr_s8:
      show: sync_flash_mode
      key: nmfe_y_twr
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_tower_ramp, color: FFFF00 }
    nmfe_y_tl_s8:
      show: sync_flash_mode
      key: nmfe_y_tl
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_upper_orbit, color: FFFF00 }
    nmfe_y_to_tr_s8:
      show: sync_flash_mode
      key: nmfe_y_to_tr
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_middle_ramp, color: FFFF00 }
    nmfe_y_ro_rr_s8:
      show: sync_flash_mode
      key: nmfe_y_ro_rr
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_right_orbit, color: FFFF00 }
    # Red shots: LL, LO, LR, SP, CNT
    nmfe_r_lr_s8:
      show: nmfe_solid_red
      key: nmfe_r_lr
      loops: -1
      show_tokens: { led: l_shot_left_ramp }
    nmfe_r_sp_s8:
      show: nmfe_solid_red
      key: nmfe_r_sp
      loops: -1
      show_tokens: { led: l_shot_spinner }
    nmfe_r_lo_s8:
      show: nmfe_solid_red
      key: nmfe_r_lo
      loops: -1
      show_tokens: { led: l_shot_left_orbit }

  ##############################################
  ## STEP 9 SETUP — SP CNT TWR lit; TOP RAMP DOWN
  ## CLEAN SLATE
  ## SP, CNT, TWR were all red — go yellow
  ## TL, TO/TR, RO/RR were yellow — go red
  ## LR, LO, LL stay red
  ##############################################
  nmfe_setup_step_9:
    # Stop yellow shows
    stop_y_twr_s9:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_twr
    stop_y_tl_s9:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_tl
    stop_y_to_tr_s9:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_to_tr
    stop_y_ro_rr_s9:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_ro_rr
    # Stop red shows for newly lit shots
    stop_r_sp_s9:
      show: nmfe_solid_red
      action: stop
      key: nmfe_r_sp
    stop_r_cnt_s9:
      show: nmfe_solid_red
      action: stop
      key: nmfe_r_cnt
    # TWR was yellow — stop yellow, it will restart below
    # (Note: nmfe_r_twr was stopped at step 8 setup; nmfe_y_twr is running)
    # Start yellow for SP, CNT, TWR
    nmfe_y_sp_s9:
      show: sync_flash_mode
      key: nmfe_y_sp
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_spinner, color: FFFF00 }
    nmfe_y_cnt_s9:
      show: sync_flash_mode
      key: nmfe_y_cnt
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_barrier, color: FFFF00 }
    # TWR already yellow (started in step 8 setup), no restart needed
    # Red shots: TL, TO/TR, RO/RR (LL, LO, LR already red)
    nmfe_r_tl_s9:
      show: nmfe_solid_red
      key: nmfe_r_tl
      loops: -1
      show_tokens: { led: l_shot_upper_orbit }
    nmfe_r_to_tr_s9:
      show: nmfe_solid_red
      key: nmfe_r_to_tr
      loops: -1
      show_tokens: { led: l_shot_middle_ramp }
    nmfe_r_ro_rr_s9:
      show: nmfe_solid_red
      key: nmfe_r_ro_rr
      loops: -1
      show_tokens: { led: l_shot_right_orbit }

  ##############################################
  ## STEP 10 SETUP — LO LR lit only; rest bad
  ## CLEAN SLATE
  ## LO, LR were red — go yellow
  ## SP, CNT, TWR were yellow — go red
  ##############################################
  nmfe_setup_step_10:
    # Stop yellow shows
    stop_y_sp_s10:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_sp
    stop_y_cnt_s10:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_cnt
    stop_y_twr_s10:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_twr
    # Stop red shows for newly lit shots
    stop_r_lo_s10:
      show: nmfe_solid_red
      action: stop
      key: nmfe_r_lo
    stop_r_lr_s10:
      show: nmfe_solid_red
      action: stop
      key: nmfe_r_lr
    # Start yellow for LO, LR
    nmfe_y_lo_s10:
      show: sync_flash_mode
      key: nmfe_y_lo
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_left_orbit, color: FFFF00 }
    nmfe_y_lr_s10:
      show: sync_flash_mode
      key: nmfe_y_lr
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_left_ramp, color: FFFF00 }
    # Red shots: SP, CNT, TWR (LL already red; TL, TO/TR, RO/RR already red)
    nmfe_r_sp_s10:
      show: nmfe_solid_red
      key: nmfe_r_sp
      loops: -1
      show_tokens: { led: l_shot_spinner }
    nmfe_r_cnt_s10:
      show: nmfe_solid_red
      key: nmfe_r_cnt
      loops: -1
      show_tokens: { led: l_shot_barrier }
    nmfe_r_twr_s10:
      show: nmfe_solid_red
      key: nmfe_r_twr
      loops: -1
      show_tokens: { led: l_shot_tower_ramp }

  ##############################################
  ## STEP 11 SETUP — SP TL RO lit; RIGHT RAMP UP; rest bad
  ## CLEAN SLATE
  ## SP, TL were red — go yellow; RO/RR light — RO is lit so yellow
  ## LO, LR were yellow — go red
  ##############################################
  nmfe_setup_step_11:
    # Stop yellow shows
    stop_y_lo_s11:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_lo
    stop_y_lr_s11:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_lr
    # Stop red shows for newly lit shots
    stop_r_sp_s11:
      show: nmfe_solid_red
      action: stop
      key: nmfe_r_sp
    stop_r_tl_s11:
      show: nmfe_solid_red
      action: stop
      key: nmfe_r_tl
    stop_r_ro_rr_s11:
      show: nmfe_solid_red
      action: stop
      key: nmfe_r_ro_rr
    # Start yellow for SP, TL, RO (l_shot_right_orbit)
    nmfe_y_sp_s11:
      show: sync_flash_mode
      key: nmfe_y_sp
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_spinner, color: FFFF00 }
    nmfe_y_tl_s11:
      show: sync_flash_mode
      key: nmfe_y_tl
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_upper_orbit, color: FFFF00 }
    nmfe_y_ro_s11:
      show: sync_flash_mode
      key: nmfe_y_ro_rr
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_right_orbit, color: FFFF00 }
    # LL lights up to indicate left lane is now the target
    nmfe_y_ll_s11:
      show: sync_flash_mode
      key: nmfe_y_ll
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_left_lane, color: FFFF00 }
    # Red shots: LO, LR, CNT, TWR, TO/TR (LL already lit yellow above)
    nmfe_r_lo_s11:
      show: nmfe_solid_red
      key: nmfe_r_lo
      loops: -1
      show_tokens: { led: l_shot_left_orbit }
    nmfe_r_lr_s11:
      show: nmfe_solid_red
      key: nmfe_r_lr
      loops: -1
      show_tokens: { led: l_shot_left_ramp }

  ##############################################
  ## WON — Stop all shot shows immediately when won video starts
  ##############################################
  nmfe_won:
    stop_won_y_ll:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_ll
    stop_won_y_lo:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_lo
    stop_won_y_lr:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_lr
    stop_won_y_sp:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_sp
    stop_won_y_cnt:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_cnt
    stop_won_y_twr:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_twr
    stop_won_y_tl:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_tl
    stop_won_y_to_tr:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_to_tr
    stop_won_y_ro_rr:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_ro_rr
    stop_won_r_ll:
      show: nmfe_solid_red
      action: stop
      key: nmfe_r_ll
    stop_won_r_lo:
      show: nmfe_solid_red
      action: stop
      key: nmfe_r_lo
    stop_won_r_lr:
      show: nmfe_solid_red
      action: stop
      key: nmfe_r_lr
    stop_won_r_sp:
      show: nmfe_solid_red
      action: stop
      key: nmfe_r_sp
    stop_won_r_cnt:
      show: nmfe_solid_red
      action: stop
      key: nmfe_r_cnt
    stop_won_r_twr:
      show: nmfe_solid_red
      action: stop
      key: nmfe_r_twr
    stop_won_r_tl:
      show: nmfe_solid_red
      action: stop
      key: nmfe_r_tl
    stop_won_r_to_tr:
      show: nmfe_solid_red
      action: stop
      key: nmfe_r_to_tr
    stop_won_r_ro_rr:
      show: nmfe_solid_red
      action: stop
      key: nmfe_r_ro_rr
    stop_won_gi_mode:
      show: nmfe_gi_yellow
      action: stop
      key: nmfe_gi_mode
    stop_won_gi_penalty:
      show: nmfe_gi_penalty_strobe
      action: stop
      key: nmfe_penalty_gi_effect

  ##############################################
  ## CLEANUP — Stop all shot shows
  ##############################################
  nmfe_cleanup:
    stop_all_y_ll:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_ll
    stop_all_y_lo:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_lo
    stop_all_y_lr:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_lr
    stop_all_y_sp:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_sp
    stop_all_y_cnt:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_cnt
    stop_all_y_twr:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_twr
    stop_all_y_tl:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_tl
    stop_all_y_to_tr:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_to_tr
    stop_all_y_ro_rr:
      show: sync_flash_mode
      action: stop
      key: nmfe_y_ro_rr
    stop_all_r_ll:
      show: nmfe_solid_red
      action: stop
      key: nmfe_r_ll
    stop_all_r_lo:
      show: nmfe_solid_red
      action: stop
      key: nmfe_r_lo
    stop_all_r_lr:
      show: nmfe_solid_red
      action: stop
      key: nmfe_r_lr
    stop_all_r_sp:
      show: nmfe_solid_red
      action: stop
      key: nmfe_r_sp
    stop_all_r_cnt:
      show: nmfe_solid_red
      action: stop
      key: nmfe_r_cnt
    stop_all_r_twr:
      show: nmfe_solid_red
      action: stop
      key: nmfe_r_twr
    stop_all_r_tl:
      show: nmfe_solid_red
      action: stop
      key: nmfe_r_tl
    stop_all_r_to_tr:
      show: nmfe_solid_red
      action: stop
      key: nmfe_r_to_tr
    stop_all_r_ro_rr:
      show: nmfe_solid_red
      action: stop
      key: nmfe_r_ro_rr
    stop_gi_mode:
      show: nmfe_gi_yellow
      action: stop
      key: nmfe_gi_mode
    stop_gi_penalty:
      show: nmfe_gi_penalty_strobe
      action: stop
      key: nmfe_penalty_gi_effect


####################################################################################
# SOUND PLAYER — Voice callouts only (music handled in base.yaml)
####################################################################################

sound_player:
  nmfe_ball_released:
    no_margin_for_error_intro_callout:
      bus: voice
      loops: 0

####################################################################################
# SHOWS
# GI lights are type: grb — using hex codes per MPF bug workaround (same as battle_jester)
# FFFF00 = yellow (works on both rgb and grb since both R and G channels are FF)
# FF0000 = red (following battle_jester pattern for grb lights)
####################################################################################

shows:

  ##############################################
  ## FLASH YELLOW — Lit shot indicator (synced)
  ## Uses sync_flash_mode from base config (referenced via show_player)
  ##############################################

  ##############################################
  ## SOLID RED — Bad shot indicator
  ##############################################
  nmfe_solid_red:
    - duration: 1s
      lights:
        (led):
          color: FF0000

  ##############################################
  ## GI YELLOW — Mode GI color (all GI lights)
  ##############################################
  nmfe_gi_yellow:
    - duration: 1s
      lights:
        l_gi_light_1:
          color: FFFF00
        l_gi_light_2:
          color: FFFF00
