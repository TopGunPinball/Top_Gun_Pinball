        l_gi_light_16:
          color: FFFF00
        l_gi_light_17:
          color: FFFF00
        l_gi_light_18:
          color: FFFF00
        l_gi_light_19:
          color: FFFF00
        l_gi_light_20:
          color: FFFF00
        l_gi_light_21:
          color: FFFF00
        l_apron_light_1:
          color: FFFF00
        l_apron_light_2:
          color: FFFF00
        l_apron_light_3:
          color: FFFF00
        l_apron_light_4:
          color: FFFF00

  ##############################################
  ## GI PENALTY STROBE — Red fade in/out, never fully off, slow pulse
  ## Fades between dim red (20%) and full red over 200ms each direction
  ## loops: -1 in show_player keeps it running until nmfe_no_hold_end stops it
  ##############################################
  nmfe_gi_penalty_strobe:
    - duration: 200ms
      lights:
        l_gi_light_1:
          color: FF0000
          fade: 200ms
        l_gi_light_2:
          color: FF0000
          fade: 200ms
        l_gi_light_3:
