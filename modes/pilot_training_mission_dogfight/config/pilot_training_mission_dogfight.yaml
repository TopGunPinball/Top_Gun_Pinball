#config_version=6

####################################################################################
# PILOT TRAINING MISSION: DOGFIGHT
#
# Single-ball timed training mission (final training mission, slot 5).
# Started from the LEFT LANE (ball held by c_left_lane_up_post during intro),
# mirroring pilot_training_mission_afterburner. Drain / victory handling mirrors
# rise_of_phoenix (hold bonus on drain until lost video finishes).
#
# BALLS: 1 | TIMER: 180s | INTRO: 20s (both-flipper skip)
# GI: alternating light-blue / white across GI + apron; pop bumpers light blue.
# GOOD shots: pulse YELLOW via sync_flash_mode. BAD shots: solid RED.
# BAD-shot penalty: 10s no-hold flippers (restarts on repeat).
# Made good shot: GI strobe flash, then restore alternating GI.
#
# SCORING (base, before total_scoring_multiplier) -> 15,000,000 total:
#   S1 350k  S2 550k  S3 750k  S4 1.0M  S5 1.25M S6 1.5M
#   S7 1.6M  S8 1.75M S9 1.2M  S10 1.4M S11 1.6M S12 2.05M
#
# STEP PROGRESSION (see per-step comments in event_player):
#   1  LR | RR                         (hit either)
#   2  LO | LR | TWR | RR              (hit any; remember which -> dogfight_s2_hit)
#   3  the OTHER 3 good; step-2 shot is BAD
#   4  MOVING target 4s/step, 1s grace: SP,TWR,TL,TR,RR,TR,TL,TWR,SP,LR,LO,LR (loop)
#   5  LO | SP | RO   (raise right ramp; remember which -> dogfight_s5_hit)
#   6  the OTHER 2 good; step-5 shot is BAD; lower right ramp on made -> step 7
#   7  TWR
#   8  CNT (barrier UP)
#   9-11 LO | LR | RO | TWR (4 lit); each hit -> next video + that shot BAD;
#        hit any 3 of 4 -> step 12
#   12 VICTORY: LL lit; SP + TL pulse (sync_pulse_mode). SP/TL -> open left diverter
#      3s to feed left lane. LL -> hold ball, won video (13s), perk select (20s).
#
# SHOT MAP:  LL=s_lane_left/l_shot_left_lane  LO=left_orbit_shot_hit/l_shot_left_orbit
#   LR=s_ramp_left_exit/l_shot_left_ramp  SP=spinner_shot_made/l_shot_spinner
#   CNT=s_barrier_target/l_shot_barrier   TWR=s_ramp_tower_exit/l_shot_tower_ramp
#   TL=s_orbit_upper/l_shot_upper_orbit   TR=s_ramp_inner_exit/l_shot_middle_ramp
#   RR=s_ramp_right_exit/l_shot_right_orbit  RO=right_orbit_shot_hit/l_shot_right_orbit
####################################################################################

mode:
  start_events: start_mode_pilot_training_mission_dogfight
  stop_events:
    - dogfight_video_complete                 # Victory (after award select) or loss
    - dogfight_drain_cleanup_complete          # Ball drained
  priority: 600
  game_mode: true
  use_wait_queue: true

mode_settings:
  can_stack_with_multiball: false

####################################################################################
# QUEUE RELAY PLAYER - hold ball_ending until drain cleanup (bonus hold on drain)
####################################################################################

queue_relay_player:
  ball_ending{mode.pilot_training_mission_dogfight.active==True}:
    post: dogfight_ball_ending_hold
    wait_for: dogfight_drain_cleanup_complete
    priority: 1000

####################################################################################
# TIMERS  (all control_events; tick 1s)
####################################################################################

timers:
  # Main mode timer - starts on ball release (NOT on scoop/lane bounce)
  # Device name is dogfight_mode_timer; the display player var is dogfight_timer.
  dogfight_mode_timer:
    start_value: 180
    end_value: 0
    direction: down
    tick_interval: 1s
    start_running: false
    control_events:
      - event: dogfight_ball_released
        action: start
      - event: dogfight_complete
        action: stop
      - event: dogfight_failed
        action: stop

  # Intro video window (20s) - both-flipper skip stops it
  dogfight_intro_video_delay:
    start_value: 0
    end_value: 25
    direction: up
    tick_interval: 1s
    control_events:
      - event: mode_pilot_training_mission_dogfight_started
        action: start
      - event: dogfight_skip_intro
        action: stop

  # Victory: won video (14s) before award selection; skippable via both flippers
  dogfight_won_video_delay:
    start_value: 0
    end_value: 14
    direction: up
    tick_interval: 1s
    start_running: false
    control_events:
      - event: dogfight_complete
        action: start
      - event: dogfight_show_perk_select
        action: stop

  # Award selection window (20s down). Restarts on every flipper nav press.
  # Expiry auto-selects the currently displayed award.
  dogfight_award_select_timer:
    start_value: 20
    end_value: 0
    direction: down
    tick_interval: 1s
    start_running: false
    control_events:
      - event: dogfight_show_perk_select
        action: start
      - event: dogfight_award_nav
        action: restart
      - event: dogfight_award_confirm
        action: stop

  # 3s arm delay: blocks both-flipper SELECT right after reaching the award slide,
  # so the same double-flip that skips the won video can't instantly pick an award.
  dogfight_award_arm_timer:
    start_value: 0
    end_value: 3
    direction: up
    tick_interval: 1s
    start_running: false
    control_events:
      - event: dogfight_show_perk_select
        action: restart
      - event: dogfight_award_confirm
        action: stop

  # Lost video (35s down), for BOTH timer-loss and drain; skippable via both flippers
  dogfight_lost_delay:
    start_value: 35
    end_value: 0
    direction: down
    tick_interval: 1s
    start_running: false
    control_events:
      - event: dogfight_failed
        action: start
      - event: dogfight_lost_done
        action: stop

  # 10s no-hold-flipper penalty (restarts on each additional bad shot)
  dogfight_no_hold_timer:
    start_value: 10
    end_value: 0
    direction: down
    tick_interval: 1s
    start_running: false
    control_events:
      - event: dogfight_penalty_activate
        action: restart
      - event: dogfight_no_hold_end
        action: stop
      - event: dogfight_cleanup
        action: stop

  # Step 4 moving target - advance every 4s
  dogfight_step4_cycle:
    start_value: 0
    end_value: 4
    direction: up
    tick_interval: 1s
    start_running: false
    control_events:
      - event: dogfight_setup_step_4
        action: restart
      - event: dogfight_step4_advance
        action: restart
      - event: dogfight_step_4_complete
        action: stop
      - event: dogfight_cleanup
        action: stop

  # Step 4 grace - previous position stays scoreable 1s after light moves
  dogfight_step4_grace:
    start_value: 1
    end_value: 0
    direction: down
    tick_interval: 1s
    start_running: false
    control_events:
      - event: dogfight_step4_advance
        action: restart
      - event: dogfight_step_4_complete
        action: stop
      - event: dogfight_cleanup
        action: stop

  # Step 12 left-orbit diverter hold (3s)
  dogfight_diverter_hold:
    start_value: 0
    end_value: 3
    direction: up
    tick_interval: 1s
    start_running: false
    control_events:
      - event: dogfight_open_diverter
        action: restart
      - event: dogfight_cleanup
        action: stop

####################################################################################
# VARIABLE PLAYER
####################################################################################

variable_player:
  mode_pilot_training_mission_dogfight_started:
    training_mission_active: { action: set, int: 1 }
    letter_collection_paused: { action: set, int: 1 }
    dogfight_step: { action: set, int: 0 }
    dogfight_complete_flag: { action: set, int: 0 }
    dogfight_shots_remaining: { action: set, int: 12 }
    mode_points_scored: { action: set, int: 0 }
    dogfight_s2_hit: { action: set, int: 0 }
    dogfight_s5_hit: { action: set, int: 0 }
    dogfight_s9_count: { action: set, int: 0 }
    dogfight_s9_lo: { action: set, int: 0 }
    dogfight_s9_lr: { action: set, int: 0 }
    dogfight_s9_ro: { action: set, int: 0 }
    dogfight_s9_twr: { action: set, int: 0 }
    dogfight_step4_position: { action: set, int: 0 }
    dogfight_step4_grace_pos: { action: set, int: 99 }
    dogfight_penalty_active: { action: set, int: 0 }
    dogfight_timer: { action: set, int: 180 }
    dogfight_penalty_timer: { action: set, string: "" }
    dogfight_won_video_active: { action: set, int: 0 }
    dogfight_lost_video_active: { action: set, int: 0 }
    dogfight_award_selecting: { action: set, int: 0 }
    dogfight_award_select_armed: { action: set, int: 0 }
    dogfight_award_index: { action: set, int: 0 }
    dogfight_award_timer_ticks: { action: set, int: 20 }
    training_missions_played: { action: add, int: 1 }
    mode_pilot_training_mission_dogfight_played: { action: set, int: 1 }
    training_dogfight_complete: { action: set, int: 1 }

  # Ball drain during mode -> route bonus after cleanup (phoenix-style)
  ball_will_end{mode.pilot_training_mission_dogfight.active==True}:
    pilot_mode_drain_pending: { action: set, int: 1 }

  # Penalty active flag (first-activation gating)
  dogfight_penalty_activate:
    dogfight_penalty_active: { action: set, int: 1 }
    dogfight_penalty_timer: { action: set, int: 10 }
  dogfight_no_hold_end:
    dogfight_penalty_active: { action: set, int: 0 }
    dogfight_penalty_timer: { action: set, string: "" }
  # Safety: clear penalty flag if main timer expires mid-penalty
  timer_dogfight_mode_timer_complete:
    dogfight_penalty_active: { action: set, int: 0 }
  dogfight_cleanup:
    dogfight_penalty_active: { action: set, int: 0 }
    dogfight_penalty_timer: { action: set, string: "" }

  # Tick-bridge display variables for Godot slides (updated every tick)
  timer_dogfight_no_hold_timer_tick:
    dogfight_penalty_timer: { action: set, int: device.timers.dogfight_no_hold_timer.ticks }
  timer_dogfight_mode_timer_tick:
    dogfight_timer: { action: set, int: device.timers.dogfight_mode_timer.ticks }

  # --- VICTORY / AWARD-SELECTION STATE ---
  # Won video phase flag
  dogfight_complete:
    dogfight_won_video_active: { action: set, int: 1 }
    dogfight_lost_video_active: { action: set, int: 0 }
  # Enter award selection: default to index 0 (Extra Ball); select is disarmed for 3s
  dogfight_show_perk_select:
    dogfight_won_video_active: { action: set, int: 0 }
    dogfight_award_selecting: { action: set, int: 1 }
    dogfight_award_select_armed: { action: set, int: 0 }
    dogfight_award_index: { action: set, int: 0 }
    dogfight_award_name: { action: set, string: "Extra Ball" }
  # After 3s the both-flipper select becomes available
  dogfight_award_arm:
    dogfight_award_select_armed: { action: set, int: 1 }
  # Award timer countdown display (updated each tick)
  timer_dogfight_award_select_timer_tick:
    dogfight_award_timer_ticks: { action: set, int: device.timers.dogfight_award_select_timer.ticks }
  # Index nav (0..5 wrap)
  dogfight_award_inc:   { dogfight_award_index: { action: add, int: 1 } }
  dogfight_award_dec:   { dogfight_award_index: { action: add, int: -1 } }
  dogfight_award_wrap0: { dogfight_award_index: { action: set, int: 0 } }
  dogfight_award_wrap5: { dogfight_award_index: { action: set, int: 5 } }
  # Displayed award name per index
  dogfight_award_refresh{current_player.dogfight_award_index==0}: { dogfight_award_name: { action: set, string: "Extra Ball" } }
  dogfight_award_refresh{current_player.dogfight_award_index==1}: { dogfight_award_name: { action: set, string: "Inverted Perk" } }
  dogfight_award_refresh{current_player.dogfight_award_index==2}: { dogfight_award_name: { action: set, string: "Missiles Perk" } }
  dogfight_award_refresh{current_player.dogfight_award_index==3}: { dogfight_award_name: { action: set, string: "Afterburner Perk" } }
  dogfight_award_refresh{current_player.dogfight_award_index==4}: { dogfight_award_name: { action: set, string: "Wingman Perk" } }
  dogfight_award_refresh{current_player.dogfight_award_index==5}: { dogfight_award_name: { action: set, string: "Light 2X Playfield" } }
  # Confirm clears selecting flag
  dogfight_award_confirm:
    dogfight_award_selecting: { action: set, int: 0 }
  # Perk grants — also mark that training mode PLAYED (removes from rotation,
  # blocks replay via the left-lane complete==0 guard, insert goes solid white).
  dogfight_grant_inverted:
    inverted_perk_active: { action: set, int: 1 }
    training_inverted_complete: { action: set, int: 1 }
  dogfight_grant_missiles:
    missiles_perk_active: { action: set, int: 1 }
    missiles_perk_saved:  { action: set, int: 1 }
    training_missles_complete: { action: set, int: 1 }
  dogfight_grant_afterburner:
    afterburner_perk_active: { action: set, int: 1 }
    training_afterburner_complete: { action: set, int: 1 }
  dogfight_grant_wingman:
    wingman_perk_active: { action: set, int: 1 }
    training_wingman_complete: { action: set, int: 1 }
  # Lost video phase flags
  dogfight_failed:
    dogfight_lost_video_active: { action: set, int: 1 }
  dogfight_lost_done:
    dogfight_lost_video_active: { action: set, int: 0 }

  # --- STEP SCORING (score + mode_points_scored + shots_remaining--) ---
  dogfight_step_1_complete:
    dogfight_step: { action: set, int: 1 }
    score: 350000 * current_player.total_scoring_multiplier
    mode_points_scored: { action: set, int: 350000 * current_player.total_scoring_multiplier }
    dogfight_shots_remaining: { action: add, int: -1 }

  # Remember which shot was hit in step 2 (1=LO 2=LR 3=TWR 4=RR)
  dogfight_step_2_complete:
    dogfight_step: { action: set, int: 2 }
    score: 550000 * current_player.total_scoring_multiplier
    mode_points_scored: { action: set, int: 550000 * current_player.total_scoring_multiplier }
    dogfight_shots_remaining: { action: add, int: -1 }
  dogfight_s2_hit_lo:  { dogfight_s2_hit: { action: set, int: 1 } }
  dogfight_s2_hit_lr:  { dogfight_s2_hit: { action: set, int: 2 } }
  dogfight_s2_hit_twr: { dogfight_s2_hit: { action: set, int: 3 } }
  dogfight_s2_hit_rr:  { dogfight_s2_hit: { action: set, int: 4 } }

  dogfight_step_3_complete:
    dogfight_step: { action: set, int: 3 }
    score: 750000 * current_player.total_scoring_multiplier
    mode_points_scored: { action: set, int: 750000 * current_player.total_scoring_multiplier }
    dogfight_shots_remaining: { action: add, int: -1 }

  dogfight_step_4_complete:
    dogfight_step: { action: set, int: 4 }
    score: 1000000 * current_player.total_scoring_multiplier
    mode_points_scored: { action: set, int: 1000000 * current_player.total_scoring_multiplier }
    dogfight_shots_remaining: { action: add, int: -1 }

  # Remember which shot was hit in step 5 (1=LO 2=SP 3=RO)
  dogfight_step_5_complete:
    dogfight_step: { action: set, int: 5 }
    score: 1250000 * current_player.total_scoring_multiplier
    mode_points_scored: { action: set, int: 1250000 * current_player.total_scoring_multiplier }
    dogfight_shots_remaining: { action: add, int: -1 }
  dogfight_s5_hit_lo: { dogfight_s5_hit: { action: set, int: 1 } }
  dogfight_s5_hit_sp: { dogfight_s5_hit: { action: set, int: 2 } }
  dogfight_s5_hit_ro: { dogfight_s5_hit: { action: set, int: 3 } }

  dogfight_step_6_complete:
    dogfight_step: { action: set, int: 6 }
    score: 1500000 * current_player.total_scoring_multiplier
    mode_points_scored: { action: set, int: 1500000 * current_player.total_scoring_multiplier }
    dogfight_shots_remaining: { action: add, int: -1 }

  dogfight_step_7_complete:
    dogfight_step: { action: set, int: 7 }
    score: 1600000 * current_player.total_scoring_multiplier
    mode_points_scored: { action: set, int: 1600000 * current_player.total_scoring_multiplier }
    dogfight_shots_remaining: { action: add, int: -1 }

  dogfight_step_8_complete:
    dogfight_step: { action: set, int: 8 }
    score: 1750000 * current_player.total_scoring_multiplier
    mode_points_scored: { action: set, int: 1750000 * current_player.total_scoring_multiplier }
    dogfight_shots_remaining: { action: add, int: -1 }

  # Steps 9-11: hit any 3 of {LO,LR,RO,TWR}. Each good hit advances + scores.
  dogfight_step_9_complete:
    dogfight_step: { action: set, int: 9 }
    dogfight_s9_count: { action: add, int: 1 }
    score: 1200000 * current_player.total_scoring_multiplier
    mode_points_scored: { action: set, int: 1200000 * current_player.total_scoring_multiplier }
    dogfight_shots_remaining: { action: add, int: -1 }
  dogfight_step_10_complete:
    dogfight_step: { action: set, int: 10 }
    dogfight_s9_count: { action: add, int: 1 }
    score: 1400000 * current_player.total_scoring_multiplier
    mode_points_scored: { action: set, int: 1400000 * current_player.total_scoring_multiplier }
    dogfight_shots_remaining: { action: add, int: -1 }
  dogfight_step_11_complete:
    dogfight_step: { action: set, int: 11 }
    dogfight_s9_count: { action: add, int: 1 }
    score: 1600000 * current_player.total_scoring_multiplier
    mode_points_scored: { action: set, int: 1600000 * current_player.total_scoring_multiplier }
    dogfight_shots_remaining: { action: add, int: -1 }
  # Mark which of the 4 became bad after each hit
  dogfight_s9_mark_lo:  { dogfight_s9_lo:  { action: set, int: 1 } }
  dogfight_s9_mark_lr:  { dogfight_s9_lr:  { action: set, int: 1 } }
  dogfight_s9_mark_ro:  { dogfight_s9_ro:  { action: set, int: 1 } }
  dogfight_s9_mark_twr: { dogfight_s9_twr: { action: set, int: 1 } }

  # Step 12 victory (LL)
  dogfight_step_12_complete:
    dogfight_step: { action: set, int: 12 }
    dogfight_complete_flag: { action: set, int: 1 }
    score: 2050000 * current_player.total_scoring_multiplier
    mode_points_scored: { action: set, int: 2050000 * current_player.total_scoring_multiplier }
    dogfight_shots_remaining: { action: add, int: -1 }
    dogfight_won: { action: set, int: 1 }
    training_dogfight_won: { action: set, int: 1 }
    training_missions_won: { action: add, int: 1 }
    # PLACEHOLDER: perk award happens after player selection (see event_player)

  # Step 4 moving target: capture old position for 1s grace, then advance
  dogfight_step4_advance:
    dogfight_step4_grace_pos: { action: set, int: current_player.dogfight_step4_position }
  timer_dogfight_step4_grace_complete:
    dogfight_step4_grace_pos: { action: set, int: 99 }
  # Position setters (0-11)
  dogfight_step4_set_0:  { dogfight_step4_position: { action: set, int: 0 } }
  dogfight_step4_set_1:  { dogfight_step4_position: { action: set, int: 1 } }
  dogfight_step4_set_2:  { dogfight_step4_position: { action: set, int: 2 } }
  dogfight_step4_set_3:  { dogfight_step4_position: { action: set, int: 3 } }
  dogfight_step4_set_4:  { dogfight_step4_position: { action: set, int: 4 } }
  dogfight_step4_set_5:  { dogfight_step4_position: { action: set, int: 5 } }
  dogfight_step4_set_6:  { dogfight_step4_position: { action: set, int: 6 } }
  dogfight_step4_set_7:  { dogfight_step4_position: { action: set, int: 7 } }
  dogfight_step4_set_8:  { dogfight_step4_position: { action: set, int: 8 } }
  dogfight_step4_set_9:  { dogfight_step4_position: { action: set, int: 9 } }
  dogfight_step4_set_10: { dogfight_step4_position: { action: set, int: 10 } }
  dogfight_step4_set_11: { dogfight_step4_position: { action: set, int: 11 } }

####################################################################################
# EVENT PLAYER
####################################################################################

event_player:
  ##############################################
  ## MODE START
  ##############################################
  mode_pilot_training_mission_dogfight_started:
    - dogfight_set_gi|200ms
    - dogfight_play_instructions_voice

  ##############################################
  ## SKIP INTRO - both flippers during intro window (phoenix-style)
  ##############################################
  s_flipper_left_active{current_player.dogfight_step==0 and device.timers.dogfight_intro_video_delay.running}:
    - dogfight_check_skip_intro
  s_flipper_right_active{current_player.dogfight_step==0 and device.timers.dogfight_intro_video_delay.running}:
    - dogfight_check_skip_intro
  dogfight_check_skip_intro{device.switches.s_flipper_left.state and device.switches.s_flipper_right.state}:
    - dogfight_skip_intro

  # Skip path (no scoop/barrier -> no 400ms delay needed, left-lane post release)
  dogfight_skip_intro:
    - dogfight_ball_released
    - dogfight_setup_step_1
  # Normal path: intro timer completes
  timer_dogfight_intro_video_delay_complete:
    - dogfight_ball_released
    - dogfight_setup_step_1

  # On release: establish servo baseline (right ramp DOWN for RR, top ramp DOWN for TR)
  dogfight_ball_released:
    - right_ramp_down
    - top_ramp_down|500ms

  ##############################################
  ## GI STROBE ON GOOD HITS (steps 1-11), then restore alternating GI
  ##############################################
  dogfight_step_1_shot_hit:  [dogfight_good_hit]
  dogfight_step_2_shot_hit:  [dogfight_good_hit]
  dogfight_step_3_shot_hit:  [dogfight_good_hit]
  dogfight_step_4_shot_hit:  [dogfight_good_hit]
  dogfight_step_5_shot_hit:  [dogfight_good_hit]
  dogfight_step_6_shot_hit:  [dogfight_good_hit]
  dogfight_step_7_shot_hit:  [dogfight_good_hit]
  dogfight_step_8_shot_hit:  [dogfight_good_hit]
  dogfight_step_9_shot_hit:  [dogfight_good_hit]
  dogfight_step_10_shot_hit: [dogfight_good_hit]
  dogfight_step_11_shot_hit: [dogfight_good_hit]
  dogfight_good_hit:
    - dogfight_set_gi|400ms      # restore alternating GI after the strobe show
    - dogfight_show_points       # base.yaml displays mode_points_scored

  ##############################################
  ## BAD-SHOT PENALTY - 10s no-hold flippers (restarts on repeat).
  ## First activation (penalty_active==0): swap flippers, show slide, GI strobe.
  ## Repeat bad shots just restart the 10s timer (timer control_event).
  ## Timer expiry -> dogfight_no_hold_end restores everything.
  ##############################################
  dogfight_bad_shot_hit:
    - dogfight_penalty_activate
  dogfight_penalty_activate{current_player.dogfight_penalty_active==0}:
    - disable_normal_flippers
    - enable_no_hold_flippers
    - dogfight_penalty_gi_start
  timer_dogfight_no_hold_timer_complete:
    - dogfight_no_hold_end
  dogfight_no_hold_end:
    - disable_no_hold_flippers
    - enable_normal_flippers
    - dogfight_penalty_gi_stop
    - dogfight_set_gi                # restore GI 1-4/18-21 to alternating

  ##############################################
  ## STEP 1: LR | RR  (hit either)
  ##############################################
  s_ramp_left_exit_active{current_player.dogfight_step==0}:
    - dogfight_step_1_complete
    - dogfight_step_1_shot_hit
    - dogfight_setup_step_2
  s_ramp_right_exit_active{current_player.dogfight_step==0}:
    - dogfight_step_1_complete
    - dogfight_step_1_shot_hit
    - dogfight_setup_step_2

  ##############################################
  ## STEP 2: LO | LR | TWR | RR  (hit any; remember which)
  ##############################################
  left_orbit_shot_hit{current_player.dogfight_step==1}:
    - dogfight_step_2_complete
    - dogfight_s2_hit_lo
    - dogfight_step_2_shot_hit
    - dogfight_setup_step_3
  s_ramp_left_exit_active{current_player.dogfight_step==1}:
    - dogfight_step_2_complete
    - dogfight_s2_hit_lr
    - dogfight_step_2_shot_hit
    - dogfight_setup_step_3
  s_ramp_tower_exit_active{current_player.dogfight_step==1}:
    - dogfight_step_2_complete
    - dogfight_s2_hit_twr
    - dogfight_step_2_shot_hit
    - dogfight_setup_step_3
  s_ramp_right_exit_active{current_player.dogfight_step==1}:
    - dogfight_step_2_complete
    - dogfight_s2_hit_rr
    - dogfight_step_2_shot_hit
    - dogfight_setup_step_3

  ##############################################
  ## STEP 3: other 3 good; step-2 shot is BAD (bad -> penalty, no advance)
  ##############################################
  left_orbit_shot_hit{current_player.dogfight_step==2 and current_player.dogfight_s2_hit!=1}:
    - dogfight_step_3_complete
    - dogfight_step_3_shot_hit
    - dogfight_setup_step_4
  left_orbit_shot_hit{current_player.dogfight_step==2 and current_player.dogfight_s2_hit==1}:
    - dogfight_bad_shot_hit
  s_ramp_left_exit_active{current_player.dogfight_step==2 and current_player.dogfight_s2_hit!=2}:
    - dogfight_step_3_complete
    - dogfight_step_3_shot_hit
    - dogfight_setup_step_4
  s_ramp_left_exit_active{current_player.dogfight_step==2 and current_player.dogfight_s2_hit==2}:
    - dogfight_bad_shot_hit
  s_ramp_tower_exit_active{current_player.dogfight_step==2 and current_player.dogfight_s2_hit!=3}:
    - dogfight_step_3_complete
    - dogfight_step_3_shot_hit
    - dogfight_setup_step_4
  s_ramp_tower_exit_active{current_player.dogfight_step==2 and current_player.dogfight_s2_hit==3}:
    - dogfight_bad_shot_hit
  s_ramp_right_exit_active{current_player.dogfight_step==2 and current_player.dogfight_s2_hit!=4}:
    - dogfight_step_3_complete
    - dogfight_step_3_shot_hit
    - dogfight_setup_step_4
  s_ramp_right_exit_active{current_player.dogfight_step==2 and current_player.dogfight_s2_hit==4}:
    - dogfight_bad_shot_hit

  ##############################################
  ## STEP 4: MOVING TARGET (4s/step, 1s grace)
  ## Positions: 0 SP,1 TWR,2 TL,3 TR,4 RR,5 TR,6 TL,7 TWR,8 SP,9 LR,10 LO,11 LR
  ##############################################
  dogfight_setup_step_4:
    - dogfight_step4_set_0
    - dogfight_step4_alloff
    - dogfight_step4_lit_0
  timer_dogfight_step4_cycle_complete:
    - dogfight_step4_advance
  dogfight_step4_advance{current_player.dogfight_step4_position==0}:  [dogfight_step4_set_1,  dogfight_step4_alloff, dogfight_step4_lit_1]
  dogfight_step4_advance{current_player.dogfight_step4_position==1}:  [dogfight_step4_set_2,  dogfight_step4_alloff, dogfight_step4_lit_2]
  dogfight_step4_advance{current_player.dogfight_step4_position==2}:  [dogfight_step4_set_3,  dogfight_step4_alloff, dogfight_step4_lit_3]
  dogfight_step4_advance{current_player.dogfight_step4_position==3}:  [dogfight_step4_set_4,  dogfight_step4_alloff, dogfight_step4_lit_4]
  dogfight_step4_advance{current_player.dogfight_step4_position==4}:  [dogfight_step4_set_5,  dogfight_step4_alloff, dogfight_step4_lit_5]
  dogfight_step4_advance{current_player.dogfight_step4_position==5}:  [dogfight_step4_set_6,  dogfight_step4_alloff, dogfight_step4_lit_6]
  dogfight_step4_advance{current_player.dogfight_step4_position==6}:  [dogfight_step4_set_7,  dogfight_step4_alloff, dogfight_step4_lit_7]
  dogfight_step4_advance{current_player.dogfight_step4_position==7}:  [dogfight_step4_set_8,  dogfight_step4_alloff, dogfight_step4_lit_8]
  dogfight_step4_advance{current_player.dogfight_step4_position==8}:  [dogfight_step4_set_9,  dogfight_step4_alloff, dogfight_step4_lit_9]
  dogfight_step4_advance{current_player.dogfight_step4_position==9}:  [dogfight_step4_set_10, dogfight_step4_alloff, dogfight_step4_lit_10]
  dogfight_step4_advance{current_player.dogfight_step4_position==10}: [dogfight_step4_set_11, dogfight_step4_alloff, dogfight_step4_lit_11]
  dogfight_step4_advance{current_player.dogfight_step4_position==11}: [dogfight_step4_set_0,  dogfight_step4_alloff, dogfight_step4_lit_0]

  # Step 4 shot detection (current position OR 1s grace position)
  spinner_shot_made{current_player.dogfight_step==3 and (current_player.dogfight_step4_position==0 or current_player.dogfight_step4_position==8 or current_player.dogfight_step4_grace_pos==0 or current_player.dogfight_step4_grace_pos==8)}:
    - dogfight_step_4_complete
    - dogfight_step_4_shot_hit
    - dogfight_setup_step_5
  s_ramp_tower_exit_active{current_player.dogfight_step==3 and (current_player.dogfight_step4_position==1 or current_player.dogfight_step4_position==7 or current_player.dogfight_step4_grace_pos==1 or current_player.dogfight_step4_grace_pos==7)}:
    - dogfight_step_4_complete
    - dogfight_step_4_shot_hit
    - dogfight_setup_step_5
  s_orbit_upper_active{current_player.dogfight_step==3 and (current_player.dogfight_step4_position==2 or current_player.dogfight_step4_position==6 or current_player.dogfight_step4_grace_pos==2 or current_player.dogfight_step4_grace_pos==6)}:
    - dogfight_step_4_complete
    - dogfight_step_4_shot_hit
    - dogfight_setup_step_5
  s_ramp_inner_exit_active{current_player.dogfight_step==3 and (current_player.dogfight_step4_position==3 or current_player.dogfight_step4_position==5 or current_player.dogfight_step4_grace_pos==3 or current_player.dogfight_step4_grace_pos==5)}:
    - dogfight_step_4_complete
    - dogfight_step_4_shot_hit
    - dogfight_setup_step_5
  s_ramp_right_exit_active{current_player.dogfight_step==3 and (current_player.dogfight_step4_position==4 or current_player.dogfight_step4_grace_pos==4)}:
    - dogfight_step_4_complete
    - dogfight_step_4_shot_hit
    - dogfight_setup_step_5
  s_ramp_left_exit_active{current_player.dogfight_step==3 and (current_player.dogfight_step4_position==9 or current_player.dogfight_step4_position==11 or current_player.dogfight_step4_grace_pos==9 or current_player.dogfight_step4_grace_pos==11)}:
    - dogfight_step_4_complete
    - dogfight_step_4_shot_hit
    - dogfight_setup_step_5
  left_orbit_shot_hit{current_player.dogfight_step==3 and (current_player.dogfight_step4_position==10 or current_player.dogfight_step4_grace_pos==10)}:
    - dogfight_step_4_complete
    - dogfight_step_4_shot_hit
    - dogfight_setup_step_5

  ##############################################
  ## STEP 5: raise right ramp; LO | SP | RO  (remember which)
  ##############################################
  dogfight_setup_step_5:
    - right_ramp_up
  left_orbit_shot_hit{current_player.dogfight_step==4}:
    - dogfight_step_5_complete
    - dogfight_s5_hit_lo
    - dogfight_step_5_shot_hit
    - dogfight_setup_step_6
  spinner_shot_made{current_player.dogfight_step==4}:
    - dogfight_step_5_complete
    - dogfight_s5_hit_sp
    - dogfight_step_5_shot_hit
    - dogfight_setup_step_6
  right_orbit_shot_hit{current_player.dogfight_step==4}:
    - dogfight_step_5_complete
    - dogfight_s5_hit_ro
    - dogfight_step_5_shot_hit
    - dogfight_setup_step_6

  ##############################################
  ## STEP 6: other 2 good; step-5 shot BAD. Made -> lower right ramp, step 7
  ##############################################
  left_orbit_shot_hit{current_player.dogfight_step==5 and current_player.dogfight_s5_hit!=1}:
    - dogfight_step_6_complete
    - dogfight_step_6_shot_hit
    - dogfight_setup_step_7
  left_orbit_shot_hit{current_player.dogfight_step==5 and current_player.dogfight_s5_hit==1}:
    - dogfight_bad_shot_hit
  spinner_shot_made{current_player.dogfight_step==5 and current_player.dogfight_s5_hit!=2}:
    - dogfight_step_6_complete
    - dogfight_step_6_shot_hit
    - dogfight_setup_step_7
  spinner_shot_made{current_player.dogfight_step==5 and current_player.dogfight_s5_hit==2}:
    - dogfight_bad_shot_hit
  right_orbit_shot_hit{current_player.dogfight_step==5 and current_player.dogfight_s5_hit!=3}:
    - dogfight_step_6_complete
    - dogfight_step_6_shot_hit
    - dogfight_setup_step_7
  right_orbit_shot_hit{current_player.dogfight_step==5 and current_player.dogfight_s5_hit==3}:
    - dogfight_bad_shot_hit

  ##############################################
  ## STEP 7: TWR (lower right ramp on entry)
  ##############################################
  dogfight_setup_step_7:
    - right_ramp_down
  s_ramp_tower_exit_active{current_player.dogfight_step==6}:
    - dogfight_step_7_complete
    - dogfight_step_7_shot_hit
    - dogfight_setup_step_8

  ##############################################
  ## STEP 8: CNT - barrier is already UP (held by qualifier the whole mode)
  ##############################################
  s_barrier_target_active{current_player.dogfight_step==7}:
    - dogfight_step_8_complete
    - dogfight_step_8_shot_hit
    - dogfight_setup_step_9

  ##############################################
  ## STEP 9-11: LO | LR | RO | TWR (4 lit). Any 3 of 4 -> step 12.
  ## Each good hit: mark that shot bad, advance, play next video.
  ## setup_step_9: raise right ramp for RO.
  ##############################################
  dogfight_setup_step_9:
    - right_ramp_up

  # Good hits, NON-completing (count<2): mark bad + solid red + advance
  left_orbit_shot_hit{current_player.dogfight_step>=8 and current_player.dogfight_step<=10 and current_player.dogfight_s9_lo==0 and current_player.dogfight_s9_count<2}:
    - dogfight_s9_mark_lo
    - dogfight_s9_progress
    - dogfight_s9_light_lo_bad
  s_ramp_left_exit_active{current_player.dogfight_step>=8 and current_player.dogfight_step<=10 and current_player.dogfight_s9_lr==0 and current_player.dogfight_s9_count<2}:
    - dogfight_s9_mark_lr
    - dogfight_s9_progress
    - dogfight_s9_light_lr_bad
  right_orbit_shot_hit{current_player.dogfight_step>=8 and current_player.dogfight_step<=10 and current_player.dogfight_s9_ro==0 and current_player.dogfight_s9_count<2}:
    - dogfight_s9_mark_ro
    - dogfight_s9_progress
    - dogfight_s9_light_ro_bad
  s_ramp_tower_exit_active{current_player.dogfight_step>=8 and current_player.dogfight_step<=10 and current_player.dogfight_s9_twr==0 and current_player.dogfight_s9_count<2}:
    - dogfight_s9_mark_twr
    - dogfight_s9_progress
    - dogfight_s9_light_twr_bad

  # COMPLETING hit (count==2): advance to step 12 only - NO red (we leave the phase)
  left_orbit_shot_hit{current_player.dogfight_step>=8 and current_player.dogfight_step<=10 and current_player.dogfight_s9_lo==0 and current_player.dogfight_s9_count==2}:
    - dogfight_s9_mark_lo
    - dogfight_s9_progress
  s_ramp_left_exit_active{current_player.dogfight_step>=8 and current_player.dogfight_step<=10 and current_player.dogfight_s9_lr==0 and current_player.dogfight_s9_count==2}:
    - dogfight_s9_mark_lr
    - dogfight_s9_progress
  right_orbit_shot_hit{current_player.dogfight_step>=8 and current_player.dogfight_step<=10 and current_player.dogfight_s9_ro==0 and current_player.dogfight_s9_count==2}:
    - dogfight_s9_mark_ro
    - dogfight_s9_progress
  s_ramp_tower_exit_active{current_player.dogfight_step>=8 and current_player.dogfight_step<=10 and current_player.dogfight_s9_twr==0 and current_player.dogfight_s9_count==2}:
    - dogfight_s9_mark_twr
    - dogfight_s9_progress

  # Bad hits (already marked) -> penalty
  left_orbit_shot_hit{current_player.dogfight_step>=8 and current_player.dogfight_step<=10 and current_player.dogfight_s9_lo==1}:
    - dogfight_bad_shot_hit
  s_ramp_left_exit_active{current_player.dogfight_step>=8 and current_player.dogfight_step<=10 and current_player.dogfight_s9_lr==1}:
    - dogfight_bad_shot_hit
  right_orbit_shot_hit{current_player.dogfight_step>=8 and current_player.dogfight_step<=10 and current_player.dogfight_s9_ro==1}:
    - dogfight_bad_shot_hit
  s_ramp_tower_exit_active{current_player.dogfight_step>=8 and current_player.dogfight_step<=10 and current_player.dogfight_s9_twr==1}:
    - dogfight_bad_shot_hit

  # Progress by count (1st/2nd/3rd good hit)
  dogfight_s9_progress{current_player.dogfight_s9_count==0}:
    - dogfight_step_9_complete
    - dogfight_step_9_shot_hit
  dogfight_s9_progress{current_player.dogfight_s9_count==1}:
    - dogfight_step_10_complete
    - dogfight_step_10_shot_hit
  dogfight_s9_progress{current_player.dogfight_s9_count==2}:
    - dogfight_step_11_complete
    - dogfight_step_11_shot_hit
    - dogfight_setup_step_12

  ##############################################
  ## STEP 12: VICTORY - LL lit; SP + TL pulse -> open left diverter 3s.
  ## LL -> victory (hold ball, won video, perk select)
  ## Lower right ramp on entry (it was raised for steps 9-11).
  ##############################################
  dogfight_setup_step_12:
    - right_ramp_down
  spinner_shot_made{current_player.dogfight_step==11}:
    - dogfight_open_diverter
  s_orbit_upper_active{current_player.dogfight_step==11}:
    - dogfight_open_diverter
  dogfight_open_diverter:
    - left_orbit_diverter_open
  timer_dogfight_diverter_hold_complete:
    - left_orbit_diverter_closed
  s_lane_left_active{current_player.dogfight_step==11}:
    - dogfight_step_12_complete
    - dogfight_complete

  ##############################################
  ## VICTORY FLOW (cleanup deliberately delayed - pitfall #3)
  ##############################################
  dogfight_complete:
    - left_orbit_diverter_closed
    - dogfight_show_points

  # WON VIDEO SKIP - both flippers during won video -> jump to award selection
  s_flipper_left_active{current_player.dogfight_won_video_active==1}:
    - dogfight_check_skip_won
  s_flipper_right_active{current_player.dogfight_won_video_active==1}:
    - dogfight_check_skip_won
  dogfight_check_skip_won{device.switches.s_flipper_left.state and device.switches.s_flipper_right.state}:
    - dogfight_show_perk_select

  # Won video ends (14s timer OR skip) -> award selection
  timer_dogfight_won_video_delay_complete:
    - dogfight_show_perk_select

  ##############################################
  ## AWARD SELECTION - 20s auto-select
  ## Navigate: HOLD one flipper ~200ms (RIGHT = down, LEFT = up)
  ## Select:   BOTH flippers (after 3s arm)
  ## The hold buffer means a quick double-flip selects without stepping first.
  ##############################################
  # BOTH flippers held -> select the current award (only after the 3s arm delay)
  s_flipper_right_active{current_player.dogfight_award_selecting==1 and current_player.dogfight_award_select_armed==1 and device.switches.s_flipper_left.state==1}:
    - dogfight_award_confirm
  s_flipper_left_active{current_player.dogfight_award_selecting==1 and current_player.dogfight_award_select_armed==1 and device.switches.s_flipper_right.state==1}:
    - dogfight_award_confirm
  # Arm the both-flipper select 3s after reaching the award slide
  timer_dogfight_award_arm_timer_complete:
    - dogfight_award_arm

  # HOLD-to-navigate: on flipper press, schedule a check 200ms later.
  # Navigate only if that flipper is STILL held AND the other is NOT held
  # (so a double-flip, where the other joins within 200ms, never steps).
  s_flipper_right_active{current_player.dogfight_award_selecting==1}:
    - dogfight_award_right_hold_check|200ms
  dogfight_award_right_hold_check{current_player.dogfight_award_selecting==1 and device.switches.s_flipper_right.state==1 and device.switches.s_flipper_left.state==0}:
    - dogfight_award_down
    - dogfight_award_nav
  s_flipper_left_active{current_player.dogfight_award_selecting==1}:
    - dogfight_award_left_hold_check|200ms
  dogfight_award_left_hold_check{current_player.dogfight_award_selecting==1 and device.switches.s_flipper_left.state==1 and device.switches.s_flipper_right.state==0}:
    - dogfight_award_up
    - dogfight_award_nav
  # Index move with wrap (0..5)
  dogfight_award_down{current_player.dogfight_award_index<5}:
    - dogfight_award_inc
  dogfight_award_down{current_player.dogfight_award_index==5}:
    - dogfight_award_wrap0
  dogfight_award_up{current_player.dogfight_award_index>0}:
    - dogfight_award_dec
  dogfight_award_up{current_player.dogfight_award_index==0}:
    - dogfight_award_wrap5
  # After any index change, refresh the displayed name
  dogfight_award_inc:   [dogfight_award_refresh]
  dogfight_award_dec:   [dogfight_award_refresh]
  dogfight_award_wrap0: [dogfight_award_refresh]
  dogfight_award_wrap5: [dogfight_award_refresh]

  # Timer expiry -> auto-select the currently displayed award
  timer_dogfight_award_select_timer_complete:
    - dogfight_award_confirm

  # Confirm -> grant the selected award, then end (500ms so grant lands before mode stops)
  dogfight_award_confirm{current_player.dogfight_award_index==0}:
    - light_extra_ball
  dogfight_award_confirm{current_player.dogfight_award_index==1}:
    - dogfight_grant_inverted
  dogfight_award_confirm{current_player.dogfight_award_index==2}:
    - dogfight_grant_missiles
  dogfight_award_confirm{current_player.dogfight_award_index==3}:
    - dogfight_grant_afterburner
  dogfight_award_confirm{current_player.dogfight_award_index==4}:
    - dogfight_grant_wingman
  dogfight_award_confirm{current_player.dogfight_award_index==5}:
    - x2_playfield_qualified
  dogfight_award_confirm:
    - dogfight_victory_end|500ms

  dogfight_victory_end:
    - dogfight_cleanup
    - dogfight_release_victory_ball
    - dogfight_video_complete
    - pilot_mode_cleanup_complete

  ##############################################
  ## LOSS (timer expiry or drain) - lost video 35s, skippable via both flippers
  ##############################################
  timer_dogfight_mode_timer_complete:
    - dogfight_failed
  dogfight_failed:
    - dogfight_cleanup
  # LOST VIDEO SKIP - both flippers during lost video
  s_flipper_left_active{current_player.dogfight_lost_video_active==1}:
    - dogfight_check_skip_lost
  s_flipper_right_active{current_player.dogfight_lost_video_active==1}:
    - dogfight_check_skip_lost
  dogfight_check_skip_lost{device.switches.s_flipper_left.state and device.switches.s_flipper_right.state}:
    - dogfight_lost_done
  # Lost video ends (35s timer OR skip)
  timer_dogfight_lost_delay_complete:
    - dogfight_lost_done
  dogfight_lost_done:
    - dogfight_drain_cleanup_complete   # releases drain queue if draining (harmless otherwise)
    - dogfight_video_complete
    - pilot_mode_cleanup_complete

  ##############################################
  ## DRAIN - route through the same lost flow (holds bonus until lost video done)
  ##############################################
  dogfight_ball_ending_hold:
    - dogfight_failed

  ##############################################
  ## CLEANUP - servos safe, flippers restored, diverter/barrier reset
  ##############################################
  dogfight_cleanup:
    - disable_no_hold_flippers
    - enable_normal_flippers
    - right_ramp_down
    - top_ramp_down|500ms
    - left_orbit_diverter_closed

####################################################################################
# SOUND PLAYER - voice callouts only (music lives in base.yaml)
# NOTE: confirm these voice asset names exist, or rename to your actual assets.
####################################################################################

sound_player:
  dogfight_play_instructions_voice:
    voice_dogfight_training_mission_instructions: { bus: voice, loops: 0 }

####################################################################################
# SLIDE PLAYER  (mode_points_scored is displayed from base.yaml via dogfight_show_points)
####################################################################################

slide_player:
  mode_pilot_training_mission_dogfight_started:
    dogfight_timer: { action: play, priority: 1000 }
    dogfight_intro_video: { action: play, priority: 900 }
    dogfight_instructions: { action: play, priority: 810 }   # persists entire mode
    dogfight_shots_remaining: { action: play, priority: 800 }

  # Remove intro video once ball is released (covers skip + normal paths)
  dogfight_ball_released:
    dogfight_intro_video: { action: remove }

  # Step videos (remove previous, play current)
  dogfight_step_1_shot_hit:
    dogfight_step_1: { action: play, priority: 820 }
  dogfight_step_2_shot_hit:
    dogfight_step_1: { action: remove }
    dogfight_step_2: { action: play, priority: 820 }
  dogfight_step_3_shot_hit:
    dogfight_step_2: { action: remove }
    dogfight_step_3: { action: play, priority: 820 }
  dogfight_step_4_shot_hit:
    dogfight_step_3: { action: remove }
    dogfight_step_4: { action: play, priority: 820 }
  dogfight_step_5_shot_hit:
    dogfight_step_4: { action: remove }
    dogfight_step_5: { action: play, priority: 820 }
  dogfight_step_6_shot_hit:
    dogfight_step_5: { action: remove }
    dogfight_step_6: { action: play, priority: 820 }
  dogfight_step_7_shot_hit:
    dogfight_step_6: { action: remove }
    dogfight_step_7: { action: play, priority: 820 }
  dogfight_step_8_shot_hit:
    dogfight_step_7: { action: remove }
    dogfight_step_8: { action: play, priority: 820 }
  dogfight_step_9_shot_hit:
    dogfight_step_8: { action: remove }
    dogfight_step_9: { action: play, priority: 820 }
  dogfight_step_10_shot_hit:
    dogfight_step_9: { action: remove }
    dogfight_step_10: { action: play, priority: 820 }
  dogfight_step_11_shot_hit:
    dogfight_step_10: { action: remove }
    dogfight_step_11: { action: play, priority: 820 }

  # Victory: won video (14s), then award decision slide
  dogfight_complete:
    dogfight_step_11: { action: remove }
    dogfight_timer: { action: remove }
    dogfight_shots_remaining: { action: remove }
    dogfight_instructions: { action: remove }
    dogfight_won: { action: play, priority: 900 }
  dogfight_show_perk_select:
    dogfight_won: { action: remove }
    dogfight_award_decision: { action: play, priority: 900 }
  # Award chosen -> remove the decision slide
  dogfight_award_confirm:
    dogfight_award_decision: { action: remove }

  # Loss (timer or drain) - lost video 35s
  dogfight_failed:
    dogfight_timer: { action: remove }
    dogfight_shots_remaining: { action: remove }
    dogfight_instructions: { action: remove }
    dogfight_lost: { action: play, priority: 900 }
  dogfight_lost_done:
    dogfight_lost: { action: remove }

  # Safety cleanup on stop
  mode_pilot_training_mission_dogfight_stopped:
    dogfight_timer: { action: remove }
    dogfight_shots_remaining: { action: remove }
    dogfight_instructions: { action: remove }
    dogfight_intro_video: { action: remove }
    dogfight_award_decision: { action: remove }
    dogfight_won: { action: remove }
    dogfight_lost: { action: remove }

####################################################################################
# SHOW PLAYER - flashing GOOD shots (sync_flash_mode) + GI strobe on hits
# Shared light l_shot_right_orbit (RR/RO) uses one key: mode_ro
####################################################################################

show_player:
  # STEP 1: LR + RR
  dogfight_setup_step_1:
    s_lr: { show: sync_flash_mode, key: mode_lr, sync_ms: 1000, loops: -1, show_tokens: { led: l_shot_left_ramp, color: FFFF00 } }
    s_rr: { show: sync_flash_mode, key: mode_ro, sync_ms: 1000, loops: -1, show_tokens: { led: l_shot_right_orbit, color: FFFF00 } }

  # STEP 2: LO + LR + TWR + RR
  dogfight_setup_step_2:
    stop_lr: { show: sync_flash_mode, action: stop, key: mode_lr }
    stop_ro: { show: sync_flash_mode, action: stop, key: mode_ro }
    s_lo:  { show: sync_flash_mode, key: mode_lo,  sync_ms: 1000, loops: -1, show_tokens: { led: l_shot_left_orbit,  color: FFFF00 } }
    s_lr:  { show: sync_flash_mode, key: mode_lr,  sync_ms: 1000, loops: -1, show_tokens: { led: l_shot_left_ramp,   color: FFFF00 } }
    s_twr: { show: sync_flash_mode, key: mode_twr, sync_ms: 1000, loops: -1, show_tokens: { led: l_shot_tower_ramp,  color: FFFF00 } }
    s_rr:  { show: sync_flash_mode, key: mode_ro,  sync_ms: 1000, loops: -1, show_tokens: { led: l_shot_right_orbit, color: FFFF00 } }

  # STEP 3: re-flash all 4; conditional stops the BAD one (step-2 hit)
  dogfight_setup_step_3:
    stop_lo:  { show: sync_flash_mode, action: stop, key: mode_lo }
    stop_lr:  { show: sync_flash_mode, action: stop, key: mode_lr }
    stop_twr: { show: sync_flash_mode, action: stop, key: mode_twr }
    stop_ro:  { show: sync_flash_mode, action: stop, key: mode_ro }
    f_lo:  { show: sync_flash_mode, key: mode_lo,  sync_ms: 1000, loops: -1, show_tokens: { led: l_shot_left_orbit,  color: FFFF00 } }
    f_lr:  { show: sync_flash_mode, key: mode_lr,  sync_ms: 1000, loops: -1, show_tokens: { led: l_shot_left_ramp,   color: FFFF00 } }
    f_twr: { show: sync_flash_mode, key: mode_twr, sync_ms: 1000, loops: -1, show_tokens: { led: l_shot_tower_ramp,  color: FFFF00 } }
    f_rr:  { show: sync_flash_mode, key: mode_ro,  sync_ms: 1000, loops: -1, show_tokens: { led: l_shot_right_orbit, color: FFFF00 } }
  dogfight_setup_step_3{current_player.dogfight_s2_hit==1}:
    bad_lo: { show: sync_flash_mode, action: stop, key: mode_lo }
  dogfight_setup_step_3{current_player.dogfight_s2_hit==2}:
    bad_lr: { show: sync_flash_mode, action: stop, key: mode_lr }
  dogfight_setup_step_3{current_player.dogfight_s2_hit==3}:
    bad_twr: { show: sync_flash_mode, action: stop, key: mode_twr }
  dogfight_setup_step_3{current_player.dogfight_s2_hit==4}:
    bad_rr: { show: sync_flash_mode, action: stop, key: mode_ro }

  # STEP 4: moving target lights handled in light_player (solid). Stop step-3 flashes.
  dogfight_setup_step_4:
    stop_lo:  { show: sync_flash_mode, action: stop, key: mode_lo }
    stop_lr:  { show: sync_flash_mode, action: stop, key: mode_lr }
    stop_twr: { show: sync_flash_mode, action: stop, key: mode_twr }
    stop_ro:  { show: sync_flash_mode, action: stop, key: mode_ro }

  # STEP 5: LO + SP + RO
  dogfight_setup_step_5:
    s_lo: { show: sync_flash_mode, key: mode_lo, sync_ms: 1000, loops: -1, show_tokens: { led: l_shot_left_orbit,  color: FFFF00 } }
    s_sp: { show: sync_flash_mode, key: mode_sp, sync_ms: 1000, loops: -1, show_tokens: { led: l_shot_spinner,     color: FFFF00 } }
    s_ro: { show: sync_flash_mode, key: mode_ro, sync_ms: 1000, loops: -1, show_tokens: { led: l_shot_right_orbit, color: FFFF00 } }

  # STEP 6: re-flash LO/SP/RO; conditional stops the BAD one (step-5 hit)
  dogfight_setup_step_6:
    stop_lo: { show: sync_flash_mode, action: stop, key: mode_lo }
    stop_sp: { show: sync_flash_mode, action: stop, key: mode_sp }
    stop_ro: { show: sync_flash_mode, action: stop, key: mode_ro }
    f_lo: { show: sync_flash_mode, key: mode_lo, sync_ms: 1000, loops: -1, show_tokens: { led: l_shot_left_orbit,  color: FFFF00 } }
    f_sp: { show: sync_flash_mode, key: mode_sp, sync_ms: 1000, loops: -1, show_tokens: { led: l_shot_spinner,     color: FFFF00 } }
    f_ro: { show: sync_flash_mode, key: mode_ro, sync_ms: 1000, loops: -1, show_tokens: { led: l_shot_right_orbit, color: FFFF00 } }
  dogfight_setup_step_6{current_player.dogfight_s5_hit==1}:
    bad_lo: { show: sync_flash_mode, action: stop, key: mode_lo }
  dogfight_setup_step_6{current_player.dogfight_s5_hit==2}:
    bad_sp: { show: sync_flash_mode, action: stop, key: mode_sp }
  dogfight_setup_step_6{current_player.dogfight_s5_hit==3}:
    bad_ro: { show: sync_flash_mode, action: stop, key: mode_ro }

  # STEP 7: TWR
  dogfight_setup_step_7:
    stop_lo: { show: sync_flash_mode, action: stop, key: mode_lo }
    stop_sp: { show: sync_flash_mode, action: stop, key: mode_sp }
    stop_ro: { show: sync_flash_mode, action: stop, key: mode_ro }
    s_twr: { show: sync_flash_mode, key: mode_twr, sync_ms: 1000, loops: -1, show_tokens: { led: l_shot_tower_ramp, color: FFFF00 } }

  # STEP 8: CNT
  dogfight_setup_step_8:
    stop_twr: { show: sync_flash_mode, action: stop, key: mode_twr }
    s_cnt: { show: sync_flash_mode, key: mode_cnt, sync_ms: 1000, loops: -1, show_tokens: { led: l_shot_barrier, color: FFFF00 } }

  # STEP 9-11: LO + LR + RO + TWR
  dogfight_setup_step_9:
    stop_cnt: { show: sync_flash_mode, action: stop, key: mode_cnt }
    s_lo:  { show: sync_flash_mode, key: mode_lo,  sync_ms: 1000, loops: -1, show_tokens: { led: l_shot_left_orbit,  color: FFFF00 } }
    s_lr:  { show: sync_flash_mode, key: mode_lr,  sync_ms: 1000, loops: -1, show_tokens: { led: l_shot_left_ramp,   color: FFFF00 } }
    s_ro:  { show: sync_flash_mode, key: mode_ro,  sync_ms: 1000, loops: -1, show_tokens: { led: l_shot_right_orbit, color: FFFF00 } }
    s_twr: { show: sync_flash_mode, key: mode_twr, sync_ms: 1000, loops: -1, show_tokens: { led: l_shot_tower_ramp,  color: FFFF00 } }
  # Convert each hit shot to bad (stop its flash; solid red in light_player)
  dogfight_s9_light_lo_bad:
    stop_lo: { show: sync_flash_mode, action: stop, key: mode_lo }
  dogfight_s9_light_lr_bad:
    stop_lr: { show: sync_flash_mode, action: stop, key: mode_lr }
  dogfight_s9_light_ro_bad:
    stop_ro: { show: sync_flash_mode, action: stop, key: mode_ro }
  dogfight_s9_light_twr_bad:
    stop_twr: { show: sync_flash_mode, action: stop, key: mode_twr }

  # STEP 12: LL flash (victory target); SP + TL pulse (sync_pulse_mode)
  dogfight_setup_step_12:
    stop_lo:  { show: sync_flash_mode, action: stop, key: mode_lo }
    stop_lr:  { show: sync_flash_mode, action: stop, key: mode_lr }
    stop_ro:  { show: sync_flash_mode, action: stop, key: mode_ro }
    stop_twr: { show: sync_flash_mode, action: stop, key: mode_twr }
    s_ll:  { show: sync_flash_mode, key: mode_ll, sync_ms: 1000, loops: -1, show_tokens: { led: l_shot_left_lane, color: FFFF00 } }
    p_sp:  { show: sync_pulse_mode, key: mode_sp_pulse, loops: -1, show_tokens: { led: l_shot_spinner,     color: FFFF00 } }
    p_tl:  { show: sync_pulse_mode, key: mode_tl_pulse, loops: -1, show_tokens: { led: l_shot_upper_orbit, color: FFFF00 } }

  # GI strobe on each good hit
  dogfight_good_hit:
    gi_flash: { show: dogfight_gi_flash, key: gi_effect, loops: 0 }

  # No-hold penalty: red strobe on slingshot/inlane GI (lights 1-4, 18-21)
  dogfight_penalty_gi_start:
    penalty_gi: { show: dogfight_gi_penalty_strobe, key: dogfight_penalty_gi_effect, loops: -1 }
  dogfight_penalty_gi_stop:
    stop_penalty_gi: { show: dogfight_gi_penalty_strobe, action: stop, key: dogfight_penalty_gi_effect }

  # CLEANUP - stop everything
  dogfight_cleanup:
    c1: { show: sync_flash_mode, action: stop, key: mode_lo }
    c2: { show: sync_flash_mode, action: stop, key: mode_lr }
    c3: { show: sync_flash_mode, action: stop, key: mode_twr }
    c4: { show: sync_flash_mode, action: stop, key: mode_ro }
    c5: { show: sync_flash_mode, action: stop, key: mode_sp }
    c6: { show: sync_flash_mode, action: stop, key: mode_cnt }
    c7: { show: sync_flash_mode, action: stop, key: mode_ll }
    c8: { show: sync_pulse_mode, action: stop, key: mode_sp_pulse }
    c9: { show: sync_pulse_mode, action: stop, key: mode_tl_pulse }
    c10: { show: dogfight_gi_flash, action: stop, key: gi_effect }
    c11: { show: dogfight_gi_penalty_strobe, action: stop, key: dogfight_penalty_gi_effect }

####################################################################################
# LIGHT PLAYER - GI (alternating light-blue/white), bad reds, moving target
####################################################################################

light_player:
  # Alternating light-blue (odd) / white (even); pop bumpers light blue
  dogfight_set_gi:
    l_gi_light_1: { color: ADD8E6, fade: 200ms }
    l_gi_light_2: { color: white, fade: 200ms }
    l_gi_light_3: { color: ADD8E6, fade: 200ms }
    l_gi_light_4: { color: white, fade: 200ms }
    l_gi_light_5: { color: ADD8E6, fade: 200ms }
    l_gi_light_6: { color: white, fade: 200ms }
    l_gi_light_7: { color: ADD8E6, fade: 200ms }
    l_gi_light_8: { color: white, fade: 200ms }
    l_gi_light_9: { color: ADD8E6, fade: 200ms }
    l_gi_light_10: { color: white, fade: 200ms }
    l_gi_light_11: { color: ADD8E6, fade: 200ms }
    l_gi_light_12: { color: white, fade: 200ms }
    l_gi_light_13: { color: ADD8E6, fade: 200ms }
    l_gi_light_14: { color: white, fade: 200ms }
    l_gi_light_15: { color: ADD8E6, fade: 200ms }
    l_gi_light_16: { color: white, fade: 200ms }
    l_gi_light_17: { color: ADD8E6, fade: 200ms }
    l_gi_light_18: { color: white, fade: 200ms }
    l_gi_light_19: { color: ADD8E6, fade: 200ms }
    l_gi_light_20: { color: white, fade: 200ms }
    l_gi_light_21: { color: ADD8E6, fade: 200ms }
    l_gi_light_22: { color: white, fade: 200ms }
    l_gi_light_23: { color: ADD8E6, fade: 200ms }
    l_gi_light_24: { color: white, fade: 200ms }
    l_gi_light_25: { color: ADD8E6, fade: 200ms }
    l_gi_light_26: { color: white, fade: 200ms }
    l_gi_light_27: { color: ADD8E6, fade: 200ms }
    l_apron_light_1: { color: ADD8E6, fade: 200ms }
    l_apron_light_2: { color: white, fade: 200ms }
    l_apron_light_3: { color: ADD8E6, fade: 200ms }
    l_apron_light_4: { color: white, fade: 200ms }
    l_gi_light_pop_left: { color: ADD8E6, fade: 200ms }
    l_gi_light_pop_right: { color: ADD8E6, fade: 200ms }
    l_gi_light_pop_bottom: { color: ADD8E6, fade: 200ms }

  # Step 4 moving target - all candidate lights off
  dogfight_step4_alloff:
    l_shot_spinner: { color: off }
    l_shot_tower_ramp: { color: off }
    l_shot_upper_orbit: { color: off }
    l_shot_middle_ramp: { color: off }
    l_shot_right_orbit: { color: off }
    l_shot_left_ramp: { color: off }
    l_shot_left_orbit: { color: off }

  # Step 4 position solids (yellow)
  dogfight_step4_lit_0:
    l_shot_spinner: { color: FFFF00, fade: 0ms }
  dogfight_step4_lit_1:
    l_shot_tower_ramp: { color: FFFF00, fade: 0ms }
  dogfight_step4_lit_2:
    l_shot_upper_orbit: { color: FFFF00, fade: 0ms }
  dogfight_step4_lit_3:
    l_shot_middle_ramp: { color: FFFF00, fade: 0ms }
  dogfight_step4_lit_4:
    l_shot_right_orbit: { color: FFFF00, fade: 0ms }
  dogfight_step4_lit_5:
    l_shot_middle_ramp: { color: FFFF00, fade: 0ms }
  dogfight_step4_lit_6:
    l_shot_upper_orbit: { color: FFFF00, fade: 0ms }
  dogfight_step4_lit_7:
    l_shot_tower_ramp: { color: FFFF00, fade: 0ms }
  dogfight_step4_lit_8:
    l_shot_spinner: { color: FFFF00, fade: 0ms }
  dogfight_step4_lit_9:
    l_shot_left_ramp: { color: FFFF00, fade: 0ms }
  dogfight_step4_lit_10:
    l_shot_left_orbit: { color: FFFF00, fade: 0ms }
  dogfight_step4_lit_11:
    l_shot_left_ramp: { color: FFFF00, fade: 0ms }

  # Step 4 done - clear moving light
  dogfight_step_4_complete:
    l_shot_spinner: { color: off }
    l_shot_tower_ramp: { color: off }
    l_shot_upper_orbit: { color: off }
    l_shot_middle_ramp: { color: off }
    l_shot_right_orbit: { color: off }
    l_shot_left_ramp: { color: off }
    l_shot_left_orbit: { color: off }

  # STEP 3 bad shot solid red (step-2 hit)
  dogfight_setup_step_3{current_player.dogfight_s2_hit==1}:
    l_shot_left_orbit: { color: FF0000, fade: 0ms }
  dogfight_setup_step_3{current_player.dogfight_s2_hit==2}:
    l_shot_left_ramp: { color: FF0000, fade: 0ms }
  dogfight_setup_step_3{current_player.dogfight_s2_hit==3}:
    l_shot_tower_ramp: { color: FF0000, fade: 0ms }
  dogfight_setup_step_3{current_player.dogfight_s2_hit==4}:
    l_shot_right_orbit: { color: FF0000, fade: 0ms }

  # STEP 6 bad shot solid red (step-5 hit)
  dogfight_setup_step_6{current_player.dogfight_s5_hit==1}:
    l_shot_left_orbit: { color: FF0000, fade: 0ms }
  dogfight_setup_step_6{current_player.dogfight_s5_hit==2}:
    l_shot_spinner: { color: FF0000, fade: 0ms }
  dogfight_setup_step_6{current_player.dogfight_s5_hit==3}:
    l_shot_right_orbit: { color: FF0000, fade: 0ms }

  # STEP 7 - clear step-6 shot lights (incl. bad red)
  dogfight_setup_step_7:
    l_shot_left_orbit: { color: off }
    l_shot_spinner: { color: off }
    l_shot_right_orbit: { color: off }

  # STEP 9-11 converted-bad solid reds
  dogfight_s9_light_lo_bad:
    l_shot_left_orbit: { color: FF0000, fade: 0ms }
  dogfight_s9_light_lr_bad:
    l_shot_left_ramp: { color: FF0000, fade: 0ms }
  dogfight_s9_light_ro_bad:
    l_shot_right_orbit: { color: FF0000, fade: 0ms }
  dogfight_s9_light_twr_bad:
    l_shot_tower_ramp: { color: FF0000, fade: 0ms }

  # STEP 12 - clear ALL shot inserts (any lingering bad reds from any prior step)
  # LL / SP / TL are re-lit by show_player (flash + pulse).
  dogfight_setup_step_12:
    l_shot_left_orbit: { color: off }
    l_shot_left_ramp: { color: off }
    l_shot_right_orbit: { color: off }
    l_shot_tower_ramp: { color: off }
    l_shot_upper_orbit: { color: off }
    l_shot_middle_ramp: { color: off }
    l_shot_spinner: { color: off }
    l_shot_barrier: { color: off }
    l_shot_pilot_gear: { color: off }
    l_shot_left_lane: { color: off }

  # CLEANUP - all shot lights off
  dogfight_cleanup:
    l_shot_left_lane: { color: off }
    l_shot_left_orbit: { color: off }
    l_shot_left_ramp: { color: off }
    l_shot_spinner: { color: off }
    l_shot_barrier: { color: off }
    l_shot_tower_ramp: { color: off }
    l_shot_upper_orbit: { color: off }
    l_shot_middle_ramp: { color: off }
    l_shot_right_orbit: { color: off }
    l_shot_pilot_gear: { color: off }

