#config_version=6
##############################################################################
## FINAL BATTLE - PHASE 4: DOGFIGHT + LANDING   (runs inside final_battle)
##
## INTRO: final_battle_phase4_intro (skippable) with the
##   final_battle_phase4_instructions slide; the multiball starts after it.
## 2-ball multiball (both locked jets), 30s ball save, GI light orange,
## bandit shots flash red. No time limit: every ball draining -> lose a jet,
## 2 balls back in play (30s save), progress kept. Scoop made -> flippers off
## until the landing ball is released (landing is single ball).
##
## STAGE 1 - two slow bandits, move every 7.5s (2s grace: the spot it just left
##   still counts). 3 hits total. Each hit moves that bandit on immediately.
##     Bandit A: LO, LR, I, SP, C, E, SP, LR, LO, LL
##     Bandit B: RR, TR, N, TL, A, TWR, M, BAR, M, TWR, A, TL, N, TR
## STAGE 2 - one fast bandit (+1 ball, 30s save), moves every 3.75s (2s grace),
##   starting at the Spinner. Each hit jumps it 3 spots. 5 hits.
##   Path (83 spots, then repeats): SP BAR TWR BAR SP LR SP BAR TWR TL TWR BAR SP LR LO LR SP BAR TWR TL TR TL TWR BAR SP LR LO LR SP BAR TWR TL TR RR TR TL TWR BAR SP LR LO LR SP BAR TWR TL TR RR TR TL TWR BAR SP LR LO LR SP BAR TWR TL TR RR TR TL TWR BAR SP LR LO LR SP BAR TWR TL TR RR TR TL TWR BAR SP LR LO
## STAGE 3 - barrier drops, shoot the scoop. Ball held, flippers off, other
##   balls drain -> phase won (won video).
## LANDING - ball released from the scoop, 120s (+30s Afterburner) to land;
##   time runs out -> lose a jet, fresh 120s (after a drain, the fresh 120s
##   starts when the new ball is plunged). White shots in order:
##   Left Ramp, Right Ramp, Left Ramp, Tower, Left Orbit. The Left Orbit ball
##   is caught by the right lane post (s_lane_right) -> VICTORY
##   (final_battle_victory; the game ends when it finishes).
## SCORING: 1,500,000 slow hit, 2,000,000 fast hit, 3,500,000 scoop (18,000,000)
##   Landing: 1,000,000 per shot, 4,000,000 final (8,000,000)
## MISSILES PERK: one slow bandit hit is credited at the start.
##############################################################################

mode:
  start_events: fb_p4_begin
  stop_events: fb_stop_phases, ball_will_end
  priority: 610
  game_mode: true

timers:
  # Fallback if the intro video never reports done
  fb_p4_intro_fallback:
    start_value: 0
    end_value: 60
    tick_interval: 1s
    control_events:
      - event: mode_final_battle_p4_started
        action: restart
      - event: fb_p4_go
        action: stop
  # LANDING: 120s (+30s Afterburner). Runs out -> lose a jet, fresh 120s.
  # After a drain, the fresh 120s starts when the new ball is plunged.
  fb_p4_land_timer:
    start_value: 120 + 30 * current_player.fb_perk_afterburner
    end_value: 0
    direction: down
    tick_interval: 1s
    control_events:
      - event: fb_p4_land_timer_restart
        action: restart
      - event: fb_jet_lost_normal
        action: pause
      - event: fb_p4_land_final
        action: stop
      - event: mode_timers_idle_pause
        action: pause
      - event: mode_timers_resume{current_player.fb_p4_stage==4 and current_player.fb_p4_land_wait==0 and current_player.fb_losing==0}
        action: start
  # Fallback if the new ball's plunge is never confirmed
  fb_p4_land_wait_fallback:
    start_value: 0
    end_value: 8
    tick_interval: 1s
    control_events:
      - event: fb_p4_land_wait_on
        action: restart
      - event: fb_p4_land_timer_restart
        action: stop
  fb_p4_slow_move:
    start_value: 0
    end_value: 1
    tick_interval: 7500ms    # 25% faster (was 10s)
    restart_on_complete: true
    control_events:
      - event: fb_p4_slow_go
        action: restart
      - event: fb_p4_stage2
        action: stop
  fb_p4_fast_move:
    start_value: 0
    end_value: 1
    tick_interval: 3750ms    # 25% faster (was 5s)
    restart_on_complete: true
    control_events:
      - event: fb_p4_stage2
        action: restart
      - event: fb_p4_stage3
        action: stop
  fb_p4_grace:
    start_value: 0
    end_value: 2
    tick_interval: 1s
    control_events:
      - event: fb_p4_grace_start
        action: restart
      - event: fb_p4_grace_stop
        action: stop
  fb_p4_catch_window:
    start_value: 0
    end_value: 4
    tick_interval: 1s
    control_events:
      - event: fb_p4_catch_arm
        action: restart

variable_player:
  mode_final_battle_p4_started:
    fb_p4_stage: { action: set, int: 0 }
    fb_p4_a: { action: set, int: 0 }
    fb_p4_a_prev: { action: set, int: -1 }
    fb_p4_b: { action: set, int: 0 }
    fb_p4_b_prev: { action: set, int: -1 }
    fb_p4_f: { action: set, int: 0 }
    fb_p4_f_prev: { action: set, int: -1 }
    fb_p4_slow_hits: { action: set, int: 0 }
    fb_p4_fast_hits: { action: set, int: 0 }
    fb_p4_land: { action: set, int: 0 }
    fb_p4_catch: { action: set, int: 0 }
    fb_hud_count: { action: set, int: 0 }
    fb_hud_count_label: { action: set, string: "BANDIT HITS" }
    fb_objective: { action: set, string: "BANDITS INBOUND" }
  fb_p4_go:
    fb_p4_stage: { action: set, int: 1 }
    fb_objective: { action: set, string: "SHOOT THE RED BANDITS - 3 HITS" }
  # Bandit moves (prev = where it was, for the 2s grace)
  fb_p4_a_step:
    fb_p4_a_prev: { action: set, int: current_player.fb_p4_a }
    fb_p4_a: { action: add, int: 1 }
  fb_p4_a_wrap:
    fb_p4_a_prev: { action: set, int: current_player.fb_p4_a }
    fb_p4_a: { action: set, int: 0 }
  fb_p4_b_step:
    fb_p4_b_prev: { action: set, int: current_player.fb_p4_b }
    fb_p4_b: { action: add, int: 1 }
  fb_p4_b_wrap:
    fb_p4_b_prev: { action: set, int: current_player.fb_p4_b }
    fb_p4_b: { action: set, int: 0 }
  fb_p4_f_step:
    fb_p4_f_prev: { action: set, int: current_player.fb_p4_f }
    fb_p4_f: { action: add, int: 1 }
  fb_p4_f_wrap:
    fb_p4_f_prev: { action: set, int: current_player.fb_p4_f }
    fb_p4_f: { action: set, int: 0 }
  fb_p4_f_jump:
    fb_p4_f_prev: { action: set, int: -1 }
    fb_p4_f: { action: add, int: 3 }
  fb_p4_f_jump_wrap:
    fb_p4_f_prev: { action: set, int: -1 }
    fb_p4_f: { action: set, int: current_player.fb_p4_f + 3 - 83 }
  fb_p4_a_noprev:
    fb_p4_a_prev: { action: set, int: -1 }
  fb_p4_b_noprev:
    fb_p4_b_prev: { action: set, int: -1 }
  fb_p4_slow_scored:
    fb_p4_slow_hits: { action: add, int: 1 }
    fb_hud_count: { action: add, int: 1 }
  fb_p4_fast_scored:
    fb_p4_fast_hits: { action: add, int: 1 }
    fb_hud_count: { action: add, int: 1 }
  fb_p4_stage2:
    fb_p4_stage: { action: set, int: 2 }
    fb_objective: { action: set, string: "SHOOT THE FAST BANDIT - 5 HITS" }
  fb_p4_stage3:
    fb_p4_stage: { action: set, int: 3 }
    fb_objective: { action: set, string: "BANDITS DOWN - SHOOT THE SCOOP" }
  fb_p4_scoop_made:
    fb_p4_stage: { action: set, int: 8 }
  fb_p4_drained:
    fb_p4_stage: { action: set, int: 9 }
  timer_fb_p4_land_timer_tick:
    fb_timer: { action: set, int: ticks }
  fb_p4_land_wait_on:
    fb_p4_land_wait: { action: set, int: 1 }
  fb_p4_land_timer_restart:
    fb_p4_land_wait: { action: set, int: 0 }
  fb_landing_begin:
    fb_p4_land_wait: { action: set, int: 0 }
    fb_p4_stage: { action: set, int: 4 }
    fb_p4_land: { action: set, int: 0 }
    fb_grace_secs: { action: set, int: 10 }
    fb_hud_count: { action: set, int: 0 }
    fb_hud_count_label: { action: set, string: "LANDING" }
  fb_p4_land_hit:
    fb_p4_land: { action: add, int: 1 }
    fb_hud_count: { action: add, int: 1 }
  fb_p4_catch_arm:
    fb_p4_catch: { action: set, int: 1 }
  timer_fb_p4_catch_window_complete:
    fb_p4_catch: { action: set, int: 0 }
  fb_p4_land_final:
    fb_p4_stage: { action: set, int: 10 }
  fb_p4_land_show_0:
    fb_objective: { action: set, string: "LANDING 1 OF 5 - SHOOT THE LEFT RAMP" }
  fb_p4_land_show_1:
    fb_objective: { action: set, string: "LANDING 2 OF 5 - SHOOT THE RIGHT RAMP" }
  fb_p4_land_show_2:
    fb_objective: { action: set, string: "LANDING 3 OF 5 - SHOOT THE LEFT RAMP" }
  fb_p4_land_show_3:
    fb_objective: { action: set, string: "LANDING 4 OF 5 - SHOOT THE TOWER" }
  fb_p4_land_show_4:
    fb_objective: { action: set, string: "LANDING 5 OF 5 - LEFT ORBIT - BRING HER HOME" }

event_player:
  ##############################################
  ## BEGIN: both locked jets released (2-ball multiball)
  ##############################################
  # Intro first (both jets are still in the lock, nothing on the playfield)
  mode_final_battle_p4_started:
    - fb_vu_final_battle_phase4_intro
  fb_video_done{video=="final_battle_phase4_intro" and current_player.fb_p4_stage==0}:
    - fb_p4_go
  timer_fb_p4_intro_fallback_complete{current_player.fb_p4_stage==0}:
    - fb_p4_go
  fb_p4_go:
    - barrier_raise   # Barrier Target is a bandit spot
    - lock_mech_release
    - fb_p4_multiball_start
    - fb_p4_slow_go
    - fb_p4_refresh_a
    - fb_p4_refresh_b
  fb_p4_go{current_player.fb_perk_missiles==1}:
    - fb_p4_slow_scored|2s


  ##############################################
  ## STAGE 1: slow bandits
  ##############################################
  timer_fb_p4_slow_move_complete{current_player.fb_p4_stage==1}:
    - fb_p4_move_a
    - fb_p4_move_b
    - fb_p4_grace_start
  fb_p4_move_a{current_player.fb_p4_a>=9}:
    - fb_p4_a_wrap
  fb_p4_move_a{current_player.fb_p4_a<9}:
    - fb_p4_a_step
  fb_p4_move_b{current_player.fb_p4_b>=13}:
    - fb_p4_b_wrap
  fb_p4_move_b{current_player.fb_p4_b<13}:
    - fb_p4_b_step
  fb_p4_a_step:
    - fb_p4_refresh_a
  fb_p4_a_wrap:
    - fb_p4_refresh_a
  fb_p4_b_step:
    - fb_p4_refresh_b
  fb_p4_b_wrap:
    - fb_p4_refresh_b
  s_c_iceman_target_active{current_player.fb_p4_stage==1 and ((current_player.fb_p4_a==4) or (device.timers.fb_p4_grace.running and (current_player.fb_p4_a_prev==4)))}:
    - fb_p4_a_hit
  s_e_iceman_target_active{current_player.fb_p4_stage==1 and ((current_player.fb_p4_a==5) or (device.timers.fb_p4_grace.running and (current_player.fb_p4_a_prev==5)))}:
    - fb_p4_a_hit
  s_i_iceman_target_active{current_player.fb_p4_stage==1 and ((current_player.fb_p4_a==2) or (device.timers.fb_p4_grace.running and (current_player.fb_p4_a_prev==2)))}:
    - fb_p4_a_hit
  s_lane_left_active{current_player.fb_p4_stage==1 and ((current_player.fb_p4_a==9) or (device.timers.fb_p4_grace.running and (current_player.fb_p4_a_prev==9)))}:
    - fb_p4_a_hit
    - fb_p4_ll_catch
  # Left Lane bandit hit: the left lane post catches the ball for 1.5s, then
  # lets it go - a clean feed back to the flippers. The post events are owned
  # by final_battle.yaml (coil + ball search block), so the release still
  # happens if this mode stops in the meantime.
  fb_p4_ll_catch:
    - fb_left_post_hold
    - fb_left_post_release|1500ms
  left_orbit_shot_hit{current_player.fb_p4_stage==1 and ((current_player.fb_p4_a==0 or current_player.fb_p4_a==8) or (device.timers.fb_p4_grace.running and (current_player.fb_p4_a_prev==0 or current_player.fb_p4_a_prev==8)))}:
    - fb_p4_a_hit
  s_ramp_left_exit_active{current_player.fb_p4_stage==1 and ((current_player.fb_p4_a==1 or current_player.fb_p4_a==7) or (device.timers.fb_p4_grace.running and (current_player.fb_p4_a_prev==1 or current_player.fb_p4_a_prev==7)))}:
    - fb_p4_a_hit
  spinner_shot_made{current_player.fb_p4_stage==1 and ((current_player.fb_p4_a==3 or current_player.fb_p4_a==6) or (device.timers.fb_p4_grace.running and (current_player.fb_p4_a_prev==3 or current_player.fb_p4_a_prev==6)))}:
    - fb_p4_a_hit
  s_a_iceman_target_active{current_player.fb_p4_stage==1 and ((current_player.fb_p4_b==4 or current_player.fb_p4_b==10) or (device.timers.fb_p4_grace.running and (current_player.fb_p4_b_prev==4 or current_player.fb_p4_b_prev==10)))}:
    - fb_p4_b_hit
  s_barrier_target_active{current_player.fb_p4_stage==1 and ((current_player.fb_p4_b==7) or (device.timers.fb_p4_grace.running and (current_player.fb_p4_b_prev==7)))}:
    - fb_p4_b_hit
  s_m_iceman_target_active{current_player.fb_p4_stage==1 and ((current_player.fb_p4_b==6 or current_player.fb_p4_b==8) or (device.timers.fb_p4_grace.running and (current_player.fb_p4_b_prev==6 or current_player.fb_p4_b_prev==8)))}:
    - fb_p4_b_hit
  s_n_iceman_target_active{current_player.fb_p4_stage==1 and ((current_player.fb_p4_b==2 or current_player.fb_p4_b==12) or (device.timers.fb_p4_grace.running and (current_player.fb_p4_b_prev==2 or current_player.fb_p4_b_prev==12)))}:
    - fb_p4_b_hit
  s_ramp_right_exit_active{current_player.fb_p4_stage==1 and ((current_player.fb_p4_b==0) or (device.timers.fb_p4_grace.running and (current_player.fb_p4_b_prev==0)))}:
    - fb_p4_b_hit
  s_orbit_upper_active{current_player.fb_p4_stage==1 and ((current_player.fb_p4_b==3 or current_player.fb_p4_b==11) or (device.timers.fb_p4_grace.running and (current_player.fb_p4_b_prev==3 or current_player.fb_p4_b_prev==11)))}:
    - fb_p4_b_hit
  s_ramp_inner_exit_active{current_player.fb_p4_stage==1 and ((current_player.fb_p4_b==1 or current_player.fb_p4_b==13) or (device.timers.fb_p4_grace.running and (current_player.fb_p4_b_prev==1 or current_player.fb_p4_b_prev==13)))}:
    - fb_p4_b_hit
  s_ramp_tower_exit_active{current_player.fb_p4_stage==1 and ((current_player.fb_p4_b==5 or current_player.fb_p4_b==9) or (device.timers.fb_p4_grace.running and (current_player.fb_p4_b_prev==5 or current_player.fb_p4_b_prev==9)))}:
    - fb_p4_b_hit
  # Hit bandit moves on right away; its old spot must not count again
  fb_p4_a_hit:
    - fb_p4_slow_scored
    - fb_p4_move_a
    - fb_p4_a_noprev|100ms
  fb_p4_b_hit:
    - fb_p4_slow_scored
    - fb_p4_move_b
    - fb_p4_b_noprev|100ms
  fb_p4_slow_scored:
    fb_step_made: {}
    fb_p4_bandit_sound: {}
    fb_p4_slow_check: {}
    fb_points_add:
      phase: 4
      points:
        value: current_player.fb_shot_value
        type: int
  fb_p4_slow_check{current_player.fb_p4_slow_hits>=3 and current_player.fb_p4_stage==1}:
    - fb_p4_stage2

  ##############################################
  ## STAGE 2: fast bandit
  ##############################################
  fb_p4_stage2:
    - barrier_raise
    - fb_p4_bandits_off
    - fb_p4_add_ball
    - fb_p4_refresh_f
  timer_fb_p4_fast_move_complete{current_player.fb_p4_stage==2}:
    - fb_p4_move_f
    - fb_p4_grace_start
  fb_p4_move_f{current_player.fb_p4_f>=82}:
    - fb_p4_f_wrap
  fb_p4_move_f{current_player.fb_p4_f<82}:
    - fb_p4_f_step
  fb_p4_f_step:
    - fb_p4_refresh_f
  fb_p4_f_wrap:
    - fb_p4_refresh_f
  fb_p4_f_jump:
    - fb_p4_refresh_f
  fb_p4_f_jump_wrap:
    - fb_p4_refresh_f
  s_barrier_target_active{current_player.fb_p4_stage==2 and ((current_player.fb_p4_f==1 or current_player.fb_p4_f==3 or current_player.fb_p4_f==7 or current_player.fb_p4_f==11 or current_player.fb_p4_f==17 or current_player.fb_p4_f==23 or current_player.fb_p4_f==29 or current_player.fb_p4_f==37 or current_player.fb_p4_f==43 or current_player.fb_p4_f==51 or current_player.fb_p4_f==57 or current_player.fb_p4_f==65 or current_player.fb_p4_f==71 or current_player.fb_p4_f==79) or (device.timers.fb_p4_grace.running and (current_player.fb_p4_f_prev==1 or current_player.fb_p4_f_prev==3 or current_player.fb_p4_f_prev==7 or current_player.fb_p4_f_prev==11 or current_player.fb_p4_f_prev==17 or current_player.fb_p4_f_prev==23 or current_player.fb_p4_f_prev==29 or current_player.fb_p4_f_prev==37 or current_player.fb_p4_f_prev==43 or current_player.fb_p4_f_prev==51 or current_player.fb_p4_f_prev==57 or current_player.fb_p4_f_prev==65 or current_player.fb_p4_f_prev==71 or current_player.fb_p4_f_prev==79)))}:
    - fb_p4_fast_scored
  left_orbit_shot_hit{current_player.fb_p4_stage==2 and ((current_player.fb_p4_f==14 or current_player.fb_p4_f==26 or current_player.fb_p4_f==40 or current_player.fb_p4_f==54 or current_player.fb_p4_f==68 or current_player.fb_p4_f==82) or (device.timers.fb_p4_grace.running and (current_player.fb_p4_f_prev==14 or current_player.fb_p4_f_prev==26 or current_player.fb_p4_f_prev==40 or current_player.fb_p4_f_prev==54 or current_player.fb_p4_f_prev==68 or current_player.fb_p4_f_prev==82)))}:
    - fb_p4_fast_scored
  s_ramp_left_exit_active{current_player.fb_p4_stage==2 and ((current_player.fb_p4_f==5 or current_player.fb_p4_f==13 or current_player.fb_p4_f==15 or current_player.fb_p4_f==25 or current_player.fb_p4_f==27 or current_player.fb_p4_f==39 or current_player.fb_p4_f==41 or current_player.fb_p4_f==53 or current_player.fb_p4_f==55 or current_player.fb_p4_f==67 or current_player.fb_p4_f==69 or current_player.fb_p4_f==81) or (device.timers.fb_p4_grace.running and (current_player.fb_p4_f_prev==5 or current_player.fb_p4_f_prev==13 or current_player.fb_p4_f_prev==15 or current_player.fb_p4_f_prev==25 or current_player.fb_p4_f_prev==27 or current_player.fb_p4_f_prev==39 or current_player.fb_p4_f_prev==41 or current_player.fb_p4_f_prev==53 or current_player.fb_p4_f_prev==55 or current_player.fb_p4_f_prev==67 or current_player.fb_p4_f_prev==69 or current_player.fb_p4_f_prev==81)))}:
    - fb_p4_fast_scored
  s_ramp_right_exit_active{current_player.fb_p4_stage==2 and ((current_player.fb_p4_f==33 or current_player.fb_p4_f==47 or current_player.fb_p4_f==61 or current_player.fb_p4_f==75) or (device.timers.fb_p4_grace.running and (current_player.fb_p4_f_prev==33 or current_player.fb_p4_f_prev==47 or current_player.fb_p4_f_prev==61 or current_player.fb_p4_f_prev==75)))}:
    - fb_p4_fast_scored
  spinner_shot_made{current_player.fb_p4_stage==2 and ((current_player.fb_p4_f==0 or current_player.fb_p4_f==4 or current_player.fb_p4_f==6 or current_player.fb_p4_f==12 or current_player.fb_p4_f==16 or current_player.fb_p4_f==24 or current_player.fb_p4_f==28 or current_player.fb_p4_f==38 or current_player.fb_p4_f==42 or current_player.fb_p4_f==52 or current_player.fb_p4_f==56 or current_player.fb_p4_f==66 or current_player.fb_p4_f==70 or current_player.fb_p4_f==80) or (device.timers.fb_p4_grace.running and (current_player.fb_p4_f_prev==0 or current_player.fb_p4_f_prev==4 or current_player.fb_p4_f_prev==6 or current_player.fb_p4_f_prev==12 or current_player.fb_p4_f_prev==16 or current_player.fb_p4_f_prev==24 or current_player.fb_p4_f_prev==28 or current_player.fb_p4_f_prev==38 or current_player.fb_p4_f_prev==42 or current_player.fb_p4_f_prev==52 or current_player.fb_p4_f_prev==56 or current_player.fb_p4_f_prev==66 or current_player.fb_p4_f_prev==70 or current_player.fb_p4_f_prev==80)))}:
    - fb_p4_fast_scored
