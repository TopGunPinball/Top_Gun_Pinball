#config_version=6

##
## ICEMAN Letters Mode - Pure YAML
## Lights letters via standup targets to qualify pilot training missions
## Cycles qualified missions with pop bumpers
## Persists progress across balls
##

mode:
  start_events: mode_base_started
  stop_events: mode_base_stopped
  priority: 200
  game_mode: true

##############################################
## Player Variables - Track Progress
##############################################

variable_player:
  # Clear training-mission perks on tilt. Perks persist the whole game;
  # a tilt is the only thing that removes them. Must live in a game mode
  # (variable_player is invalid in the non-game tilt mode).
  tilt:
    missiles_perk_active: { action: set, int: 0 }
    inverted_perk_active: { action: set, int: 0 }
    afterburner_perk_active: { action: set, int: 0 }
    wingman_perk_active: { action: set, int: 0 }
  player_added:
    # Dogfight availability flags (kept as simple ints to avoid nested boolean
    # conditions, which MPF's parser evaluates incorrectly).
    #  dogfight_ready       = 1 once 1 training + 1 pilot played and dogfight not played
    #  dogfight_others_done = 1 once all 4 NON-dogfight training missions are complete
    dogfight_ready:
      action: set
      int: 0
    dogfight_others_done:
      action: set
      int: 0
    # Individual ICEMAN letter states (0=off, 1=lit)
    iceman_letter_i:
      action: set
      int: 0
    iceman_letter_c:
      action: set
      int: 0
    iceman_letter_e:
      action: set
      int: 0
    iceman_letter_m:
      action: set
      int: 0
    iceman_letter_a:
      action: set
      int: 0
    iceman_letter_n:
      action: set
      int: 0
    # Flag to block target hits during completion
    iceman_completing:
      action: set
      int: 0
    # Track which training missions are complete (0 or 1)
    training_inverted_complete:
      action: set
      int: 0
    training_missles_complete:
      action: set
      int: 0
    training_afterburner_complete:
      action: set
      int: 0
    training_wingman_complete:
      action: set
      int: 0
    training_dogfight_complete:
      action: set
      int: 0
    # MIG post lockout tracking
    right_post_locked_out:
      action: set
      int: 0

  ##############################################
  ## Light Letters When Standup Targets Hit
  ##############################################

  # I target
  s_i_iceman_target_active{current_player.iceman_letter_i==0 and current_player.iceman_completing==0 and current_player.letter_collection_paused==0}:
    iceman_letter_i:
      action: set
      int: 1

  # C target
  s_c_iceman_target_active{current_player.iceman_letter_c==0 and current_player.iceman_completing==0 and current_player.letter_collection_paused==0}:
    iceman_letter_c:
      action: set
      int: 1

  # E target
  s_e_iceman_target_active{current_player.iceman_letter_e==0 and current_player.iceman_completing==0 and current_player.letter_collection_paused==0}:
    iceman_letter_e:
      action: set
      int: 1

  # M target
  s_m_iceman_target_active{current_player.iceman_letter_m==0 and current_player.iceman_completing==0 and current_player.letter_collection_paused==0}:
    iceman_letter_m:
      action: set
      int: 1

  # A target
  s_a_iceman_target_active{current_player.iceman_letter_a==0 and current_player.iceman_completing==0 and current_player.letter_collection_paused==0}:
    iceman_letter_a:
      action: set
      int: 1

  # N target
  s_n_iceman_target_active{current_player.iceman_letter_n==0 and current_player.iceman_completing==0 and current_player.letter_collection_paused==0}:
    iceman_letter_n:
      action: set
      int: 1

  ##############################################
  ## Qualify Training Missions on ICEMAN Complete
  ## Random selection: training_pick_start (random_event_player at bottom of
  ## file) picks one of training_start_inverted/missiles/afterburner/wingman.
  ## Each handler below sets training_mission_qualified directly to that slot.
  ## If the chosen mode is already played, the existing
  ## player_training_mission_qualified auto-skip chain (further down in
  ## event_player) advances to the next uncompleted mission automatically.
  ## Dogfight (slot 5) is excluded from the random pool because it is gated
  ## until missions 1-4 are all complete (auto-skip will land on it then).
  ##############################################

  # Random pick → Inverted (slot 1)
  training_start_inverted:
    training_mission_qualified:
      action: set
      int: 1

  # Random pick → Missiles (slot 2)
  training_start_missiles:
    training_mission_qualified:
      action: set
      int: 2

  # Random pick → Afterburner (slot 3)
  training_start_afterburner:
    training_mission_qualified:
      action: set
      int: 3

  # Random pick → Wingman (slot 4)
  training_start_wingman:
    training_mission_qualified:
      action: set
      int: 4

  ##############################################
  ## Handle ICEMAN Completion
  ##############################################

  iceman_complete:
    iceman_completing:
      action: set
      int: 1
    iceman_total_completions:
      action: add
      int: 1
    score:
      action: add
      int: 73000 * current_player.total_scoring_multiplier
      block: true

  ##############################################
  ## Reset Letters After Completion
  ##############################################

  iceman_reset_letters:
    iceman_letter_i:
      action: set
      int: 0
    iceman_letter_c:
      action: set
      int: 0
    iceman_letter_e:
      action: set
      int: 0
    iceman_letter_m:
      action: set
      int: 0
    iceman_letter_a:
      action: set
      int: 0
    iceman_letter_n:
      action: set
      int: 0
    iceman_completing:
      action: set
      int: 0

  ##############################################
  ## Clear Qualified Mission When Started
  ##############################################

  mode_pilot_training_mission_inverted_started:
    training_mission_qualified:
      action: set
      int: 0

  mode_pilot_training_mission_missiles_started:
    training_mission_qualified:
      action: set
      int: 0

  mode_pilot_training_mission_afterburner_started:
    training_mission_qualified:
      action: set
      int: 0

  mode_pilot_training_mission_wingman_started:
    training_mission_qualified:
      action: set
      int: 0

  mode_pilot_training_mission_dogfight_started:
    training_mission_qualified:
      action: set
      int: 0

  ##############################################
  ## Rotate Qualified Mission on Pop Bumper Hits
  ##############################################

  # Rotate mission via bumpers using a SINGLE modulo handler per bumper:
  #   1->2->3->4->5->1  (one operation, so nothing re-fires on the same hit).
  # The auto-skip chain skips completed slots; the wrap guard sends 5->1 when
  # dogfight isn't available. When dogfight IS available it rests at 5 and flashes,
  # same as any other slot rests until the next bumper hit rotates it onward.
  #
  # NOTE on the dogfight_settle_lockout clause: landing on 5 can happen from two
  # (or three) pop bumpers firing within a couple ms of each other during multiball,
  # which was rotating 5 straight back to 1 before the player ever had a real chance
  # to see/shoot it. dogfight_settle_lockout is a short (100ms) timer that starts the
  # instant the value becomes 5 with dogfight ready (see event_player + timers below)
  # and only suppresses rotation while it's running. After it expires, slot 5 rotates
  # away on the next bumper hit exactly like every other slot — it does NOT stay
  # parked forever, it's just protected from being erased in the same instant it's set.
  s_bumper_left_active{current_player.training_mission_qualified>0 and current_player.training_mission_active==0 and current_player.pilot_mode_active==0 and current_player.hard_deck_active==0 and current_player.multiball_active==0 and (current_player.training_mission_qualified!=5 or current_player.dogfight_ready==0 or device.timers.dogfight_settle_lockout.running==False)}:
    training_mission_qualified:
      action: set
      int: (current_player.training_mission_qualified % 5) + 1

  s_bumper_center_active{current_player.training_mission_qualified>0 and current_player.training_mission_active==0 and current_player.pilot_mode_active==0 and current_player.hard_deck_active==0 and current_player.multiball_active==0 and (current_player.training_mission_qualified!=5 or current_player.dogfight_ready==0 or device.timers.dogfight_settle_lockout.running==False)}:
    training_mission_qualified:
      action: set
      int: (current_player.training_mission_qualified % 5) + 1

  s_bumper_right_active{current_player.training_mission_qualified>0 and current_player.training_mission_active==0 and current_player.pilot_mode_active==0 and current_player.hard_deck_active==0 and current_player.multiball_active==0 and (current_player.training_mission_qualified!=5 or current_player.dogfight_ready==0 or device.timers.dogfight_settle_lockout.running==False)}:
    training_mission_qualified:
      action: set
      int: (current_player.training_mission_qualified % 5) + 1

  # Wrap mission value back to 1 if missions 1-4 aren't complete
  wrap_mission_to_one:
    training_mission_qualified:
      action: set
      int: 1

  ##############################################
  ## MIG Post Lockout Logic
  ##############################################

  # Set lockout flag when ball comes from right side
  s_orbit_right_active:
    right_post_locked_out:
      action: set
      int: 1

  s_ramp_inner_exit_active:
    right_post_locked_out:
      action: set
      int: 1

  s_orbit_upper_active:
    right_post_locked_out:
      action: set
      int: 1

  s_spinner_active:
    right_post_locked_out:
      action: set
      int: 1

  # Clear lockout when timer expires
  timer_right_orbit_lockout_timer_complete:
    right_post_locked_out:
      action: set
      int: 0

  ##############################################
  ## INVERTED PERK: Set inverted_perk_active on mode win
  ## training_inverted_mode_over fires 500ms after mode stops
  ## Only sets perk if training mission was won
  ##############################################
  training_inverted_mode_over{current_player.training_mission_inverted_perk_active==1}:
    inverted_perk_active:
      action: set
      int: 1

  ##############################################
  ## ALL TRAINING MISSIONS COMPLETE FLAG
  ## Set to 1 when all 5 training missions are complete.
  ## Cleared automatically on new game (new player objects default all vars to 0).
  ##############################################
  all_training_missions_complete_set:
    all_training_missions_complete:
      action: set
      int: 1

  ##############################################
  ## DOGFIGHT AVAILABILITY FLAGS (all pure-AND conditions)
  ## dogfight_ready = 1 once ONE training + ONE pilot mission have been played
  ## (and dogfight itself isn't played). Set from whichever counter completes the
  ## pair; cleared once dogfight is played.
  ##############################################
  player_training_missions_played{value>=1 and current_player.pilot_missions_played>=1 and current_player.training_dogfight_complete==0}:
    dogfight_ready:
      action: set
      int: 1
  player_pilot_missions_played{value>=1 and current_player.training_missions_played>=1 and current_player.training_dogfight_complete==0}:
    dogfight_ready:
      action: set
      int: 1
  player_training_dogfight_complete{value==1}:
    dogfight_ready:
      action: set
      int: 0

  ##############################################
  ## RE-EVALUATE ROTATION WHEN DOGFIGHT BECOMES READY
  ## dogfight_ready flipping to 1 doesn't itself change
  ## training_mission_qualified, so the skip-completed cascade above (which
  ## only fires on a genuine VALUE change) never runs — if the pointer was
  ## resting dormant at 5 (per the "stay at 5, dormant" comment below) from
  ## before dogfight was ready, nothing re-triggers the light-update chain
  ## until the next bumper hit. This re-posts the SAME value, which MPF
  ## still fires as a derived event even with no actual change, correctly
  ## re-running the cascade/light logic immediately instead of waiting.
  ##############################################
  player_dogfight_ready{value==1}:
    training_mission_qualified:
      action: set
      int: current_player.training_mission_qualified

  ## dogfight_others_done = 1 once all 4 NON-dogfight training missions are complete
  ## (fires from whichever of the four completes last).
  player_training_inverted_complete{value==1 and current_player.training_missles_complete==1 and current_player.training_afterburner_complete==1 and current_player.training_wingman_complete==1}:
    dogfight_others_done:
      action: set
      int: 1
  player_training_missles_complete{value==1 and current_player.training_inverted_complete==1 and current_player.training_afterburner_complete==1 and current_player.training_wingman_complete==1}:
    dogfight_others_done:
      action: set
      int: 1
  player_training_afterburner_complete{value==1 and current_player.training_inverted_complete==1 and current_player.training_missles_complete==1 and current_player.training_wingman_complete==1}:
    dogfight_others_done:
      action: set
      int: 1
  player_training_wingman_complete{value==1 and current_player.training_inverted_complete==1 and current_player.training_missles_complete==1 and current_player.training_afterburner_complete==1}:
    dogfight_others_done:
      action: set
      int: 1

  ##############################################
  ## INVERTED PERK: Double ICEMAN Letters
  ## Awards the next uncollected letter in I→C→E→M→A→N chain
  ## Each target that sets a letter also triggers the bonus chain
  ##############################################
  inverted_award_iceman_i:
    iceman_letter_i:
      action: set
      int: 1
  inverted_award_iceman_c:
    iceman_letter_c:
      action: set
      int: 1
  inverted_award_iceman_e:
    iceman_letter_e:
      action: set
      int: 1
  inverted_award_iceman_m:
    iceman_letter_m:
      action: set
      int: 1
  inverted_award_iceman_a:
    iceman_letter_a:
      action: set
      int: 1
  inverted_award_iceman_n:
    iceman_letter_n:
      action: set
      int: 1

##############################################
## Timers
##############################################

timers:
  iceman_reset:
    start_value: 0
    end_value: 1
    tick_interval: 500ms
    direction: up
    control_events:
      - event: iceman_complete
        action: restart
  
  # Left MIG post - holds for 2 seconds after spinner hit
  # control_events: restart action on restart_left_mig_post_timer event
  # end_value: 2 ticks × tick_interval: 1s = 2 seconds total hold
  left_mig_post_timer:
    start_value: 0
    end_value: 2
    direction: up
    tick_interval: 1s
    start_running: false
    control_events:
      - event: restart_left_mig_post_timer
        action: restart
  
  # Lockout timer - prevents right post activation if ball came from right side
  right_orbit_lockout_timer:
    start_value: 0
    end_value: 3
    direction: up
    tick_interval: 1s
    start_running: false
    control_events:
      - event: restart_right_orbit_lockout_timer
        action: restart

  # Brief debounce window on landing on slot 5 (dogfight) while ready. Prevents
  # near-simultaneous pop bumper hits (common during multiball) from rotating the
  # value straight back to 1 in the same instant it was set. Does NOT keep dogfight
  # parked permanently - once this expires, normal bumper rotation resumes.
  dogfight_settle_lockout:
    start_value: 0
    end_value: 1
    direction: up
    tick_interval: 100ms
    start_running: false
    control_events:
      - event: dogfight_slot_settled
        action: restart

##############################################
## Event Player - Check for Completion & Handle Logic
##############################################

event_player:
  ##############################################
  ## Training Mode Insert Light + Perk Slide (Delayed to Survive Clear)
  ##############################################

  # Fire delayed event to set insert light and show perk slide after mode stops
  # MUST be delayed 500ms to survive the 'clear' event that fires right after mode_stopped
  mode_pilot_training_mission_inverted_stopped:
    - training_inverted_mode_over|500ms

  mode_pilot_training_mission_missiles_stopped:
    - training_missiles_mode_over|500ms

  mode_pilot_training_mission_afterburner_stopped:
    - training_afterburner_mode_over|500ms

  mode_pilot_training_mission_wingman_stopped:
    - training_wingman_mode_over|500ms

  mode_pilot_training_mission_dogfight_stopped:
    - training_dogfight_mode_over|500ms

  ##############################################
  ## INVERTED PERK: Double ICEMAN Letters
  ## When inverted_perk_active==1, each ICEMAN target hit also awards
  ## the next uncollected letter in I→C→E→M→A→N order
  ## Skipped on Tier 0 (training_missions_played==0) — Tier 0 is easy enough.
  ##############################################
  
  # Each target hit triggers the bonus chain (same conditions as normal collection)
  s_i_iceman_target_active{current_player.iceman_letter_i==0 and current_player.iceman_completing==0 and current_player.letter_collection_paused==0 and current_player.inverted_perk_active==1 and current_player.training_missions_played>=1}:
    - inverted_bonus_iceman_letter
  s_c_iceman_target_active{current_player.iceman_letter_c==0 and current_player.iceman_completing==0 and current_player.letter_collection_paused==0 and current_player.inverted_perk_active==1 and current_player.training_missions_played>=1}:
    - inverted_bonus_iceman_letter
  s_e_iceman_target_active{current_player.iceman_letter_e==0 and current_player.iceman_completing==0 and current_player.letter_collection_paused==0 and current_player.inverted_perk_active==1 and current_player.training_missions_played>=1}:
    - inverted_bonus_iceman_letter
  s_m_iceman_target_active{current_player.iceman_letter_m==0 and current_player.iceman_completing==0 and current_player.letter_collection_paused==0 and current_player.inverted_perk_active==1 and current_player.training_missions_played>=1}:
    - inverted_bonus_iceman_letter
  s_a_iceman_target_active{current_player.iceman_letter_a==0 and current_player.iceman_completing==0 and current_player.letter_collection_paused==0 and current_player.inverted_perk_active==1 and current_player.training_missions_played>=1}:
    - inverted_bonus_iceman_letter
  s_n_iceman_target_active{current_player.iceman_letter_n==0 and current_player.iceman_completing==0 and current_player.letter_collection_paused==0 and current_player.inverted_perk_active==1 and current_player.training_missions_played>=1}:
    - inverted_bonus_iceman_letter

  # Chain logic: award first uncollected letter in I→C→E→M→A→N order
  inverted_bonus_iceman_letter{current_player.iceman_letter_i==0}:
    - inverted_award_iceman_i
  inverted_bonus_iceman_letter{current_player.iceman_letter_i==1 and current_player.iceman_letter_c==0}:
    - inverted_award_iceman_c
  inverted_bonus_iceman_letter{current_player.iceman_letter_i==1 and current_player.iceman_letter_c==1 and current_player.iceman_letter_e==0}:
    - inverted_award_iceman_e
  inverted_bonus_iceman_letter{current_player.iceman_letter_i==1 and current_player.iceman_letter_c==1 and current_player.iceman_letter_e==1 and current_player.iceman_letter_m==0}:
    - inverted_award_iceman_m
  inverted_bonus_iceman_letter{current_player.iceman_letter_i==1 and current_player.iceman_letter_c==1 and current_player.iceman_letter_e==1 and current_player.iceman_letter_m==1 and current_player.iceman_letter_a==0}:
    - inverted_award_iceman_a
  inverted_bonus_iceman_letter{current_player.iceman_letter_i==1 and current_player.iceman_letter_c==1 and current_player.iceman_letter_e==1 and current_player.iceman_letter_m==1 and current_player.iceman_letter_a==1 and current_player.iceman_letter_n==0}:
    - inverted_award_iceman_n

  # After each bonus award, check if ICEMAN is now complete
  inverted_award_iceman_i: check_ice_man_complete
  inverted_award_iceman_c: check_ice_man_complete
  inverted_award_iceman_e: check_ice_man_complete
  inverted_award_iceman_m: check_ice_man_complete
  inverted_award_iceman_a: check_ice_man_complete
  inverted_award_iceman_n: check_ice_man_complete

  ##############################################
  ## TIER 0: training_missions_played==0
  ## EASIEST tier — group awards.
  ## Hit any of I, C, or E -> light all three (I+C+E group).
  ## Hit any of M, A, or N -> light all three (M+A+N group).
  ## If the group is already fully lit, nothing extra is awarded
  ## (the vanilla unlit-letter handler still sets the hit letter,
  ## but here all three are already lit so it's a no-op).
  ## Inverted perk does NOT apply on Tier 0.
  ##############################################

  # Triggers: any I/C/E target hit (lit or unlit) -> award ICE group
  # Guard: at least one letter in the group must still be unlit (otherwise silent)
  s_i_iceman_target_active{current_player.iceman_completing==0 and current_player.letter_collection_paused==0 and current_player.training_missions_played==0 and (current_player.iceman_letter_i==0 or current_player.iceman_letter_c==0 or current_player.iceman_letter_e==0)}:
    - tier0_award_ice_group
  s_c_iceman_target_active{current_player.iceman_completing==0 and current_player.letter_collection_paused==0 and current_player.training_missions_played==0 and (current_player.iceman_letter_i==0 or current_player.iceman_letter_c==0 or current_player.iceman_letter_e==0)}:
    - tier0_award_ice_group
  s_e_iceman_target_active{current_player.iceman_completing==0 and current_player.letter_collection_paused==0 and current_player.training_missions_played==0 and (current_player.iceman_letter_i==0 or current_player.iceman_letter_c==0 or current_player.iceman_letter_e==0)}:
    - tier0_award_ice_group

  # Triggers: any M/A/N target hit (lit or unlit) -> award MAN group
  s_m_iceman_target_active{current_player.iceman_completing==0 and current_player.letter_collection_paused==0 and current_player.training_missions_played==0 and (current_player.iceman_letter_m==0 or current_player.iceman_letter_a==0 or current_player.iceman_letter_n==0)}:
    - tier0_award_man_group
  s_a_iceman_target_active{current_player.iceman_completing==0 and current_player.letter_collection_paused==0 and current_player.training_missions_played==0 and (current_player.iceman_letter_m==0 or current_player.iceman_letter_a==0 or current_player.iceman_letter_n==0)}:
    - tier0_award_man_group
  s_n_iceman_target_active{current_player.iceman_completing==0 and current_player.letter_collection_paused==0 and current_player.training_missions_played==0 and (current_player.iceman_letter_m==0 or current_player.iceman_letter_a==0 or current_player.iceman_letter_n==0)}:
    - tier0_award_man_group

  # Group award dispatchers — fire the existing atomic awards.
  # inverted_award_iceman_X already handles light updates and triggers
  # check_ice_man_complete via the existing event_player handlers (lines ~431-436).
  # Note: the vanilla unlit-letter handler (lines 71-104) will also fire on the
  # SAME target hit, which means the hit letter gets set twice (harmless — same value).
  tier0_award_ice_group:
    - inverted_award_iceman_i
    - inverted_award_iceman_c
    - inverted_award_iceman_e

  tier0_award_man_group:
    - inverted_award_iceman_m
    - inverted_award_iceman_a
    - inverted_award_iceman_n

  ##############################################
  ## TIER 1: training_missions_played==1
  ## Any target hit scores its letter normally (existing logic).
  ## If the hit target is ALREADY LIT, award the next unlit letter
  ## in I->C->E->M->A->N order instead.
  ##############################################

  # Triggers: hit a lit letter with 1 mission played
  s_i_iceman_target_active{current_player.iceman_letter_i==1 and current_player.iceman_completing==0 and current_player.letter_collection_paused==0 and current_player.training_missions_played==1}:
    - tier1_bonus_iceman_letter
  s_c_iceman_target_active{current_player.iceman_letter_c==1 and current_player.iceman_completing==0 and current_player.letter_collection_paused==0 and current_player.training_missions_played==1}:
    - tier1_bonus_iceman_letter
  s_e_iceman_target_active{current_player.iceman_letter_e==1 and current_player.iceman_completing==0 and current_player.letter_collection_paused==0 and current_player.training_missions_played==1}:
    - tier1_bonus_iceman_letter
  s_m_iceman_target_active{current_player.iceman_letter_m==1 and current_player.iceman_completing==0 and current_player.letter_collection_paused==0 and current_player.training_missions_played==1}:
    - tier1_bonus_iceman_letter
  s_a_iceman_target_active{current_player.iceman_letter_a==1 and current_player.iceman_completing==0 and current_player.letter_collection_paused==0 and current_player.training_missions_played==1}:
    - tier1_bonus_iceman_letter
  s_n_iceman_target_active{current_player.iceman_letter_n==1 and current_player.iceman_completing==0 and current_player.letter_collection_paused==0 and current_player.training_missions_played==1}:
    - tier1_bonus_iceman_letter

  # Dispatch: award first unlit letter in I->C->E->M->A->N order
  tier1_bonus_iceman_letter{current_player.iceman_letter_i==0}:
    - inverted_award_iceman_i
  tier1_bonus_iceman_letter{current_player.iceman_letter_i==1 and current_player.iceman_letter_c==0}:
    - inverted_award_iceman_c
  tier1_bonus_iceman_letter{current_player.iceman_letter_i==1 and current_player.iceman_letter_c==1 and current_player.iceman_letter_e==0}:
    - inverted_award_iceman_e
  tier1_bonus_iceman_letter{current_player.iceman_letter_i==1 and current_player.iceman_letter_c==1 and current_player.iceman_letter_e==1 and current_player.iceman_letter_m==0}:
    - inverted_award_iceman_m
  tier1_bonus_iceman_letter{current_player.iceman_letter_i==1 and current_player.iceman_letter_c==1 and current_player.iceman_letter_e==1 and current_player.iceman_letter_m==1 and current_player.iceman_letter_a==0}:
    - inverted_award_iceman_a
  tier1_bonus_iceman_letter{current_player.iceman_letter_i==1 and current_player.iceman_letter_c==1 and current_player.iceman_letter_e==1 and current_player.iceman_letter_m==1 and current_player.iceman_letter_a==1 and current_player.iceman_letter_n==0}:
    - inverted_award_iceman_n

  # Perk bonus: inverted perk active -> award one additional letter after the tier1 award
  tier1_bonus_iceman_letter{current_player.inverted_perk_active==1}:
    - inverted_bonus_iceman_letter

  ##############################################
  ## TIER 2: training_missions_played==2
  ## Hit unlit letter -> that letter (existing logic).
  ## Hit LIT letter -> award the neighbor with priority:
  ##   I -> C
  ##   C -> I, else E
  ##   E -> C, else M
  ##   M -> E, else A
  ##   A -> M, else N
  ##   N -> A
  ## If neighbors already lit, nothing awarded (silent).
  ##############################################

  # Triggers: hit a lit letter with 2 missions played
  s_i_iceman_target_active{current_player.iceman_letter_i==1 and current_player.iceman_completing==0 and current_player.letter_collection_paused==0 and current_player.training_missions_played==2}:
    - tier2_bonus_iceman_i
  s_c_iceman_target_active{current_player.iceman_letter_c==1 and current_player.iceman_completing==0 and current_player.letter_collection_paused==0 and current_player.training_missions_played==2}:
    - tier2_bonus_iceman_c
  s_e_iceman_target_active{current_player.iceman_letter_e==1 and current_player.iceman_completing==0 and current_player.letter_collection_paused==0 and current_player.training_missions_played==2}:
    - tier2_bonus_iceman_e
  s_m_iceman_target_active{current_player.iceman_letter_m==1 and current_player.iceman_completing==0 and current_player.letter_collection_paused==0 and current_player.training_missions_played==2}:
    - tier2_bonus_iceman_m
  s_a_iceman_target_active{current_player.iceman_letter_a==1 and current_player.iceman_completing==0 and current_player.letter_collection_paused==0 and current_player.training_missions_played==2}:
    - tier2_bonus_iceman_a
  s_n_iceman_target_active{current_player.iceman_letter_n==1 and current_player.iceman_completing==0 and current_player.letter_collection_paused==0 and current_player.training_missions_played==2}:
    - tier2_bonus_iceman_n

  # I lit: give C if unlit
  tier2_bonus_iceman_i{current_player.iceman_letter_c==0}:
    - inverted_award_iceman_c

  # C lit: give I first, else E
  tier2_bonus_iceman_c{current_player.iceman_letter_i==0}:
    - inverted_award_iceman_i
  tier2_bonus_iceman_c{current_player.iceman_letter_i==1 and current_player.iceman_letter_e==0}:
    - inverted_award_iceman_e

  # E lit: give C first, else M
  tier2_bonus_iceman_e{current_player.iceman_letter_c==0}:
    - inverted_award_iceman_c
  tier2_bonus_iceman_e{current_player.iceman_letter_c==1 and current_player.iceman_letter_m==0}:
    - inverted_award_iceman_m

  # M lit: give E first, else A
  tier2_bonus_iceman_m{current_player.iceman_letter_e==0}:
    - inverted_award_iceman_e
  tier2_bonus_iceman_m{current_player.iceman_letter_e==1 and current_player.iceman_letter_a==0}:
    - inverted_award_iceman_a

  # A lit: give M first, else N
  tier2_bonus_iceman_a{current_player.iceman_letter_m==0}:
    - inverted_award_iceman_m
  tier2_bonus_iceman_a{current_player.iceman_letter_m==1 and current_player.iceman_letter_n==0}:
    - inverted_award_iceman_n

  # N lit: give A if unlit
  tier2_bonus_iceman_n{current_player.iceman_letter_a==0}:
    - inverted_award_iceman_a

  # Perk bonus: inverted perk active -> award one additional letter after each tier2 neighbor award
  tier2_bonus_iceman_i{current_player.inverted_perk_active==1}:
    - inverted_bonus_iceman_letter
  tier2_bonus_iceman_c{current_player.inverted_perk_active==1}:
    - inverted_bonus_iceman_letter
  tier2_bonus_iceman_e{current_player.inverted_perk_active==1}:
    - inverted_bonus_iceman_letter
  tier2_bonus_iceman_m{current_player.inverted_perk_active==1}:
    - inverted_bonus_iceman_letter
  tier2_bonus_iceman_a{current_player.inverted_perk_active==1}:
    - inverted_bonus_iceman_letter
  tier2_bonus_iceman_n{current_player.inverted_perk_active==1}:
    - inverted_bonus_iceman_letter

  ##############################################
  ## Start Training Missions via Left Lane
  ##############################################
  
  # Start Inverted training mission when left lane hit with mission 1 qualified
  # Only start if not already completed and no pilot mode active
  # Guard: extra_ball_lit==0 prevents firing while extra ball collect sequence runs
  s_lane_left_active{current_player.training_mission_qualified==1 and current_player.training_inverted_complete==0 and current_player.pilot_mode_active==0 and current_player.hard_deck_qualified_mode==0 and current_player.extra_ball_lit==0}:
    - start_mode_pilot_training_mission_inverted
  
  # Start Missiles training mission when left lane hit with mission 2 qualified
  # Only start if not already completed and no pilot mode active
  s_lane_left_active{current_player.training_mission_qualified==2 and current_player.training_missles_complete==0 and current_player.pilot_mode_active==0 and current_player.hard_deck_qualified_mode==0 and current_player.extra_ball_lit==0}:
    - start_mode_pilot_training_mission_missiles
  
  # Start Afterburner training mission when left lane hit with mission 3 qualified
  # Only start if not already completed and no pilot mode active
  s_lane_left_active{current_player.training_mission_qualified==3 and current_player.training_afterburner_complete==0 and current_player.pilot_mode_active==0 and current_player.hard_deck_qualified_mode==0 and current_player.extra_ball_lit==0}:
    - start_mode_pilot_training_mission_afterburner
  
  # Start Wingman training mission when left lane hit with mission 4 qualified
  s_lane_left_active{current_player.training_mission_qualified==4 and current_player.training_wingman_complete==0 and current_player.pilot_mode_active==0 and current_player.hard_deck_qualified_mode==0 and current_player.extra_ball_lit==0}:
    - start_mode_training_wingman
  
  # Start Dogfight training mission when left lane hit with mission 5 qualified.
  # Only startable once dogfight is AVAILABLE (1 training + 1 pilot played, not yet played).
  s_lane_left_active{current_player.training_mission_qualified==5 and current_player.dogfight_ready==1 and current_player.pilot_mode_active==0 and current_player.hard_deck_qualified_mode==0 and current_player.extra_ball_lit==0}:
    - start_mode_pilot_training_mission_dogfight

  ##############################################
  ## ALL TRAINING MISSIONS COMPLETE TRACKING
  ## Sets all_training_missions_complete=1 when all 5 training missions are done.
  ## Used by mystery award to exclude "Light Training Mission" from award pool.
  ## Checks whenever any training_xxx_complete flag changes to 1.
  ##############################################

  player_training_inverted_complete{value==1}: check_all_training_complete
  player_training_missles_complete{value==1}: check_all_training_complete
  player_training_afterburner_complete{value==1}: check_all_training_complete
  player_training_wingman_complete{value==1}: check_all_training_complete
  player_training_dogfight_complete{value==1}: check_all_training_complete

  check_all_training_complete{current_player.training_inverted_complete==1 and current_player.training_missles_complete==1 and current_player.training_afterburner_complete==1 and current_player.training_wingman_complete==1 and current_player.training_dogfight_complete==1}:
    - all_training_missions_complete_set

  # Timer completion triggers the reset
  timer_iceman_reset_complete:
    iceman_reset_letters

  # Check if ICE or MAN is complete after any letter lights
  s_i_iceman_target_active{current_player.iceman_letter_i==0 and current_player.iceman_completing==0}: check_ice_man_complete
  s_c_iceman_target_active{current_player.iceman_letter_c==0 and current_player.iceman_completing==0}: check_ice_man_complete
  s_e_iceman_target_active{current_player.iceman_letter_e==0 and current_player.iceman_completing==0}: check_ice_man_complete
  s_m_iceman_target_active{current_player.iceman_letter_m==0 and current_player.iceman_completing==0}: check_ice_man_complete
  s_a_iceman_target_active{current_player.iceman_letter_a==0 and current_player.iceman_completing==0}: check_ice_man_complete
  s_n_iceman_target_active{current_player.iceman_letter_n==0 and current_player.iceman_completing==0}: check_ice_man_complete

  # Post ICE complete if I-C-E are lit
  check_ice_man_complete{current_player.iceman_letter_i==1 and current_player.iceman_letter_c==1 and current_player.iceman_letter_e==1}:
    ice_complete:
      priority: 100

  # Post MAN complete if M-A-N are lit
  check_ice_man_complete{current_player.iceman_letter_m==1 and current_player.iceman_letter_a==1 and current_player.iceman_letter_n==1}:
    man_complete:
      priority: 100

  # Post ICEMAN complete if all 6 letters are lit
  check_ice_man_complete{current_player.iceman_letter_i==1 and current_player.iceman_letter_c==1 and current_player.iceman_letter_e==1 and current_player.iceman_letter_m==1 and current_player.iceman_letter_a==1 and current_player.iceman_letter_n==1}:
    iceman_complete:
      priority: 110

  # Qualify training mission ONLY if not already qualified (prevents double qualification)
  # training_pick_start fires via random_event_player (see bottom of file),
  # which chooses one of the 4 randomizable training missions.
  # Each training_start_XXX handler sets training_mission_qualified to that
  # slot (via variable_player above) and posts qualify_training_mission for
  # the voice callout.
  # If the randomly-chosen mode is already played, the auto-skip chain
  # (player_training_mission_qualified handlers below) advances to the next
  # uncompleted mission automatically.
  iceman_complete{current_player.training_mission_qualified==0}:
    training_pick_start

  # Random pick handlers — fire qualify_training_mission for the voice callout
  # (variable_player above sets training_mission_qualified to the right slot)
  training_start_inverted:
    qualify_training_mission
  training_start_missiles:
    qualify_training_mission
  training_start_afterburner:
    qualify_training_mission
  training_start_wingman:
    qualify_training_mission

  # Restore qualified mission state on ball start
  mode_iceman_letters_started:
    - restore_training_mission_light

  # Dogfight (slot 5) is now available once ONE training + ONE pilot mission have
  # been played (and dogfight itself isn't played yet). When value reaches 5:
  #  - if dogfight is available -> it STAYS at 5 (it's a rotation option / the last one)
  #  - if NOT available AND a training mission is still open -> wrap to 1 to find it
  #  - if NOT available AND all training complete -> STAY at 5 (dormant, non-startable)
  #    until a pilot mission is played. The "training still open" clause is what
  #    prevents an infinite qualify-loop through completed slots.
  player_training_mission_qualified{value==5 and current_player.dogfight_ready==0 and current_player.dogfight_others_done==0}:
    wrap_mission_to_one

  # Start the brief settle-debounce window (see dogfight_settle_lockout timer)
  # every time the value lands on 5 while dogfight is ready. This is what stops
  # near-simultaneous pop bumper hits from erasing it instantly, without making
  # it permanently sticky - the timer expires quickly and normal rotation resumes.
  player_training_mission_qualified{value==5 and current_player.dogfight_ready==1}:
    - dogfight_slot_settled

  # Auto-skip completed missions during pop bumper rotation
  # Sets directly to the next UNCOMPLETED mission value so the variable
  # always stays in sync with what's actually lit on the playfield.
  # Conditions are ordered most-specific first so MPF matches correctly.

  # Skip value==1 (inverted complete) — find next uncompleted
  player_training_mission_qualified{value==1 and current_player.training_inverted_complete==1 and current_player.training_missles_complete==0}:
    training_mission_qualified:
      action: set
      int: 2
  player_training_mission_qualified{value==1 and current_player.training_inverted_complete==1 and current_player.training_missles_complete==1 and current_player.training_afterburner_complete==0}:
    training_mission_qualified:
      action: set
      int: 3
  player_training_mission_qualified{value==1 and current_player.training_inverted_complete==1 and current_player.training_missles_complete==1 and current_player.training_afterburner_complete==1 and current_player.training_wingman_complete==0}:
    training_mission_qualified:
      action: set
      int: 4
  player_training_mission_qualified{value==1 and current_player.training_inverted_complete==1 and current_player.training_missles_complete==1 and current_player.training_afterburner_complete==1 and current_player.training_wingman_complete==1}:
    training_mission_qualified:
      action: set
      int: 5

  # Skip value==2 (missiles complete) — find next uncompleted
  player_training_mission_qualified{value==2 and current_player.training_missles_complete==1 and current_player.training_afterburner_complete==0}:
    training_mission_qualified:
      action: set
      int: 3
  player_training_mission_qualified{value==2 and current_player.training_missles_complete==1 and current_player.training_afterburner_complete==1 and current_player.training_wingman_complete==0}:
    training_mission_qualified:
      action: set
      int: 4
  player_training_mission_qualified{value==2 and current_player.training_missles_complete==1 and current_player.training_afterburner_complete==1 and current_player.training_wingman_complete==1}:
    training_mission_qualified:
      action: set
      int: 5

  # Skip value==3 (afterburner complete) — find next uncompleted
  player_training_mission_qualified{value==3 and current_player.training_afterburner_complete==1 and current_player.training_wingman_complete==0}:
    training_mission_qualified:
      action: set
      int: 4
  player_training_mission_qualified{value==3 and current_player.training_afterburner_complete==1 and current_player.training_wingman_complete==1}:
    training_mission_qualified:
      action: set
      int: 5

  # Skip value==4 (wingman complete) — jump to dogfight
  player_training_mission_qualified{value==4 and current_player.training_wingman_complete==1}:
    training_mission_qualified:
      action: set
      int: 5

  # Stop all pulse shows when any training mission starts
  mode_pilot_training_mission_inverted_started:
    stop_all_training_pulse_shows
  mode_pilot_training_mission_missiles_started:
    stop_all_training_pulse_shows
  mode_pilot_training_mission_afterburner_started:
    stop_all_training_pulse_shows
  mode_pilot_training_mission_wingman_started:
    stop_all_training_pulse_shows
  mode_pilot_training_mission_dogfight_started:
    stop_all_training_pulse_shows

  # Stop pulse shows when any pilot mission starts
  mode_edge_of_space_started:
    stop_all_training_pulse_shows
  mode_battle_jester_started:
    stop_all_training_pulse_shows
  mode_canyon_run_started:
    stop_all_training_pulse_shows
  mode_rise_of_phoenix_started:
    stop_all_training_pulse_shows
  mode_rescue_cougar_started:
    stop_all_training_pulse_shows
  mode_balls_of_fire_started:
    stop_all_training_pulse_shows
  mode_cool_under_pressure_started:
    stop_all_training_pulse_shows
  mode_no_points_for_second_place_started:
    stop_all_training_pulse_shows
  mode_below_the_hard_deck_started:
    stop_all_training_pulse_shows
  mode_no_margin_for_error_started:
    stop_all_training_pulse_shows

  # Stop pulse shows when any hard deck mission starts
  mode_hard_deck_playing_with_the_boys_started:
    stop_all_training_pulse_shows
  mode_hard_deck_charlie_started:
    stop_all_training_pulse_shows
  mode_hard_deck_maverick_and_penny_started:
    stop_all_training_pulse_shows
  mode_hard_deck_honoring_iceman_started:
    stop_all_training_pulse_shows

  # Stop pulse shows when multiball starts
  mode_top_gun_multiball_started:
    stop_all_training_pulse_shows

  # Restore pulse shows when pilot missions stop
  mode_edge_of_space_stopped{current_player.training_mission_qualified>0}:
    restore_training_mission_light
  mode_battle_jester_stopped{current_player.training_mission_qualified>0}:
    restore_training_mission_light
  mode_canyon_run_stopped{current_player.training_mission_qualified>0}:
    restore_training_mission_light
  mode_rise_of_phoenix_stopped{current_player.training_mission_qualified>0}:
    restore_training_mission_light
  mode_rescue_cougar_stopped{current_player.training_mission_qualified>0}:
    restore_training_mission_light
  mode_balls_of_fire_stopped{current_player.training_mission_qualified>0}:
    restore_training_mission_light
  mode_cool_under_pressure_stopped{current_player.training_mission_qualified>0}:
    restore_training_mission_light
  mode_no_points_for_second_place_stopped{current_player.training_mission_qualified>0}:
    restore_training_mission_light
  mode_below_the_hard_deck_stopped{current_player.training_mission_qualified>0}:
    restore_training_mission_light
  mode_no_margin_for_error_stopped{current_player.training_mission_qualified>0}:
    restore_training_mission_light

  # Restore pulse shows when hard deck missions stop
  mode_hard_deck_playing_with_the_boys_stopped{current_player.training_mission_qualified>0}:
    restore_training_mission_light
  mode_hard_deck_charlie_stopped{current_player.training_mission_qualified>0}:
    restore_training_mission_light
  mode_hard_deck_maverick_and_penny_stopped{current_player.training_mission_qualified>0}:
    restore_training_mission_light
  mode_hard_deck_honoring_iceman_stopped{current_player.training_mission_qualified>0}:
    restore_training_mission_light

  # Restore pulse shows when multiball stops
  mode_top_gun_multiball_stopped{current_player.training_mission_qualified>0}:
    restore_training_mission_light

  ##############################################
  ## MIG Post Timer Control Events
  ##############################################

  # Start left post timer when spinner hit — only during base mode (not during pilot modes, hard deck, or multiball)
  s_spinner_active{current_player.training_mission_qualified>0 and current_player.training_mission_active==0 and current_player.pilot_mode_active==0 and current_player.hard_deck_active==0 and current_player.multiball_active==0}:
    - restart_left_mig_post_timer

  # Relay to the global MIG post capture mechanism in base.yaml so a ball
  # caught between the posts (s_mig_capture) forces both posts up, sending
  # it into the pops to let the player change modes.
  timer_left_mig_post_timer_started:
    - mig_post_fired

  # Start lockout timer when right-side switches hit
  s_orbit_right_active:
    - restart_right_orbit_lockout_timer

  s_ramp_inner_exit_active:
    - restart_right_orbit_lockout_timer

  s_orbit_upper_active:
    - restart_right_orbit_lockout_timer

  # Timer restarts are handled directly by control_events on each timer above.
  # restart_left_mig_post_timer and restart_right_orbit_lockout_timer are
  # consumed by the timers' control_events (action: restart) and no
  # additional event posting is needed.

##############################################
## Coil Player - Control Barrier Target & MIG Posts
##############################################

coil_player:
  # Training missions do NOT use the barrier - removed barrier pulse from qualification
  # Barrier is only used for pilot mission modes (rescue_cougar, etc.)

  # Safety: release barrier when training mission starts (ensure barrier is down)
  mode_pilot_training_mission_inverted_started:
    c_mode_barrier:
      action: off
  mode_pilot_training_mission_missiles_started:
    c_mode_barrier:
      action: off
  mode_pilot_training_mission_afterburner_started:
    c_mode_barrier:
      action: off
  mode_pilot_training_mission_wingman_started:
    c_mode_barrier:
      action: off
  mode_pilot_training_mission_dogfight_started:
    c_mode_barrier:
      action: off

  ##############################################
  ## MIG Post Control
  ##############################################

  # LEFT MIG POST - Activate when spinner hit, training mission qualified, and in base mode only
  s_spinner_active{current_player.training_mission_qualified>0 and current_player.training_mission_active==0 and current_player.pilot_mode_active==0 and current_player.hard_deck_active==0 and current_player.multiball_active==0}:
    c_left_mig_up_post:
      action: pulse
      hold_power: 0.125

  # Hold left post while timer is running
  timer_left_mig_post_timer_started:
    c_left_mig_up_post:
      action: enable
      hold_power: 0.125

  # Release left post when timer completes
  timer_left_mig_post_timer_complete:
    c_left_mig_up_post:
      action: disable

##############################################
## Show Player - Pulse Qualified Missions & Pop Bumpers
##############################################

show_player:
  # Stop all shows when mode stops
  mode_iceman_letters_stopped:
    iceman_inverted_pulse:
      action: stop
    iceman_missles_pulse:
      action: stop
    iceman_afterburner_pulse:
      action: stop
    iceman_wingman_pulse:
      action: stop
    iceman_dogfight_pulse:
      action: stop
    iceman_pop_bumpers_fade:
      action: stop

  # Stop all pulse shows before starting a new one
  stop_all_training_pulse_shows:
    iceman_inverted_pulse:
      action: stop
    iceman_missles_pulse:
      action: stop
    iceman_afterburner_pulse:
      action: stop
    iceman_wingman_pulse:
      action: stop
    iceman_dogfight_pulse:
      action: stop

  # Start pulsing and pop bumper fade when mission is qualified
  # Use the player variable change event to trigger shows AFTER variable is set
  # Stop all other pulse shows first, then start the correct one
  # CRITICAL: Only start iceman_inverted_pulse if mode hasn't been played yet
  player_training_mission_qualified{value==1 and current_player.training_inverted_complete==0 and current_player.pilot_mode_active==0 and current_player.hard_deck_active==0 and current_player.multiball_active==0 and current_player.training_mission_active==0}:
    iceman_missles_pulse:
      action: stop
    iceman_afterburner_pulse:
      action: stop
    iceman_wingman_pulse:
      action: stop
    iceman_dogfight_pulse:
      action: stop
    iceman_inverted_pulse:
      loops: -1
      speed: 1
      show_tokens:
        led: l_mode_inverted
        color: cyan
      key: iceman_inverted_pulse
    iceman_pop_bumpers_fade:
      loops: -1
      speed: 1
      key: iceman_pop_bumpers_fade

  player_training_mission_qualified{value==2 and current_player.training_missles_complete==0 and current_player.pilot_mode_active==0 and current_player.hard_deck_active==0 and current_player.multiball_active==0 and current_player.training_mission_active==0}:
    iceman_inverted_pulse:
      action: stop
    iceman_afterburner_pulse:
      action: stop
    iceman_wingman_pulse:
      action: stop
    iceman_dogfight_pulse:
      action: stop
    iceman_missles_pulse:
      loops: -1
      speed: 1
      show_tokens:
        led: l_mode_missles
        color: cyan
      key: iceman_missles_pulse
    iceman_pop_bumpers_fade:
      loops: -1
      speed: 1
      key: iceman_pop_bumpers_fade

  player_training_mission_qualified{value==3 and current_player.training_afterburner_complete==0 and current_player.pilot_mode_active==0 and current_player.hard_deck_active==0 and current_player.multiball_active==0 and current_player.training_mission_active==0}:
    iceman_inverted_pulse:
      action: stop
    iceman_missles_pulse:
      action: stop
    iceman_wingman_pulse:
      action: stop
    iceman_dogfight_pulse:
      action: stop
    iceman_afterburner_pulse:
      loops: -1
      speed: 1
      show_tokens:
        led: l_mode_afterburner
        color: cyan
      key: iceman_afterburner_pulse
    iceman_pop_bumpers_fade:
      loops: -1
      speed: 1
      key: iceman_pop_bumpers_fade

  player_training_mission_qualified{value==4 and current_player.training_wingman_complete==0 and current_player.pilot_mode_active==0 and current_player.hard_deck_active==0 and current_player.multiball_active==0 and current_player.training_mission_active==0}:
    iceman_inverted_pulse:
      action: stop
    iceman_missles_pulse:
      action: stop
    iceman_afterburner_pulse:
      action: stop
    iceman_dogfight_pulse:
      action: stop
    iceman_wingman_pulse:
      loops: -1
      speed: 1
      show_tokens:
        led: l_mode_wingman
        color: cyan
      key: iceman_wingman_pulse
    iceman_pop_bumpers_fade:
      loops: -1
      speed: 1
      key: iceman_pop_bumpers_fade

  # Dogfight - only show if ALL 4 standard missions are complete
  player_training_mission_qualified{value==5 and current_player.dogfight_ready==1 and current_player.pilot_mode_active==0 and current_player.hard_deck_active==0 and current_player.multiball_active==0 and current_player.training_mission_active==0}:
    iceman_inverted_pulse:
      action: stop
    iceman_missles_pulse:
      action: stop
    iceman_afterburner_pulse:
      action: stop
    iceman_wingman_pulse:
      action: stop
    iceman_dogfight_pulse:
      loops: -1
      speed: 1
      show_tokens:
        led: l_mode_dogfight
        color: cyan
      key: iceman_dogfight_pulse
    iceman_pop_bumpers_fade:
      loops: -1
      speed: 1
      key: iceman_pop_bumpers_fade

  # Restore pulsing show on ball start if mission is qualified
  restore_training_mission_light{current_player.training_mission_qualified==1 and current_player.training_inverted_complete==0}:
    iceman_inverted_pulse:
      loops: -1
      speed: 1
      show_tokens:
        led: l_mode_inverted
        color: cyan
      key: iceman_inverted_pulse
    iceman_pop_bumpers_fade:
      loops: -1
      speed: 1
      key: iceman_pop_bumpers_fade

  restore_training_mission_light{current_player.training_mission_qualified==2 and current_player.training_missles_complete==0}:
    iceman_missles_pulse:
      loops: -1
      speed: 1
      show_tokens:
        led: l_mode_missles
        color: cyan
      key: iceman_missles_pulse
    iceman_pop_bumpers_fade:
      loops: -1
      speed: 1
      key: iceman_pop_bumpers_fade

  restore_training_mission_light{current_player.training_mission_qualified==3 and current_player.training_afterburner_complete==0}:
    iceman_afterburner_pulse:
      loops: -1
      speed: 1
      show_tokens:
        led: l_mode_afterburner
        color: cyan
      key: iceman_afterburner_pulse
    iceman_pop_bumpers_fade:
      loops: -1
      speed: 1
      key: iceman_pop_bumpers_fade

  restore_training_mission_light{current_player.training_mission_qualified==4 and current_player.training_wingman_complete==0}:
    iceman_wingman_pulse:
      loops: -1
      speed: 1
      show_tokens:
        led: l_mode_wingman
        color: cyan
      key: iceman_wingman_pulse
    iceman_pop_bumpers_fade:
      loops: -1
      speed: 1
      key: iceman_pop_bumpers_fade

  restore_training_mission_light{current_player.training_mission_qualified==5 and current_player.dogfight_ready==1}:
    iceman_dogfight_pulse:
      loops: -1
      speed: 1
      show_tokens:
        led: l_mode_dogfight
        color: cyan
      key: iceman_dogfight_pulse
    iceman_pop_bumpers_fade:
      loops: -1
      speed: 1
      key: iceman_pop_bumpers_fade

  # Stop pop bumper fade when training mission starts
  mode_pilot_training_mission_inverted_started:
    iceman_pop_bumpers_fade:
      action: stop
  mode_pilot_training_mission_missiles_started:
    iceman_pop_bumpers_fade:
      action: stop
  # Stop pulse show when missiles mode ends (before setting solid white)
  training_missiles_mode_over:
    iceman_missles_pulse:
      action: stop
      key: iceman_missles_pulse
  mode_pilot_training_mission_afterburner_started:
    iceman_pop_bumpers_fade:
      action: stop
  # Stop pulse show when afterburner mode ends (before setting solid white)
  training_afterburner_mode_over:
    iceman_afterburner_pulse:
      action: stop
      key: iceman_afterburner_pulse
  mode_pilot_training_mission_wingman_started:
    iceman_pop_bumpers_fade:
      action: stop
  # Stop pulse show when wingman mode ends (before setting solid white)
  training_wingman_mode_over:
    iceman_wingman_pulse:
      action: stop
      key: iceman_wingman_pulse
  # Stop pulse show when dogfight mode ends (before setting solid white)
  training_dogfight_mode_over:
    iceman_dogfight_pulse:
      action: stop
      key: iceman_dogfight_pulse
  mode_pilot_training_mission_dogfight_started:
    iceman_pop_bumpers_fade:
      action: stop

  # TODO: Add light show when letters are collected
