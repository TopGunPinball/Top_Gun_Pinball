sound_player:
  # Training mission qualified voice callout
  qualify_training_mission:
    voice_pilot_training_qualified:
      bus: voice
      loops: 0

##############################################
## Random Event Player
##############################################

random_event_player:
  ##############################################
  ## RANDOM STARTING TRAINING MISSION SELECTION
  ## Picks a random starting training mission when ICEMAN completes.
  ## Includes the 4 randomizable missions (Inverted, Missiles, Afterburner,
  ## Wingman). Dogfight is excluded because it is gated until the other 4
  ## are all complete — the auto-skip chain in event_player will land on it
  ## when appropriate.
  ## If the randomly-chosen mission is already played, the
  ## player_training_mission_qualified auto-skip handlers (in event_player)
  ## advance training_mission_qualified to the next uncompleted slot.
  ##
  ## scope: machine + force_all: true → shuffle-bag behavior. The randomizer
  ## state persists across games for the life of the MPF process. All 4
  ## events are picked in random order before any repeats. Picked because
  ## the default (scope: player, force_all: false) creates a fresh randomizer
  ## every game, so each game's first pick is independent and the same mode
  ## can land multiple games in a row purely by chance — with only 4 options
  ## the variance is visible (1/4 chance per game). Shuffle-bag guarantees
  ## variety across consecutive games.
  ##############################################
  training_pick_start:
    scope: machine
    force_all: true
    events:
      - training_start_inverted
      - training_start_missiles
      - training_start_afterburner
      - training_start_wingman