  # TODO: Add light show when ICEMAN is completed
  # iceman_complete:
  #   iceman_complete_show:
  #     loops: 1
  #     speed: 1

shows:
  iceman_inverted_pulse:
    - duration: 1s
      lights:
        (led):
          color: (color)
          fade: 0ms
    - duration: 1s
      lights:
        (led):
          color: off
          fade: 0ms

  iceman_missles_pulse:
    - duration: 1s
      lights:
        (led):
          color: (color)
          fade: 0ms
    - duration: 1s
      lights:
        (led):
          color: off
          fade: 0ms

  iceman_afterburner_pulse:
    - duration: 1s
      lights:
        (led):
          color: (color)
          fade: 0ms
    - duration: 1s
      lights:
        (led):
          color: off
          fade: 0ms

  iceman_wingman_pulse:
    - duration: 1s
      lights:
        (led):
          color: (color)
          fade: 0ms
    - duration: 1s
      lights:
        (led):
          color: off
          fade: 0ms

  iceman_dogfight_pulse:
    - duration: 1s
      lights:
        (led):
          color: (color)
          fade: 0ms
    - duration: 1s
      lights:
        (led):
          color: off
          fade: 0ms

  iceman_pop_bumpers_fade:
    - duration: 1s
      lights:
        l_gi_light_pop_left:
          color: cyan
          fade: 0ms
        l_gi_light_pop_right:
          color: cyan
          fade: 0ms
        l_gi_light_pop_bottom:
          color: cyan
          fade: 0ms
    - duration: 1s
