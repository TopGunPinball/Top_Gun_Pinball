      int: current_player.pilot_bob_collected + current_player.pilot_coyote_collected + current_player.pilot_fanboy_collected + current_player.pilot_goose_collected + current_player.pilot_hangman_collected + current_player.pilot_hollywood_collected + current_player.pilot_hondo_collected + current_player.pilot_iceman_collected + current_player.pilot_maverick_collected + current_player.pilot_phoenix_collected + current_player.pilot_rooster_collected + current_player.pilot_slider_collected + current_player.pilot_viper_collected + current_player.pilot_wolfman_collected
    hs_pilots_time: { action: set, int: current_player.hs_play_seconds }
  player_pilot_hondo_collected{value==1 and prev_value==0}:
    hs_pilots:
      action: set
      int: current_player.pilot_bob_collected + current_player.pilot_coyote_collected + current_player.pilot_fanboy_collected + current_player.pilot_goose_collected + current_player.pilot_hangman_collected + current_player.pilot_hollywood_collected + current_player.pilot_hondo_collected + current_player.pilot_iceman_collected + current_player.pilot_maverick_collected + current_player.pilot_phoenix_collected + current_player.pilot_rooster_collected + current_player.pilot_slider_collected + current_player.pilot_viper_collected + current_player.pilot_wolfman_collected
    hs_pilots_time: { action: set, int: current_player.hs_play_seconds }
  player_pilot_phoenix_collected{value==1 and prev_value==0}:
    hs_pilots:
      action: set
      int: current_player.pilot_bob_collected + current_player.pilot_coyote_collected + current_player.pilot_fanboy_collected + current_player.pilot_goose_collected + current_player.pilot_hangman_collected + current_player.pilot_hollywood_collected + current_player.pilot_hondo_collected + current_player.pilot_iceman_collected + current_player.pilot_maverick_collected + current_player.pilot_phoenix_collected + current_player.pilot_rooster_collected + current_player.pilot_slider_collected + current_player.pilot_viper_collected + current_player.pilot_wolfman_collected
    hs_pilots_time: { action: set, int: current_player.hs_play_seconds }
  player_pilot_rooster_collected{value==1 and prev_value==0}:
    hs_pilots:
      action: set
      int: current_player.pilot_bob_collected + current_player.pilot_coyote_collected + current_player.pilot_fanboy_collected + current_player.pilot_goose_collected + current_player.pilot_hangman_collected + current_player.pilot_hollywood_collected + current_player.pilot_hondo_collected + current_player.pilot_iceman_collected + current_player.pilot_maverick_collected + current_player.pilot_phoenix_collected + current_player.pilot_rooster_collected + current_player.pilot_slider_collected + current_player.pilot_viper_collected + current_player.pilot_wolfman_collected
    hs_pilots_time: { action: set, int: current_player.hs_play_seconds }

  # ---------------------------------------------------------------- MISSIONS WON
  # Mirror the existing counters (each mission already adds to these)
  player_pilot_missions_won:
    hs_pilot_missions: { action: set, int: value }
  player_training_missions_won:
    hs_training_missions: { action: set, int: value }

  # ---------------------------------------------------------------- MISSION POINTS
  # Pilot missions (10): snapshot score at start, add the difference at stop
  mode_rescue_cougar_started:
    hs_pilot_mission_score_start: { action: set, int: current_player.score }
  mode_rise_of_phoenix_started:
    hs_pilot_mission_score_start: { action: set, int: current_player.score }
  mode_battle_jester_started:
    hs_pilot_mission_score_start: { action: set, int: current_player.score }
  mode_canyon_run_started:
    hs_pilot_mission_score_start: { action: set, int: current_player.score }
  mode_no_margin_for_error_started:
    hs_pilot_mission_score_start: { action: set, int: current_player.score }
  mode_below_the_hard_deck_started:
    hs_pilot_mission_score_start: { action: set, int: current_player.score }
  mode_edge_of_space_started:
    hs_pilot_mission_score_start: { action: set, int: current_player.score }
  mode_great_balls_of_fire_started:
    hs_pilot_mission_score_start: { action: set, int: current_player.score }
  mode_no_points_for_second_place_started:
    hs_pilot_mission_score_start: { action: set, int: current_player.score }
  mode_cool_under_pressure_started:
    hs_pilot_mission_score_start: { action: set, int: current_player.score }

  mode_rescue_cougar_stopped:
    hs_pilot_mission_points: { action: add, int: current_player.score - current_player.hs_pilot_mission_score_start }
  mode_rise_of_phoenix_stopped:
    hs_pilot_mission_points: { action: add, int: current_player.score - current_player.hs_pilot_mission_score_start }
  mode_battle_jester_stopped:
    hs_pilot_mission_points: { action: add, int: current_player.score - current_player.hs_pilot_mission_score_start }
  mode_canyon_run_stopped:
    hs_pilot_mission_points: { action: add, int: current_player.score - current_player.hs_pilot_mission_score_start }
  mode_no_margin_for_error_stopped:
    hs_pilot_mission_points: { action: add, int: current_player.score - current_player.hs_pilot_mission_score_start }
  mode_below_the_hard_deck_stopped:
    hs_pilot_mission_points: { action: add, int: current_player.score - current_player.hs_pilot_mission_score_start }
  mode_edge_of_space_stopped:
    hs_pilot_mission_points: { action: add, int: current_player.score - current_player.hs_pilot_mission_score_start }
  mode_great_balls_of_fire_stopped:
    hs_pilot_mission_points: { action: add, int: current_player.score - current_player.hs_pilot_mission_score_start }
  mode_no_points_for_second_place_stopped:
    hs_pilot_mission_points: { action: add, int: current_player.score - current_player.hs_pilot_mission_score_start }
  mode_cool_under_pressure_stopped:
    hs_pilot_mission_points: { action: add, int: current_player.score - current_player.hs_pilot_mission_score_start }

  # Training missions (5)
  mode_pilot_training_mission_inverted_started:
    hs_training_mission_score_start: { action: set, int: current_player.score }
  mode_pilot_training_mission_missiles_started:
    hs_training_mission_score_start: { action: set, int: current_player.score }
  mode_pilot_training_mission_afterburner_started:
    hs_training_mission_score_start: { action: set, int: current_player.score }
  mode_pilot_training_mission_wingman_started:
    hs_training_mission_score_start: { action: set, int: current_player.score }
  mode_pilot_training_mission_dogfight_started:
    hs_training_mission_score_start: { action: set, int: current_player.score }

  mode_pilot_training_mission_inverted_stopped:
    hs_training_mission_points: { action: add, int: current_player.score - current_player.hs_training_mission_score_start }
  mode_pilot_training_mission_missiles_stopped:
    hs_training_mission_points: { action: add, int: current_player.score - current_player.hs_training_mission_score_start }
  mode_pilot_training_mission_afterburner_stopped:
    hs_training_mission_points: { action: add, int: current_player.score - current_player.hs_training_mission_score_start }
  mode_pilot_training_mission_wingman_stopped:
    hs_training_mission_points: { action: add, int: current_player.score - current_player.hs_training_mission_score_start }
  mode_pilot_training_mission_dogfight_stopped:
    hs_training_mission_points: { action: add, int: current_player.score - current_player.hs_training_mission_score_start }

  # ---------------------------------------------------------------- PLAYING WITH THE BOYS
  # Best single run (points scored while the mode ran)
  mode_hard_deck_playing_with_the_boys_started:
    hs_pwtb_score_start: { action: set, int: current_player.score }
  mode_hard_deck_playing_with_the_boys_stopped:
    hs_pwtb_last: { action: set, int: current_player.score - current_player.hs_pwtb_score_start }
  player_hs_pwtb_last{value > current_player.hs_pwtb}:
    hs_pwtb: { action: set, int: value }

  # ---------------------------------------------------------------- BONUS
  # Biggest single end-of-ball bonus (MPF's total, after the multiplier)
  bonus_entry{entry=="total" and score > current_player.hs_bonus}:
    hs_bonus: { action: set, int: score }

  # ---------------------------------------------------------------- PILOT JACKPOT
  # pilot_awards cashes the bank at the gear target and adds 1 to
  # pilot_jackpots_collected. That change event is processed BEFORE
  # pilot_bank_payout gets recalculated (it's queued after), so the payout
  # still holds the amount just paid.
  player_pilot_jackpots_collected{change > 0}:
    hs_pilot_jackpot_last: { action: set, int: current_player.pilot_bank_payout }
  player_hs_pilot_jackpot_last{value > current_player.hs_pilot_jackpot}:
    hs_pilot_jackpot: { action: set, int: value }

  # ---------------------------------------------------------------- FINAL BATTLE
  # Win time. hs_fb_seconds restarts with each Final Battle (one per game).
  mode_final_battle_started:
    hs_fb_seconds: { action: set, int: 0 }
  fb_victory{machine.practice_fb_game==0}:
    hs_fb_fastest: { action: set, int: current_player.hs_fb_seconds }

  # Same amount final_battle.yaml awards (mission points x jets left, x1 if
  # no jets left). Tilt awards nothing, so nothing is recorded.
  player_fb_points_awarded{value==1 and machine.practice_fb_game==0 and current_player.fb_jets>=1}:
    hs_final_battle: { action: set, int: current_player.fb_mission_points * current_player.fb_jets }
  player_fb_points_awarded{value==1 and machine.practice_fb_game==0 and current_player.fb_jets<1}:
    hs_final_battle: { action: set, int: current_player.fb_mission_points }
  player_fb_points_awarded{value==1 and machine.practice_fb_game==1 and current_player.fb_jets>=1}:
    hs_final_battle_practice: { action: set, int: current_player.fb_mission_points * current_player.fb_jets }
  player_fb_points_awarded{value==1 and machine.practice_fb_game==1 and current_player.fb_jets<1}:
    hs_final_battle_practice: { action: set, int: current_player.fb_mission_points }
