#config_version=6

##############################################################################
## HIGH SCORE TRACKING
##
## FILE NAME: modes/high_score_tracking/config/high_score_tracking.yaml
##
## Keeps the player variables the extra high score tables are built from.
## It only WATCHES other modes (mode started/stopped events, player variable
## change events) - no other mode file needs editing for these tables.
##
## Runs for every ball, including Final Battle Practice games.
##   start: ball_started     stop: ball_ended
## (ball_ended, not ball_will_end: mission drains, the bonus total and the
## Final Battle tally all happen while ball_ending is held, and must be seen.)
##
## PLAYER VARIABLES (per game, start at 0 - MPF creates them on first use)
##   Table value (= high_score category name)   Tie-breaker / extra column
##   hs_final_battle           FB points         -
##   hs_final_battle_practice  FB points         -    (practice games only)
##   hs_migs                   MIGs destroyed    hs_migs_time  (TGMB seconds,
##                                                lower wins)
##   hs_pilot_missions         missions won      hs_pilot_mission_points
##                                                (higher wins)
##   hs_training_missions      missions won      hs_training_mission_points
##                                                (higher wins)
##   hs_bonus                  best single bonus -
##   hs_pilots                 pilots collected  hs_pilots_time (ball seconds,
##                                                lower wins)
##   hs_pwtb                   best PWTB run     -
##   hs_pilot_jackpot          best pilot jackpot -  (tie: first one keeps it)
##   hs_fb_fastest             Final Battle win time in seconds (LOWER wins)
##                             phase 1 start -> landing (fb_victory), normal
##                             games only; 0 = never won (no entry)
##   hs_tgmb_jackpots          best single Top Gun Multiball: MIG jackpots +
##                             super jackpots, exactly as scored (multipliers
##                             included). Run total: hs_tgmb_jp_run
##
## CLOCKS
##   hs_play_seconds  - this player's ball time (1s ticks while their ball is
##                      in play; stops at ball_will_end, so bonus/other
##                      players' turns don't count)
##   hs_fb_seconds    - Final Battle time, from phase 1 starting (after the
##                      intro) to the landing; videos between phases count
##   hs_tgmb_seconds  - Top Gun Multiball time only (runs while the TGMB mode
##                      runs, pauses between multiballs, carries on in the
##                      next one)
##
## MISSION POINTS = everything scored while the mission was running (score
##   snapshot at mode start, difference added at mode stop). Won or lost.
##############################################################################

mode:
  start_events: ball_started
  stop_events: ball_ended
  priority: 105
  game_mode: true

##############################################################################
## TIMERS
##############################################################################
timers:
  # Player ball time (used for the Pilots Collected time)
  hs_play_clock:
    start_value: 0
    end_value: 99999
    direction: up
    tick_interval: 1s
    start_running: true
    control_events:
      - event: ball_will_end
        action: stop

  # Top Gun Multiball time (used for the MIGs Destroyed time)
  hs_tgmb_clock:
    start_value: 0
    end_value: 99999
    direction: up
    tick_interval: 1s
    start_running: false
    control_events:
      - event: mode_top_gun_multiball_started
        action: restart
      # Ball started while TGMB was already running (see event_player)
      - event: hs_tgmb_clock_resume
        action: restart
      - event: mode_top_gun_multiball_will_stop
        action: stop
      - event: ball_will_end
        action: stop

  # Final Battle time (used for Fastest Final Battle win)
  hs_fb_clock:
    start_value: 0
    end_value: 99999
    direction: up
    tick_interval: 1s
    start_running: false
    control_events:
      - event: fb_p1_begin
        action: start
      - event: fb_victory
        action: stop
      - event: fb_failed
        action: stop
      - event: ball_will_end
        action: stop

##############################################################################
## EVENT PLAYER
##############################################################################
event_player:
  # TGMB already running when this mode starts (ball started mid-multiball)
  mode_high_score_tracking_started{mode.top_gun_multiball.active==True}:
    - hs_tgmb_clock_resume

##############################################################################
## VARIABLE PLAYER
##############################################################################
variable_player:

  # ---------------------------------------------------------------- CLOCKS
  timer_hs_play_clock_tick:
    hs_play_seconds: { action: add, int: 1 }
  timer_hs_tgmb_clock_tick:
    hs_tgmb_seconds: { action: add, int: 1 }
  timer_hs_fb_clock_tick:
    hs_fb_seconds: { action: add, int: 1 }

  # ---------------------------------------------------------------- MIGS
  # Every MIG destroyed in TGMB (scored or during the 10% penalty). This is a
  # whole-game count - the progress-reset penalty does NOT take MIGs away here.
  radar_mig_destroyed{mode.top_gun_multiball.active==True}:
    hs_migs: { action: add, int: 1 }
    hs_migs_time: { action: set, int: current_player.hs_tgmb_seconds }
    # same amount top_gun_multiball.yaml scores for this MIG
    hs_tgmb_jp_run: { action: add, int: current_player.multiball_last_jackpot * current_player.total_scoring_multiplier }
  radar_mig_destroyed_no_score{mode.top_gun_multiball.active==True}:
    hs_migs: { action: add, int: 1 }
    hs_migs_time: { action: set, int: current_player.hs_tgmb_seconds }

  # ---------------------------------------------------------------- TGMB JACKPOTS
  # New multiball -> new run total
  mode_top_gun_multiball_started:
    hs_tgmb_jp_run: { action: set, int: 0 }
  # Super jackpot: top_gun_multiball.yaml scores it, sets mode_points_scored
  # to the amount and adds 1 to super_jackpots_collected in one block, then
  # empties the bank. This change event is processed after that block, so
  # mode_points_scored holds the amount just paid.
  player_super_jackpots_collected{change > 0 and mode.top_gun_multiball.active==True}:
    hs_tgmb_jp_run: { action: add, int: current_player.mode_points_scored }
  # Best single multiball
  player_hs_tgmb_jp_run{value > current_player.hs_tgmb_jackpots}:
    hs_tgmb_jackpots: { action: set, int: value }

  # ---------------------------------------------------------------- PILOTS
  # Each pilot flag only ever goes 0 -> 1 once per game. Count = sum of flags
  # (same sum the bonus uses); time = ball time when the latest one landed.
  player_pilot_goose_collected{value==1 and prev_value==0}:
    hs_pilots:
      action: set
      int: current_player.pilot_bob_collected + current_player.pilot_coyote_collected + current_player.pilot_fanboy_collected + current_player.pilot_goose_collected + current_player.pilot_hangman_collected + current_player.pilot_hollywood_collected + current_player.pilot_hondo_collected + current_player.pilot_iceman_collected + current_player.pilot_maverick_collected + current_player.pilot_phoenix_collected + current_player.pilot_rooster_collected + current_player.pilot_slider_collected + current_player.pilot_viper_collected + current_player.pilot_wolfman_collected
    hs_pilots_time: { action: set, int: current_player.hs_play_seconds }
