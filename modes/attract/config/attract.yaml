#config_version=6

##############################################################################
# ATTRACT MODE
# Added stop/start events for custom service mode
##############################################################################
mode:
  start_events:
    - mode_end_of_game_attract_stopped
    - machine_reset_phase_3
    - mode_top_gun_service_stopped
    # PRACTICE: back to attract after Video Mode Practice (no game was run)
    - mode_practice_video_stopped{mode.top_gun_service.active==False}
    # PRACTICE: back to attract after a Final Battle Practice game
    # (end_of_game_attract is skipped for practice games)
    - practice_fb_game_finished
  stop_events:
    - game_starting
    - mode_top_gun_service_started
    - mode_end_of_game_attract_started
    # PRACTICE: Video Mode Practice runs without a game
    - practice_video_start
  priority: 10

mode_settings:
  selectable_items:
    - title
    - presented_by
    - hotrod_pinball_logo
    - mpf_logo
    - high_score_top_5
    - credits
    - last_scores_1p{machine.player1_score and not machine.player2_score}
    - last_scores_2p{machine.player2_score and not machine.player3_score}
    - last_scores_3p{machine.player3_score and not machine.player4_score}
    - last_scores_4p{machine.player4_score}
  # Flippers don't move the carousel while the practice (game type) menu is open
  next_item_events:
    - s_flipper_right_active{machine.practice_menu_open==0}
    - timer_attract_carousel_timer_complete
  previous_item_events:
    - s_flipper_left_active{machine.practice_menu_open==0}

