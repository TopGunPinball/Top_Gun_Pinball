slide_player:
  mode_attract_started: attract

  # PRACTICE MENU (game_type slide) - see PRACTICE MENU in event_player
  practice_menu_opened:
    game_type:
      action: play
      priority: 1000
  practice_menu_closed:
    game_type:
      action: remove

sound_player:
  mode_attract_started:
    top_gun_pinball_attract_scene_music:
      bus: music
      loops: -1

  timer_attract_music_stop_timer_complete:
    silence:
      bus: music
      loops: 0

# Kick off the chained cycle and home all servos
# Also clear any ball stuck in mode scoop (barrier blocks eject on cold boot)
event_player:
  mode_attract_started:
    - attract_cycle_step1
    - right_ramp_down
    - top_ramp_down|500ms          # SERVO stagger (Pitfall #6)
    - lock_released|1000ms

  # If ball is stuck in mode scoop on boot, drop barrier so it can eject
  mode_attract_started{device.switches.s_mode_start.state==1}:
    - attract_scoop_clear_start

  # After delay, raise barrier back up
  timer_attract_scoop_clear_delay_complete:
    - attract_scoop_clear_done

  ##############################################################################
  ## PRACTICE MENU (game_type slide)
  ##   Hold BOTH flippers 5s           -> menu opens on "Normal Game"
  ##   Left / right flipper            -> cycle Normal / Video Mode / Final Battle
  ##   No flipper for 5s               -> menu closes, back to Normal Game
  ##   START while the menu is open:
  ##     Normal Game        -> normal game (attract starts it as usual)
  ##     Video Mode Practice-> practice_video_start: attract stops, NO game is
  ##                           started, modes/practice_video plays the carrier
  ##                           landing, then attract comes back
  ##     Final Battle       -> practice_fb_game = 1 (variable_player below),
  ##                           attract starts a normal 1-player game and
  ##                           modes/practice_final_battle starts Final Battle
  ##   machine.practice_game_type: 0 Normal, 1 Video Mode, 2 Final Battle
  ##############################################################################
  s_flipper_left_active{device.switches.s_flipper_right.state and machine.practice_menu_open==0}:
    - practice_both_flippers_held
  s_flipper_right_active{device.switches.s_flipper_left.state and machine.practice_menu_open==0}:
    - practice_both_flippers_held

  timer_practice_hold_timer_complete{machine.practice_menu_open==0}:
    - practice_menu_opened

  # Right flipper: Normal -> Video -> Final Battle -> Normal
  s_flipper_right_active{machine.practice_menu_open==1 and machine.practice_game_type==0}:
    - practice_select_1
    - practice_menu_flip
  s_flipper_right_active{machine.practice_menu_open==1 and machine.practice_game_type==1}:
    - practice_select_2
    - practice_menu_flip
  s_flipper_right_active{machine.practice_menu_open==1 and machine.practice_game_type==2}:
    - practice_select_0
    - practice_menu_flip
  # Left flipper: the other way round
  s_flipper_left_active{machine.practice_menu_open==1 and machine.practice_game_type==0}:
    - practice_select_2
    - practice_menu_flip
  s_flipper_left_active{machine.practice_menu_open==1 and machine.practice_game_type==1}:
    - practice_select_0
    - practice_menu_flip
  s_flipper_left_active{machine.practice_menu_open==1 and machine.practice_game_type==2}:
    - practice_select_1
    - practice_menu_flip

  # No flipper for 5s -> close, back to Normal Game
  timer_practice_menu_timer_complete:
    - practice_menu_closed

  # START on Video Mode Practice -> attract stops (stop_events) before the
  # start button is released, so no game is requested
  s_start_active{machine.practice_menu_open==1 and machine.practice_game_type==1}:
    - practice_video_start

##############################################
## Start Button LED - Slow flash in attract mode
##############################################
coil_player:
  # Stop flashing (turn off) when attract mode ends + safety barrier raise
  mode_attract_stopping:
    c_start_button_led:
      action: disable
    c_mode_barrier:
      action: disable

  # Clear any ball stuck in shooter lane when attract starts (boot/game over)
  mode_attract_started{device.switches.s_shooter_lane.state==1}:
    c_plunger:
      action: pulse

  # Drop barrier directly (pilot_mission_qualifier not running in attract)
  attract_scoop_clear_start:
    c_mode_barrier:
      action: enable

  # Raise barrier after delay
  attract_scoop_clear_done:
    c_mode_barrier:
      action: disable

show_player:                                            # Light Shows being played
  # Start button slow flash during attract
  mode_attract_started:
    start_button_flash:
      show: start_button_slow_flash
      loops: -1
      priority: 100

  attract_cycle_step1:
    attract_corners_sweep:
      loops: 1
      speed: 40
      priority: 200
      events_when_completed: attract_cycle_step2 

  attract_cycle_step2:
    attract_spiral_in_and_out:
      loops: 4
      speed: 40
      priority: 200
      events_when_completed: attract_cycle_step3

  attract_cycle_step3:
    attract_color_plus_spin:
      loops: 1
      speed: 40
      priority: 200
      events_when_completed: attract_cycle_step4

  attract_cycle_step4:
    attract_insert_color_bounce:
      loops: 4
      speed: 40
      priority: 200
      events_when_completed: attract_cycle_step5

  attract_cycle_step5:
    attract_chase_all_inserts:
      loops: 5
      speed: 85
      priority: 200
      events_when_completed: attract_cycle_step6

  attract_cycle_step6:
    attract_color_wheel:
      loops: 5
      speed: 40
      priority: 200
      events_when_completed: attract_cycle_step1

  # Clean stop on mode end
  mode_attract_stopping:
    attract_corners_sweep: stop
    attract_spiral_in_and_out: stop
    attract_color_plus_spin: stop
    attract_insert_color_bounce: stop
    attract_chase_all_inserts: stop
    attract_color_wheel: stop
    start_button_flash: stop

timers:
  ##############################################################################
  ## PRACTICE MENU TIMERS
  ##############################################################################
  # Both flippers held 5s -> open the menu. Either flipper let go -> cancel.
  practice_hold_timer:
    start_value: 0
    end_value: 5
    direction: up
    tick_interval: 1s
    start_running: false
    control_events:
      - event: practice_both_flippers_held
        action: restart
      - event: s_flipper_left_inactive
        action: stop
      - event: s_flipper_right_inactive
        action: stop

  # Menu closes 5s after it opened / after the last flipper press
  practice_menu_timer:
    start_value: 0
    end_value: 5
    direction: up
    tick_interval: 1s
    start_running: false
    control_events:
      - event: practice_menu_opened
        action: restart
      - event: practice_menu_flip
        action: restart
      - event: practice_menu_closed
        action: stop

  attract_carousel_timer:
    end_value: 1
    tick_interval: 7s
    start_running: true
    control_events:
      - event: carousel_item_highlighted
        action: restart
      - event: flipper_cradle
        action: stop
      - event: flipper_cradle_release
        action: restart

  # Stop music after 2 minutes — lights keep going
  attract_music_stop_timer:
    start_value: 0
    end_value: 120
    direction: up
    tick_interval: 1s
    control_events:
      - event: mode_attract_started
        action: restart
      - event: mode_attract_will_stop
        action: stop

  # Delay before raising barrier after scoop clears stuck ball
  attract_scoop_clear_delay:
    start_value: 0
    end_value: 3
    direction: up
    tick_interval: 1s
    start_running: false
    control_events:
      - event: attract_scoop_clear_start
        action: start
      - event: mode_attract_will_stop
        action: stop

##############################################
## SHOWS - Start Button Flash
##############################################
shows:
  # Slow flash for start button LED (1 second on, 1 second off)
  start_button_slow_flash:
    - duration: 1s
      coils:
        c_start_button_led: enable
    - duration: 1s
      coils:
        c_start_button_led: disable

##############################################################################
## PRACTICE MENU - selection (machine variables, defined in config.yaml)
##############################################################################
variable_player:
  practice_menu_opened:
    practice_menu_open: { action: set_machine, int: 1 }
    practice_game_type: { action: set_machine, int: 0 }
  practice_select_0:
    practice_game_type: { action: set_machine, int: 0 }
  practice_select_1:
    practice_game_type: { action: set_machine, int: 1 }
  practice_select_2:
    practice_game_type: { action: set_machine, int: 2 }

  # Timed out: menu gone, back to Normal Game (also drops a Final Battle
  # pick whose game start was refused)
  practice_menu_closed:
    practice_menu_open: { action: set_machine, int: 0 }
    practice_game_type: { action: set_machine, int: 0 }
    practice_fb_game: { action: set_machine, int: 0 }

  # START on Final Battle Practice: flag the game that is about to start.
  # Cleared when that game ends (config.yaml).
  s_start_active{machine.practice_menu_open==1 and machine.practice_game_type==2}:
    practice_fb_game: { action: set_machine, int: 1 }

  # Attract leaving for any reason: menu closed, Normal Game selected again.
  # (practice_fb_game is NOT cleared here - the game is starting.)
  mode_attract_stopping:
    practice_menu_open: { action: set_machine, int: 0 }
    practice_game_type: { action: set_machine, int: 0 }
