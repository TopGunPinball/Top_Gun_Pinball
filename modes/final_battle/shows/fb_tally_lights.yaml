##############################################################################
## FINAL BATTLE - POINTS TALLY (lost)  ->  "DEBRIEF"
## Played by final_battle.yaml on fb_tally_start when the mission was lost.
## Timed to fb_tally_timer (a tally row every 1.5s):
##   rows 1-7  one insert group per row flashes WHITE then settles AMBER and
##             stays lit, so the playfield fills up as the rows appear:
##             GOOSE/MIG lanes -> LOCK -> ICEMAN -> left shots -> right shots
##             -> mission inserts -> status inserts.  GI rises from a dim
##             steel blue; apron lights count up.
##   row 8     points awarded: whole playfield strobes white/gold
##   then      gold breathe, then a solid gold hold until fb_end_game.
## Regenerate with gen_tally_show.py rather than hand-editing.
##############################################################################

