#show_version=6
# final_battle_fanfare_04 - shot fanfare light show (15 steps x 66ms = ~1.0s)
# Played by final_battle.yaml on fb_fanfare (loops: 0, priority 2).
#   LOCK L/O/C/K, GOOSE and MIG inserts: white (brightness kept)
#   every other insert: (color) = the phase GI color, at the original brightness
#   GI / apron lights removed - the GI flicker owns them during the fanfare
# Converted from show_version 5 (time: +1 per step).
