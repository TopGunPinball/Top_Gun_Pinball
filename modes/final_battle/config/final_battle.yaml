#config_version=6
##############################################################################
## FINAL BATTLE - CONTROLLER (wizard mode, based on the Top Gun: Maverick
## final mission). Runs for the whole Final Battle; the four phase modes
## (final_battle_p1 .. final_battle_p4) run inside it one at a time.
##
## FILE NAME: modes/final_battle/config/final_battle.yaml
##
## START: center scoop while Final Battle is lit (pilot_mission_qualifier.yaml
##        posts start_mode_final_battle). Final Battle ALWAYS ends the game for
##        this player - win, lose (out of jets) or tilt.
##
## THIS MODE OWNS:
##   - intro: final_battle_intro (62s) + final_battle_intro_instructions slide
##     (first 25s); voice_final_battle_intro starts 48s in
##   - SKIPPABLE VIDEOS (both flippers): every intro and every lost video.
##   - VICTORY: final_battle_victory (includes The End); game ends after it
##     Skipping just ends the video early - the game carries on exactly as if
##     it had finished.
##   - ONE MORE TRY: last jet lost in PHASE 1 with at least one jet locked ->
##     voice_one_more_try (5s), phase 1 won video, phase 2 on the last jet
##     with the locked jets released (+ the ball already in play, which
##     waits in the shooter lane with the flippers off until that release).
##     Lost in phase 1 with nothing locked -> voice_failed_seriously.
##   - LOST: out of jets -> final_battle_phase<N>_lost for the phase it
##     happened in (phase 4 + landing use phase4_lost) -> points tally
##   - jets (lives): 3, +1 with the Wingman perk
##   - the scoop hold, the unlimited "last ball" save (= lose a jet + new ball),
##     the single-ball grace save, every multiball device, auto-plunge
##   - lights: every letter / shot insert off at priority 600 (phase modes
##     light their own shots at 610); GI color per phase; explosion GI
##   - SHOT FANFARE: fb_fanfare (every shot made) -> 1s GI flicker in the
##     phase color + one of 8 random light shows (final_battle_fanfare_01..08
##     in modes/final_battle/shows/)
##   - phase sequencing: phase N complete -> won video -> phase N+1
##   - the points tally, awarding the points, and ending the game
##   - tilt: Final Battle lost, no points
##
## PERKS (captured at start):
##   Wingman     +1 jet
##   Afterburner +30s on the phase 1, 3 and 4 timers
##   Inverted    +10s on each missile set and flare window
##   Missiles    one shot completed automatically at the start of each phase
##
## OTHER MODES: goose / iceman / MIG letters, Mach scoring, 2X, Buzz the Tower,
##   pilot awards, hard deck qualifiers, extra ball and the shot callout
##   randomizers stop when Final Battle starts (mode_final_battle_started is in
##   their stop_events). TGMB locks keeps running (it owns the lock diverter
##   and servo) but is neutralized here (nothing lit, collection paused).
##
## VIDEOS: Godot plays them from res://addons/artwork/videos/final_battle/
##   <name>.ogv through final_battle_video (a queue: one step video waits at
##   most; urgent videos interrupt). Missing files show a 2.5s placeholder card.
##   MPF -> Godot: fb_video (video, urgent)  Godot -> MPF: fb_video_done (video)
##
## SCORING: flat points (no multipliers), banked per phase and awarded at the
##   tally. A complete run = 75,000,000. Values live in the phase mode files.
##############################################################################

mode:
  start_events: start_mode_final_battle
  # ball_ended (not ball_will_end): after a lost Final Battle the ball ends
  # while the lost video / tally still have to play - the queue relay below
  # holds ball_ending until fb_end_game. (A ball_ending stop would run before
  # the relay - mode stop handlers sit at priority + 1 - and cancel it.)
  stop_events: ball_ended
  priority: 600
  game_mode: true
  use_wait_queue: true
  # code/final_battle_code.py: the game loop skips a player whose game Final
  # Battle ended (other players keep their balls)
  code: final_battle_code.FinalBattleMode

##############################################################################
## END OF THE PLAYER'S GAME AFTER A LOSS
## On the last jet the last-ball save is OFF (fb_save_check), so the final
## drain really ends the ball. ball_ending is held here until the lost video
## and tally are done (fb_end_game) - no ball is ever kicked out for it.
##############################################################################
queue_relay_player:
  ball_ending{current_player.fb_end_hold==1}:
    post: fb_ball_end_held
    wait_for: fb_end_game
    priority: 1000

##############################################################################
## BALL HOLD - scoop (intro, phase 1 ball 3, phase 2/4 finales)
## Stays enabled the whole time; a ball taken out by a multiball (ball_locks)
## is subtracted automatically, so it never goes stale.
##############################################################################
ball_holds:
  fb_scoop_hold:
    balls_to_hold: 1
    hold_devices: bd_mode_scoop
    enable_events: mode_final_battle_started
    release_one_events: fb_scoop_release
    release_all_events: mode_final_battle_will_stop, tilt, fb_end_game
    # Cleared before every scoop shot that should hold the ball. A ball taken
    # out by a multiball doesn't count down the hold, so without this the hold
    # stays "full" and the next scoop shot is ejected right away.
    reset_events: fb_scoop_hold_reset

##############################################################################
## BALL SAVES
##############################################################################
ball_saves:
  # LAST-BALL SAVE = losing a jet. Unlimited; only saves the last ball in play.
  fb_last_ball_save:
    active_time: 0              # 0 = until disabled
    only_last_ball: true
    balls_to_save: -1
    auto_launch: false          # fb_plunge_delay timer plunges
    # The saved ball WAITS IN THE TROUGH until fb_save_eject: after the jet
    # explosion (fb_jet_continue), or at phase 2 for one more try. On the last
    # jet this save is off (fb_save_check), so the final drain ends the ball.
    delayed_eject_events: fb_save_eject
    enable_events: fb_life_save_enable
    disable_events: fb_life_save_disable, fb_end_game, tilt, ball_will_end
  # Grace save at the start of single-ball play (no jet lost while active)
  fb_grace_save:
    active_time: current_player.fb_grace_secs
    balls_to_save: -1
    auto_launch: false
    enable_events: fb_grace_save_enable
    disable_events: fb_grace_save_disable, fb_end_game, tilt, ball_will_end

##############################################################################
## MULTIBALLS (all here so the last-ball save can check their shoot-again)
##############################################################################
multiballs:
  # Locked balls already sitting in the lock when Final Battle starts are
  # released during the intro (flippers off) and drain.
  fb_clear_locks_1:
    ball_count: 1
    ball_count_type: add
    shoot_again: 0
    ball_locks: bd_lock_goose, bd_lock_mav
    start_events: fb_clear_locks_1
  fb_clear_locks_2:
    ball_count: 2
    ball_count_type: add
    shoot_again: 0
    ball_locks: bd_lock_goose, bd_lock_mav
    start_events: fb_clear_locks_2
  # PHASE 2: 2 locked jets + the scoop jet join the jet held at the left lane
  # (one more try: only the jets locked in phase 1 + the ball in play)
  fb_p2_multiball:
    ball_count: current_player.fb_omt_balls
    ball_count_type: total
    shoot_again: 20s
    ball_locks: bd_lock_goose, bd_lock_mav, bd_mode_scoop
    start_events: fb_p2_multiball_start
    stop_events: fb_mb_stop_saves, fb_end_game
  # One more jet after every missile set (7s save each)
  fb_p2_adder:
    ball_count: 1
    ball_count_type: add
    shoot_again: 7s
    add_a_ball_shoot_again: 7s
    start_or_add_a_ball_events: fb_p2_add_ball
    stop_events: fb_mb_stop_saves, fb_end_game
  # All jets drained -> jet lost -> 4 balls again, 20s save
  fb_p2_relaunch:
    ball_count: 4
    ball_count_type: total
    shoot_again: 20s
    start_events: fb_p2_relaunch
    stop_events: fb_mb_stop_saves, fb_end_game
  # PHASE 4: both locked jets released (one ejected, the lock servo drops both)
  fb_p4_multiball:
    ball_count: 2
    ball_count_type: total
    shoot_again: 30s
    ball_locks: bd_lock_goose, bd_lock_mav
    start_events: fb_p4_multiball_start
    stop_events: fb_mb_stop_saves, fb_end_game
  fb_p4_adder:
    ball_count: 1
    ball_count_type: add
    shoot_again: 30s
    add_a_ball_shoot_again: 30s
    start_or_add_a_ball_events: fb_p4_add_ball
    stop_events: fb_mb_stop_saves, fb_end_game
  fb_p4_relaunch:
    ball_count: 2
    ball_count_type: total
    shoot_again: 30s
    start_events: fb_p4_relaunch
    stop_events: fb_mb_stop_saves, fb_end_game

##############################################################################
## TIMERS
##############################################################################
timers:
  # Intro: ends when final_battle_intro (62s) reports done; 65s = fallback.
  # Its ticks also time the briefing voice (48s).
  fb_intro_timer:
    start_value: 0
    end_value: 65
    tick_interval: 1s
    control_events:
      - event: mode_final_battle_started
        action: start
      - event: fb_intro_done
        action: stop
  # Both-flipper skip ignored for 1s after a skippable video starts
  fb_skip_lockout:
    start_value: 0
    end_value: 1
    tick_interval: 1s
    control_events:
      - event: fb_skippable_on
        action: restart
  # Auto-plunge any ball that lands in the shooter lane
  # fb_omt_hold = 1 keeps the ball in the shooter lane:
  #   one more try - until phase 2 releases the locked jets
  #   out of jets  - for good (the game is over)
  fb_plunge_delay:
    start_value: 0
    end_value: 1
    tick_interval: 1s
    control_events:
      - event: s_shooter_lane_active{current_player.fb_omt_hold==0}
        action: restart
      - event: fb_one_more_try
        action: stop
      - event: fb_jet_lost_final
        action: stop
      - event: fb_omt_release{device.switches.s_shooter_lane.state}
        action: restart
      - event: s_shooter_lane_inactive
        action: stop
  # Fallback if a won/failed video never reports done
  fb_transition_timeout:
    start_value: 0
    end_value: 90
    tick_interval: 1s
    control_events:
      - event: fb_transition_start
        action: restart
      - event: fb_advance
        action: stop
  # Tally rows reveal every 1.5s (8 rows), then 3 more ticks before done
  fb_tally_timer:
    start_value: 0
    end_value: 11
    tick_interval: 1500ms
    control_events:
      - event: fb_tally_start
        action: restart
  # Shot value: held at 1,500,000 for 3s, then falls smoothly to 500,000
  # over 15s (updated every 200ms). Restarts every time a shot is made (and at
  # each phase / missile set). 90 ticks = 18s; ticks 90-76 = the 3s hold.
  fb_shot_value_timer:
    start_value: 90
    end_value: 0
    direction: down
    tick_interval: 200ms
    control_events:
      - event: fb_step_made
        action: restart
      - event: fb_shot_value_reset
        action: restart
  # Shoot Again insert flashes while a ball save is on; off 2s before it ends.
  # (counts up; fb_sa_off_at = save length - 2)
  fb_sa_timer:
    start_value: 0
    end_value: 120
    tick_interval: 1s
    control_events:
      - event: fb_sa_start
        action: restart
      - event: fb_sa_off
        action: stop
  # Phase 2 instructions: 16s into the phase 1 won video
  fb_p2_instr_delay:
    start_value: 0
    end_value: 16
    tick_interval: 1s
    control_events:
      - event: fb_p2_instr_arm
        action: restart
      - event: fb_p2_begin
        action: stop
  fb_end_timeout:
    start_value: 0
    end_value: 240
    tick_interval: 1s
    control_events:
      - event: fb_end_timeout_start
        action: restart

##############################################################################
## VARIABLE PLAYER
##############################################################################
variable_player:
  mode_final_battle_started:
    # perks first, before anything reacts to pilot_mode_active
    fb_perk_missiles: { action: set, int: current_player.missiles_perk_active }
    fb_perk_afterburner: { action: set, int: current_player.afterburner_perk_active }
    fb_perk_inverted: { action: set, int: current_player.training_mission_inverted_perk_active }
    fb_perk_wingman: { action: set, int: current_player.wingman_perk_active }
    fb_jets: { action: set, int: 3 + current_player.wingman_perk_active }
    # neutralize multiball / lock progress (this player's game ends here)
    multiball_qualified: { action: set, int: 0 }
    lock_goose_lit: { action: set, int: 0 }
    lock_mav_lit: { action: set, int: 0 }
    lock_collection_paused: { action: set, int: 1 }
    pilot_mode_active: { action: set, int: 1 }
    letter_collection_paused: { action: set, int: 1 }
    qualified_mode_number: { action: set, int: 0 }
    final_battle_played: { action: set, int: 1 }
    fb_phase: { action: set, int: 0 }
    fb_step: { action: set, int: 0 }
    fb_losing: { action: set, int: 0 }
    fb_omt: { action: set, int: 0 }          # 1 = phase 2 reached via "one more try"
    fb_omt_balls: { action: set, int: 4 }    # balls phase 2 starts with
    fb_omt_hold: { action: set, int: 0 }     # 1 = keep the ball in the shooter lane
    fb_end_hold: { action: set, int: 0 }     # 1 = hold ball_ending for the lost video + tally
    fb_hud_text_on: { action: set, int: 1 }  # 0 = HUD centre text hidden (tally)
    fb_intro_over: { action: set, int: 0 }
    fb_skippable: { action: set, int: 1 }
    fb_lost_phase: { action: set, int: 0 }
    fb_transition: { action: set, int: 0 }
    fb_result: { action: set, int: 0 }
    fb_tally_step: { action: set, int: 0 }
    fb_points_awarded: { action: set, int: 0 }
    fb_shot_value: { action: set, int: 1500000 }
    fb_p2_instr_shown: { action: set, int: 0 }
    fb_timer_on: { action: set, int: 0 }
    fb_tally_mult: { action: set, int: 1 }
    fb_tally_award: { action: set, int: 0 }
    fb_missiles_evaded: { action: set, int: 0 }
    fb_points_p1: { action: set, int: 0 }
    fb_points_p2: { action: set, int: 0 }
    fb_points_p3: { action: set, int: 0 }
    fb_points_p4: { action: set, int: 0 }
    fb_points_p5: { action: set, int: 0 }
    fb_mission_points: { action: set, int: 0 }
    fb_timer: { action: set, int: 0 }
    fb_phase_title: { action: set, string: "FINAL BATTLE" }
    fb_objective: { action: set, string: "MISSION BRIEFING" }
    fb_info: { action: set, string: "" }

  fb_intro_done:
    fb_intro_over: { action: set, int: 1 }

  fb_hold_on:
    fb_holding: { action: set_machine, int: 1 }
  fb_hold_off:
    fb_holding: { action: set_machine, int: 0 }

  # Skippable videos
  fb_skippable_on:
    fb_skippable: { action: set, int: 1 }
  fb_video_done{video=="final_battle_phase1_won"}:
    fb_skippable: { action: set, int: 0 }
  fb_video_done{video=="final_battle_phase2_won"}:
    fb_skippable: { action: set, int: 0 }
  fb_video_done{video=="final_battle_phase3_won"}:
    fb_skippable: { action: set, int: 0 }
  fb_video_done{video=="final_battle_phase4_step_9"}:
    fb_skippable: { action: set, int: 0 }
  fb_skip_video:
    fb_skippable: { action: set, int: 0 }
  fb_video_done{video=="final_battle_intro"}:
    fb_skippable: { action: set, int: 0 }
  fb_video_done{video=="final_battle_phase2_intro"}:
    fb_skippable: { action: set, int: 0 }
  fb_video_done{video=="final_battle_phase3_intro"}:
    fb_skippable: { action: set, int: 0 }
  fb_video_done{video=="final_battle_phase4_intro"}:
    fb_skippable: { action: set, int: 0 }
  fb_video_done{video=="final_battle_phase1_lost"}:
    fb_skippable: { action: set, int: 0 }
  fb_video_done{video=="final_battle_phase2_lost"}:
    fb_skippable: { action: set, int: 0 }
  fb_video_done{video=="final_battle_phase3_lost"}:
    fb_skippable: { action: set, int: 0 }
  fb_video_done{video=="final_battle_phase4_lost"}:
    fb_skippable: { action: set, int: 0 }

  # Points banked by the phase modes (fb_points_add with phase + points)
  fb_points_add{phase==1}:
    fb_points_p1: { action: add, int: points }
    fb_mission_points: { action: add, int: points }
  fb_points_add{phase==2}:
    fb_points_p2: { action: add, int: points }
    fb_mission_points: { action: add, int: points }
  fb_points_add{phase==3}:
    fb_points_p3: { action: add, int: points }
    fb_mission_points: { action: add, int: points }
  fb_points_add{phase==4}:
    fb_points_p4: { action: add, int: points }
    fb_mission_points: { action: add, int: points }
  fb_points_add{phase==5}:
    fb_points_p5: { action: add, int: points }
    fb_mission_points: { action: add, int: points }

  # Phase starts
  fb_p1_begin:
    fb_phase: { action: set, int: 1 }
    fb_step: { action: set, int: 0 }
    fb_transition: { action: set, int: 0 }
    fb_phase_title: { action: set, string: "PHASE 1 - CANYON RUN" }
    fb_info: { action: set, string: "LOCK ALL 4 JETS" }
  # ONE MORE TRY (lost the last jet in phase 1 with jets locked): keep the
  # last jet (shows 1 = last chance), block further losses until phase 2,
  # remember the ball count: every locked jet + the ball already in play.
  fb_one_more_try:
    fb_omt_hold: { action: set, int: 1 }
    fb_omt: { action: set, int: 1 }
    fb_omt_balls: { action: set, int: current_player.fb_hud_count + 1 }
    fb_losing: { action: set, int: 1 }
  fb_p2_begin{current_player.fb_omt==1}:
    fb_losing: { action: set, int: 0 }
    fb_omt_hold: { action: set, int: 0 }
  fb_p2_begin:
    fb_phase: { action: set, int: 2 }
    fb_step: { action: set, int: 0 }
    fb_transition: { action: set, int: 0 }
    fb_phase_title: { action: set, string: "PHASE 2 - EVADE THE MISSILES" }
    fb_info: { action: set, string: "HIT ALL 3 SHOTS BEFORE THE MISSILE FIRES" }
  fb_p3_begin:
    fb_phase: { action: set, int: 3 }
    fb_step: { action: set, int: 0 }
    fb_transition: { action: set, int: 0 }
    fb_phase_title: { action: set, string: "PHASE 3 - ESCAPE IN THE F-14" }
    fb_info: { action: set, string: "HIT EVERY GREEN SHOT, THEN LOCK 2 BALLS" }
  fb_p4_begin:
    fb_phase: { action: set, int: 4 }
    fb_step: { action: set, int: 0 }
    fb_transition: { action: set, int: 0 }
    fb_phase_title: { action: set, string: "PHASE 4 - DOGFIGHT" }
    fb_info: { action: set, string: "SHOOT DOWN THE BANDITS" }
  fb_landing_begin:
    fb_phase: { action: set, int: 5 }
    fb_step: { action: set, int: 0 }
    fb_transition: { action: set, int: 0 }
    fb_phase_title: { action: set, string: "LAND THE JET" }
    fb_info: { action: set, string: "BRING HER HOME" }

  # Phase complete -> waiting on the won video
  fb_p1_complete:
    fb_transition: { action: set, int: 1 }
  fb_p2_complete:
    fb_transition: { action: set, int: 2 }
  fb_p3_complete:
    fb_transition: { action: set, int: 3 }
  fb_p4_complete:
    fb_transition: { action: set, int: 4 }

  # Step counter for step videos (phase modes post fb_step_made)
  fb_step_made:
    fb_step: { action: add, int: 1 }
    fb_shot_value: { action: set, int: 1500000 }

  # Jets
  fb_jet_lost_normal:
    fb_jets: { action: add, int: -1 }
    fb_losing: { action: set, int: 1 }
  fb_jet_lost_final:
    fb_lost_phase: { action: set, int: current_player.fb_phase }
    fb_jets: { action: add, int: -1 }
    fb_losing: { action: set, int: 1 }
    fb_omt_hold: { action: set, int: 1 }   # game over: never plunge again
    fb_end_hold: { action: set, int: 1 }   # the ball may end now: hold it for the tally
  # Last jet drained (the last-ball save is off on the last jet): the ball
  # is ending -> that's the final loss. Hold the ball end for the tally.
  ball_will_end{current_player.fb_phase>=1 and current_player.fb_phase<=5 and current_player.fb_losing==0}:
    fb_end_hold: { action: set, int: 1 }
  fb_jet_continue:
    fb_losing: { action: set, int: 0 }
  fb_loss_drain:
    fb_loss_reason: { action: set, int: 1 }
  fb_loss_timer:
    fb_loss_reason: { action: set, int: 2 }

  # Results
  fb_victory:
    fb_hud_text_on: { action: set, int: 0 }
    fb_result: { action: set, int: 1 }
    fb_phase: { action: set, int: 9 }
  fb_failed:
    fb_hud_text_on: { action: set, int: 0 }
    fb_result: { action: set, int: 2 }
    fb_phase: { action: set, int: 9 }

  # Tally: rows 1-5 phases, 6 subtotal, 7 jets remaining (x), 8 award.
  # Multiplier = jets remaining (x1 if Final Battle was lost with none left)
  fb_tally_start{current_player.fb_jets>=1}:
    fb_tally_mult: { action: set, int: current_player.fb_jets }
    fb_tally_award: { action: set, int: current_player.fb_mission_points * current_player.fb_jets }
  fb_tally_start{current_player.fb_jets<1}:
    fb_tally_mult: { action: set, int: 1 }
    fb_tally_award: { action: set, int: current_player.fb_mission_points }
  timer_fb_tally_timer_tick{ticks<=8}:
    fb_tally_step: { action: set, int: ticks }
  timer_fb_tally_timer_tick{ticks==8 and current_player.fb_points_awarded==0}:
    score: { action: add, int: current_player.fb_tally_award }
    fb_points_awarded: { action: set, int: 1 }
  # Safety: the game is ending before the tally reached its total
  fb_end_game{current_player.fb_points_awarded==0 and current_player.fb_result>=1 and current_player.fb_jets>=1}:
    score: { action: add, int: current_player.fb_mission_points * current_player.fb_jets }
    fb_points_awarded: { action: set, int: 1 }
  fb_end_game{current_player.fb_points_awarded==0 and current_player.fb_result>=1 and current_player.fb_jets<1}:
    score: { action: add, int: current_player.fb_mission_points }
    fb_points_awarded: { action: set, int: 1 }

  # Shot value (see fb_shot_value_timer)
  timer_fb_shot_value_timer_tick{ticks<75}:
    fb_shot_value: { action: set, int: 500000 + ticks * 1000000 / 75 }
  fb_shot_value_reset:
    fb_shot_value: { action: set, int: 1500000 }
  timer_fb_shot_value_timer_complete:
    fb_shot_value: { action: set, int: 500000 }

  # Shoot Again light: when to turn it off (save length - 2s)
  fb_grace_save_enable:
    fb_sa_off_at: { action: set, int: current_player.fb_grace_secs - 2 }
  multiball_fb_p2_multiball_started:
    fb_sa_off_at: { action: set, int: 18 }
  multiball_fb_p2_relaunch_started:
    fb_sa_off_at: { action: set, int: 18 }
  fb_p2_add_ball:
    fb_sa_off_at: { action: set, int: 5 }
  multiball_fb_p4_multiball_started:
    fb_sa_off_at: { action: set, int: 28 }
  multiball_fb_p4_relaunch_started:
    fb_sa_off_at: { action: set, int: 28 }
  fb_p4_add_ball:
    fb_sa_off_at: { action: set, int: 28 }

  # Phase 2 instructions slide shown during the phase 1 won video?
  fb_p2_instr_show:
    fb_p2_instr_shown: { action: set, int: 1 }

  # HUD timer only while a phase timer is actually running
  fb_timer_show:
    fb_timer_on: { action: set, int: 1 }
  fb_timer_hide:
    fb_timer_on: { action: set, int: 0 }

  # End of the player's game: no more balls, no extra balls
  # End of THIS player's game: final_battle_game_over makes the game loop skip
  # them from now on (code/final_battle_code.py) - the other players keep
  # their balls. (No more forcing ball = balls_per_game: that ended everyone's
  # game when this was the last player, and gave extra turns otherwise.)
  fb_end_game:
    extra_balls: { action: set, int: 0 }
    final_battle_game_over: { action: set, int: 1 }
    fb_end_hold: { action: set, int: 0 }
  # Tilt during Final Battle: this player's game is over (the game loop skips
  # them from now on - see code/final_battle_code.py)
  tilt:
    extra_balls: { action: set, int: 0 }
    final_battle_game_over: { action: set, int: 1 }
    fb_phase: { action: set, int: 9 }

##############################################################################
## EVENT PLAYER
##############################################################################
event_player:
  ##############################################
  ## WON VIDEOS are skippable too (both flippers), once they actually start
  ## (Godot reports fb_video_started)
  ##############################################
  fb_video_started{video=="final_battle_phase2_won"}:
    - fb_skippable_on
  fb_video_started{video=="final_battle_phase3_won"}:
    - fb_skippable_on
  fb_video_started{video=="final_battle_phase4_step_9"}:
    - fb_skippable_on
  fb_video_started{video=="final_battle_phase1_won"}:
    - fb_skippable_on
    - fb_p2_instr_arm

  ##############################################
  ## PHASE 2 INSTRUCTIONS: 16s into the phase 1 won video, off when the balls
  ## are released. Won video skipped before 16s -> shown for 10s at release.
  ##############################################
  timer_fb_p2_instr_delay_complete{current_player.fb_transition==1}:
    - fb_p2_instr_show

  ##############################################
  ## SHOOT AGAIN LIGHT (flashes during any Final Battle ball save)
  ##############################################
  fb_grace_save_enable:
    - fb_sa_start
  multiball_fb_p2_multiball_started:
    - fb_sa_start
  multiball_fb_p2_relaunch_started:
    - fb_sa_start
  fb_p2_add_ball:
    - fb_sa_start
  multiball_fb_p4_multiball_started:
    - fb_sa_start
  multiball_fb_p4_relaunch_started:
    - fb_sa_start
  fb_p4_add_ball:
    - fb_sa_start
  timer_fb_sa_timer_tick{ticks>=current_player.fb_sa_off_at}:
    - fb_sa_off
  fb_grace_save_disable:
    - fb_sa_off
  fb_mb_stop_saves:
    - fb_sa_off

  ##############################################
  ## HUD TIMER: shown in phases 1-3 and the landing; hidden for intros and the
## phase 4 bandits
  ##############################################
  fb_p2_begin:
    - fb_timer_show
    - fb_shot_value_reset
  # One more try: the waiting ball goes in as the locked jets are released
  mode_final_battle_p2_started{current_player.fb_omt==1}:
    - enable_normal_flippers
    - fb_hold_off
    - fb_save_eject     # the held ball leaves the trough now...
    - fb_omt_release    # ...and is plunged (if it's already in the lane)
  fb_p3_begin:
    - fb_timer_hide
  fb_p4_begin:
    - fb_timer_hide

  ##############################################
  ## SCOOP OUT: kick the held ball out (barrier drops, ball out, barrier back
  ## up - scoop_ball_release in pilot_mission_qualifier.yaml). If the scoop is
  ## empty, just make sure the barrier is up.
  ##############################################
  fb_scoop_out{device.switches.s_mode_start.state}:
    - scoop_ball_release
    - fb_scoop_release
    - lock_disable_scoop_for_mode
  fb_scoop_out{not device.switches.s_mode_start.state}:
    - barrier_raise

  ##############################################
  ## BALL HELD BY A POST (left / right lane): no ball search while it's held.
  ## (A ball in the scoop or the lock is off the playfield, so ball search
  ## already ignores it.) machine var fb_holding also stops the both-flippers-
  ## released unblock in ball_search_servos.yaml from undoing this.
  ##############################################
  fb_left_post_hold:
    - fb_hold_on
  fb_right_post_hold:
    - fb_hold_on
  fb_left_post_release:
    - fb_hold_off
  fb_hold_on:
    - ball_search_block
  fb_hold_off:
    - ball_search_unblock
  mode_final_battle_will_stop:
    - fb_hold_off

  ##############################################
  ## MUSIC: plays whenever a phase is being played; silent during intro, won
  ## and lost videos. fb_music_go starts the current phase's track.
  ##############################################
  fb_music_go{current_player.fb_phase==1}:
    - fb_music_p1
  fb_music_go{current_player.fb_phase==2}:
    - fb_music_p2
  fb_music_go{current_player.fb_phase==3}:
    - fb_music_p3
  fb_music_go{current_player.fb_phase==4}:
    - fb_music_p4
  # Landing (fb_phase 5, set on fb_landing_begin = ball kicked out of the
  # scoop) has its own track
  fb_music_go{current_player.fb_phase==5}:
    - fb_music_landing
  fb_video_done{video=="final_battle_phase2_intro" and current_player.fb_phase==2}:
    - fb_music_go
  fb_p3_go:
    - fb_music_go
    - fb_timer_show
    - fb_shot_value_reset
  fb_p4_go:
    - fb_music_go
    - fb_shot_value_reset
  fb_landing_begin:
    - fb_music_go
    - fb_shot_value_reset
    - fb_timer_show

  ##############################################
