show_player:
  ##############################################
  ## SHOT FANFARE (fb_fanfare)
  ##   GI flicker in the phase's GI color, ~1s, priority 3 (under the jet-lost
  ##   explosion). A new hit while it runs just lets it carry on.
  ##   Random light show: final_battle_fanfare_01..08 from
  ##   modes/final_battle/shows/, priority 2 - above the "everything off"
  ##   lights here, below the phase modes' lit shots (610+), so lit shots
  ##   always show through.
  ##############################################
  fb_fanfare{current_player.fb_phase==1 or current_player.fb_phase==5}:
    fb_gi_flicker:
