## RANDOM EVENT PLAYER - shot fanfare light show (never the same twice in a row)
##############################################################################
random_event_player:
  fb_fanfare:
    force_different: true
    events:
      - fb_fanfare_show_1
      - fb_fanfare_show_2
      - fb_fanfare_show_3
      - fb_fanfare_show_4
      - fb_fanfare_show_5
      - fb_fanfare_show_6
      - fb_fanfare_show_7
      - fb_fanfare_show_8

##############################################################################
## SLIDE PLAYER (mode priority 600 + value)
##############################################################################
slide_player:
  mode_final_battle_started:
    final_battle_hud:
      action: play
      priority: 10
    final_battle_video:
      action: play
      priority: 20
    final_battle_intro_instructions:
      action: play
      priority: 30
      expire: 25s
  fb_intro_done:
    final_battle_intro_instructions:
      action: remove
  # Phase 2 instructions: 16s into the phase 1 won video until the balls are
  # released; if the won video was skipped first, 10s from the release
  fb_p2_instr_show:
    final_battle_phase2_instructions:
      action: play
      priority: 30
  fb_p2_begin{current_player.fb_p2_instr_shown==1}:
    final_battle_phase2_instructions:
      action: remove
  fb_p2_begin{current_player.fb_p2_instr_shown==0}:
    final_battle_phase2_instructions:
      action: play
      priority: 30
      expire: 10s
  # Written instructions over the phase 3 / phase 4 intro videos
  fb_vu_final_battle_phase3_intro:
    final_battle_phase3_instructions:
      action: play
      priority: 30
  fb_video_done{video=="final_battle_phase3_intro"}:
    final_battle_phase3_instructions:
      action: remove
  fb_vu_final_battle_phase4_intro:
    final_battle_phase4_instructions:
      action: play
      priority: 30
  fb_video_done{video=="final_battle_phase4_intro"}:
    final_battle_phase4_instructions:
      action: remove
  # Mission over (won or lost): no instruction overlay may stay up
  fb_failed:
    final_battle_intro_instructions:
      action: remove
    final_battle_phase2_instructions:
      action: remove
    final_battle_phase3_instructions:
      action: remove
    final_battle_phase4_instructions:
      action: remove
  fb_victory:
    final_battle_intro_instructions:
      action: remove
    final_battle_phase2_instructions:
      action: remove
    final_battle_phase3_instructions:
      action: remove
    final_battle_phase4_instructions:
      action: remove
  fb_tally_start:
    final_battle_tally:
      action: play
      priority: 40
      expire: 30s

##############################################################################
## SOUND PLAYER
##############################################################################
sound_player:
  fb_music_stop:
    silence:
      bus: music
      loops: 0
  fb_intro_voice:
    voice_final_battle_intro:
      bus: voice
      loops: 0
      ducking:
        bus: music
        attenuation: 0.8
        attack: 150ms
        release: 600ms
        release_point: 0
  fb_music_p1:
    final_battle_phase_1_music:
      bus: music
      loops: -1
  fb_music_p2:
    final_battle_phase_2_music:
      bus: music
      loops: -1
  fb_music_p3:
    final_battle_phase_3_music:
      bus: music
      loops: -1
  fb_music_p4:
    final_battle_phase_4_music:
      bus: music
      loops: -1
  # (no "stop" entry here: GMC stops processing a sound_player event at the
  # first stop action, so it would swallow the play. The phase 4 track is
  # already silenced when phase 4 is won.)
  fb_music_landing:
    final_battle_landing_music:
      bus: music
      loops: -1
  fb_voice_jet_lost:
    voice_final_battle_jet_lost:
      bus: voice
      loops: 0
      ducking:
        bus: music
        attenuation: 0.8
        attack: 150ms
        release: 600ms
        release_point: 0
  fb_voice_last_jet:
