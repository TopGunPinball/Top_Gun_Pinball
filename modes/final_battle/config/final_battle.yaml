  ##############################################
  ## START / INTRO
  ##############################################
  # Intro video 1s after the start: the Godot video player slide is created
  # when Final Battle starts and has to be listening before the request goes
  # out (sent at the same instant, the request was missed).
  mode_final_battle_started:
    - fb_vu_final_battle_intro|1s
    - disable_normal_flippers
    - barrier_raise|1500ms
  # Balls already in the lock (from an earlier TGMB lock) are released now
  mode_final_battle_started{device.switches.s_lock_goose.state and device.switches.s_lock_mav.state}:
    - lock_mech_release
    - fb_clear_locks_2
  mode_final_battle_started{(device.switches.s_lock_goose.state or device.switches.s_lock_mav.state) and not (device.switches.s_lock_goose.state and device.switches.s_lock_mav.state)}:
    - lock_mech_release
    - fb_clear_locks_1

  # SKIP (both flippers) any skippable video: it just ends early, and its
  # fb_video_done carries the game on exactly as if it had finished
  s_flipper_left_active{current_player.fb_skippable==1 and device.switches.s_flipper_right.state and not device.timers.fb_skip_lockout.running}:
    - fb_skip_video
  s_flipper_right_active{current_player.fb_skippable==1 and device.switches.s_flipper_left.state and not device.timers.fb_skip_lockout.running}:
    - fb_skip_video
  fb_skip_video:
    - fb_video_clear

  # Intro over: video finished / skipped (or the 65s fallback)
  fb_video_done{video=="final_battle_intro" and current_player.fb_phase==0 and current_player.fb_intro_over==0}:
    - fb_intro_done
  timer_fb_intro_timer_complete{current_player.fb_intro_over==0}:
    - fb_intro_done
  timer_fb_intro_timer_tick{ticks==49 and current_player.fb_intro_over==0}:
    - fb_intro_voice

  # Phase 1 starts once any released lock balls have drained
  fb_intro_done{game.balls_in_play<=1}:
    - fb_p1_begin
  balls_in_play{balls==1 and current_player.fb_phase==0 and current_player.fb_intro_over==1}:
    - fb_p1_begin

  # Phase 1 start: flippers on, last-ball save (= jets) on
  fb_p1_begin:
    - enable_normal_flippers
    - fb_life_save_enable
    - fb_music_go
    - fb_timer_show
    - fb_shot_value_reset

  ##############################################
  ## PHASE TRANSITIONS: complete -> won video -> next phase
  ##############################################
  fb_p1_complete:
    - fb_vq_final_battle_phase1_won
    - fb_transition_start
    - fb_music_stop
  fb_p2_complete:
    - fb_vq_final_battle_phase2_won
    - fb_transition_start
    - fb_music_stop
  fb_p3_complete:
    - fb_vq_final_battle_phase3_won
    - fb_transition_start
    - fb_music_stop
  fb_p4_complete:
    - fb_vq_final_battle_phase4_won
    - fb_transition_start
    - fb_music_stop
  fb_video_done{video=="final_battle_phase1_won" and current_player.fb_transition==1}:
    - fb_advance
  fb_video_done{video=="final_battle_phase2_won" and current_player.fb_transition==2}:
    - fb_advance
  fb_video_done{video=="final_battle_phase3_won" and current_player.fb_transition==3}:
    - fb_advance
  fb_video_done{video=="final_battle_phase4_step_9" and current_player.fb_transition==4}:
    - fb_advance
  timer_fb_transition_timeout_complete{current_player.fb_transition>0}:
    - fb_advance
  fb_advance{current_player.fb_transition==1}:
    - fb_p2_begin
  fb_advance{current_player.fb_transition==2}:
    - fb_p3_begin
  fb_advance{current_player.fb_transition==3}:
    - fb_p4_begin
  fb_advance{current_player.fb_transition==4}:
    - fb_landing_begin

  ##############################################
  ## JETS (LIVES)
  ## A drained last ball (no grace / multiball save running) costs a jet;
  ## phase modes post fb_lose_jet themselves for timer / missile losses.
  ##############################################
  # (MPF posts this with balls=0 when it declines to save during multiball)
  ball_save_fb_last_ball_save_saving_ball{balls>0 and current_player.fb_phase>=1 and current_player.fb_phase<=5 and current_player.fb_losing==0 and device.multiballs.fb_p2_multiball.shoot_again==False and device.multiballs.fb_p2_adder.shoot_again==False and device.multiballs.fb_p2_relaunch.shoot_again==False and device.multiballs.fb_p4_multiball.shoot_again==False and device.multiballs.fb_p4_adder.shoot_again==False and device.multiballs.fb_p4_relaunch.shoot_again==False and device.ball_saves.fb_grace_save.enabled==False}:
    - fb_loss_drain
    - fb_lose_jet
  # The save caught a drain that does NOT cost a jet (grace save running, a
  # multiball shoot-again, a loss already in progress...): that ball must come
  # straight back out, like before the save held balls in the trough. Only
  # one more try keeps it waiting (fb_omt_hold). Without this the ball sat in
  # the trough with nothing to release it - no ball, and later two at once.
  ball_save_fb_last_ball_save_saving_ball{balls>0 and current_player.fb_omt_hold==0 and not (current_player.fb_phase>=1 and current_player.fb_phase<=5 and current_player.fb_losing==0 and device.multiballs.fb_p2_multiball.shoot_again==False and device.multiballs.fb_p2_adder.shoot_again==False and device.multiballs.fb_p2_relaunch.shoot_again==False and device.multiballs.fb_p4_multiball.shoot_again==False and device.multiballs.fb_p4_adder.shoot_again==False and device.multiballs.fb_p4_relaunch.shoot_again==False and device.ball_saves.fb_grace_save.enabled==False)}:
    - fb_save_eject
  fb_lose_jet{current_player.fb_losing==0 and current_player.fb_phase<=5 and current_player.fb_jets>2}:
    - fb_jet_lost_normal
    - fb_voice_jet_lost
  fb_lose_jet{current_player.fb_losing==0 and current_player.fb_phase<=5 and current_player.fb_jets==2}:
    - fb_jet_lost_normal
    - fb_voice_last_jet
  fb_lose_jet{current_player.fb_losing==0 and current_player.fb_phase<=5 and current_player.fb_jets<=1 and not (current_player.fb_phase==1 and current_player.fb_hud_count>=1)}:
    - fb_jet_lost_final
  # Last jet lost in phase 1 but at least one jet is locked: one more try.
  # Explosion + "one more try" (5s), then the phase 1 won video and phase 2
  # with the locked jets (fb_p2_multiball uses fb_omt_balls).
  fb_lose_jet{current_player.fb_losing==0 and current_player.fb_jets<=1 and current_player.fb_phase==1 and current_player.fb_hud_count>=1}:
    - fb_one_more_try
  # Flippers off so a ball still on the playfield drains; the last-ball save
  # feeds it to the shooter lane, where it waits (no plunge, no ball search)
  # until phase 2 releases the locked jets.
  fb_one_more_try:
    - disable_normal_flippers
    - fb_hold_on
    - fb_stop_phases          # phase 1 off (timer, shots, lights)
    - fb_music_stop
    - fb_vu_final_battle_jet_explosion
    - fb_gi_explode|300ms
    - fb_voice_one_more_try
    - fb_p1_complete|5500ms   # -> phase 1 won video -> phase 2 (as a win)
  # Explosion video (2.15s); GI explosion starts 0.3s into it
  # A drained jet's replacement leaves the trough when play continues
  fb_jet_continue:
    - fb_save_eject
    - fb_save_check     # (not changed while a loss is in progress)

  # LAST-BALL SAVE ON THE LAST JET: off, so the final drain ends the ball
  # (nothing is ever ejected for it). Back on if a phase 1 lock makes the
  # player eligible for one more try again.
  player_fb_jets:
    - fb_save_check
  player_fb_phase:
    - fb_save_check
  player_fb_hud_count:
    - fb_save_check
  fb_save_check{current_player.fb_losing==0 and current_player.fb_phase>=1 and current_player.fb_phase<=5 and current_player.fb_jets<=1 and not (current_player.fb_phase==1 and current_player.fb_hud_count>=1)}:
    - fb_life_save_disable
  fb_save_check{current_player.fb_losing==0 and current_player.fb_phase>=1 and current_player.fb_phase<=5 and not (current_player.fb_jets<=1 and not (current_player.fb_phase==1 and current_player.fb_hud_count>=1))}:
    - fb_life_save_enable
  # ...and the final drain itself: the ball is ending on the last jet
  ball_will_end{current_player.fb_phase>=1 and current_player.fb_phase<=5 and current_player.fb_losing==0}:
    - fb_loss_drain
    - fb_lose_jet
  fb_jet_lost_normal:
    - fb_vu_final_battle_jet_explosion
    - fb_gi_explode|300ms
    - fb_jet_continue|3500ms
  # Out of jets = game over for this player. Stop play right now: phase off,
  # flippers off, no multiball re-launches. Any ball still loose drains (no
  # save on the last jet) and ball_ending is held until fb_end_game.
  fb_jet_lost_final:
    - fb_stop_phases
    - disable_normal_flippers
    - fb_mb_stop_saves
    - fb_grace_save_disable
    - fb_hold_on
    - fb_vu_final_battle_jet_explosion
    - fb_gi_explode|300ms
    - fb_failed|3500ms

  ##############################################
  ## RESULTS -> TALLY -> END OF GAME
  ##############################################
  fb_failed:
    - fb_music_stop
    - fb_stop_phases
    - fb_mb_stop_saves
    - fb_grace_save_disable
    - fb_voice_failed
    - fb_end_timeout_start
  fb_failed{current_player.fb_lost_phase<=1}:
    - fb_vu_final_battle_phase1_lost
  fb_failed{current_player.fb_lost_phase==2}:
    - fb_vu_final_battle_phase2_lost
  fb_failed{current_player.fb_lost_phase==3}:
    - fb_vu_final_battle_phase3_lost
  fb_failed{current_player.fb_lost_phase>=4}:
    - fb_vu_final_battle_phase4_lost
  fb_video_done{video=="final_battle_phase1_lost" and current_player.fb_result==2 and current_player.fb_tally_step==0}:
    - fb_tally_start
  fb_video_done{video=="final_battle_phase2_lost" and current_player.fb_result==2 and current_player.fb_tally_step==0}:
    - fb_tally_start
  fb_video_done{video=="final_battle_phase3_lost" and current_player.fb_result==2 and current_player.fb_tally_step==0}:
    - fb_tally_start
  fb_video_done{video=="final_battle_phase4_lost" and current_player.fb_result==2 and current_player.fb_tally_step==0}:
    - fb_tally_start
  # VICTORY: final_battle_victory plays (it includes "The End"). The game ends
  # when it finishes.
  # >>> TALLY TIMING: the points-award slide starts at the |0s below. Change it
  # >>> to the point in the victory video where it should appear (e.g. |12s).
  fb_victory:
    - fb_music_stop
    - fb_stop_phases
    - fb_mb_stop_saves
    - fb_grace_save_disable
    - fb_vu_final_battle_victory
    - fb_voice_victory
    - fb_end_timeout_start
    - fb_tally_start|0s
  fb_video_done{video=="final_battle_victory" and current_player.fb_result==1}:
    - fb_end_game
  # Lost: tally done -> game ends
  timer_fb_tally_timer_complete{current_player.fb_result==2}:
    - fb_end_game
  # Safety: something never reported done
  timer_fb_end_timeout_complete{current_player.fb_result==2 and current_player.fb_tally_step==0}:
    - fb_tally_start
  timer_fb_end_timeout_complete{current_player.fb_result==1 and current_player.final_battle_game_over==0}:
    - fb_end_game

  # End the game: flippers off, everything released, the ball drains and the
  # game ends exactly like the last ball draining (high score entry etc.)
  fb_end_game:
    - fb_sa_off
    - fb_stop_phases
    - fb_life_save_disable
    - fb_grace_save_disable
    - disable_normal_flippers
    - lock_disable_scoop_for_mode
  fb_end_game{device.switches.s_mode_start.state}:
    - scoop_ball_release
    - fb_hold_off
  tilt:
    - fb_stop_phases
    - fb_mb_stop_saves
    - fb_video_clear
    - lock_disable_scoop_for_mode

