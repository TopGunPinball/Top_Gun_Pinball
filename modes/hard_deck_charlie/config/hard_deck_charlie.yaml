    charlie_shots_remaining:
      action: add
      int: -1
    mode_points_scored:
      action: set
      int: 600000 * current_player.total_scoring_multiplier

  charlie_stage_4_shot_3:
    score:
      action: add
      int: 800000 * current_player.total_scoring_multiplier
    charlie_stage_4_shots_made:
      action: add
      int: 1
    charlie_shots_remaining:
      action: add
      int: -1
    mode_points_scored:
      action: set
      int: 800000 * current_player.total_scoring_multiplier

  charlie_stage_4_shot_4:
    score:
      action: add
      int: 1000000 * current_player.total_scoring_multiplier
    charlie_stage_4_shots_made:
      action: add
      int: 1
    charlie_shots_remaining:
      action: add
      int: -1
    mode_points_scored:
      action: set
      int: 1000000 * current_player.total_scoring_multiplier

  ##############################################
  ## FINAL SHOT SETUP - Set per-stage "final shot lit" flag
  ##############################################
  charlie_stage_1_final_shot_setup:
    charlie_stage_1_final_shot_lit:
      action: set
      int: 1
  charlie_stage_2_final_shot_setup:
    charlie_stage_2_final_shot_lit:
      action: set
      int: 1
  charlie_stage_3_final_shot_setup:
    charlie_stage_3_final_shot_lit:
      action: set
      int: 1
  charlie_stage_4_final_shot_setup:
    charlie_stage_4_final_shot_lit:
      action: set
      int: 1

  ##############################################
  ## STAGE TRANSITIONS - Update charlie_stage + reset shots_remaining
  ##############################################
  charlie_enter_stage_2:
    charlie_stage:
      action: set
      int: 2
    charlie_shots_remaining:
      action: set
      int: 4                  # Stage 2: 3 ordered non-final + 1 RO final
  charlie_enter_stage_3:
    charlie_stage:
      action: set
      int: 3
    charlie_shots_remaining:
      action: set
      int: 4                  # Stage 3: 3 any-order + 1 RO final
  charlie_enter_stage_4:
    charlie_stage:
      action: set
      int: 4
    charlie_shots_remaining:
      action: set
      int: 5                  # Stage 4: 4 any-order + 1 scoop final

  ##############################################
  ## FINAL SHOT HITS - Stage perks
  ##############################################
  # Stage 1 final (barrier scoop): 5M
  charlie_stage_1_final_shot_hit:
    score:
      action: add
      int: 5000000 * current_player.total_scoring_multiplier
    charlie_stage_1_final_shot_lit:
      action: set
      int: 0
    charlie_shots_remaining:
      action: add
      int: -1
    mode_points_scored:
      action: set
      int: 5000000 * current_player.total_scoring_multiplier

  # Stage 2 final (RO captured) — final_shot_hit fires AFTER shot_4 (same event tick).
  # shot_4 already adds 1M score, decrements shots_remaining, sets mode_points_scored.
  # final_shot_hit handles ONLY the stage-specific perk (bonus_multiplier) + flag clear.
  charlie_stage_2_final_shot_hit:
    charlie_stage_2_final_shot_lit:
      action: set
      int: 0
    bonus_multiplier:
      action: set
      int: current_player.bonus_multiplier + 5

  # Stage 3 final (RO captured) — clears the lit flag only. The conditional
  # perk (qualify ejection or +5M bonus) is routed via event_player to avoid
  # a race condition where both conditional variable_player handlers fire
  # in the same event tick (the ==0 handler changes the variable, then the
  # ==1 handler evaluates against the new value and ALSO matches).
  charlie_stage_3_final_shot_hit:
    charlie_stage_3_final_shot_lit:
      action: set
      int: 0

  # Stage 3 win → ejection seat NOT yet qualified → qualify it.
  # We also reset goose_last_letter_collected to 0 so goose_letters'
  # slide_player handler `eject_mode_qualified_event{goose_last_letter_collected!=1}`
  # fires (plays the ejection_seat_active HUD slide). Without this reset,
  # if G was the last GOOSE letter collected, goose_letters' OTHER handler
  # (`==1` branch) runs which only removes progress slides — meaning the
  # ACTIVE indicator never appears until the next ball.
  charlie_stage_3_qualify_eject_seat:
    eject_mode_qualified:
      action: set
      int: 1
    goose_last_letter_collected:
      action: set
      int: 0

  # Stage 3 win → ejection seat ALREADY qualified → award 5M bonus instead.
  charlie_stage_3_award_eject_bonus:
    score:
      action: add
      int: 5000000 * current_player.total_scoring_multiplier
    mode_points_scored:
      action: set
      int: 5000000 * current_player.total_scoring_multiplier

  # Stage 4 final (scoop captured): 5M + extra ball (light_extra_ball)
  # Stage 4 final (scoop captured): 5M + extra ball award.
  # We set extra_ball_lit directly here instead of firing light_extra_ball
  # in event_player, because that event triggers goose_letters to play the
  # extra_ball_lit_video slide on top of the charlie stage 4 won video.
  # Setting the variable directly skips the slide AND the voice callout.
  # Orange l_extra_ball_lit light comes on at the next ball start via
  # extra_ball.yaml's mode_extra_ball_started{extra_ball_lit==1} handler.
  charlie_stage_4_final_shot_hit:
    score:
      action: add
      int: 5000000 * current_player.total_scoring_multiplier
    charlie_stage_4_final_shot_lit:
      action: set
      int: 0
    charlie_shots_remaining:
      action: add
      int: -1
    charlie_complete_flag:
      action: set
      int: 1                  # Stage 4 = mode fully complete
    mode_points_scored:
      action: set
      int: 5000000 * current_player.total_scoring_multiplier
    extra_ball_lit:
      action: set
      int: 1                  # Direct award — bypasses light_extra_ball event chain

  ##############################################
  ## TIMER TICK - Update display variable for Godot
  ##############################################
  timer_hard_deck_charlie_timer_tick:
    charlie_timer_ticks:
      action: set
      int: current_player.hard_deck_charlie_hard_deck_charlie_timer_tick

####################################################################################
# EVENT PLAYER
####################################################################################
event_player:
  ##############################################
  ## MODE START - Raise barrier (block scoop during intro)
  ##############################################
  mode_hard_deck_charlie_started:
    - barrier_raise

  ##############################################
  ## INTRO SKIP - Both flippers pressed during intro
  ## Uses condition check: only fires when BOTH are held at same time.
  ##############################################
  s_flipper_left_active{current_player.charlie_stage==1 and device.timers.hard_deck_charlie_intro_video_delay.running and device.switches.s_flipper_right.state==1}:
    - hard_deck_charlie_skip_intro
  s_flipper_right_active{current_player.charlie_stage==1 and device.timers.hard_deck_charlie_intro_video_delay.running and device.switches.s_flipper_left.state==1}:
    - hard_deck_charlie_skip_intro

  ##############################################
  ## INTRO COMPLETE (timeout OR skip) → release ball into play, set up Stage 1
  ## NOTE: Barrier stays UP throughout stage 1 — only drops when final shot
  ## is lit (after 4 non-final shots).
  ##############################################
  hard_deck_charlie_skip_intro:
    - hard_deck_charlie_ball_released
    - charlie_stage_1_setup

  timer_hard_deck_charlie_intro_video_delay_complete:
    - hard_deck_charlie_ball_released
    - charlie_stage_1_setup

  ##############################################
  ## STAGE 1 SETUP - Light all 4 non-final shots, set servos
  ##############################################
  charlie_stage_1_setup:
    - right_ramp_down                       # Servo: RR shot requires down

  ##############################################
  ## STAGE 1 SHOT DETECTION
  ## Guards: stage==1, this specific shot not yet hit, final not lit,
  ## mode not complete.
  ##############################################
  # LO — composite event fired by pilot_mission_qualifier (s_orbit_left → s_orbit_right within 2s)
  left_orbit_shot_hit{current_player.charlie_stage==1 and current_player.charlie_stage_1_lo_hit==0 and current_player.charlie_stage_1_final_shot_lit==0 and current_player.charlie_complete_flag==0}:
    - charlie_stage_1_lo_hit
    - charlie_stage_1_shot_hit

  s_ramp_left_exit_active{current_player.charlie_stage==1 and current_player.charlie_stage_1_lr_hit==0 and current_player.charlie_stage_1_final_shot_lit==0 and current_player.charlie_complete_flag==0}:
    - charlie_stage_1_lr_hit
    - charlie_stage_1_shot_hit

  s_ramp_tower_exit_active{current_player.charlie_stage==1 and current_player.charlie_stage_1_twr_hit==0 and current_player.charlie_stage_1_final_shot_lit==0 and current_player.charlie_complete_flag==0}:
    - charlie_stage_1_twr_hit
    - charlie_stage_1_shot_hit

  s_ramp_right_exit_active{current_player.charlie_stage==1 and current_player.charlie_stage_1_rr_hit==0 and current_player.charlie_stage_1_final_shot_lit==0 and current_player.charlie_complete_flag==0}:
    - charlie_stage_1_rr_hit
    - charlie_stage_1_shot_hit

  ##############################################
  ## SHOT-NUMBER ROUTING
  ## Generic charlie_stage_1_shot_hit → specific shot_1/2/3/4 based on order
  ## (uses pre-increment shots_made counter).
  ##############################################
  charlie_stage_1_shot_hit{current_player.charlie_stage_1_shots_made==0}:
    - charlie_stage_1_shot_1
  charlie_stage_1_shot_hit{current_player.charlie_stage_1_shots_made==1}:
    - charlie_stage_1_shot_2
  charlie_stage_1_shot_hit{current_player.charlie_stage_1_shots_made==2}:
    - charlie_stage_1_shot_3
  charlie_stage_1_shot_hit{current_player.charlie_stage_1_shots_made==3}:
    - charlie_stage_1_shot_4

  ##############################################
  ## SHOT FEEDBACK - Shake + show points slide (handled in base.yaml)
  ## 4th shot also fires final_shot_setup (after 200ms so step_4 has a moment).
  ##############################################
  charlie_stage_1_shot_1:
    - shaker_soft
    - charlie_show_points
  charlie_stage_1_shot_2:
    - shaker_soft
    - charlie_show_points
  charlie_stage_1_shot_3:
    - shaker_soft
    - charlie_show_points
  charlie_stage_1_shot_4:
    - shaker_soft
    - charlie_show_points
    - charlie_stage_1_final_shot_setup|200ms

  ##############################################
  ## FINAL SHOT SETUP - Drop barrier, light barrier insert
  ##############################################
  charlie_stage_1_final_shot_setup:
    - barrier_drop

  ##############################################
  ## FINAL SHOT (BARRIER/SCOOP) HIT
  ## Re-enable ball_holds capture (charlie_stage_1_final_shot_setup_hold).
  ## Then fire the win.
  ##############################################
  s_mode_start_active{current_player.charlie_stage==1 and current_player.charlie_stage_1_final_shot_lit==1 and current_player.charlie_complete_flag==0}:
    - charlie_stage_1_final_shot_setup_hold
    - charlie_stage_1_final_shot_hit

  charlie_stage_1_final_shot_hit:
    - shaker_soft
    - barrier_raise
    - charlie_show_points

  ##############################################
  ## STAGE 1 DECISION
  ## During won video (10s):
  ##   Left flipper or timeout = continue → Stage 2
  ##   Right flipper          = exit (mode stops, points kept)
  ##############################################
  s_flipper_left_active{device.timers.hard_deck_charlie_stage_1_decision_timer.running and current_player.charlie_stage==1}:
    - charlie_stage_1_continue
  s_flipper_right_active{device.timers.hard_deck_charlie_stage_1_decision_timer.running and current_player.charlie_stage==1}:
    - charlie_stage_1_exit
  timer_hard_deck_charlie_stage_1_decision_timer_complete{current_player.charlie_stage==1}:
    - charlie_stage_1_continue

  # CONTINUE → Stage 2.
  # scoop_ball_release (qualifier handler) drops barrier and sets scoop_release_pending=1
  # so the global timer raises barrier after ball exits scoop. 400ms after the barrier
  # starts dropping, fire the ball_released event — which is in ball_holds release_one_events
  # so the scoop actually ejects the ball.
  # IMPORTANT: barrier_raise|1500ms — qualifier suppresses its own barrier_raise when
  # qualified_mode_number>0 (pilot mission queued). Charlie must raise the barrier itself
  # for the remaining stages; otherwise it stays down through stage 2/3/4.
  charlie_stage_1_continue:
    - scoop_ball_release
    - hard_deck_charlie_stage_2_ball_released|400ms     # releases ball from hold + resumes mode timer
    - charlie_enter_stage_2|400ms                       # set stage var, reset shots_remaining
    - charlie_stage_2_setup|400ms                       # servos + insert lights
    - barrier_raise|1500ms                              # ball has cleared scoop by now

  # EXIT → mode end, keep accumulated points.
  # No explicit barrier_raise here. mode_hard_deck_charlie_stopped (below)
  # raises the barrier when qualified_mode_number==0. When a pilot mission
  # IS queued, the pilot_mission_qualifier's coil_player drops the barrier
  # on mode_stopped so the player can shoot into the scoop to start that
  # pilot mission — raising it here would override that and lock the player out.
  charlie_stage_1_exit:
    - scoop_ball_release
    - hard_deck_charlie_decision_ball_release|400ms     # release ball from hold
    - hard_deck_charlie_cleanup|400ms                   # ramps down, diverter close
    - hard_deck_charlie_mode_end_complete|800ms

  ##############################################
  ## STAGE 2 SETUP
  ## Right ramp stays DOWN at setup — it goes UP only when RO arms
  ## (charlie_stage_2_final_shot_setup, after SP2 is hit).
  ## variable_player / show_player / light_player handle the rest of setup
  ## (insert flashes, GI yellow, etc.) via charlie_stage_2_setup directly.
  ## (charlie_stage_2_setup intentionally has no event_player actions.)
  ##############################################

  ##############################################
  ## STAGE 2 SHOT DETECTION
  ## Order: Spinner #1 → TO → Spinner #2 → RO (final, captures ball)
  ## Only the currently-lit shot is hittable (guards check spin_count + to_hit).
  ## TO uses s_orbit_lower with top ramp UP. The top ramp is raised when SP1
  ## fires (so the ball can pass underneath into s_orbit_lower) and lowered
  ## again when TO fires (so it doesn't interfere with SP2 / RO).
  ## hard_deck_charlie_cleanup lowers the top ramp on any mode exit/fail.
  ##############################################
  # Spinner #1 — composite (3 spins). Active when spin_count==0
  spinner_shot_made{current_player.charlie_stage==2 and current_player.charlie_stage_2_spin_count==0 and current_player.charlie_stage_2_final_shot_lit==0 and current_player.charlie_complete_flag==0}:
    - charlie_stage_2_sp1_hit
    - charlie_stage_2_shot_hit

  # When SP1 fires, raise the top ramp so the player can shoot TO under it.
  charlie_stage_2_sp1_hit:
    - top_ramp_up

  # TO — after SP1. Active when spin_count==1 and to not yet hit.
  # s_orbit_lower is the under-top-ramp switch; top_ramp must be UP for ball to reach it.
  s_orbit_lower_active{current_player.charlie_stage==2 and current_player.charlie_stage_2_spin_count==1 and current_player.charlie_stage_2_to_hit==0 and current_player.charlie_stage_2_final_shot_lit==0 and current_player.charlie_complete_flag==0}:
    - charlie_stage_2_to_hit
    - charlie_stage_2_shot_hit

  # When TO fires, lower the top ramp again (no other stage 2 shots need it up).
  charlie_stage_2_to_hit:
    - top_ramp_down

  # Spinner #2 — after TO. Active when spin_count==1 and to_hit==1
  spinner_shot_made{current_player.charlie_stage==2 and current_player.charlie_stage_2_spin_count==1 and current_player.charlie_stage_2_to_hit==1 and current_player.charlie_stage_2_final_shot_lit==0 and current_player.charlie_complete_flag==0}:
    - charlie_stage_2_sp2_hit
    - charlie_stage_2_shot_hit

  # RO (final/4th shot) — only hittable once spin_count==2 (all 3 non-finals done).
  # Use raw s_orbit_right_active because diverter sends ball to left lane,
  # so the right_orbit_shot_hit composite (which needs s_orbit_left after) won't fire.
  s_orbit_right_active{current_player.charlie_stage==2 and current_player.charlie_stage_2_final_shot_lit==1 and current_player.charlie_stage_2_ro_hit==0 and current_player.charlie_complete_flag==0}:
    - charlie_stage_2_ro_triggered

  charlie_stage_2_ro_triggered:
    - left_orbit_diverter_open
    - charlie_diverter_assist_trigger                   # starts 3s safety close timer

  ##############################################
  ## STAGE 2 SHOT-NUMBER ROUTING
  ##############################################
  charlie_stage_2_shot_hit{current_player.charlie_stage_2_shots_made==0}:
    - charlie_stage_2_shot_1
  charlie_stage_2_shot_hit{current_player.charlie_stage_2_shots_made==1}:
    - charlie_stage_2_shot_2
  charlie_stage_2_shot_hit{current_player.charlie_stage_2_shots_made==2}:
    - charlie_stage_2_shot_3

  ##############################################
  ## STAGE 2 SHOT FEEDBACK
  ## After shot 3 (spinner #2), light final RO shot.
  ##############################################
  charlie_stage_2_shot_1:
    - shaker_soft
    - charlie_show_points
  charlie_stage_2_shot_2:
    - shaker_soft
    - charlie_show_points
  charlie_stage_2_shot_3:
    - shaker_soft
    - charlie_show_points
    - charlie_stage_2_final_shot_setup|200ms

  # Stage 2 final shot setup — fires after SP2 hit. Right ramp goes UP now so
  # the player can shoot RO. (Other config players handle: variable_player sets
  # final_shot_lit=1; show_player starts charlie_rr_flash on l_shot_right_orbit.)
  charlie_stage_2_final_shot_setup:
    - right_ramp_up

  ##############################################
  ## STAGE 2 RO BALL CAPTURE
  ## Diverter sent ball to left lane → s_lane_left fires.
  ## Capture ball at left lane post, fire shot_4 + final_shot_hit, close diverter.
  ##############################################
  s_lane_left_active{current_player.charlie_stage==2 and current_player.charlie_stage_2_final_shot_lit==1 and current_player.charlie_stage_2_ro_hit==0 and current_player.charlie_complete_flag==0}:
    - charlie_stage_2_ro_captured

  charlie_stage_2_ro_captured:
    - charlie_stage_2_left_lane_post_enable
    - left_orbit_diverter_closed                        # ball captured, close diverter
    - right_ramp_down                                   # lower right ramp now that capture done
    - charlie_stage_2_shot_4                            # 4th shot scored
    - charlie_stage_2_final_shot_hit

  # charlie_stage_2_left_lane_post_enable is consumed by coil_player (enables c_left_lane_up_post)

  # Safety: diverter 3s timer expired without capture — close it anyway
  timer_hard_deck_charlie_diverter_assist_complete:
    - left_orbit_diverter_closed

  charlie_stage_2_final_shot_hit:
    - shaker_soft
    - charlie_show_points

  ##############################################
  ## STAGE 2 DECISION
  ##############################################
  s_flipper_left_active{device.timers.hard_deck_charlie_stage_2_decision_timer.running and current_player.charlie_stage==2}:
    - charlie_stage_2_continue
  s_flipper_right_active{device.timers.hard_deck_charlie_stage_2_decision_timer.running and current_player.charlie_stage==2}:
    - charlie_stage_2_exit
  timer_hard_deck_charlie_stage_2_decision_timer_complete{current_player.charlie_stage==2}:
    - charlie_stage_2_continue

  # CONTINUE → Stage 3 — drop left lane post, transition
  charlie_stage_2_continue:
    - charlie_stage_2_continue_release

  charlie_stage_2_continue_release:
    - charlie_stage_2_left_lane_post_drop               # coil disable
    - hard_deck_charlie_stage_3_ball_released|400ms     # resumes mode timer
    - charlie_enter_stage_3|400ms
    - charlie_stage_3_setup|400ms

  # EXIT — drop post, end mode
  charlie_stage_2_exit:
    - charlie_stage_2_left_lane_post_drop
    - hard_deck_charlie_decision_ball_release|400ms
    - hard_deck_charlie_cleanup|400ms
    - hard_deck_charlie_mode_end_complete|800ms

  # charlie_stage_2_left_lane_post_drop is consumed by coil_player (disables c_left_lane_up_post)

  ##############################################
  ## STAGE 3 SETUP
  ## Right ramp stays DOWN at setup — it goes UP only when RO arms
  ## (charlie_stage_3_final_shot_setup, after 3rd non-final shot hit).
  ## Barrier stays UP (s_barrier_target needs it).
  ## Light all 6 iceman target inserts + barrier insert pink.
  ## RO does NOT light yet — waits for the 3 non-finals.
  ## (charlie_stage_3_setup intentionally has no event_player actions.)
  ##############################################

  ##############################################
  ## STAGE 3 SHOT DETECTION
  ## 3 any-order non-finals: ICE group, MAN group, Barrier target.
  ## Each I/C/E hit → ice_hit; each M/A/N hit → man_hit. Light handler turns
  ## off ALL 3 lights in the group when its flag flips.
  ## CRITICAL: We do NOT touch iceman_letter_i/c/e/m/a/n — letter_collection_paused
  ## prevents iceman_letters from firing, so progress is preserved.
  ##############################################
  # ICE group — any of I/C/E
  s_i_iceman_target_active{current_player.charlie_stage==3 and current_player.charlie_stage_3_ice_hit==0 and current_player.charlie_stage_3_final_shot_lit==0 and current_player.charlie_complete_flag==0}:
    - charlie_stage_3_ice_hit
    - charlie_stage_3_shot_hit
  s_c_iceman_target_active{current_player.charlie_stage==3 and current_player.charlie_stage_3_ice_hit==0 and current_player.charlie_stage_3_final_shot_lit==0 and current_player.charlie_complete_flag==0}:
    - charlie_stage_3_ice_hit
    - charlie_stage_3_shot_hit
  s_e_iceman_target_active{current_player.charlie_stage==3 and current_player.charlie_stage_3_ice_hit==0 and current_player.charlie_stage_3_final_shot_lit==0 and current_player.charlie_complete_flag==0}:
    - charlie_stage_3_ice_hit
    - charlie_stage_3_shot_hit

  # MAN group — any of M/A/N
  s_m_iceman_target_active{current_player.charlie_stage==3 and current_player.charlie_stage_3_man_hit==0 and current_player.charlie_stage_3_final_shot_lit==0 and current_player.charlie_complete_flag==0}:
    - charlie_stage_3_man_hit
    - charlie_stage_3_shot_hit
  s_a_iceman_target_active{current_player.charlie_stage==3 and current_player.charlie_stage_3_man_hit==0 and current_player.charlie_stage_3_final_shot_lit==0 and current_player.charlie_complete_flag==0}:
    - charlie_stage_3_man_hit
    - charlie_stage_3_shot_hit
  s_n_iceman_target_active{current_player.charlie_stage==3 and current_player.charlie_stage_3_man_hit==0 and current_player.charlie_stage_3_final_shot_lit==0 and current_player.charlie_complete_flag==0}:
    - charlie_stage_3_man_hit
    - charlie_stage_3_shot_hit

  # Barrier target (s_barrier_target, barrier UP)
  s_barrier_target_active{current_player.charlie_stage==3 and current_player.charlie_stage_3_barrier_hit==0 and current_player.charlie_stage_3_final_shot_lit==0 and current_player.charlie_complete_flag==0}:
    - charlie_stage_3_barrier_hit
    - charlie_stage_3_shot_hit

  ##############################################
  ## STAGE 3 SHOT-NUMBER ROUTING
  ##############################################
  charlie_stage_3_shot_hit{current_player.charlie_stage_3_shots_made==0}:
    - charlie_stage_3_shot_1
  charlie_stage_3_shot_hit{current_player.charlie_stage_3_shots_made==1}:
    - charlie_stage_3_shot_2
  charlie_stage_3_shot_hit{current_player.charlie_stage_3_shots_made==2}:
    - charlie_stage_3_shot_3

  ##############################################
  ## STAGE 3 SHOT FEEDBACK
  ## After shot 3, light RO as final.
  ##############################################
  charlie_stage_3_shot_1:
    - shaker_soft
    - charlie_show_points
  charlie_stage_3_shot_2:
    - shaker_soft
    - charlie_show_points
  charlie_stage_3_shot_3:
    - shaker_soft
    - charlie_show_points
    - charlie_stage_3_final_shot_setup|200ms

  # charlie_stage_3_final_shot_setup — fires after 3rd non-final shot. Right ramp
  # goes UP now so the player can shoot RO. variable_player + light/show handle
  # the insert flash on the same event.
  charlie_stage_3_final_shot_setup:
    - right_ramp_up

  ##############################################
  ## STAGE 3 RO HIT + BALL CAPTURE (same pattern as stage 2)
  ##############################################
  s_orbit_right_active{current_player.charlie_stage==3 and current_player.charlie_stage_3_final_shot_lit==1 and current_player.charlie_stage_3_ro_hit==0 and current_player.charlie_complete_flag==0}:
    - charlie_stage_3_ro_triggered

  charlie_stage_3_ro_triggered:
    - left_orbit_diverter_open
    - charlie_diverter_assist_trigger

  s_lane_left_active{current_player.charlie_stage==3 and current_player.charlie_stage_3_final_shot_lit==1 and current_player.charlie_stage_3_ro_hit==0 and current_player.charlie_complete_flag==0}:
    - charlie_stage_3_ro_captured

  charlie_stage_3_ro_captured:
    - charlie_stage_3_left_lane_post_enable
    - left_orbit_diverter_closed
    - right_ramp_down
    - charlie_stage_3_shot_4
    - charlie_stage_3_final_shot_hit

  # charlie_stage_3_left_lane_post_enable is consumed by coil_player (enables c_left_lane_up_post)

  charlie_stage_3_final_shot_hit:
    - shaker_soft
    - charlie_show_points

  # Stage 3 win perk — routed via event_player conditionals to two distinct
  # events. This avoids the race where two conditional variable_player
  # handlers (==0 and ==1) both fire in the same event tick because the
  # ==0 handler changes the variable before the ==1 handler evaluates.
  # Event_player conditional posting is evaluated once at fire time, so
  # only one of these matches and only one downstream event is posted.
  charlie_stage_3_final_shot_hit{current_player.eject_mode_qualified==0}:
    - charlie_stage_3_qualify_eject_seat
  charlie_stage_3_final_shot_hit{current_player.eject_mode_qualified==1}:
    - charlie_stage_3_award_eject_bonus

  # Qualify path — post eject_mode_qualified_event so goose_letters plays
  # the ejection_seat_active HUD slide. goose_letters' qualified-video slide
  # play has a `mode.hard_deck_charlie.active==False` guard, so the video
  # is suppressed while charlie is running — only the active HUD plays.
  # variable_player on this event resets goose_last_letter_collected to 0
  # so goose_letters' !=1 branch fires (which actually plays the slides).
  charlie_stage_3_qualify_eject_seat:
    - eject_mode_qualified_event

  # Award path — variable_player adds the 5M bonus.
  # (No event_player actions needed here.)

  ##############################################
  ## STAGE 3 DECISION
  ##############################################
  s_flipper_left_active{device.timers.hard_deck_charlie_stage_3_decision_timer.running and current_player.charlie_stage==3}:
    - charlie_stage_3_continue
  s_flipper_right_active{device.timers.hard_deck_charlie_stage_3_decision_timer.running and current_player.charlie_stage==3}:
    - charlie_stage_3_exit
  timer_hard_deck_charlie_stage_3_decision_timer_complete{current_player.charlie_stage==3}:
    - charlie_stage_3_continue

  # CONTINUE → Stage 4
  charlie_stage_3_continue:
    - charlie_stage_3_continue_release

  charlie_stage_3_continue_release:
    - charlie_stage_3_left_lane_post_drop
    - hard_deck_charlie_stage_4_ball_released|400ms
    - charlie_enter_stage_4|400ms
    - charlie_stage_4_setup|400ms

  # EXIT — drop post, end mode
  charlie_stage_3_exit:
    - charlie_stage_3_left_lane_post_drop
    - hard_deck_charlie_decision_ball_release|400ms
    - hard_deck_charlie_cleanup|400ms
    - hard_deck_charlie_mode_end_complete|800ms

  # charlie_stage_3_left_lane_post_drop is consumed by coil_player (disables c_left_lane_up_post)

  ##############################################
  ## STAGE 4 SETUP
  ## Right ramp DOWN (so s_ramp_right_exit fires for RR shot).
  ## Top ramp UP (so s_orbit_lower fires for TO shot).
  ## Stagger ramp moves to avoid servo power contention.
  ## Barrier stays UP throughout non-final shots.
  ##############################################
  charlie_stage_4_setup:
    - right_ramp_down
    - charlie_stage_4_setup_servo_2|500ms

  charlie_stage_4_setup_servo_2:
    - top_ramp_up

  ##############################################
  ## STAGE 4 SHOT DETECTION
  ## 4 any-order non-finals: TO, TWR, RR, LR.
  ## Then scoop (s_mode_start) as final.
  ##############################################
  # TO — s_orbit_lower (top ramp UP)
  s_orbit_lower_active{current_player.charlie_stage==4 and current_player.charlie_stage_4_to_hit==0 and current_player.charlie_stage_4_final_shot_lit==0 and current_player.charlie_complete_flag==0}:
    - charlie_stage_4_to_hit
    - charlie_stage_4_shot_hit

  s_ramp_tower_exit_active{current_player.charlie_stage==4 and current_player.charlie_stage_4_twr_hit==0 and current_player.charlie_stage_4_final_shot_lit==0 and current_player.charlie_complete_flag==0}:
    - charlie_stage_4_twr_hit
    - charlie_stage_4_shot_hit

  s_ramp_right_exit_active{current_player.charlie_stage==4 and current_player.charlie_stage_4_rr_hit==0 and current_player.charlie_stage_4_final_shot_lit==0 and current_player.charlie_complete_flag==0}:
    - charlie_stage_4_rr_hit
    - charlie_stage_4_shot_hit

  s_ramp_left_exit_active{current_player.charlie_stage==4 and current_player.charlie_stage_4_lr_hit==0 and current_player.charlie_stage_4_final_shot_lit==0 and current_player.charlie_complete_flag==0}:
    - charlie_stage_4_lr_hit
    - charlie_stage_4_shot_hit

  ##############################################
  ## STAGE 4 SHOT-NUMBER ROUTING
  ##############################################
  charlie_stage_4_shot_hit{current_player.charlie_stage_4_shots_made==0}:
    - charlie_stage_4_shot_1
  charlie_stage_4_shot_hit{current_player.charlie_stage_4_shots_made==1}:
    - charlie_stage_4_shot_2
  charlie_stage_4_shot_hit{current_player.charlie_stage_4_shots_made==2}:
    - charlie_stage_4_shot_3
  charlie_stage_4_shot_hit{current_player.charlie_stage_4_shots_made==3}:
    - charlie_stage_4_shot_4

  ##############################################
  ## STAGE 4 SHOT FEEDBACK
  ## 4th shot fires final_shot_setup (drops barrier, lights scoop insert).
  ##############################################
  charlie_stage_4_shot_1:
    - shaker_soft
    - charlie_show_points
  charlie_stage_4_shot_2:
    - shaker_soft
    - charlie_show_points
  charlie_stage_4_shot_3:
    - shaker_soft
    - charlie_show_points
  charlie_stage_4_shot_4:
    - shaker_soft
    - charlie_show_points
    - charlie_stage_4_final_shot_setup|200ms

  ##############################################
  ## STAGE 4 FINAL SHOT SETUP - Drop barrier, light barrier insert.
  ## Top ramp STAYS UP until ball is held in scoop.
  ##############################################
  charlie_stage_4_final_shot_setup:
    - barrier_drop

  ##############################################
  ## STAGE 4 FINAL SHOT (SCOOP) HIT
  ## Re-enable ball_holds capture, fire final_shot_hit.
  ## Top ramp lowers AFTER ball captured.
  ## No decision — won video plays for stage_4_won_delay (6s), then ball auto-releases.
  ##############################################
  s_mode_start_active{current_player.charlie_stage==4 and current_player.charlie_stage_4_final_shot_lit==1 and current_player.charlie_complete_flag==0}:
    - charlie_stage_4_final_shot_setup_hold
    - charlie_stage_4_final_shot_hit

  charlie_stage_4_final_shot_hit:
    - shaker_soft
    - barrier_raise
    - top_ramp_down                                     # ball held; safe to lower now
    - charlie_show_points
    # NOTE: light_extra_ball NOT posted here. Posting that event makes
    # goose_letters play the extra_ball_lit_video slide on top of the
    # charlie stage 4 won video. extra_ball_lit is set directly via
    # variable_player on this event — the EB is still collectable at
    # left lane and the orange light comes on at the next ball start.

  # After 6s won delay → drop barrier, release ball, end mode.
  # scoop_ball_release pattern: barrier coil needs 400ms to physically lower
  # before the ball is ejected from the hold.
  # No explicit barrier_raise here — mode_hard_deck_charlie_stopped raises
  # the barrier when qualified_mode_number==0, and the qualifier's own
  # coil_player drops it (re-enable c_mode_barrier) when a pilot mission
  # is queued so the player can shoot the scoop to start that mission.
  timer_hard_deck_charlie_stage_4_won_delay_complete:
    - scoop_ball_release                                # drops barrier + sets scoop_release_pending
    - hard_deck_charlie_stage_4_ball_release|400ms      # ball_holds releases the ball
    - hard_deck_charlie_cleanup|400ms                   # right/top ramp down, diverter close
    - hard_deck_charlie_mode_end_complete|800ms

  ##############################################
  ## DRAIN / TIMER EXPIRE → FAILED PATH (per stage)
  ##############################################
  hard_deck_charlie_ball_ending_hold:
    - hard_deck_charlie_failed

  timer_hard_deck_charlie_timer_complete{current_player.charlie_complete_flag==0}:
    - hard_deck_charlie_failed

  # Route to stage-specific failure handler
  hard_deck_charlie_failed{current_player.charlie_stage==1}:
    - hard_deck_charlie_failed_stage_1
  hard_deck_charlie_failed{current_player.charlie_stage==2}:
    - hard_deck_charlie_failed_stage_2
  hard_deck_charlie_failed{current_player.charlie_stage==3}:
    - hard_deck_charlie_failed_stage_3
  hard_deck_charlie_failed{current_player.charlie_stage==4}:
    - hard_deck_charlie_failed_stage_4

  hard_deck_charlie_failed_stage_1:
    - barrier_raise
    - timer_hard_deck_charlie_stage_1_failed_delay_start
    - hard_deck_charlie_cleanup

  hard_deck_charlie_failed_stage_2:
    - barrier_raise
    - timer_hard_deck_charlie_stage_2_failed_delay_start
    - hard_deck_charlie_cleanup

  hard_deck_charlie_failed_stage_3:
    - barrier_raise
    - timer_hard_deck_charlie_stage_3_failed_delay_start
    - hard_deck_charlie_cleanup

  hard_deck_charlie_failed_stage_4:
    - barrier_raise
    - timer_hard_deck_charlie_stage_4_failed_delay_start
    - hard_deck_charlie_cleanup

  # Each stage's lost-video timer complete → release queue_relay → mode stops
  timer_hard_deck_charlie_stage_1_failed_delay_complete:
    - hard_deck_charlie_drain_cleanup_complete
  timer_hard_deck_charlie_stage_2_failed_delay_complete:
    - hard_deck_charlie_drain_cleanup_complete
  timer_hard_deck_charlie_stage_3_failed_delay_complete:
    - hard_deck_charlie_drain_cleanup_complete
  timer_hard_deck_charlie_stage_4_failed_delay_complete:
    - hard_deck_charlie_drain_cleanup_complete

  ##############################################
  ## CLEANUP - Servos + diverter to safe positions
  ## Staggered ramp moves to prevent power contention.
  ## c_left_lane_up_post disabled in coil_player on mode_will_stop.
  ##############################################
  hard_deck_charlie_cleanup:
    - right_ramp_down
    - left_orbit_diverter_closed
    - hard_deck_charlie_cleanup_servo_2|400ms

  hard_deck_charlie_cleanup_servo_2:
    - top_ramp_down

  ##############################################
  ## MODE STOP SAFETY - Raise barrier on exit (unless pilot mission queued).
  ## If pilot is queued, pilot_mission_qualifier drops the barrier for them.
  ## Conditions are mutually exclusive so no race with the qualifier.
  ##############################################
  mode_hard_deck_charlie_stopped{current_player.qualified_mode_number==0}:
    - barrier_raise

####################################################################################
# COIL PLAYER - Left lane post management
# Enabled during intro to catch ball at left lane.
# Disabled when ball released to play stage 1.
# Re-enabled for stage 2/3 RO captures (charlie_stage_X_left_lane_post_enable).
# Disabled on stage 2/3 decision continue/exit (charlie_stage_X_left_lane_post_drop).
# Safety-disabled on mode_will_stop.
####################################################################################
coil_player:
  ##############################################
  ## INTRO PHASE - hold ball at left lane
  ##############################################
  mode_hard_deck_charlie_started:
    c_left_lane_up_post:
      action: enable

  hard_deck_charlie_ball_released:
    c_left_lane_up_post:
      action: disable

  ##############################################
  ## STAGE 2 / STAGE 3 - RO capture re-uses the post
  ##############################################
  charlie_stage_2_left_lane_post_enable:
    c_left_lane_up_post:
      action: enable
  charlie_stage_3_left_lane_post_enable:
    c_left_lane_up_post:
      action: enable

  # Decision continue OR exit drops the post
  charlie_stage_2_left_lane_post_drop:
    c_left_lane_up_post:
      action: disable
  charlie_stage_3_left_lane_post_drop:
    c_left_lane_up_post:
      action: disable

  ##############################################
  ## SAFETY - Release post if mode stops abnormally
  ##############################################
  mode_hard_deck_charlie_will_stop:
    c_left_lane_up_post:
      action: disable

####################################################################################
# SLIDE PLAYER
# Priority layering:
#   800 = background (persistent throughout stage)
#   850 = shots_remaining overlay
#   870 = step slides (cycle through as shots are hit)
#   900 = won / lost (over gameplay layers)
#   1000 = intro + timer overlay
####################################################################################
slide_player:
  ##############################################
  ## INTRO
  ##############################################
  mode_hard_deck_charlie_started:
    hard_deck_charlie_intro:
      action: play
      priority: 1000

  hard_deck_charlie_skip_intro:
    hard_deck_charlie_intro:
      action: remove

  ##############################################
  ## STAGE 1 LAYERS (play on ball release after intro)
  ##############################################
  hard_deck_charlie_ball_released:
    hard_deck_charlie_intro:
      action: remove
    hard_deck_charlie_background:
      action: play
      priority: 800
    hard_deck_charlie_shots_remaining:
      action: play
      priority: 850
    hard_deck_charlie_timer:
      action: play
      priority: 1000

  ##############################################
  ## BACKGROUND VIDEO LOOP (fallback path)
  ## MPFVideoPlayer in GMC has no native loop option. Option A (Godot-side):
  ## set End Behavior = Custom Method and End Method = play, which auto-restarts
  ## the inner VideoStreamPlayer when the video ends. If that doesn't work,
  ## use this fallback: in the MPFVideoPlayer's "Events When Stopped" field,
  ## add `charlie_background_video_ended`. This handler then re-plays the slide
  ## every time the video ends — creates a continuous loop for the whole mode.
  ## (Harmless if Option A works — the event simply won't fire.)
  ##############################################
  charlie_background_video_ended:
    hard_deck_charlie_background:
      action: play
      priority: 800

  ##############################################
  ## STAGE 1 STEP SLIDES
  ##############################################
  charlie_stage_1_shot_1:
    hard_deck_charlie_stage_1_step_1:
      action: play
      priority: 870
  charlie_stage_1_shot_2:
    hard_deck_charlie_stage_1_step_1:
      action: remove
    hard_deck_charlie_stage_1_step_2:
      action: play
      priority: 870
  charlie_stage_1_shot_3:
    hard_deck_charlie_stage_1_step_2:
      action: remove
    hard_deck_charlie_stage_1_step_3:
      action: play
      priority: 870
  charlie_stage_1_shot_4:
    hard_deck_charlie_stage_1_step_3:
      action: remove
    hard_deck_charlie_stage_1_step_4:
      action: play
      priority: 870

  ##############################################
  ## STAGE 1 WON - 10s
  ##############################################
  charlie_stage_1_final_shot_hit:
    hard_deck_charlie_stage_1_step_4:
      action: remove
    hard_deck_charlie_stage_1_won:
      action: play
      priority: 900
      expire: 10s

  # Continue/exit removes the won slide
  charlie_stage_1_continue:
    hard_deck_charlie_stage_1_won:
      action: remove
  charlie_stage_1_exit:
    hard_deck_charlie_stage_1_won:
      action: remove

  ##############################################
  ## STAGE 1 LOST - 7s
  ##############################################
  hard_deck_charlie_failed_stage_1:
    hard_deck_charlie_stage_1_step_1:
      action: remove
    hard_deck_charlie_stage_1_step_2:
      action: remove
    hard_deck_charlie_stage_1_step_3:
      action: remove
    hard_deck_charlie_stage_1_step_4:
      action: remove
    hard_deck_charlie_stage_1_lost:
      action: play
      priority: 900
      expire: 7s

  ##############################################
  ## STAGE 2 STEP SLIDES
  ## Shot order: SP1 → step_1, LO → step_2, SP2 → step_3, RO captured → step_4
  ##############################################
  charlie_stage_2_shot_1:
    hard_deck_charlie_stage_2_step_1:
      action: play
      priority: 870
  charlie_stage_2_shot_2:
    hard_deck_charlie_stage_2_step_1:
      action: remove
    hard_deck_charlie_stage_2_step_2:
      action: play
      priority: 870
  charlie_stage_2_shot_3:
    hard_deck_charlie_stage_2_step_2:
      action: remove
    hard_deck_charlie_stage_2_step_3:
      action: play
      priority: 870
  charlie_stage_2_shot_4:
    hard_deck_charlie_stage_2_step_3:
      action: remove
    hard_deck_charlie_stage_2_step_4:
      action: play
      priority: 870

  ##############################################
  ## STAGE 2 WON - 6s
  ##############################################
  charlie_stage_2_final_shot_hit:
    hard_deck_charlie_stage_2_step_4:
      action: remove
    hard_deck_charlie_stage_2_won:
      action: play
      priority: 900
      expire: 6s

  charlie_stage_2_continue:
    hard_deck_charlie_stage_2_won:
      action: remove
  charlie_stage_2_exit:
    hard_deck_charlie_stage_2_won:
      action: remove

  ##############################################
  ## STAGE 2 LOST - 5s
  ##############################################
  hard_deck_charlie_failed_stage_2:
    hard_deck_charlie_stage_2_step_1:
      action: remove
    hard_deck_charlie_stage_2_step_2:
      action: remove
    hard_deck_charlie_stage_2_step_3:
      action: remove
    hard_deck_charlie_stage_2_step_4:
      action: remove
    hard_deck_charlie_stage_2_lost:
      action: play
      priority: 900
      expire: 5s

  ##############################################
  ## STAGE 3 STEP SLIDES (only 3 — no step_4 since RO capture goes straight to won)
  ##############################################
  charlie_stage_3_shot_1:
    hard_deck_charlie_stage_3_step_1:
      action: play
      priority: 870
  charlie_stage_3_shot_2:
    hard_deck_charlie_stage_3_step_1:
      action: remove
    hard_deck_charlie_stage_3_step_2:
      action: play
      priority: 870
  charlie_stage_3_shot_3:
    hard_deck_charlie_stage_3_step_2:
      action: remove
    hard_deck_charlie_stage_3_step_3:
      action: play
      priority: 870

  ##############################################
  ## STAGE 3 WON - 5s
  ##############################################
  charlie_stage_3_final_shot_hit:
    hard_deck_charlie_stage_3_step_3:
      action: remove
    hard_deck_charlie_stage_3_won:
      action: play
      priority: 900
      expire: 5s

  charlie_stage_3_continue:
    hard_deck_charlie_stage_3_won:
      action: remove
  charlie_stage_3_exit:
    hard_deck_charlie_stage_3_won:
      action: remove

  ##############################################
  ## STAGE 3 LOST - 5s
  ##############################################
  hard_deck_charlie_failed_stage_3:
    hard_deck_charlie_stage_3_step_1:
      action: remove
    hard_deck_charlie_stage_3_step_2:
      action: remove
    hard_deck_charlie_stage_3_step_3:
      action: remove
    hard_deck_charlie_stage_3_lost:
      action: play
      priority: 900
      expire: 5s

  ##############################################
  ## STAGE 4 STEP SLIDES (only 3 — shot 4 has no step slide, goes to scoop arm + won)
  ##############################################
  charlie_stage_4_shot_1:
    hard_deck_charlie_stage_4_step_1:
      action: play
      priority: 870
  charlie_stage_4_shot_2:
    hard_deck_charlie_stage_4_step_1:
      action: remove
    hard_deck_charlie_stage_4_step_2:
      action: play
      priority: 870
  charlie_stage_4_shot_3:
    hard_deck_charlie_stage_4_step_2:
      action: remove
    hard_deck_charlie_stage_4_step_3:
      action: play
      priority: 870

  ##############################################
  ## STAGE 4 WON - 6s (then ball auto-releases — no decision)
  ##############################################
  charlie_stage_4_final_shot_hit:
    hard_deck_charlie_stage_4_step_3:
      action: remove
    hard_deck_charlie_stage_4_won:
      action: play
      priority: 900
      expire: 6s

  ##############################################
  ## STAGE 4 LOST - 9s
  ##############################################
  hard_deck_charlie_failed_stage_4:
    hard_deck_charlie_stage_4_step_1:
      action: remove
    hard_deck_charlie_stage_4_step_2:
      action: remove
    hard_deck_charlie_stage_4_step_3:
      action: remove
    hard_deck_charlie_stage_4_lost:
      action: play
      priority: 900
      expire: 11s

  ##############################################
  ## SAFETY CLEANUP on mode stop - Remove all charlie slides
  ##############################################
  mode_hard_deck_charlie_stopped:
    hard_deck_charlie_intro:
      action: remove
    hard_deck_charlie_background:
      action: remove
    hard_deck_charlie_shots_remaining:
      action: remove
    hard_deck_charlie_timer:
      action: remove
    hard_deck_charlie_stage_1_step_1:
      action: remove
    hard_deck_charlie_stage_1_step_2:
      action: remove
    hard_deck_charlie_stage_1_step_3:
      action: remove
    hard_deck_charlie_stage_1_step_4:
      action: remove
    hard_deck_charlie_stage_2_step_1:
      action: remove
    hard_deck_charlie_stage_2_step_2:
      action: remove
    hard_deck_charlie_stage_2_step_3:
      action: remove
    hard_deck_charlie_stage_2_step_4:
      action: remove
    hard_deck_charlie_stage_3_step_1:
      action: remove
    hard_deck_charlie_stage_3_step_2:
      action: remove
    hard_deck_charlie_stage_3_step_3:
      action: remove
    hard_deck_charlie_stage_4_step_1:
      action: remove
    hard_deck_charlie_stage_4_step_2:
      action: remove
    hard_deck_charlie_stage_4_step_3:
      action: remove

