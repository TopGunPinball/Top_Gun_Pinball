####################################################################################
# SHOW PLAYER - Pink flash on each lit shot insert
# (1000ms cycle for non-final, faster 500ms for barrier when it lights)
####################################################################################
show_player:
  charlie_stage_1_setup:
    charlie_lo_flash:
      show: sync_flash_mode
      key: charlie_l_shot_left_orbit
      sync_ms: 1000
      loops: -1
      show_tokens:
        led: l_shot_left_orbit
        color: FF69B4
    charlie_lr_flash:
      show: sync_flash_mode
      key: charlie_l_shot_left_ramp
      sync_ms: 1000
      loops: -1
      show_tokens:
        led: l_shot_left_ramp
        color: FF69B4
    charlie_twr_flash:
      show: sync_flash_mode
      key: charlie_l_shot_tower_ramp
      sync_ms: 1000
      loops: -1
      show_tokens:
        led: l_shot_tower_ramp
        color: FF69B4
    charlie_rr_flash:
      show: sync_flash_mode
      key: charlie_l_shot_right_orbit
      sync_ms: 1000
      loops: -1
      show_tokens:
        led: l_shot_right_orbit
        color: FF69B4

  charlie_stage_1_lo_hit:
    charlie_lo_flash:
      action: stop
      key: charlie_l_shot_left_orbit
  charlie_stage_1_lr_hit:
    charlie_lr_flash:
      action: stop
      key: charlie_l_shot_left_ramp
  charlie_stage_1_twr_hit:
    charlie_twr_flash:
      action: stop
      key: charlie_l_shot_tower_ramp
  charlie_stage_1_rr_hit:
    charlie_rr_flash:
      action: stop
      key: charlie_l_shot_right_orbit

  ##############################################
  ## BARRIER FLASH - Faster cycle when lit
  ##############################################
  charlie_stage_1_final_shot_setup:
    charlie_barrier_flash:
      show: sync_flash_mode
      key: charlie_l_shot_barrier
      sync_ms: 500
      loops: -1
      show_tokens:
        led: l_shot_barrier
        color: FF69B4

  charlie_stage_1_final_shot_hit:
    charlie_barrier_flash:
      action: stop
      key: charlie_l_shot_barrier

  ##############################################
  ## CLEANUP - Stop all flashes
  ##############################################
  hard_deck_charlie_cleanup:
    charlie_lo_flash:
      action: stop
      key: charlie_l_shot_left_orbit
    charlie_lr_flash:
      action: stop
      key: charlie_l_shot_left_ramp
    charlie_twr_flash:
      action: stop
      key: charlie_l_shot_tower_ramp
    charlie_rr_flash:
      action: stop
      key: charlie_l_shot_right_orbit
    charlie_barrier_flash:
      action: stop
      key: charlie_l_shot_barrier

  mode_hard_deck_charlie_stopped:
    charlie_lo_flash:
      action: stop
      key: charlie_l_shot_left_orbit
    charlie_lr_flash:
      action: stop
      key: charlie_l_shot_left_ramp
    charlie_twr_flash:
      action: stop
      key: charlie_l_shot_tower_ramp
    charlie_rr_flash:
      action: stop
      key: charlie_l_shot_right_orbit
    charlie_barrier_flash:
      action: stop
      key: charlie_l_shot_barrier