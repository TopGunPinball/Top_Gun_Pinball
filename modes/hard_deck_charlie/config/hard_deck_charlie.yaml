####################################################################################
# SHOW PLAYER - Pink flashes on lit shot inserts using sync_flash_mode.
# Pattern matches stage 1 (existing): one show-name + LED-based key per LED.
# Show names and keys are reused across stages because each LED can only have
# one active flash at a time. Stop+start on the same key safely overwrites.
#
# Sync timing: 1000ms for non-final shots, 500ms for the live final shot.
####################################################################################
show_player:
  ##############################################
  ## STAGE 1 - 4 non-final shots all lit at setup, barrier final on shot_setup
  ##############################################
  charlie_stage_1_setup:
    charlie_lo_flash:
      show: sync_flash_mode
      key: charlie_l_shot_left_orbit
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_left_orbit, color: FF69B4 }
    charlie_lr_flash:
      show: sync_flash_mode
      key: charlie_l_shot_left_ramp
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_left_ramp, color: FF69B4 }
    charlie_twr_flash:
      show: sync_flash_mode
      key: charlie_l_shot_tower_ramp
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_tower_ramp, color: FF69B4 }
    charlie_rr_flash:
      show: sync_flash_mode
      key: charlie_l_shot_right_orbit
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_right_orbit, color: FF69B4 }

  charlie_stage_1_lo_hit:
    charlie_lo_flash:
      action: stop
      key: charlie_l_shot_left_orbit
  charlie_stage_1_lr_hit:
    charlie_lr_flash:
      action: stop
      key: charlie_l_shot_left_ramp
  charlie_stage_1_twr_hit:
    charlie_twr_flash:
      action: stop
      key: charlie_l_shot_tower_ramp
  charlie_stage_1_rr_hit:
    charlie_rr_flash:
      action: stop
      key: charlie_l_shot_right_orbit

  charlie_stage_1_final_shot_setup:
    charlie_barrier_flash:
      show: sync_flash_mode
      key: charlie_l_shot_barrier
      sync_ms: 500
      loops: -1
      show_tokens: { led: l_shot_barrier, color: FF69B4 }

  charlie_stage_1_final_shot_hit:
    charlie_barrier_flash:
      action: stop
      key: charlie_l_shot_barrier

  ##############################################
  ## STAGE 2 - Spinner #1, then LO, then Spinner #2, then RO (ordered)
  ## Each only-lit-shot uses the per-LED show name and key.
  ## Spinner is lit twice (SP1, SP2); same name+key — stop then start is safe.
  ##############################################
  charlie_stage_2_setup:
    charlie_sp_flash:
      show: sync_flash_mode
      key: charlie_l_shot_spinner
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_spinner, color: FF69B4 }

  charlie_stage_2_sp1_hit:
    charlie_sp_flash:
      action: stop
      key: charlie_l_shot_spinner
    charlie_to_flash:
      show: sync_flash_mode
      key: charlie_l_shot_middle_ramp
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_middle_ramp, color: FF69B4 }

  charlie_stage_2_to_hit:
    charlie_to_flash:
      action: stop
      key: charlie_l_shot_middle_ramp
    charlie_sp_flash:
      show: sync_flash_mode
      key: charlie_l_shot_spinner
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_spinner, color: FF69B4 }

  charlie_stage_2_sp2_hit:
    charlie_sp_flash:
      action: stop
      key: charlie_l_shot_spinner

  # Final RO armed — same LED as stage 1's RR; faster sync_ms signals "live final"
  charlie_stage_2_final_shot_setup:
    charlie_rr_flash:
      show: sync_flash_mode
      key: charlie_l_shot_right_orbit
      sync_ms: 500
      loops: -1
      show_tokens: { led: l_shot_right_orbit, color: FF69B4 }

  charlie_stage_2_final_shot_hit:
    charlie_rr_flash:
      action: stop
      key: charlie_l_shot_right_orbit

  ##############################################
  ## STAGE 3 - 3 any-order non-finals lit at setup
  ## (6 iceman targets in 2 groups + barrier target), then RO as final.
  ##############################################
  charlie_stage_3_setup:
    # ICE group
    charlie_ice_i_flash:
      show: sync_flash_mode
      key: charlie_l_iceman_i
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_iceman_i, color: FF69B4 }
    charlie_ice_c_flash:
      show: sync_flash_mode
      key: charlie_l_iceman_c
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_iceman_c, color: FF69B4 }
    charlie_ice_e_flash:
      show: sync_flash_mode
      key: charlie_l_iceman_e
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_iceman_e, color: FF69B4 }
    # MAN group
    charlie_man_m_flash:
      show: sync_flash_mode
      key: charlie_l_iceman_m
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_iceman_m, color: FF69B4 }
    charlie_man_a_flash:
      show: sync_flash_mode
      key: charlie_l_iceman_a
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_iceman_a, color: FF69B4 }
    charlie_man_n_flash:
      show: sync_flash_mode
      key: charlie_l_iceman_n
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_iceman_n, color: FF69B4 }
    # Barrier target
    charlie_barrier_flash:
      show: sync_flash_mode
      key: charlie_l_shot_barrier
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_barrier, color: FF69B4 }

  # ICE group hit → stop all 3 ICE flashes
  charlie_stage_3_ice_hit:
    charlie_ice_i_flash:
      action: stop
      key: charlie_l_iceman_i
    charlie_ice_c_flash:
      action: stop
      key: charlie_l_iceman_c
    charlie_ice_e_flash:
      action: stop
      key: charlie_l_iceman_e

  # MAN group hit → stop all 3 MAN flashes
  charlie_stage_3_man_hit:
    charlie_man_m_flash:
      action: stop
      key: charlie_l_iceman_m
    charlie_man_a_flash:
      action: stop
      key: charlie_l_iceman_a
    charlie_man_n_flash:
      action: stop
      key: charlie_l_iceman_n

  charlie_stage_3_barrier_hit:
    charlie_barrier_flash:
      action: stop
      key: charlie_l_shot_barrier

  # RO armed (after 3 non-finals) — faster flash
  charlie_stage_3_final_shot_setup:
    charlie_rr_flash:
      show: sync_flash_mode
      key: charlie_l_shot_right_orbit
      sync_ms: 500
      loops: -1
      show_tokens: { led: l_shot_right_orbit, color: FF69B4 }

  charlie_stage_3_final_shot_hit:
    charlie_rr_flash:
      action: stop
      key: charlie_l_shot_right_orbit

  ##############################################
  ## STAGE 4 - 4 any-order non-finals at setup, scoop final on shot_setup
  ## TO uses l_shot_middle_ramp (top ramp UP); RR uses l_shot_right_orbit.
  ##############################################
  charlie_stage_4_setup:
    charlie_to_flash:
      show: sync_flash_mode
      key: charlie_l_shot_middle_ramp
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_middle_ramp, color: FF69B4 }
    charlie_twr_flash:
      show: sync_flash_mode
      key: charlie_l_shot_tower_ramp
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_tower_ramp, color: FF69B4 }
    charlie_rr_flash:
      show: sync_flash_mode
      key: charlie_l_shot_right_orbit
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_right_orbit, color: FF69B4 }
    charlie_lr_flash:
      show: sync_flash_mode
      key: charlie_l_shot_left_ramp
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_left_ramp, color: FF69B4 }

  charlie_stage_4_to_hit:
    charlie_to_flash:
      action: stop
      key: charlie_l_shot_middle_ramp
  charlie_stage_4_twr_hit:
    charlie_twr_flash:
      action: stop
      key: charlie_l_shot_tower_ramp
  charlie_stage_4_rr_hit:
    charlie_rr_flash:
      action: stop
      key: charlie_l_shot_right_orbit
  charlie_stage_4_lr_hit:
    charlie_lr_flash:
      action: stop
      key: charlie_l_shot_left_ramp

  # Final scoop armed (after 4 non-finals) — faster flash on barrier insert
  charlie_stage_4_final_shot_setup:
    charlie_barrier_flash:
      show: sync_flash_mode
      key: charlie_l_shot_barrier
      sync_ms: 500
      loops: -1
      show_tokens: { led: l_shot_barrier, color: FF69B4 }

  charlie_stage_4_final_shot_hit:
    charlie_barrier_flash:
      action: stop
      key: charlie_l_shot_barrier

