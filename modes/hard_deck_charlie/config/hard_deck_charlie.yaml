#config_version=6

####################################################################################
# HARD DECK CHARLIE - HARD DECK MISSION (slot 1)
# Priority: 600
# Hard deck mode 1 (pink FF69B4). Wired into hard_deck_qualifiers.yaml.
#
# === 4-STAGE STRUCTURE ===
# Intro (90s skippable) → Stage 1 → [decision] → Stage 2 → [decision]
#                       → Stage 3 → [decision] → Stage 4 → auto-win/release
#
# === STAGE 1 ===   GI: alternating Dark Blue / White
# 4 non-final any-order: LO, LR, TWR, RR (right ramp DOWN)
# Each insert turns off when hit. Scoring: 350K / 600K / 800K / 1M × multiplier.
# After 4: barrier drops, l_shot_barrier lights pink (500ms flash).
# Final: s_mode_start (5M × multiplier). Won 10s, lost 7s.
# Decision: left/timeout = continue → stage 2; right = exit.
#
# === STAGE 2 ===   GI: yellow
# Right ramp UP. 3 ordered shots, then RO as final:
#   Spinner #1 → LO → Spinner #2 → RO
# Only the currently-lit insert is hittable.
# Scoring: 350K / 500K / 750K / 1M × multiplier.
# RO hit: left_orbit_diverter opens 3s → ball captured at left lane post.
# Right ramp lowers on capture.
# Won 6s, lost 5s. Stage 2 win awards +5 bonus_multiplier.
#
# === STAGE 3 ===   GI: army green
# Right ramp UP. 3 any-order non-final + RO as final:
#   ICE group (any of I/C/E targets — preserves iceman_letter_* progress!)
#   MAN group (any of M/A/N targets)
#   Barrier Target (s_barrier_target, barrier stays UP)
#   → After all 3, RO lights as final (same diverter capture as stage 2).
# Scoring: 350K / 500K / 750K / 1M × multiplier.
# Won 5s, lost 5s. Win qualifies ejection seat OR awards 5M if already qualified.
#
# === STAGE 4 ===   GI: alternating Yellow / Light Blue; pops solid Yellow
# Top ramp UP, right ramp DOWN. 4 any-order non-final, then scoop final:
#   TO  = s_orbit_lower (top ramp UP)
#   TWR = s_ramp_tower_exit
#   RR  = s_ramp_right_exit
#   LR  = s_ramp_left_exit
# Scoring same as stage 1.
# After 4: barrier drops, l_shot_barrier lights. Top ramp STAYS UP.
# Final: s_mode_start → ball captured in scoop, top ramp lowers.
# Won 6s plays, ball auto-released (no decision). Win awards extra ball.
# Lost 9s.
#
# === MODE TIMER ===
# 150s total. Var: charlie_timer_ticks. Pauses during each stage's decision.
# Resumes on each stage's ball_released event.
#
# === SERVO POSITIONS ===
#   Stage 1: right DOWN, top DOWN
#   Stage 2: right UP,   top DOWN
#   Stage 3: right UP,   top DOWN
#   Stage 4: right DOWN, top UP
#
# === MUSIC ===
# hard_deck_charlie music starts on charlie_ball_released, silences on
# stage_4 won/lost only. Handled in base.yaml.
#
# === DRAIN HANDLING ===
# queue_relay_player holds ball_ending until drain_cleanup_complete.
# Per-stage failed_delay: 7 / 5 / 5 / 9 seconds matching lost video duration.
#
# === CLEANUP ===
# hard_deck_charlie_cleanup lowers both ramps (staggered) + closes diverter.
# Fires on any failed_stage_N path, on stage-4 win release, on exit paths.
####################################################################################

mode:
  start_events: start_mode_hard_deck_charlie
  stop_events:
    - hard_deck_charlie_drain_cleanup_complete   # Drain or timer-expire path
    - hard_deck_charlie_mode_end_complete        # Decision exit / final completion
  priority: 600
  game_mode: true
  use_wait_queue: true

mode_settings:
  can_stack_with_multiball: true

####################################################################################
# BALL HOLDS
# Scoop holds:
#   1. After mode_started (intro phase, before barrier drops)
#   2. After stage 1 barrier shot (final shot — decision phase)
#   3. After stage 4 final scoop shot (won phase — no decision, auto-release)
# Released by:
#   - hard_deck_charlie_ball_released         (after intro / skip → stage 1)
#   - hard_deck_charlie_stage_2_ball_released (stage 1 continue → stage 2)
#   - hard_deck_charlie_decision_ball_release (stage 1 exit, mode end)
#   - hard_deck_charlie_stage_4_ball_release  (stage 4 won → auto release after video)
#   - mode_will_stop (safety — release_all)
####################################################################################
ball_holds:
  hard_deck_charlie_scoop_hold:
    balls_to_hold: 1
    hold_devices: bd_mode_scoop
    enable_events:
      - mode_hard_deck_charlie_started
      - charlie_stage_1_final_shot_setup_hold
      - charlie_stage_4_final_shot_setup_hold
    release_one_events:
      - hard_deck_charlie_ball_released
      - hard_deck_charlie_stage_2_ball_released
      - hard_deck_charlie_decision_ball_release
      - hard_deck_charlie_stage_4_ball_release
    release_all_events: mode_hard_deck_charlie_will_stop

####################################################################################
# QUEUE RELAY - Hold bonus until lost video finishes
####################################################################################
queue_relay_player:
  ball_ending{mode.hard_deck_charlie.active==True}:
    post: hard_deck_charlie_ball_ending_hold
    wait_for: hard_deck_charlie_drain_cleanup_complete
    priority: 1000

####################################################################################
# TIMERS
####################################################################################
timers:
  ##############################################
  ## INTRO VIDEO DELAY (90s)
  ## Drives transition into Stage 1 when video finishes (or skipped via both flippers).
  ##############################################
  hard_deck_charlie_intro_video_delay:
    start_value: 0
    end_value: 90
    direction: up
    tick_interval: 1s
    start_running: false
    control_events:
      - event: mode_hard_deck_charlie_started
        action: start
      - event: hard_deck_charlie_skip_intro
        action: stop

  ##############################################
  ## MODE TIMER - 150s total across ALL stages
  ## Pauses on stage_X_final_shot_hit (decision begins).
  ## Resumes on stage_(X+1)_ball_released (player has ball back).
  ## Stops on fail, stage 4 final, or mode end.
  ##############################################
  hard_deck_charlie_timer:
    start_value: 150
    end_value: 0
    direction: down
    tick_interval: 1s
    start_running: false
    control_events:
      - event: hard_deck_charlie_ball_released
        action: start
      # Pause on each stage's final shot (decision time)
      - event: charlie_stage_1_final_shot_hit
        action: pause
      - event: charlie_stage_2_final_shot_hit
        action: pause
      - event: charlie_stage_3_final_shot_hit
        action: pause
      - event: charlie_stage_4_final_shot_hit
        action: pause
      # Resume on each subsequent stage's ball release.
      # MPF resumes a paused timer with action: start (not "resume" — not a valid enum).
      - event: hard_deck_charlie_stage_2_ball_released
        action: start
      - event: hard_deck_charlie_stage_3_ball_released
        action: start
      - event: hard_deck_charlie_stage_4_ball_released
        action: start
      # Reward time for continuing into the next stage.
      # +30s entering stage 2, +25s entering stage 3, +20s entering stage 4.
      # These fire alongside the resume (same event_player tick); order within
      # the tick doesn't matter — timer ends up at (paused_value + bonus).
      - event: charlie_enter_stage_2
        action: add
        value: 30
      - event: charlie_enter_stage_3
        action: add
        value: 25
      - event: charlie_enter_stage_4
        action: add
        value: 20
      # Stop on fail or mode end
      - event: hard_deck_charlie_failed
        action: stop
      - event: hard_deck_charlie_mode_end_complete
        action: stop

  ##############################################
  ## DECISION TIMERS - 10s each (left/timeout=continue, right=exit)
  ## Stage 4 has NO decision (auto-release).
  ##############################################
  hard_deck_charlie_stage_1_decision_timer:
    start_value: 10
    end_value: 0
    direction: down
    tick_interval: 1s
    start_running: false
    control_events:
      - event: charlie_stage_1_final_shot_hit
        action: start
      - event: charlie_stage_1_continue
        action: stop
      - event: charlie_stage_1_exit
        action: stop

  hard_deck_charlie_stage_2_decision_timer:
    start_value: 10
    end_value: 0
    direction: down
    tick_interval: 1s
    start_running: false
    control_events:
      - event: charlie_stage_2_final_shot_hit
        action: start
      - event: charlie_stage_2_continue
        action: stop
      - event: charlie_stage_2_exit
        action: stop

  hard_deck_charlie_stage_3_decision_timer:
    start_value: 10
    end_value: 0
    direction: down
    tick_interval: 1s
    start_running: false
    control_events:
      - event: charlie_stage_3_final_shot_hit
        action: start
      - event: charlie_stage_3_continue
        action: stop
      - event: charlie_stage_3_exit
        action: stop

  ##############################################
  ## STAGE 4 WON DELAY - 6s (hold ball during won video, then release)
  ##############################################
  hard_deck_charlie_stage_4_won_delay:
    start_value: 0
    end_value: 6
    direction: up
    tick_interval: 1s
    start_running: false
    control_events:
      - event: charlie_stage_4_final_shot_hit
        action: start

  ##############################################
  ## FAILED DELAYS - Match lost video duration per stage
  ##  Stage 1: 7s | Stage 2: 5s | Stage 3: 5s | Stage 4: 9s
  ##############################################
  hard_deck_charlie_stage_1_failed_delay:
    start_value: 0
    end_value: 7
    direction: up
    tick_interval: 1s
    start_running: false
    control_events:
      - event: timer_hard_deck_charlie_stage_1_failed_delay_start
        action: start

  hard_deck_charlie_stage_2_failed_delay:
    start_value: 0
    end_value: 5
    direction: up
    tick_interval: 1s
    start_running: false
    control_events:
      - event: timer_hard_deck_charlie_stage_2_failed_delay_start
        action: start

  hard_deck_charlie_stage_3_failed_delay:
    start_value: 0
    end_value: 5
    direction: up
    tick_interval: 1s
    start_running: false
    control_events:
      - event: timer_hard_deck_charlie_stage_3_failed_delay_start
        action: start

  hard_deck_charlie_stage_4_failed_delay:
    start_value: 0
    end_value: 11
    direction: up
    tick_interval: 1s
    start_running: false
    control_events:
      - event: timer_hard_deck_charlie_stage_4_failed_delay_start
        action: start

  ##############################################
  ## LEFT ORBIT DIVERTER TIMER - 3s safety close
  ## Stage 2/3 RO opens diverter; this closes it after 3s if ball capture
  ## doesn't fire the close earlier. (s_lane_left_active fires close too —
  ## "first wins" pattern.)
  ##############################################
  hard_deck_charlie_diverter_assist:
    start_value: 0
    end_value: 3
    direction: up
    tick_interval: 1s
    start_running: false
    control_events:
      - event: charlie_diverter_assist_trigger
        action: restart

####################################################################################
# VARIABLE PLAYER
####################################################################################
variable_player:
  ##############################################
  ## MODE START - Initialize all state
  ##############################################
  mode_hard_deck_charlie_started:
    charlie_stage:
      action: set
      int: 1
    charlie_complete_flag:
      action: set
      int: 0
    charlie_timer_ticks:
      action: set
      int: 150
    charlie_shots_remaining:
      action: set
      int: 5                  # Stage 1: 4 non-final + 1 barrier
    # Stage 1 shot tracking
    charlie_stage_1_lo_hit:
      action: set
      int: 0
    charlie_stage_1_lr_hit:
      action: set
      int: 0
    charlie_stage_1_twr_hit:
      action: set
      int: 0
    charlie_stage_1_rr_hit:
      action: set
      int: 0
    charlie_stage_1_shots_made:
      action: set
      int: 0
    charlie_stage_1_final_shot_lit:
      action: set
      int: 0
    # Stage 2 shot tracking (Spinner, TO, Spinner, RO — in order)
    charlie_stage_2_spin_count:
      action: set
      int: 0                  # 0=before SP1, 1=after SP1, 2=after SP2
    charlie_stage_2_to_hit:
      action: set
      int: 0
    charlie_stage_2_ro_hit:
      action: set
      int: 0
    charlie_stage_2_shots_made:
      action: set
      int: 0
    charlie_stage_2_final_shot_lit:
      action: set
      int: 0                  # 1 = RO is the live shot
    # Stage 3 shot tracking (ICE group, MAN group, Barrier target, RO — any order for 3)
    charlie_stage_3_ice_hit:
      action: set
      int: 0
    charlie_stage_3_man_hit:
      action: set
      int: 0
    charlie_stage_3_barrier_hit:
      action: set
      int: 0
    charlie_stage_3_ro_hit:
      action: set
      int: 0
    charlie_stage_3_shots_made:
      action: set
      int: 0
    charlie_stage_3_final_shot_lit:
      action: set
      int: 0                  # 1 = RO is the live shot (after 3 non-finals)
    # Stage 4 shot tracking (TO, Tower, RR, LR any order; scoop final)
    charlie_stage_4_to_hit:
      action: set
      int: 0
    charlie_stage_4_twr_hit:
      action: set
      int: 0
    charlie_stage_4_rr_hit:
      action: set
      int: 0
    charlie_stage_4_lr_hit:
      action: set
      int: 0
    charlie_stage_4_shots_made:
      action: set
      int: 0
    charlie_stage_4_final_shot_lit:
      action: set
      int: 0
    # Reset mode_points_scored for popups
    mode_points_scored:
      action: set
      int: 0
    # Drain coordination — bonus reads this in base.yaml
    pilot_mode_drain_pending:
      action: set
      int: 0

  ##############################################
  ## BALL WILL END - Mark drain pending so base.yaml music handler
  ## doesn't immediately restart Danger Zone (bonus handles it).
  ##############################################
  ball_will_end{mode.hard_deck_charlie.active==True}:
    pilot_mode_drain_pending:
      action: set
      int: 1

  ##############################################
  ## SHOT FLAG SETTERS (light_player turns off insert when these fire)
  ##############################################
  # Stage 1
  charlie_stage_1_lo_hit:
    charlie_stage_1_lo_hit:
      action: set
      int: 1
  charlie_stage_1_lr_hit:
    charlie_stage_1_lr_hit:
      action: set
      int: 1
  charlie_stage_1_twr_hit:
    charlie_stage_1_twr_hit:
      action: set
      int: 1
  charlie_stage_1_rr_hit:
    charlie_stage_1_rr_hit:
      action: set
      int: 1

  # Stage 2 — spinner count increments via spinner_shot_made (composite); TO has its own flag.
  # Top ramp servo is raised when SP1 fires (so the player can shoot TO underneath it)
  # and lowered when TO fires (so subsequent shots aren't affected). See event_player.
  charlie_stage_2_sp1_hit:
    charlie_stage_2_spin_count:
      action: set
      int: 1
  charlie_stage_2_to_hit:
    charlie_stage_2_to_hit:
      action: set
      int: 1
  charlie_stage_2_sp2_hit:
    charlie_stage_2_spin_count:
      action: set
      int: 2

  # Stage 3 — group flags (any of I/C/E sets ice_hit, any of M/A/N sets man_hit)
  charlie_stage_3_ice_hit:
    charlie_stage_3_ice_hit:
      action: set
      int: 1
  charlie_stage_3_man_hit:
    charlie_stage_3_man_hit:
      action: set
      int: 1
  charlie_stage_3_barrier_hit:
    charlie_stage_3_barrier_hit:
      action: set
      int: 1

  # Stage 4 — individual flags
  charlie_stage_4_to_hit:
    charlie_stage_4_to_hit:
      action: set
      int: 1
  charlie_stage_4_twr_hit:
    charlie_stage_4_twr_hit:
      action: set
      int: 1
  charlie_stage_4_rr_hit:
    charlie_stage_4_rr_hit:
      action: set
      int: 1
  charlie_stage_4_lr_hit:
    charlie_stage_4_lr_hit:
      action: set
      int: 1

  ##############################################
  ## PROGRESSIVE SCORING BY SHOT ORDER — Stage 1
  ## 350K / 600K / 800K / 1M × multiplier
  ##############################################
  charlie_stage_1_shot_1:
    score:
      action: add
      int: 350000 * current_player.total_scoring_multiplier
    charlie_stage_1_shots_made:
      action: add
      int: 1
    charlie_shots_remaining:
      action: add
      int: -1
    mode_points_scored:
      action: set
      int: 350000 * current_player.total_scoring_multiplier

  charlie_stage_1_shot_2:
    score:
      action: add
      int: 600000 * current_player.total_scoring_multiplier
    charlie_stage_1_shots_made:
      action: add
      int: 1
    charlie_shots_remaining:
      action: add
      int: -1
    mode_points_scored:
      action: set
      int: 600000 * current_player.total_scoring_multiplier

  charlie_stage_1_shot_3:
    score:
      action: add
      int: 800000 * current_player.total_scoring_multiplier
    charlie_stage_1_shots_made:
      action: add
      int: 1
    charlie_shots_remaining:
      action: add
      int: -1
    mode_points_scored:
      action: set
      int: 800000 * current_player.total_scoring_multiplier

  charlie_stage_1_shot_4:
    score:
      action: add
      int: 1000000 * current_player.total_scoring_multiplier
    charlie_stage_1_shots_made:
      action: add
      int: 1
    charlie_shots_remaining:
      action: add
      int: -1
    mode_points_scored:
      action: set
      int: 1000000 * current_player.total_scoring_multiplier

  ##############################################
  ## PROGRESSIVE SCORING BY SHOT ORDER — Stage 2
  ## 350K / 500K / 750K / 1M × multiplier
  ##############################################
  charlie_stage_2_shot_1:
    score:
      action: add
      int: 350000 * current_player.total_scoring_multiplier
    charlie_stage_2_shots_made:
      action: add
      int: 1
    charlie_shots_remaining:
      action: add
      int: -1
    mode_points_scored:
      action: set
      int: 350000 * current_player.total_scoring_multiplier

  charlie_stage_2_shot_2:
    score:
      action: add
      int: 500000 * current_player.total_scoring_multiplier
    charlie_stage_2_shots_made:
      action: add
      int: 1
    charlie_shots_remaining:
      action: add
      int: -1
    mode_points_scored:
      action: set
      int: 500000 * current_player.total_scoring_multiplier

  charlie_stage_2_shot_3:
    score:
      action: add
      int: 750000 * current_player.total_scoring_multiplier
    charlie_stage_2_shots_made:
      action: add
      int: 1
    charlie_shots_remaining:
      action: add
      int: -1
    mode_points_scored:
      action: set
      int: 750000 * current_player.total_scoring_multiplier

  charlie_stage_2_shot_4:
    score:
      action: add
      int: 1000000 * current_player.total_scoring_multiplier
    charlie_stage_2_shots_made:
      action: add
      int: 1
    charlie_shots_remaining:
      action: add
      int: -1
    mode_points_scored:
      action: set
      int: 1000000 * current_player.total_scoring_multiplier

  ##############################################
  ## PROGRESSIVE SCORING BY SHOT ORDER — Stage 3
  ## 350K / 500K / 750K / 1M × multiplier
  ##############################################
  charlie_stage_3_shot_1:
    score:
      action: add
      int: 350000 * current_player.total_scoring_multiplier
    charlie_stage_3_shots_made:
      action: add
      int: 1
    charlie_shots_remaining:
      action: add
      int: -1
    mode_points_scored:
      action: set
      int: 350000 * current_player.total_scoring_multiplier

  charlie_stage_3_shot_2:
    score:
      action: add
      int: 500000 * current_player.total_scoring_multiplier
    charlie_stage_3_shots_made:
      action: add
      int: 1
    charlie_shots_remaining:
      action: add
      int: -1
    mode_points_scored:
      action: set
      int: 500000 * current_player.total_scoring_multiplier

  charlie_stage_3_shot_3:
    score:
      action: add
      int: 750000 * current_player.total_scoring_multiplier
    charlie_stage_3_shots_made:
      action: add
      int: 1
    charlie_shots_remaining:
      action: add
      int: -1
    mode_points_scored:
      action: set
      int: 750000 * current_player.total_scoring_multiplier

  charlie_stage_3_shot_4:
    score:
      action: add
      int: 1000000 * current_player.total_scoring_multiplier
    charlie_stage_3_shots_made:
      action: add
      int: 1
    charlie_shots_remaining:
      action: add
      int: -1
    mode_points_scored:
      action: set
      int: 1000000 * current_player.total_scoring_multiplier

  ##############################################
  ## PROGRESSIVE SCORING BY SHOT ORDER — Stage 4
  ## 350K / 600K / 800K / 1M × multiplier (same as stage 1)
  ##############################################
  charlie_stage_4_shot_1:
    score:
      action: add
      int: 350000 * current_player.total_scoring_multiplier
    charlie_stage_4_shots_made:
      action: add
      int: 1
    charlie_shots_remaining:
      action: add
      int: -1
    mode_points_scored:
      action: set
      int: 350000 * current_player.total_scoring_multiplier

  charlie_stage_4_shot_2:
    score:
      action: add
      int: 600000 * current_player.total_scoring_multiplier
    charlie_stage_4_shots_made:
      action: add
