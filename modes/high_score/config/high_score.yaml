#config_version=6

##############################################################################
## HIGH SCORE MODE
##############################################################################
##
## TABLES (high_score categories). The category name IS the player variable
## the table ranks by (MPF rule). All but "score" are kept by
## modes/high_score_tracking.
##
##   score                     Top score - 15 entries (top 5 + alternates 6-15)
##   hs_final_battle           Final Battle points (normal games)       top 5
##   hs_final_battle_practice  Final Battle points (practice games)     top 5
##   hs_fb_fastest             Fastest Final Battle WIN (seconds, LOWER wins,
##                             shown as m:ss; normal games only)
##   hs_migs                   MIGs destroyed in TGMB; tie = less TGMB time
##   hs_tgmb_jackpots          Most jackpot points in ONE Top Gun Multiball
##                             (MIG jackpots + super jackpots, as scored)
##   hs_pilot_missions         Pilot missions won; tie = more mission points
##   hs_training_missions      Training missions won; tie = more mission pts
##   hs_bonus                  Biggest single bonus
##   hs_pilots                 Pilots collected; tie = less ball time
##   hs_pwtb                   Playing With the Boys - best run
##   hs_pilot_jackpot          Biggest pilot jackpot; tie = first one keeps it
##   Any exact tie (value AND tie-breaker): the earlier entry keeps the spot.
##
## Per-table settings (title, slide layout, tie-breaker) are in
## mode_settings: tables: below. Code: code/top_gun_high_score.py
##
## MACHINE VARIABLES (Godot MPFVariable nodes):
##   <category><n>_name / _value / _label   (stock MPF, n = 1..5, score 1..15)
##   <category><n>_extra                    time column, e.g. hs_migs1_extra "5:12"
##   hs_chart_title, hs_chart<n>_name / _value / _extra
##       = the table currently shown on high_score_top_5 /
##         high_score_top_5_3_lines (end of game charts + attract carousel)
##   hs_entry_title   title of the table the player is entering a name for
##
## FLOW (game_ending):
##   Each player who made ANY table enters their name ONCE (high_score_entry).
##   Practice games only check hs_final_battle_practice; normal games check
##   every other table.
##   No award slide: the tables made are queued, and end_of_game_attract shows
##   them as charts, 5s each, with the high score music:
##     every table made         -> its top 5 chart
##     main score alternates    -> right after the score top 5, when the main
##                                 score is the only table made OR a player
##                                 landed in 6th-15th
##   then the normal end-of-game screen (or attract after a practice game).
##
## TO RESET (e.g. before a show):
##   Delete <machine>/data/high_scores.yaml and restart MPF
##   OR post: reset_high_scores
##
## ADDING / REMOVING A TABLE:
##   Adding one is safe - it is filled from its defaults on the next boot.
##   REMOVING one (or changing a table's number of entries) makes MPF reject
##   the saved file and reset EVERY table to the defaults.
##
## DEFAULTS: must be in ranking order. Names up to 20 characters, uppercase.
##############################################################################

mode:
  # Stock MPF high score + tie-breakers, practice table, chart queue
  code: top_gun_high_score.TopGunHighScore
  priority: 1500
  # Every game, practice included (the code picks the tables to check)
  start_events: game_ending
  game_mode: false
  use_wait_queue: true

high_score:
  _overwrite: true
  # MPF's internal timeout — always longer than our 20s Godot timer.
  # Godot always fires text_input_high_score_complete before this.
  enter_initials_timeout: 60
  # Not used - the award slide is replaced by the end-of-game charts
  award_slide_display_time: 0
  # Safety filler if MPF timeout somehow fires before Godot does
  filler_initials:
    - LFS
  reset_high_scores_events: reset_high_scores
  # Tables where the LOWER value ranks higher
  reverse_sort:
    - hs_fb_fastest

  categories:
