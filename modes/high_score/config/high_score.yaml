##############################################################################
## TABLE SETTINGS (read by code/top_gun_high_score.py)
##   title              shown on the chart / attract page (hs_chart_title)
##   layout             2_lines -> high_score_top_5 slide (name, value)
##                      3_lines -> high_score_top_5_3_lines (name, value, extra)
##   practice           true = only Final Battle Practice games feed this table
##   tiebreak           player variable that breaks ties on the value
##   tiebreak_order     lowest | highest wins the tie
##   extra              third column: time (m:ss of the tie-breaker)
##   value_format       time = show the VALUE itself as m:ss (seconds)
##   default_tiebreaks  tie-breakers for the default entries, in order
##                      (seconds for times)
## The attract carousel page for a table is named after the table (category).
##############################################################################
mode_settings:
  tables:
    score:
      title: "TOP GUN HIGH SCORES"
      layout: 2_lines
    hs_final_battle:
      title: "FINAL BATTLE"
      layout: 2_lines
    hs_final_battle_practice:
      title: "FINAL BATTLE PRACTICE"
      layout: 2_lines
      practice: true
    hs_fb_fastest:
      title: "FASTEST FINAL BATTLE WIN"
      layout: 2_lines
      value_format: time
    hs_migs:
      title: "MOST MIGS DESTROYED"
      layout: 3_lines
      tiebreak: hs_migs_time
      tiebreak_order: lowest
      extra: time
      default_tiebreaks: [900, 840, 720, 600, 480]
    hs_tgmb_jackpots:
      title: "TOP GUN MULTIBALL JACKPOTS"
      layout: 2_lines
    hs_pilot_missions:
      title: "MOST PILOT MISSIONS WON"
      layout: 2_lines
      tiebreak: hs_pilot_mission_points
      tiebreak_order: highest
      default_tiebreaks: [80000000, 60000000, 40000000, 30000000, 20000000]
    hs_training_missions:
      title: "MOST TRAINING MISSIONS WON"
      layout: 2_lines
      tiebreak: hs_training_mission_points
      tiebreak_order: highest
      default_tiebreaks: [40000000, 30000000, 20000000, 10000000, 5000000]
    hs_bonus:
      title: "BIGGEST BONUS"
      layout: 2_lines
    hs_pilots:
      title: "MOST PILOTS COLLECTED"
      layout: 3_lines
      tiebreak: hs_pilots_time
      tiebreak_order: lowest
      extra: time
      default_tiebreaks: [1200, 1080, 960, 840, 720]
    hs_pwtb:
      title: "PLAYING WITH THE BOYS"
      layout: 2_lines
    hs_pilot_jackpot:
      title: "BIGGEST PILOT JACKPOT"
      layout: 2_lines

##############################################################################
## EVENT PLAYER
##############################################################################

event_player:
  # Route flipper and start inputs to named nav events.
  # Conditions ensure they ONLY fire during high score entry.
  # Start button is blocked from triggering game_starting by
  # high_score mode's priority 1500 (higher than attract at 10).
  s_flipper_left_active{mode.high_score.active}:
    - hs_nav_prev
  s_flipper_right_active{mode.high_score.active}:
    - hs_nav_next
  s_start_active{mode.high_score.active}:
    - hs_nav_select

  # When Godot detects name is at max length, it posts hs_name_full.
  # MPF jumps letter cursor to FINISH position (index 28).
  hs_name_full:
    - hs_set_finish

  # Carousel navigation: decide step vs. wrap HERE, against the index as it
  # is BEFORE any change. (Two conditional variable_player handlers on the
  # same event chain into each other: 27 -> 28 -> wrap to 0 skipped FINISH,
  # and 1 -> 0 -> wrap to 28 skipped A.) Posted events are queued, so both
  # conditions below see the same, unchanged index.
  hs_nav_prev{machine.hs_letter_index > 0}:
    - hs_nav_prev_step
  hs_nav_prev{machine.hs_letter_index == 0}:
    - hs_nav_prev_wrap
  hs_nav_next{machine.hs_letter_index < 28}:
    - hs_nav_next_step
  hs_nav_next{machine.hs_letter_index >= 28}:
    - hs_nav_next_wrap

##############################################################################
## VARIABLE PLAYER
## - Manages hs_letter_index machine var (drives carousel in Godot)
## - Manages hs_select_trigger machine var (signals Godot to process a select)
## - Captures high_score_enter_initials event kwargs into machine vars for display
##############################################################################

variable_player:

  ##------------------------------------------------------------------------
  ## Reset on each new entry prompt (not just mode start, since multiple
  ## players may qualify and entry fires multiple times)
  ##------------------------------------------------------------------------
  high_score_enter_initials:
    hs_entry_made:
      action: set_machine
      int: 1
    hs_letter_index:
      action: set_machine
      int: 0
    hs_select_trigger:
      action: set_machine
      int: 0
    # Capture event kwargs directly — player_num, value, award are event args
    hs_player_num:
      action: set_machine
      int: player_num
    hs_score_value:
      action: set_machine
      int: value
    hs_award_text:
      action: set_machine
      string: award

  ##------------------------------------------------------------------------
  ## Letter carousel navigation — wraps at both ends
  ##------------------------------------------------------------------------
  ## (step/wrap decided once in event_player - see hs_nav_prev/hs_nav_next)
  hs_nav_prev_step:
    hs_letter_index:
      action: add_machine
      int: -1
  hs_nav_prev_wrap:
    hs_letter_index:
      action: set_machine
      int: 28    # wrap A → FINISH

  hs_nav_next_step:
    hs_letter_index:
      action: add_machine
      int: 1
  hs_nav_next_wrap:
    hs_letter_index:
      action: set_machine
      int: 0     # wrap FINISH → A

  ##------------------------------------------------------------------------
  ## Select trigger — increments so Godot detects the change event
  ##------------------------------------------------------------------------
  hs_nav_select:
    hs_select_trigger:
      action: add_machine
      int: 1

  ##------------------------------------------------------------------------
  ## Jump to FINISH (index 28) when name is full
  ##------------------------------------------------------------------------
  hs_set_finish:
    hs_letter_index:
      action: set_machine
      int: 28

##############################################################################
## SLIDE PLAYER
##############################################################################

slide_player:
  # Name entry: show entry UI, clear any award slide
  high_score_enter_initials:
    high_score_entry:
      action: play
      priority: 1600
    high_score_award:
      action: remove

  # (No award slide any more - the tables made are shown as charts by
  #  end_of_game_attract once every name is in.)

  # Cleanup when mode ends
  mode_high_score_stopped:
    high_score_entry:
      action: remove
    high_score_award:
      action: remove

##############################################################################
## SOUND PLAYER
##############################################################################

sound_player:
  # Music starts on name entry — end_of_game_attract restarts it on hs_display_start
  # so it continues through the leaderboard slides.
  high_score_enter_initials:
    music_high_score:
      bus: music
      loops: -1

  # Voice congrats now plays in end_of_game_attract when the charts start
  # (this mode stops right after the last name, which would cut it off).

##############################################################################
## SHOW PLAYER
##############################################################################

show_player:
  high_score_enter_initials:
    high_score_entry_lights:
      loops: -1
      speed: 1
      priority: 1500

  mode_high_score_stopped:
    high_score_entry_lights:
      action: stop
    high_score_award_lights:
      action: stop