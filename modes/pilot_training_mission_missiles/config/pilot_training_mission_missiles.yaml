#config_version=6

####################################################################################
# PILOT TRAINING MISSION: MISSILES
#
# A single-ball timed training mission with a locate/track/destroy loop.
#
# THEME: Locate a plane, track it across a moving radar sweep, then shoot it
# down. 4 planes total across 4 rounds — each round burns one of the 4
# candidate shots permanently, forcing the player to use all 4 instead of
# spamming one easy shot.
#
# BALLS: 1 (normal flippers)
# TIMER: 90 seconds
# GI: Cyan (odd lights) and White (even lights) ambient; red strobe on bad shots
# PERK: Missiles perk earned on mode win, active for rest of ball
# CANNOT STACK WITH MULTIBALL
#
# ROUND STRUCTURE (x4):
#   PHASE 1 - LOCATE: LO, LR, TWR, RR lit green (whichever aren't burned yet).
#     Hit one -> locks it as this round's target. Hit a burned one, or any of
#     SP/CNT/TL/TR -> bad shot (rainbow + red GI punishment).
#   PHASE 2 - SWEEP: A window of N consecutive shots (from the 9-position
#     order LL,LO,LR,SP,CNT,TWR,TL,TR,RR) is lit and slides right one step at
#     a time, reversing at the far edge (RR), bouncing indefinitely. Hit ANY
#     lit shot in the window to pass through. Never a bad shot here — this
#     phase doesn't relate to Phase 1/3 targets at all. Window width shrinks
#     each round: Round 1 = 4, Round 2 = 3, Round 3 = 2, Round 4 = 1. Sweep
#     speed: 1s/step (rounds 1-2), 1.5s/step (rounds 3-4).
#   PHASE 3 - DESTROY: focus returns to the SAME shot located in Phase 1.
#     Hit it -> destroyed, permanently burned (bad from here on in both
#     future Phase 1 and Phase 3). Hit anything else -> bad shot.
#
# SCORING (locate / destroy per round):
#   Round 1: 500,000 / 750,000
#   Round 2: 650,000 / 900,000
#   Round 3: 800,000 / 1,050,000   (destroy value is our own pick — see notes)
#   Round 4: 1,000,000 / 1,250,000 + 2,500,000 mode-complete bonus
#
# VIDEO ASSET MAPPING (only 3 sets of round-specific "destroy" scenes exist):
#   Round 1 destroy -> missiles_step_3 slide/video
#   Round 2 destroy -> missiles_step_6 slide/video
#   Round 3 destroy -> missiles_step_9 slide/video
#   Round 4 destroy -> REUSES missiles_step_3 (Round 1's asset), per instruction
#   Phase 1 (any round) -> missiles_locating_jet background
#   Phase 2 (any round) -> missiles_locking_on background
#
# SHOT LIGHTS:
#   LL = l_shot_left_lane     LO  = l_shot_left_orbit
#   LR = l_shot_left_ramp     SP  = l_shot_spinner
#   CNT = l_shot_barrier      TWR = l_shot_tower_ramp
#   TL = l_shot_upper_orbit   TR  = l_shot_middle_ramp (shares light with TO,
#                                   unused here — this mode's 9-slot order
#                                   uses TR/s_ramp_inner_exit, matching the
#                                   original window mechanic this replaces)
#   RR = l_shot_right_orbit
####################################################################################

mode:
  start_events: start_mode_pilot_training_mission_missiles
  stop_events:
    - missiles_video_complete
    - timer_missiles_failed_delay_complete
    - missiles_drain_cleanup_complete
  priority: 600
  game_mode: true
  use_wait_queue: true

mode_settings:
  can_stack_with_multiball: false

####################################################################################
# BALL HOLDS - Prevent auto-eject during intro video
####################################################################################

ball_holds:
  missiles_scoop_hold:
    balls_to_hold: 1
    hold_devices: bd_mode_scoop
    enable_events:
      - mode_pilot_training_mission_missiles_started
    release_one_events:
      - missiles_ball_released
    release_all_events:
      - mode_pilot_training_mission_missiles_will_stop

####################################################################################
# QUEUE RELAY PLAYER - Hold ball_ending until mode cleanup completes
####################################################################################

queue_relay_player:
  ball_ending{mode.pilot_training_mission_missiles.active==True}:
    post: missiles_ball_ending_hold
    wait_for: missiles_drain_cleanup_complete
    priority: 1000
####################################################################################
# TIMERS
####################################################################################

timers:
  missiles_timer:
    start_value: 150
    end_value: 0
    direction: down
    tick_interval: 1s
    start_running: false
    control_events:
      - event: missiles_ball_released
        action: start
      - event: missiles_complete
        action: stop
      - event: missiles_failed
        action: stop
      - event: missiles_drain_detected
        action: stop
      - event: lock_sequence_timer_pause
        action: pause
      - event: lock_sequence_timer_resume
        action: start

  missiles_intro_video_delay:
    start_value: 0
    end_value: 10
    direction: up
    tick_interval: 1s
    control_events:
      - event: mode_pilot_training_mission_missiles_started
        action: start
      - event: missiles_skip_intro
        action: stop

  # Sweep tick — rounds 1-2 (1s/step)
  # Sweep tick — rounds 1-2 (0.5s/step)
  missiles_sweep_timer_fast:
    start_value: 0
    end_value: 1
    direction: up
    tick_interval: 500ms
    start_running: false
    control_events:
      - event: missiles_start_sweep_fast
        action: start
      - event: missiles_sweep_advance
        action: restart
      - event: missiles_sweep_hit
        action: stop
      - event: missiles_destroy_success
        action: stop
      - event: missiles_failed
        action: stop
      - event: missiles_drain_detected
        action: stop
      - event: lock_sequence_timer_pause
        action: pause
      - event: lock_sequence_timer_resume
        action: start

  # Sweep tick — rounds 3-4 (1s/step)
  missiles_sweep_timer_slow:
    start_value: 0
    end_value: 1
    direction: up
    tick_interval: 1s
    start_running: false
    control_events:
      - event: missiles_start_sweep_slow
        action: start
      - event: missiles_sweep_advance
        action: restart
      - event: missiles_sweep_hit
        action: stop
      - event: missiles_destroy_success
        action: stop
      - event: missiles_failed
        action: stop
      - event: missiles_drain_detected
        action: stop
      - event: lock_sequence_timer_pause
        action: pause
      - event: lock_sequence_timer_resume
        action: start

  # Bad-shot punishment — 5s, restarts on every additional bad shot,
  # stopped early by the next locate or destroy success
  missiles_punishment_timer:
    start_value: 0
    end_value: 5
    direction: up
    tick_interval: 1s
    start_running: false
    control_events:
      - event: missiles_bad_shot
        action: restart
      - event: missiles_locate_success
        action: stop
      - event: missiles_destroy_success
        action: stop
      - event: missiles_failed
        action: stop
      - event: missiles_drain_detected
        action: stop

  # PHASE 1 FRUSTRATION TIMER — 30s with no locate -> random nag callout,
  # matching the original's "pair steps: 30 second timeout" behavior
  missiles_phase1_frustration_timer:
    start_value: 0
    end_value: 30
    direction: up
    tick_interval: 1s
    start_running: false
    control_events:
      - event: missiles_setup_phase_1
        action: restart
      - event: missiles_locate_success
        action: stop
      - event: missiles_failed
        action: stop
      - event: missiles_drain_detected
        action: stop

  # MISSILE FLYING DELAY — time before the explosion GI kicks in, matching
  # each destroy video's actual "missile in flight" runtime before impact.
  # 4.0s (16 ticks): rounds 1, 3, 4 (round 4 reuses round 1's video)
  # 4.5s (18 ticks): round 2
  missiles_flying_delay_a:
    start_value: 0
    end_value: 16
    direction: up
    tick_interval: 250ms
    start_running: false
    control_events:
      - event: missiles_start_flying_a
        action: start
      - event: missiles_cleanup
        action: stop
      - event: missiles_drain_detected
        action: stop

  missiles_flying_delay_b:
    start_value: 0
    end_value: 18
    direction: up
    tick_interval: 250ms
    start_running: false
    control_events:
      - event: missiles_start_flying_b
        action: start
      - event: missiles_cleanup
        action: stop
      - event: missiles_drain_detected
        action: stop

  # MISSILE EXPLOSION DELAY — how long the explosion GI/video plays before
  # advancing to the next round. 2.5s (round 1/4), 2.75s (round 2), 3.5s (round 3)
  missiles_explosion_delay_a:
    start_value: 0
    end_value: 10
    direction: up
    tick_interval: 250ms
    start_running: false
    control_events:
      - event: missiles_start_explosion_a
        action: start
      - event: missiles_cleanup
        action: stop
      - event: missiles_drain_detected
        action: stop

  missiles_explosion_delay_b:
    start_value: 0
    end_value: 11
    direction: up
    tick_interval: 250ms
    start_running: false
    control_events:
      - event: missiles_start_explosion_b
        action: start
      - event: missiles_cleanup
        action: stop
      - event: missiles_drain_detected
        action: stop

  missiles_explosion_delay_c:
    start_value: 0
    end_value: 14
    direction: up
    tick_interval: 250ms
    start_running: false
    control_events:
      - event: missiles_start_explosion_c
        action: start
      - event: missiles_cleanup
        action: stop
      - event: missiles_drain_detected
        action: stop

  # Simple, independent 6s timer for the "shoot the lit green shots" callout,
  # decoupled from the flying/explosion chain so it doesn't depend on that
  # timing being exactly right.
  missiles_callout_delay:
    start_value: 0
    end_value: 6
    direction: up
    tick_interval: 1s
    start_running: false
    control_events:
      - event: missiles_destroy_success
        action: restart
      - event: missiles_failed
        action: stop
      - event: missiles_drain_detected
        action: stop

  missiles_complete_delay:
    start_value: 0
    end_value: 4
    direction: up
    tick_interval: 250ms
    start_running: false
    control_events:
      - event: timer_missiles_complete_delay_start
        action: start

  missiles_failed_delay:
    start_value: 0
    end_value: 1
    direction: up
    tick_interval: 3300ms
    start_running: false
    control_events:
      - event: timer_missiles_failed_delay_start
        action: start

  missiles_drain_delay:
    start_value: 0
    end_value: 1
    direction: up
    tick_interval: 3300ms
    control_events:
      - event: missiles_drain_detected
        action: start
####################################################################################
# VARIABLE PLAYER
####################################################################################

variable_player:
  mode_pilot_training_mission_missiles_started:
    training_mission_active:
      action: set
      int: 1
    letter_collection_paused:
      action: set
      int: 1
    missiles_phase:
      action: set
      int: 0    # 0 = intro; setup_phase_1 sets to 1 when locate opens
    missiles_round:
      action: set
      int: 1
    missiles_target:
      action: set
      int: 0    # 0=none 1=LO 2=LR 3=TWR 4=RR
    missiles_lo_burned:
      action: set
      int: 0
    missiles_lr_burned:
      action: set
      int: 0
    missiles_twr_burned:
      action: set
      int: 0
    missiles_rr_burned:
      action: set
      int: 0
    missiles_complete_flag:
      action: set
      int: 0
    missiles_shots_remaining:
      action: set
      int: 12    # 3 hits/round (locate + sweep + destroy) x 4 rounds
    missiles_phase3_bad_count:
      action: set
      int: 0
    missiles_destroyed_round:
      action: set
      int: 0
    missiles_sweep_pos:
      action: set
      int: 0
    missiles_sweep_dir:
      action: set
      int: 0
    missiles_sweep_width:
      action: set
      int: 4
    mode_points_scored:
      action: set
      int: 0
    training_missions_played:
      action: add
      int: 1
    mode_pilot_training_mission_missiles_played:
      action: set
      int: 1
    training_missles_complete:
      action: set
      int: 1

  ball_will_end{mode.pilot_training_mission_missiles.active==True}:
    pilot_mode_drain_pending:
      action: set
      int: 1

  ##############################################
  ## PHASE 1 - LOCATE: which shot was hit
  ##############################################
  missiles_locate_hit_lo:
    missiles_target: { action: set, int: 1 }
  missiles_locate_hit_lr:
    missiles_target: { action: set, int: 2 }
  missiles_locate_hit_twr:
    missiles_target: { action: set, int: 3 }
  missiles_locate_hit_rr:
    missiles_target: { action: set, int: 4 }

  # Locate scoring + sweep width per round (merged into one block per round)
  missiles_locate_success{current_player.missiles_round==1}:
    score: 500000 * current_player.total_scoring_multiplier
    mode_points_scored: { action: set, int: 500000 * current_player.total_scoring_multiplier }
    missiles_sweep_width: { action: set, int: 4 }
  missiles_locate_success{current_player.missiles_round==2}:
    score: 650000 * current_player.total_scoring_multiplier
    mode_points_scored: { action: set, int: 650000 * current_player.total_scoring_multiplier }
    missiles_sweep_width: { action: set, int: 3 }
  missiles_locate_success{current_player.missiles_round==3}:
    score: 800000 * current_player.total_scoring_multiplier
    mode_points_scored: { action: set, int: 800000 * current_player.total_scoring_multiplier }
    missiles_sweep_width: { action: set, int: 2 }
  missiles_locate_success{current_player.missiles_round==4}:
    score: 1000000 * current_player.total_scoring_multiplier
    mode_points_scored: { action: set, int: 1000000 * current_player.total_scoring_multiplier }
    missiles_sweep_width: { action: set, int: 1 }

  missiles_locate_success:
    missiles_phase: { action: set, int: 2 }
    missiles_sweep_pos: { action: set, int: 0 }
    missiles_sweep_dir: { action: set, int: 0 }
    missiles_shots_remaining: { action: add, int: -1 }

  ##############################################
  ## PHASE 2 - SWEEP: position advance (direction handled separately —
  ## keeping these apart avoids MPF cascading advance+flip+retreat in one
  ## tick, same reasoning as the original window mechanic this replaces)
  ##############################################
  missiles_sweep_advance{current_player.missiles_sweep_dir==0 and current_player.missiles_sweep_pos<10-current_player.missiles_sweep_width}:
    missiles_sweep_pos: { action: add, int: 1 }
  missiles_sweep_advance{current_player.missiles_sweep_dir==1 and current_player.missiles_sweep_pos>0}:
    missiles_sweep_pos: { action: add, int: -1 }

  missiles_sweep_flip_right:
    missiles_sweep_dir: { action: set, int: 1 }
  missiles_sweep_flip_left:
    missiles_sweep_dir: { action: set, int: 0 }

  missiles_sweep_hit:
    missiles_phase: { action: set, int: 3 }
    missiles_shots_remaining: { action: add, int: -1 }
    missiles_phase3_bad_count: { action: set, int: 0 }

  missiles_bad_shot{current_player.missiles_phase==3}:
    missiles_phase3_bad_count: { action: add, int: 1 }

  ##############################################
  ## PHASE 3 - DESTROY: scoring per round
  ##############################################
  missiles_destroy_success{current_player.missiles_round==1}:
    score: 750000 * current_player.total_scoring_multiplier
    mode_points_scored: { action: set, int: 750000 * current_player.total_scoring_multiplier }
  missiles_destroy_success{current_player.missiles_round==2}:
    score: 900000 * current_player.total_scoring_multiplier
    mode_points_scored: { action: set, int: 900000 * current_player.total_scoring_multiplier }
  missiles_destroy_success{current_player.missiles_round==3}:
    score: 1050000 * current_player.total_scoring_multiplier
    mode_points_scored: { action: set, int: 1050000 * current_player.total_scoring_multiplier }
  missiles_destroy_success{current_player.missiles_round==4}:
    score: 1250000 * current_player.total_scoring_multiplier
    mode_points_scored: { action: set, int: 1250000 * current_player.total_scoring_multiplier }

  missiles_complete_bonus:
    score: 2500000 * current_player.total_scoring_multiplier
    mode_points_scored: { action: set, int: 2500000 * current_player.total_scoring_multiplier }

  # Burn whichever shot was this round's target
  missiles_burn_target{current_player.missiles_target==1}:
    missiles_lo_burned: { action: set, int: 1 }
  missiles_burn_target{current_player.missiles_target==2}:
    missiles_lr_burned: { action: set, int: 1 }
  missiles_burn_target{current_player.missiles_target==3}:
    missiles_twr_burned: { action: set, int: 1 }
  missiles_burn_target{current_player.missiles_target==4}:
    missiles_rr_burned: { action: set, int: 1 }

  missiles_destroy_success:
    missiles_shots_remaining: { action: add, int: -1 }
    missiles_destroyed_round: { action: set, int: current_player.missiles_round }

  ##############################################
  ## ROUND ADVANCE
  ##############################################
  missiles_setup_next_round:
    missiles_round: { action: add, int: 1 }
    missiles_phase: { action: set, int: 1 }
    missiles_target: { action: set, int: 0 }

  # THE BUG: this was missing entirely. missiles_setup_phase_1 fires at mode
  # start (from skip_intro / intro_video_delay_complete) to arm lights/shows,
  # but nothing ever set missiles_phase away from its init value of 0 for
  # round 1 specifically — every Phase 1 condition checks missiles_phase==1,
  # so round 1 never matched anything at all.
  missiles_setup_phase_1:
    missiles_phase: { action: set, int: 1 }

  missiles_complete:
    missiles_complete_flag:
      action: set
      int: 1
    training_missiles_won:
      action: set
      int: 1
    training_missions_won:
      action: add
      int: 1
    missiles_perk_active:
      action: set
      int: 1

  ##############################################
  ## LEFT ORBIT SAFE RETURN — arm/clear
  ## Phase 1 while LO unburned; Phase 3 when LO is this round's target.
  ##############################################
  orbit_left_safe_return_arm:
    orbit_left_shot_armed:
      action: set
      int: 1

  orbit_left_safe_return_clear:
    orbit_left_shot_armed:
      action: set
      int: 0
####################################################################################
# EVENT PLAYER - Mode flow and shot detection
####################################################################################

event_player:
  ##############################################
  ## MODE START SEQUENCE
  ##############################################
  mode_pilot_training_mission_missiles_started:
    - missiles_set_gi|200ms
    - missiles_play_instructions_voice

  ##############################################
  ## SKIP INTRO - Both flippers pressed during intro
  ##############################################
  s_flipper_left_active{current_player.missiles_phase==0 and device.timers.missiles_intro_video_delay.running}:
    - missiles_check_skip_intro
  s_flipper_right_active{current_player.missiles_phase==0 and device.timers.missiles_intro_video_delay.running}:
    - missiles_check_skip_intro

  missiles_check_skip_intro{device.switches.s_flipper_left.state and device.switches.s_flipper_right.state}:
    - missiles_skip_intro

  # SKIP PATH: stop intro timer, release ball, open Phase 1
  missiles_skip_intro:
    - missiles_ball_released
    - missiles_setup_phase_1

  # NORMAL PATH: timer completes -> release ball AND open Phase 1
  timer_missiles_intro_video_delay_complete:
    - missiles_ball_released
    - missiles_setup_phase_1

  ##############################################
  ## DRAIN HANDLING
  ##############################################
  missiles_ball_ending_hold:
    - missiles_failed
    - missiles_drain_detected

  timer_missiles_drain_delay_complete:
    - missiles_drain_cleanup_complete
    - missiles_cleanup

  ##############################################
  ## PHASE 1 - LOCATE
  ## LO/LR/TWR/RR lit green if not yet burned. Only an ALREADY-BURNED
  ## candidate (visibly red) is a bad shot. SP/CNT/TL/TR are never
  ## candidates and are never shown red, so hitting them is a no-op — they
  ## were never marked as anything, good or bad. LL has no effect either.
  ##############################################
  left_orbit_shot_hit{current_player.missiles_phase==1 and current_player.missiles_lo_burned==0}:
    - missiles_locate_hit_lo
    - missiles_locate_success
  left_orbit_shot_hit{current_player.missiles_phase==1 and current_player.missiles_lo_burned==1}:
    - missiles_bad_shot

  s_ramp_left_exit_active{current_player.missiles_phase==1 and current_player.missiles_lr_burned==0}:
    - missiles_locate_hit_lr
    - missiles_locate_success
  s_ramp_left_exit_active{current_player.missiles_phase==1 and current_player.missiles_lr_burned==1}:
    - missiles_bad_shot

  s_ramp_tower_exit_active{current_player.missiles_phase==1 and current_player.missiles_twr_burned==0}:
    - missiles_locate_hit_twr
    - missiles_locate_success
  s_ramp_tower_exit_active{current_player.missiles_phase==1 and current_player.missiles_twr_burned==1}:
    - missiles_bad_shot

  s_ramp_right_exit_active{current_player.missiles_phase==1 and current_player.missiles_rr_burned==0}:
    - missiles_locate_hit_rr
    - missiles_locate_success
  s_ramp_right_exit_active{current_player.missiles_phase==1 and current_player.missiles_rr_burned==1}:
    - missiles_bad_shot

  ##############################################
  ## PHASE 2 - SWEEP setup: pick fast/slow timer by round, first redraw
  ##############################################
  missiles_locate_success{current_player.missiles_round<=2}:
    - missiles_start_sweep_fast
    - missiles_sweep_redraw
  missiles_locate_success{current_player.missiles_round>=3}:
    - missiles_start_sweep_slow
    - missiles_sweep_redraw

  timer_missiles_sweep_timer_fast_complete:
    - missiles_sweep_advance
  timer_missiles_sweep_timer_slow_complete:
    - missiles_sweep_advance

  missiles_sweep_advance:
    - missiles_sweep_redraw

  # Boundary flip — checked off the derived position-changed event, kept
  # separate from the advance itself for the same reason the original
  # window mechanic did: avoids MPF cascading advance+flip+retreat in one tick
  player_missiles_sweep_pos{value==10-current_player.missiles_sweep_width and current_player.missiles_sweep_dir==0}:
    - missiles_sweep_flip_right
  player_missiles_sweep_pos{value==0 and current_player.missiles_sweep_dir==1}:
    - missiles_sweep_flip_left

  # No ramp movement anywhere in this mode — position 7 in the sweep order
  # is TR (s_ramp_inner_exit), reachable as-is with no ramp control needed.

  ##############################################
  ## PHASE 2 SWEEP - shot detection
  ## Any of the 10 positions counts if it's within the current window.
  ## Never a bad shot here — anything outside the window is a no-op.
  ##############################################
  s_lane_left_active{current_player.missiles_phase==2 and current_player.missiles_sweep_pos<=0 and current_player.missiles_sweep_pos+current_player.missiles_sweep_width-1>=0}:
    - missiles_sweep_hit
  left_orbit_shot_hit{current_player.missiles_phase==2 and current_player.missiles_sweep_pos<=1 and current_player.missiles_sweep_pos+current_player.missiles_sweep_width-1>=1}:
    - missiles_sweep_hit
  s_ramp_left_exit_active{current_player.missiles_phase==2 and current_player.missiles_sweep_pos<=2 and current_player.missiles_sweep_pos+current_player.missiles_sweep_width-1>=2}:
    - missiles_sweep_hit
  spinner_shot_made{current_player.missiles_phase==2 and current_player.missiles_sweep_pos<=3 and current_player.missiles_sweep_pos+current_player.missiles_sweep_width-1>=3 and current_player.missiles_spinner_locked==0}:
    - missiles_sweep_hit
  s_barrier_target_active{current_player.missiles_phase==2 and current_player.missiles_sweep_pos<=4 and current_player.missiles_sweep_pos+current_player.missiles_sweep_width-1>=4}:
    - missiles_sweep_hit
  s_ramp_tower_exit_active{current_player.missiles_phase==2 and current_player.missiles_sweep_pos<=5 and current_player.missiles_sweep_pos+current_player.missiles_sweep_width-1>=5}:
    - missiles_sweep_hit
  s_orbit_upper_active{current_player.missiles_phase==2 and current_player.missiles_sweep_pos<=6 and current_player.missiles_sweep_pos+current_player.missiles_sweep_width-1>=6}:
    - missiles_sweep_hit
  s_ramp_inner_exit_active{current_player.missiles_phase==2 and current_player.missiles_sweep_pos<=7 and current_player.missiles_sweep_pos+current_player.missiles_sweep_width-1>=7}:
    - missiles_sweep_hit
  s_flight_gear_target_active{current_player.missiles_phase==2 and current_player.missiles_sweep_pos<=8 and current_player.missiles_sweep_pos+current_player.missiles_sweep_width-1>=8}:
    - missiles_sweep_hit
  s_ramp_right_exit_active{current_player.missiles_phase==2 and current_player.missiles_sweep_pos<=9 and current_player.missiles_sweep_pos+current_player.missiles_sweep_width-1>=9}:
    - missiles_sweep_hit

  ##############################################
  ## PHASE 3 - DESTROY
  ## Only the located target counts as good. Only an ALREADY-BURNED other
  ## candidate (visibly red) is a bad shot. A not-yet-burned other candidate,
  ## or any of SP/CNT/TL/TR, is a no-op — never shown red, never punished.
  ##############################################
  left_orbit_shot_hit{current_player.missiles_phase==3 and current_player.missiles_target==1}:
    - missiles_destroy_success
  left_orbit_shot_hit{current_player.missiles_phase==3 and current_player.missiles_target!=1 and current_player.missiles_lo_burned==1}:
    - missiles_bad_shot

  s_ramp_left_exit_active{current_player.missiles_phase==3 and current_player.missiles_target==2}:
    - missiles_destroy_success
  s_ramp_left_exit_active{current_player.missiles_phase==3 and current_player.missiles_target!=2 and current_player.missiles_lr_burned==1}:
    - missiles_bad_shot

  s_ramp_tower_exit_active{current_player.missiles_phase==3 and current_player.missiles_target==3}:
    - missiles_destroy_success
  s_ramp_tower_exit_active{current_player.missiles_phase==3 and current_player.missiles_target!=3 and current_player.missiles_twr_burned==1}:
    - missiles_bad_shot

  s_ramp_right_exit_active{current_player.missiles_phase==3 and current_player.missiles_target==4}:
    - missiles_destroy_success
  s_ramp_right_exit_active{current_player.missiles_phase==3 and current_player.missiles_target!=4 and current_player.missiles_rr_burned==1}:
    - missiles_bad_shot

  ##############################################
  ## ROUND ADVANCE / MODE COMPLETE
  ## Round advance now happens IMMEDIATELY on the destroy hit (rounds 1-3) —
  ## next round's shots relight right away so the player isn't stuck waiting
  ## for the explosion/video to finish before knowing where to go. The
  ## explosion GI effect still runs on its own real delay, purely cosmetic
  ## now — it no longer gates anything. missiles_destroyed_round captures
  ## which round this was BEFORE the advance, so the delay chain (which
  ## fires seconds later) doesn't accidentally read the already-advanced
  ## round number.
  ##############################################
  missiles_destroy_success:
    - missiles_burn_target
    - missiles_punishment_end
    - orbit_left_safe_return_clear|700ms
    - shaker_rumble

  # Advance immediately (rounds 1-3) — next round's shots light up right away
  missiles_destroy_success{current_player.missiles_round<4}:
    - missiles_setup_next_round

  # Stage 1: flying delay — 4.0s (rounds 1/3/4), 4.5s (round 2). Uses the
  # captured round so this is unaffected by the immediate advance above.
  missiles_destroy_success{current_player.missiles_destroyed_round==1 or current_player.missiles_destroyed_round==3 or current_player.missiles_destroyed_round==4}:
    - missiles_start_flying_a
  missiles_destroy_success{current_player.missiles_destroyed_round==2}:
    - missiles_start_flying_b

  timer_missiles_flying_delay_a_complete:
    - missiles_explosion_start
  timer_missiles_flying_delay_b_complete:
    - missiles_explosion_start

  # Stage 2: explosion delay — 2.5s (round 1/4), 2.75s (round 2), 3.5s (round 3)
  missiles_explosion_start{current_player.missiles_destroyed_round==1 or current_player.missiles_destroyed_round==4}:
    - missiles_start_explosion_a
  missiles_explosion_start{current_player.missiles_destroyed_round==2}:
    - missiles_start_explosion_b
  missiles_explosion_start{current_player.missiles_destroyed_round==3}:
    - missiles_start_explosion_c

  timer_missiles_explosion_delay_a_complete:
    - missiles_explosion_end
  timer_missiles_explosion_delay_b_complete:
    - missiles_explosion_end
  timer_missiles_explosion_delay_c_complete:
    - missiles_explosion_end

  # Stage 3: explosion cleanup only. Round 1-3 advance already happened
  # immediately above — this just restores ambient GI. Round 4 (mode
  # complete) still waits for the full sequence since there's no "next
  # round" to rush toward.
  missiles_explosion_end:
    - missiles_set_gi
  missiles_explosion_end{current_player.missiles_destroyed_round==4}:
    - missiles_complete_bonus
    - missiles_complete

  missiles_setup_next_round:
    - missiles_setup_phase_1

  ##############################################
  ## BAD SHOT PUNISHMENT
  ## Restarts on every additional bad hit; ends early on the next locate or
  ## destroy success. Never fires during Phase 2.
  ##############################################
  missiles_bad_shot{current_player.missiles_complete_flag==0}:
    - missiles_punishment_start

  player_missiles_phase3_bad_count{value==3}:
    - missiles_phase3_frustration_callout

  missiles_punishment_end:
    - missiles_set_gi

  missiles_locate_success:
    - missiles_punishment_end
    - orbit_left_safe_return_clear|700ms

  timer_missiles_punishment_timer_complete:
    - missiles_punishment_end

  ##############################################
  ## LEFT ORBIT SAFE RETURN
  ##############################################
  missiles_setup_phase_1{current_player.missiles_lo_burned==0}:
    - orbit_left_safe_return_arm
  missiles_setup_phase_1{current_player.missiles_lo_burned==1}:
    - orbit_left_safe_return_clear

  missiles_sweep_hit{current_player.missiles_target==1}:
    - orbit_left_safe_return_arm
  missiles_sweep_hit{current_player.missiles_target!=1}:
    - orbit_left_safe_return_clear

  ##############################################
  ## TIMER EXPIRED / MODE COMPLETION AND FAILURE
  ##############################################
  timer_missiles_timer_complete:
    - missiles_failed

  missiles_complete:
    - missiles_cleanup
    - timer_missiles_complete_delay_start
    - missiles_mode_ended

  timer_missiles_complete_delay_complete:
    - missiles_video_complete
    - pilot_mode_cleanup_complete

  missiles_failed:
    - missiles_cleanup
    - timer_missiles_failed_delay_start
    - missiles_mode_ended
    - orbit_left_safe_return_clear

  timer_missiles_failed_delay_complete:
    - missiles_video_complete
    - pilot_mode_cleanup_complete

  ##############################################
  ## MODE CLEANUP
  ##############################################
  missiles_cleanup: {}

  timer_missiles_phase1_frustration_timer_complete:
    - missiles_phase1_frustration_callout
####################################################################################
# RANDOM EVENT PLAYER
# 50/50 pick between the two Phase 1 "hurry up" nag callouts
####################################################################################

random_event_player:
  missiles_phase1_frustration_callout:
    - missiles_frustration_getting_away
    - missiles_frustration_take_the_shot

####################################################################################
# SOUND PLAYER - Voice Callouts ONLY (Music handled in base.yaml)
####################################################################################

sound_player:
  missiles_play_instructions_voice:
    voice_missiles_training_mission_instructions:
      bus: voice
      loops: 0

  missiles_failed:
    voice_missiles_failed:
      bus: voice
      loops: 0

  missiles_complete:
    voice_missiles_completed:
      bus: voice
      loops: 0

  # New round's shots are already lit (immediate), but the callout waits
  # a flat 8s — long enough to cover the explosion sequence regardless of
  # round — before announcing them
  timer_missiles_callout_delay_complete{current_player.missiles_destroyed_round<4}:
    voice_missiles_shoot_the_lit_green_shots:
      bus: voice
      loops: 0

  # Phase 1, 30s with no locate — random nag
  missiles_frustration_getting_away:
    voice_hurry_up_hes_getting_away:
      bus: voice
      loops: 0
  missiles_frustration_take_the_shot:
    voice_take_the_shot_already:
      bus: voice
      loops: 0

  # Phase 3, 3 wrong hits on the same target attempt
  missiles_phase3_frustration_callout:
    voice_are_you_going_to_aim_first:
      bus: voice
      loops: 0

####################################################################################
# SLIDE PLAYER - Mode Slides (Godot GMC)
####################################################################################

slide_player:
  mode_pilot_training_mission_missiles_started:
    missiles_timer:
      action: play
      priority: 1000
    missiles_instructions:
      action: play
      priority: 760
    missiles_shots_remaining:
      action: play
      priority: 800

  missiles_ball_released:
    missiles_instructions:
      action: remove
    missiles_locating_jet:
      action: play
      priority: 750

  ##############################################
  ## PHASE 1 START — background swaps immediately (it's hidden underneath
  ## the still-playing destroy video until that video's own removal at
  ## missiles_explosion_end) — but we do NOT remove the previous round's
  ## step video here, since it needs to keep playing its full duration.
  ##############################################
  missiles_setup_phase_1{current_player.missiles_round==1}:
    missiles_locating_jet:
      action: play
      priority: 750
  missiles_setup_phase_1{current_player.missiles_round==2}:
    missiles_locking_on:
      action: remove
    missiles_locating_jet:
      action: play
      priority: 750
  missiles_setup_phase_1{current_player.missiles_round==3}:
    missiles_locking_on:
      action: remove
    missiles_locating_jet:
      action: play
      priority: 750
  missiles_setup_phase_1{current_player.missiles_round==4}:
    missiles_locking_on:
      action: remove
    missiles_locating_jet:
      action: play
      priority: 750

  ##############################################
  ## LOCATE SUCCESS — swap to the round's first numbered slide (the reward
  ## for finding the jet), same as the original's step_1_shot_hit behavior
  ##############################################
  missiles_locate_success{current_player.missiles_round==1}:
    missiles_locating_jet:
      action: remove
    missiles_locking_on:
      action: play
      priority: 750
    missiles_step_1:
      action: play
      priority: 800
    mode_points_scored:
      action: play
      priority: 840
      expire: 2s
  missiles_locate_success{current_player.missiles_round==2}:
    missiles_locating_jet:
      action: remove
    missiles_locking_on:
      action: play
      priority: 750
    missiles_step_4:
      action: play
      priority: 800
    mode_points_scored:
      action: play
      priority: 840
      expire: 2s
  missiles_locate_success{current_player.missiles_round==3}:
    missiles_locating_jet:
      action: remove
    missiles_locking_on:
      action: play
      priority: 750
    missiles_step_7:
      action: play
      priority: 800
    mode_points_scored:
      action: play
      priority: 840
      expire: 2s
  missiles_locate_success{current_player.missiles_round==4}:
    missiles_locating_jet:
      action: remove
    missiles_locking_on:
      action: play
      priority: 750
    missiles_step_1:
      action: play
      priority: 800
    mode_points_scored:
      action: play
      priority: 840
      expire: 2s

  ##############################################
  ## SWEEP SUCCESS — swap to the round's middle numbered slide
  ##############################################
  missiles_sweep_hit{current_player.missiles_round==1}:
    missiles_step_1:
      action: remove
    missiles_step_2:
      action: play
      priority: 800
  missiles_sweep_hit{current_player.missiles_round==2}:
    missiles_step_4:
      action: remove
    missiles_step_5:
      action: play
      priority: 800
  missiles_sweep_hit{current_player.missiles_round==3}:
    missiles_step_7:
      action: remove
    missiles_step_8:
      action: play
      priority: 800
  missiles_sweep_hit{current_player.missiles_round==4}:
    missiles_step_1:
      action: remove
    missiles_step_2:
      action: play
      priority: 800

  ##############################################
  ## DESTROY VIDEOS — each round's last slide from its original 3-slide set.
  ## Round 4 reuses Round 1's set. Uses missiles_destroyed_round (captured
  ## at the moment of the hit) since the round advance now happens
  ## immediately — missiles_round itself may have already ticked forward
  ## by the time this same event's other handlers run.
  ##############################################
  missiles_destroy_success{current_player.missiles_destroyed_round==1}:
    missiles_step_2:
      action: remove
    missiles_step_3:
      action: play
      priority: 800
    mode_points_scored:
      action: play
      priority: 840
      expire: 2s

  missiles_destroy_success{current_player.missiles_destroyed_round==2}:
    missiles_step_5:
      action: remove
    missiles_step_6:
      action: play
      priority: 800
    mode_points_scored:
      action: play
      priority: 840
      expire: 2s

  missiles_destroy_success{current_player.missiles_destroyed_round==3}:
    missiles_step_8:
      action: remove
    missiles_step_9:
      action: play
      priority: 800
    mode_points_scored:
      action: play
      priority: 840
      expire: 2s

  missiles_destroy_success{current_player.missiles_destroyed_round==4}:
    missiles_step_2:
      action: remove
    missiles_step_3:
      action: play
      priority: 800
    mode_points_scored:
      action: play
      priority: 840
      expire: 2s

  # Destroy video is removed once the explosion sequence naturally finishes
  # (not immediately at round-advance) — this is what reveals the
  # already-swapped locating_jet background underneath.
  missiles_explosion_end{current_player.missiles_destroyed_round==1}:
    missiles_step_3:
      action: remove
  missiles_explosion_end{current_player.missiles_destroyed_round==2}:
    missiles_step_6:
      action: remove
  missiles_explosion_end{current_player.missiles_destroyed_round==3}:
    missiles_step_9:
      action: remove
  missiles_explosion_end{current_player.missiles_destroyed_round==4}:
    missiles_step_3:
      action: remove

  missiles_complete:
    missiles_step_3:
      action: remove
    missiles_timer:
      action: remove
    missiles_shots_remaining:
      action: remove
    missiles_mode_won:
      action: play
      priority: 900
    missiles_perk_active:
      action: play
      priority: 850

  ##############################################
  ## Failure - remove HUD slides
  ##############################################
  missiles_failed:
    missiles_timer:
      action: remove
    missiles_instructions:
      action: remove
    missiles_locating_jet:
      action: remove
    missiles_locking_on:
      action: remove
    missiles_step_1:
      action: remove
    missiles_step_2:
      action: remove
    missiles_step_3:
      action: remove
    missiles_step_4:
      action: remove
    missiles_step_5:
      action: remove
    missiles_step_6:
      action: remove
    missiles_step_7:
      action: remove
    missiles_step_8:
      action: remove
    missiles_step_9:
      action: remove
    missiles_shots_remaining:
      action: remove

  # Safety cleanup on mode stop
  mode_pilot_training_mission_missiles_stopped:
    missiles_timer:
      action: remove
    missiles_instructions:
      action: remove
    missiles_locating_jet:
      action: remove
    missiles_locking_on:
      action: remove
    missiles_step_1:
      action: remove
    missiles_step_2:
      action: remove
    missiles_step_3:
      action: remove
    missiles_step_4:
      action: remove
    missiles_step_5:
      action: remove
    missiles_step_6:
      action: remove
    missiles_step_7:
      action: remove
    missiles_step_8:
      action: remove
    missiles_step_9:
      action: remove
    missiles_shots_remaining:
      action: remove
    missiles_perk_active:
      action: remove
####################################################################################
# SHOW PLAYER - Flashing shot lights and GI effects
####################################################################################

show_player:
  ##############################################
  ## MISSILES INSERT - White pulse during mode play
  ##############################################
  missiles_ball_released:
    missles_insert_pulse:
      show: missles_pulse
      loops: -1
      speed: 1
      show_tokens:
        led: l_mode_missles
        color: white
      key: missles_pulse

  ##############################################
  ## PHASE 1 - LOCATE: flash whichever of LO/LR/TWR/RR aren't burned yet.
  ## Stops any leftover Phase 3 target flash first.
  ##############################################
  missiles_setup_phase_1:
    stop_target_flash0:
      show: sync_flash_mode
      action: stop
      key: mode_target_flash

  missiles_setup_phase_1{current_player.missiles_lo_burned==0}:
    locate_lo_flash:
      show: sync_flash_mode
      key: mode_locate_lo
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_left_orbit, color: 00FF00 }
  missiles_setup_phase_1{current_player.missiles_lr_burned==0}:
    locate_lr_flash:
      show: sync_flash_mode
      key: mode_locate_lr
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_left_ramp, color: 00FF00 }
  missiles_setup_phase_1{current_player.missiles_twr_burned==0}:
    locate_twr_flash:
      show: sync_flash_mode
      key: mode_locate_twr
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_tower_ramp, color: 00FF00 }
  missiles_setup_phase_1{current_player.missiles_rr_burned==0}:
    locate_rr_flash:
      show: sync_flash_mode
      key: mode_locate_rr
      sync_ms: 1000
      loops: -1
      show_tokens: { led: l_shot_right_orbit, color: 00FF00 }

  # Stop the flash on whichever shot was just burned (solid red set via
  # light_player below, not a show — no animation needed for "permanently bad")
  missiles_burn_target{current_player.missiles_target==1}:
    stop_locate_lo: { show: sync_flash_mode, action: stop, key: mode_locate_lo }
  missiles_burn_target{current_player.missiles_target==2}:
    stop_locate_lr: { show: sync_flash_mode, action: stop, key: mode_locate_lr }
  missiles_burn_target{current_player.missiles_target==3}:
    stop_locate_twr: { show: sync_flash_mode, action: stop, key: mode_locate_twr }
  missiles_burn_target{current_player.missiles_target==4}:
    stop_locate_rr: { show: sync_flash_mode, action: stop, key: mode_locate_rr }

  # Leaving Phase 1 (locate succeeded) — stop the other 3 candidate flashes;
  # the burn handler above already stopped the one that was just hit
  missiles_locate_success:
    stop_locate_lo2: { show: sync_flash_mode, action: stop, key: mode_locate_lo }
    stop_locate_lr2: { show: sync_flash_mode, action: stop, key: mode_locate_lr }
    stop_locate_twr2: { show: sync_flash_mode, action: stop, key: mode_locate_twr }
    stop_locate_rr2: { show: sync_flash_mode, action: stop, key: mode_locate_rr }

  ##############################################
  ## PHASE 3 - DESTROY: flash only the located target — GREEN (good shot).
  ## Red is reserved for burned/bad shots so the player can always tell
  ## which one is safe to hit.
  ##############################################
  missiles_sweep_hit{current_player.missiles_target==1}:
    target_flash: { show: sync_flash_mode, key: mode_target_flash, sync_ms: 500, loops: -1, show_tokens: { led: l_shot_left_orbit, color: 00FF00 } }
  missiles_sweep_hit{current_player.missiles_target==2}:
    target_flash: { show: sync_flash_mode, key: mode_target_flash, sync_ms: 500, loops: -1, show_tokens: { led: l_shot_left_ramp, color: 00FF00 } }
  missiles_sweep_hit{current_player.missiles_target==3}:
    target_flash: { show: sync_flash_mode, key: mode_target_flash, sync_ms: 500, loops: -1, show_tokens: { led: l_shot_tower_ramp, color: 00FF00 } }
  missiles_sweep_hit{current_player.missiles_target==4}:
    target_flash: { show: sync_flash_mode, key: mode_target_flash, sync_ms: 500, loops: -1, show_tokens: { led: l_shot_right_orbit, color: 00FF00 } }

  missiles_destroy_success:
    stop_target_flash: { show: sync_flash_mode, action: stop, key: mode_target_flash }

  missiles_explosion_start:
    explosion_gi: { show: missiles_explosion_gi, key: gi_effect, loops: -1 }

  missiles_explosion_end:
    stop_explosion_gi: { show: missiles_explosion_gi, action: stop, key: gi_effect }

  ##############################################
  ## BAD SHOT PUNISHMENT — rainbow chase (defined in shows: below) + red GI
  ##############################################
  missiles_punishment_start:
    rainbow_punishment:
      show: missiles_rainbow_punishment
      key: missiles_punishment_effect
      loops: -1
    gi_penalty:
      show: missiles_gi_penalty_strobe
      key: missiles_penalty_gi_effect
      loops: -1

  missiles_punishment_end:
    stop_rainbow: { show: missiles_rainbow_punishment, action: stop, key: missiles_punishment_effect }
    stop_gi_penalty: { show: missiles_gi_penalty_strobe, action: stop, key: missiles_penalty_gi_effect }
####################################################################################
# LIGHT PLAYER
####################################################################################

light_player:
  ##############################################
  ## GI Color - Cyan (odd) and White (even) - cyan = GRB-swapped cyan
  ##############################################
  missiles_set_gi:
    l_gi_light_1: { color: cyan, fade: 0ms }
    l_gi_light_2: { color: white, fade: 0ms }
    l_gi_light_3: { color: cyan, fade: 0ms }
    l_gi_light_4: { color: white, fade: 0ms }
    l_gi_light_5: { color: cyan, fade: 0ms }
    l_gi_light_6: { color: white, fade: 0ms }
    l_gi_light_7: { color: cyan, fade: 0ms }
    l_gi_light_8: { color: white, fade: 0ms }
    l_gi_light_9: { color: cyan, fade: 0ms }
    l_gi_light_10: { color: white, fade: 0ms }
    l_gi_light_11: { color: cyan, fade: 0ms }
    l_gi_light_12: { color: white, fade: 0ms }
    l_gi_light_13: { color: cyan, fade: 0ms }
    l_gi_light_14: { color: white, fade: 0ms }
    l_gi_light_15: { color: cyan, fade: 0ms }
    l_gi_light_16: { color: white, fade: 0ms }
    l_gi_light_17: { color: cyan, fade: 0ms }
    l_gi_light_18: { color: white, fade: 0ms }
    l_gi_light_19: { color: cyan, fade: 0ms }
    l_gi_light_20: { color: white, fade: 0ms }
    l_gi_light_21: { color: cyan, fade: 0ms }
    l_gi_light_22: { color: white, fade: 0ms }
    l_gi_light_23: { color: cyan, fade: 0ms }
    l_gi_light_24: { color: white, fade: 0ms }
    l_gi_light_25: { color: cyan, fade: 0ms }
    l_gi_light_26: { color: white, fade: 0ms }
    l_gi_light_27: { color: cyan, fade: 0ms }
    l_apron_light_1: { color: cyan, fade: 0ms }
    l_apron_light_2: { color: white, fade: 0ms }
    l_apron_light_3: { color: cyan, fade: 0ms }
    l_apron_light_4: { color: white, fade: 0ms }

  ##############################################
  ## BURNED SHOTS - solid red, permanent for the rest of the mode
  ##############################################
  missiles_burn_target{current_player.missiles_target==1}:
    l_shot_left_orbit: { color: FF0000, fade: 0ms }
  missiles_burn_target{current_player.missiles_target==2}:
    l_shot_left_ramp: { color: FF0000, fade: 0ms }
  missiles_burn_target{current_player.missiles_target==3}:
    l_shot_tower_ramp: { color: FF0000, fade: 0ms }
  missiles_burn_target{current_player.missiles_target==4}:
    l_shot_right_orbit: { color: FF0000, fade: 0ms }

  # Re-assert burned reds at the start of every Phase 1 — Phase 2's sweep
  # redraw may have overwritten them while the window passed over that light
  missiles_setup_phase_1{current_player.missiles_lo_burned==1}:
    l_shot_left_orbit: { color: FF0000, fade: 0ms }
  missiles_setup_phase_1{current_player.missiles_lr_burned==1}:
    l_shot_left_ramp: { color: FF0000, fade: 0ms }
  missiles_setup_phase_1{current_player.missiles_twr_burned==1}:
    l_shot_tower_ramp: { color: FF0000, fade: 0ms }
  missiles_setup_phase_1{current_player.missiles_rr_burned==1}:
    l_shot_right_orbit: { color: FF0000, fade: 0ms }

  # Same re-assertion needed entering Phase 3 — Phase 2's sweep redraw runs
  # right up until the moment of the sweep hit
  missiles_sweep_hit{current_player.missiles_lo_burned==1}:
    l_shot_left_orbit: { color: FF0000, fade: 0ms }
  missiles_sweep_hit{current_player.missiles_lr_burned==1}:
    l_shot_left_ramp: { color: FF0000, fade: 0ms }
  missiles_sweep_hit{current_player.missiles_twr_burned==1}:
    l_shot_tower_ramp: { color: FF0000, fade: 0ms }
  missiles_sweep_hit{current_player.missiles_rr_burned==1}:
    l_shot_right_orbit: { color: FF0000, fade: 0ms }

  # Clear every sweep position to off when Phase 3 begins — the sweep timer
  # is stopped now too (see timers:), but this makes sure nothing is still
  # showing green from the last redraw before the target's own red flash
  # (in show_player) takes over. Burned shots are excluded here by
  # condition (not by ordering) so they can't get their red overwritten
  # depending on which of these fires first.
  missiles_sweep_hit:
    l_shot_left_lane: { color: off, fade: 0ms }
    l_shot_spinner: { color: off, fade: 0ms }
    l_shot_barrier: { color: off, fade: 0ms }
    l_shot_upper_orbit: { color: off, fade: 0ms }
    l_shot_middle_ramp: { color: off, fade: 0ms }
    l_shot_pilot_gear: { color: off, fade: 0ms }
  missiles_sweep_hit{current_player.missiles_lo_burned==0 and current_player.missiles_target!=1}:
    l_shot_left_orbit: { color: off, fade: 0ms }
  missiles_sweep_hit{current_player.missiles_lr_burned==0 and current_player.missiles_target!=2}:
    l_shot_left_ramp: { color: off, fade: 0ms }
  missiles_sweep_hit{current_player.missiles_twr_burned==0 and current_player.missiles_target!=3}:
    l_shot_tower_ramp: { color: off, fade: 0ms }
  missiles_sweep_hit{current_player.missiles_rr_burned==0 and current_player.missiles_target!=4}:
    l_shot_right_orbit: { color: off, fade: 0ms }

  ##############################################
  ## PHASE 2 SWEEP - redraw all 10 positions on every tick/setup
  ## Fires on missiles_sweep_redraw. General condition works for any
  ## window width without needing per-width duplication.
  ##############################################
  missiles_sweep_redraw{current_player.missiles_sweep_pos<=0 and current_player.missiles_sweep_pos+current_player.missiles_sweep_width-1>=0}:
    l_shot_left_lane:
      color: 00FF00
      fade: 0ms
  missiles_sweep_redraw{not (current_player.missiles_sweep_pos<=0 and current_player.missiles_sweep_pos+current_player.missiles_sweep_width-1>=0)}:
    l_shot_left_lane:
      color: off
      fade: 0ms
  missiles_sweep_redraw{current_player.missiles_sweep_pos<=1 and current_player.missiles_sweep_pos+current_player.missiles_sweep_width-1>=1}:
    l_shot_left_orbit:
      color: 00FF00
      fade: 0ms
  missiles_sweep_redraw{not (current_player.missiles_sweep_pos<=1 and current_player.missiles_sweep_pos+current_player.missiles_sweep_width-1>=1)}:
    l_shot_left_orbit:
      color: off
      fade: 0ms
  missiles_sweep_redraw{current_player.missiles_sweep_pos<=2 and current_player.missiles_sweep_pos+current_player.missiles_sweep_width-1>=2}:
    l_shot_left_ramp:
      color: 00FF00
      fade: 0ms
  missiles_sweep_redraw{not (current_player.missiles_sweep_pos<=2 and current_player.missiles_sweep_pos+current_player.missiles_sweep_width-1>=2)}:
    l_shot_left_ramp:
      color: off
      fade: 0ms
  missiles_sweep_redraw{current_player.missiles_sweep_pos<=3 and current_player.missiles_sweep_pos+current_player.missiles_sweep_width-1>=3}:
    l_shot_spinner:
      color: 00FF00
      fade: 0ms
  missiles_sweep_redraw{not (current_player.missiles_sweep_pos<=3 and current_player.missiles_sweep_pos+current_player.missiles_sweep_width-1>=3)}:
    l_shot_spinner:
      color: off
      fade: 0ms
  missiles_sweep_redraw{current_player.missiles_sweep_pos<=4 and current_player.missiles_sweep_pos+current_player.missiles_sweep_width-1>=4}:
    l_shot_barrier:
      color: 00FF00
      fade: 0ms
  missiles_sweep_redraw{not (current_player.missiles_sweep_pos<=4 and current_player.missiles_sweep_pos+current_player.missiles_sweep_width-1>=4)}:
    l_shot_barrier:
      color: off
      fade: 0ms
  missiles_sweep_redraw{current_player.missiles_sweep_pos<=5 and current_player.missiles_sweep_pos+current_player.missiles_sweep_width-1>=5}:
    l_shot_tower_ramp:
      color: 00FF00
      fade: 0ms
  missiles_sweep_redraw{not (current_player.missiles_sweep_pos<=5 and current_player.missiles_sweep_pos+current_player.missiles_sweep_width-1>=5)}:
    l_shot_tower_ramp:
      color: off
      fade: 0ms
  missiles_sweep_redraw{current_player.missiles_sweep_pos<=6 and current_player.missiles_sweep_pos+current_player.missiles_sweep_width-1>=6}:
    l_shot_upper_orbit:
      color: 00FF00
      fade: 0ms
  missiles_sweep_redraw{not (current_player.missiles_sweep_pos<=6 and current_player.missiles_sweep_pos+current_player.missiles_sweep_width-1>=6)}:
    l_shot_upper_orbit:
      color: off
      fade: 0ms
  missiles_sweep_redraw{current_player.missiles_sweep_pos<=7 and current_player.missiles_sweep_pos+current_player.missiles_sweep_width-1>=7}:
    l_shot_middle_ramp:
      color: 00FF00
      fade: 0ms
  missiles_sweep_redraw{not (current_player.missiles_sweep_pos<=7 and current_player.missiles_sweep_pos+current_player.missiles_sweep_width-1>=7)}:
    l_shot_middle_ramp:
      color: off
      fade: 0ms
  missiles_sweep_redraw{current_player.missiles_sweep_pos<=8 and current_player.missiles_sweep_pos+current_player.missiles_sweep_width-1>=8}:
    l_shot_pilot_gear:
      color: 00FF00
      fade: 0ms
  missiles_sweep_redraw{not (current_player.missiles_sweep_pos<=8 and current_player.missiles_sweep_pos+current_player.missiles_sweep_width-1>=8)}:
    l_shot_pilot_gear:
      color: off
      fade: 0ms
  missiles_sweep_redraw{current_player.missiles_sweep_pos<=9 and current_player.missiles_sweep_pos+current_player.missiles_sweep_width-1>=9}:
    l_shot_right_orbit:
      color: 00FF00
      fade: 0ms
  missiles_sweep_redraw{not (current_player.missiles_sweep_pos<=9 and current_player.missiles_sweep_pos+current_player.missiles_sweep_width-1>=9)}:
    l_shot_right_orbit:
      color: off
      fade: 0ms
####################################################################################
# COIL PLAYER
####################################################################################

coil_player:
  # Hold ball at left lane post during intro video
  mode_pilot_training_mission_missiles_started:
    c_left_lane_up_post:
      action: enable

  # Release ball after intro (or skip)
  missiles_ball_released:
    c_left_lane_up_post:
      action: disable

  # Mode cleanup - disable post
  missiles_cleanup:
    c_left_lane_up_post:
      action: disable

  # Safety - disable post on mode stop
  mode_pilot_training_mission_missiles_will_stop:
    c_left_lane_up_post:
      action: disable

