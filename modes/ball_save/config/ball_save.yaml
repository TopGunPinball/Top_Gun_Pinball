#config_version=6

##############################################################################
# BALL SAVE MODE - Top Gun Pinball
##############################################################################
#
# This mode manages ball save functionality with:
#   - Accelerating "shoot again" light flash as timer decreases
#   - Two types of ball saves: new_ball and mode
#   - Scoop eject safety save (5 seconds after every scoop kick)
#   - Auto-plunger for saved balls
#   - Godot scene "ball_saved" for new ball saves
#
# CONSECUTIVE BALL SAVE VIDEO ROUTING:
#   - 1st save in 20s window: ball_saved scene + starts 20s window timer
#   - 2nd save in same window: ball_saved_2 scene (timer keeps running)
#   - 3rd save in same window: ball_saved_3 scene (counter resets)
#   - 4th save (still in window): cycles back to ball_saved
#   - 5th save: ball_saved_2, etc.
#   - Window timer is NEVER restarted by saves 2/3/4/5 - only resets when it
#     naturally expires after the full 20s from save #1.
#
# LIGHT PATTERN:
#   - Flash speed = time_remaining * 100ms (faster as time runs out)
#   - Last 2 seconds: light OFF (grace period feel)
#
# >>> To change the standard MODE ball save duration used by all pilot
#     missions, see the "mode_ball_save_countdown" timer at the top of the
#     TIMERS section immediately below (single start_value, currently 10s). <<<
#
##############################################################################

mode:
  start_events: ball_starting
  stop_events: ball_ending
  priority: 150                   # Above base (100), below most modes

##############################################################################
# TIMERS
##############################################################################
timers:
  ##############################################################################
  # ⚙️  STANDARD MODE BALL SAVE DURATION — CHANGE HERE ONLY  ⚙️
  # ──────────────────────────────────────────────────────────────────────────
  # This ONE number (start_value below) controls the ball save duration for
  # EVERY mode in the game that fires the plain "ball_save_mode_timer_start"
  # event. To change the standard save time across all 25+ modes, edit the
  # start_value on the line below — nothing else needs to change.
  #
  # Mode-side usage (this is the entire integration — one line):
  #   event_player:
  #     xxx_ball_released:
  #       - ball_save_mode_timer_start
  #
  # NOTE: There is no per-mode override anymore — posting the event with a
  # 'time:' parameter no longer has any effect. If a specific mode ever needs
  # a genuinely different duration than the shared standard, that requires a
  # config change here (a second timer/device), not just an event parameter.
  ##############################################################################
  mode_ball_save_countdown:
    start_value: 10                # <-- THE SINGLE SOURCE OF TRUTH. Change duration here.
    end_value: 0
    direction: down
    tick_interval: 1s
    control_events:
      # Guarded so a standard request never SHORTENS a longer save that is
      # already running (e.g. Mystery Award's 30s). If less than start_value
      # remains (or the timer isn't running), it restarts exactly as before.
      - event: ball_save_mode_timer_start{device.timers.mode_ball_save_countdown.running==False or device.timers.mode_ball_save_countdown.ticks<device.timers.mode_ball_save_countdown.start_value}
        action: restart             # Resets to start_value above. No 'value:' override.
      # MYSTERY AWARD 30s SAVE: posted 100ms after ball_save_mode_timer_start
      # (which enables mode_ball_save, starts this timer and the flash), then
      # jumps the remaining time up to 30. Change the 30 here to adjust.
      - event: ball_save_mystery_extend
        action: jump
        value: 30
      - event: ball_save_mode_ball_save_disabled
        action: stop

  # Main ball save countdown timer (20 seconds for new ball save)
  # IMPORTANT: MPF ball_saves device event format is ball_save_<device_name>_<event>
  # So for device "new_ball_save", events are ball_save_new_ball_save_enabled, etc.
  ball_save_countdown:
    start_value: 20
    end_value: 0
    direction: down
    tick_interval: 1s
    control_events:
      - event: ball_save_new_ball_save_timer_start
        action: restart
      - event: ball_save_new_ball_save_disabled
        action: stop

  # Scoop eject safety save countdown (5 seconds)
  scoop_save_countdown:
    start_value: 5
    end_value: 0
    direction: down
    tick_interval: 1s
    control_events:
      - event: ball_save_scoop_eject_save_timer_start
        action: restart
      - event: ball_save_scoop_eject_save_disabled
        action: stop

  # Auto-plunger delay - 1.25 seconds after saved ball settles on shooter lane
  # Gated by ball_just_saved==1 so it does NOT fire during skillshot
  # If MPF's auto_launch fires first, ball leaves and s_shooter_lane_inactive stops timer
  ball_save_auto_plunger_delay:
    start_value: 0
    end_value: 5
    direction: up
    tick_interval: 250ms
    control_events:
      - event: s_shooter_lane_active{current_player.ball_just_saved==1}
        action: restart
      - event: s_shooter_lane_inactive
        action: stop

  # Tracks the 20-second consecutive ball save window
  # Starts on FIRST save only (counter==0); does NOT restart on 2nd/3rd/4th saves
  # Counter resets to 0 when this timer completes (cycle starts fresh next save)
  consecutive_save_window:
    start_value: 20
    end_value: 0
    direction: down
    tick_interval: 1s
    control_events:
      - event: consecutive_save_window_start
        action: restart

##############################################################################
# EVENT PLAYER
##############################################################################
event_player:
  ##############################################################################
  # NEW BALL SAVE - Enable at start of ball
  # The ball save device handles timing automatically via its own timer
  # Our timer is just for the light show
  ##############################################################################
  mode_ball_save_started:
    - ball_save_new_ball_enable
  
  # Start the ball save timer when ball leaves shooter lane
  # This triggers the ball_save device's timer_start_events, which posts
  # ball_save_new_ball_save_timer_start (used by our light show timer)
  s_shooter_lane_inactive{device.ball_saves.new_ball_save.enabled==True}:
    - ball_save_new_ball_timer_start

  ##############################################################################
  # END NEW BALL SAVE WHEN A TRAINING MISSION STARTS
  # Starting a mode is a deliberate game decision, so the new-ball save is no
  # longer needed. Scoop entry (pilot missions) is handled directly in
  # new_ball_save's disable_events (config_ball_saves.yaml). Training
  # missions start from the left lane, so they're caught here instead.
  #   - training_mission_active is set to 1 by every training mission; this
  #     generic catch also covers any training missions added later.
  #   - Explicit mode_started events are belt-and-braces for the current five.
  # Disabling an already-disabled ball save is a no-op, so duplicates are safe.
  ##############################################################################
  player_training_mission_active{value==1}:
    - ball_save_new_ball_disable
  mode_pilot_training_mission_afterburner_started:
    - ball_save_new_ball_disable
  mode_pilot_training_mission_dogfight_started:
    - ball_save_new_ball_disable
  mode_pilot_training_mission_inverted_started:
    - ball_save_new_ball_disable
  mode_pilot_training_mission_missiles_started:
    - ball_save_new_ball_disable
  mode_pilot_training_mission_wingman_started:
    - ball_save_new_ball_disable

  # New ball save ended early (scoop hit / training mission start) — the
  # ball_save_countdown timer is STOPPED (not completed) by the disable, so
  # timer_ball_save_countdown_complete never fires to kill the flash.
  # Stop it here unless mode_ball_save has already taken over the light.
  ball_save_new_ball_save_disabled{device.ball_saves.mode_ball_save.enabled==False}:
    - ball_save_flash_stop
  
  ##############################################################################
  # CONSECUTIVE BALL SAVE VIDEO ROUTING
  # Routes to ball_saved / ball_saved_2 / ball_saved_3 based on counter.
  # MPF's auto_launch handles plunger automatically.
  # MPF event: ball_save_<device_name>_saving_ball
  # Increment runs via separate event so condition always sees pre-increment value.
  ##############################################################################
  
  # First save (counter==0): play ball_saved + start 20s window
  ball_save_new_ball_save_saving_ball{current_player.consecutive_ball_saves==0}:
    - ball_saved_scene_play
    - consecutive_save_window_start
    - consecutive_save_did_count

  # Second save (counter==1): play ball_saved_2 (timer keeps running, NOT restarted)
  ball_save_new_ball_save_saving_ball{current_player.consecutive_ball_saves==1}:
    - ball_saved_2_scene_play
    - consecutive_save_did_count

  # Third save (counter==2): play ball_saved_3, then reset counter so #4 cycles back to ball_saved
  ball_save_new_ball_save_saving_ball{current_player.consecutive_ball_saves==2}:
    - ball_saved_3_scene_play
    - consecutive_save_reset

  ##############################################################################
  # MODE BALL SAVE - Events for modes to use
  ##############################################################################
  # Mode ball save is enabled automatically when ball_save_mode_timer_start event is posted
  # (see ball_saves config - enable_events: ball_save_mode_timer_start)

  ##############################################################################
  # MYSTERY AWARD - 30 SECOND BALL SAVE
  # mystery_award.yaml sets mystery_ball_save_pending=1 when this award is
  # picked. It can't start the save itself on mode_mystery_award_stopped:
  # a mode's own config players are removed before its *_stopped event is
  # posted, so that handler never fired. ball_save runs all ball, so it
  # catches the event here once the ball is back on the playfield.
  # Reuses mode_ball_save (not a new device) so every existing gate on
  # mode_ball_save.enabled keeps preventing double-ejects with the other saves.
  ##############################################################################
  mode_mystery_award_stopped{current_player.mystery_ball_save_pending==1}:
    - ball_save_mode_timer_start
    - ball_save_mystery_extend|100ms

  # When mode ball save catches a drain, play the same ball_saved / _2 / _3
  # scene routing as new_ball_save, sharing the same consecutive-save counter
  # and 20s window (see CONSECUTIVE BALL SAVE VIDEO ROUTING above). Ball
  # save stays active afterward — MPF's balls_to_save: -1 means it keeps
  # running for the rest of the timer, unlike scoop_eject_save's single use.
  ball_save_mode_ball_save_saving_ball{current_player.consecutive_ball_saves==0}:
    - ball_saved_scene_play
    - consecutive_save_window_start
    - consecutive_save_did_count

  ball_save_mode_ball_save_saving_ball{current_player.consecutive_ball_saves==1}:
    - ball_saved_2_scene_play
    - consecutive_save_did_count

  ball_save_mode_ball_save_saving_ball{current_player.consecutive_ball_saves==2}:
    - ball_saved_3_scene_play
    - consecutive_save_reset

  ##############################################################################
  # NEW BALL SAVE LIGHT FLASH - Based on timer value (10 second duration)
  ##############################################################################
  # Timer ticks - update flash speed based on remaining time
  # 10-9 seconds: Slow flash
  timer_ball_save_countdown_tick{ticks>=9}:
    - ball_save_flash_slow
  
  # 8-7 seconds: Medium-slow flash
  timer_ball_save_countdown_tick{ticks>=7 and ticks<9}:
    - ball_save_flash_medium_slow
  
  # 6-5 seconds: Medium flash  
  timer_ball_save_countdown_tick{ticks>=5 and ticks<7}:
    - ball_save_flash_medium
  
  # 4-3 seconds: Fast flash
  timer_ball_save_countdown_tick{ticks>=3 and ticks<5}:
    - ball_save_flash_fast
  
  # 2-0 seconds: Light OFF (grace period)
  timer_ball_save_countdown_tick{ticks<3}:
    - ball_save_flash_off
  
  # Timer complete - ensure light is off
  timer_ball_save_countdown_complete:
    - ball_save_flash_stop

  ##############################################################################
  # MODE BALL SAVE LIGHT FLASH - Variable duration
  # Uses same speed tiers but adapts to any duration
  ##############################################################################
  # Slow flash when plenty of time remains (9+ seconds)
  timer_mode_ball_save_countdown_tick{ticks>=9}:
    - ball_save_flash_slow
  
  # Medium-slow flash (7-8 seconds)
  timer_mode_ball_save_countdown_tick{ticks>=7 and ticks<9}:
    - ball_save_flash_medium_slow
  
  # Medium flash (5-6 seconds)
  timer_mode_ball_save_countdown_tick{ticks>=5 and ticks<7}:
    - ball_save_flash_medium
  
  # Fast flash (3-4 seconds)
  timer_mode_ball_save_countdown_tick{ticks>=3 and ticks<5}:
    - ball_save_flash_fast
  
  # Grace period (0-2 seconds) - Light OFF
  timer_mode_ball_save_countdown_tick{ticks<3}:
    - ball_save_flash_off
  
  # Timer complete - stop light
  timer_mode_ball_save_countdown_complete:
    - ball_save_flash_stop

  ##############################################################################
  # SCOOP EJECT SAVE LIGHT FLASH - 5 second duration
  # Starts medium, speeds up, grace period at end
  #
  # PRIORITY: mode_ball_save AND new_ball_save both win the shared flash
  # display over scoop_eject_save when active (new_ball_save can overlap it
  # via a virtual lock award early in the ball) (mode save is the "real" one the
  # player cares about; scoop save is just a silent safety net). Every rule
  # below is gated with mode_ball_save AND new_ball_save enabled==False so
  # scoop's ticks (including its own grace-period "off") never clobber a
  # concurrently-running mode or new-ball save's flash.
  ##############################################################################
  # 5-4 seconds: Medium flash
  timer_scoop_save_countdown_tick{ticks>=4 and device.ball_saves.mode_ball_save.enabled==False and device.ball_saves.new_ball_save.enabled==False}:
    - ball_save_flash_medium

  # 3 seconds: Fast flash
  timer_scoop_save_countdown_tick{ticks>=3 and ticks<4 and device.ball_saves.mode_ball_save.enabled==False and device.ball_saves.new_ball_save.enabled==False}:
    - ball_save_flash_fast

  # 2-0 seconds: Light OFF (grace period)
  timer_scoop_save_countdown_tick{ticks<3 and device.ball_saves.mode_ball_save.enabled==False and device.ball_saves.new_ball_save.enabled==False}:
    - ball_save_flash_off

  # Timer complete - stop light (only if mode/new-ball save isn't still running)
  timer_scoop_save_countdown_complete{device.ball_saves.mode_ball_save.enabled==False and device.ball_saves.new_ball_save.enabled==False}:
    - ball_save_flash_stop

##############################################################################
# VARIABLE PLAYER
##############################################################################
variable_player:
  # Track ball save state for debugging/display
  player_added:
    ball_save_active:
      action: set
      int: 0
    ball_save_time_remaining:
      action: set
      int: 0
    ball_just_saved:
      action: set
      int: 0
    consecutive_ball_saves:
      action: set
      int: 0
  
  # Reset consecutive save counter at the start of every ball
  # (timer dies when mode stops on ball_ending; counter would otherwise persist)
  mode_ball_save_started:
    consecutive_ball_saves:
      action: set
      int: 0

  # Increment counter via separate event so the conditional handlers above
  # always evaluate against the pre-increment value
  consecutive_save_did_count:
    consecutive_ball_saves:
      action: add
      int: 1

  # After the third save, reset counter so save #4 starts the cycle over
  # (without restarting the 20s window timer)
  consecutive_save_reset:
    consecutive_ball_saves:
      action: set
      int: 0

  # Mystery Award save consumed — clear the pending flag. Cleared on the
  # delayed extend event (not mode_mystery_award_stopped itself) so it can't
  # race the event_player condition that reads it on that same event.
  ball_save_mystery_extend:
    mystery_ball_save_pending:
      action: set
      int: 0

  # Reset counter when the 20-second window expires
  timer_consecutive_save_window_complete:
    consecutive_ball_saves:
      action: set
      int: 0

  ##############################################################################
  # ball_save_active is a COUNT of currently-active save devices, not a flag.
  # Reason: multiple saves (e.g. scoop_eject_save + mode_ball_save) run
  # concurrently and finish at different times. If each device unconditionally
  # SET this to 0 on its own disable, whichever save happened to finish first
  # would incorrectly zero it out while a longer save was still running (this
  # is exactly what happened before this fix — scoop_eject_save's 5s disable
  # was clobbering mode_ball_save's still-active 10s window). Using add/-1
  # instead of set means it only reaches 0 when the LAST active save ends.
  ##############################################################################
  # MPF event format: ball_save_<device_name>_enabled/disabled
  ball_save_new_ball_save_enabled:
    ball_save_active:
      action: add
      int: 1
  
  ball_save_new_ball_save_disabled:
    ball_save_active:
      action: add
      int: -1
  
  ball_save_mode_ball_save_enabled:
    ball_save_active:
      action: add
      int: 1
  
  ball_save_mode_ball_save_disabled:
    ball_save_active:
      action: add
      int: -1

  ball_save_scoop_eject_save_enabled:
    ball_save_active:
      action: add
      int: 1

  ball_save_scoop_eject_save_disabled:
    ball_save_active:
      action: add
      int: -1
  
  # Set flag when ball is saved (for skillshot mode to check)
  # This prevents skillshot from showing when a saved ball returns to shooter lane
  ball_save_new_ball_save_saving_ball:
    ball_just_saved:
      action: set
      int: 1
  
  ball_save_mode_ball_save_saving_ball:
    ball_just_saved:
      action: set
      int: 1

  ball_save_scoop_eject_save_saving_ball:
    ball_just_saved:
      action: set
      int: 1

  ball_save_ejection_seat_ball_save_saving_ball:
    ball_just_saved:
      action: set
      int: 1

  ball_save_orbit_left_safe_return_save_saving_ball:
    ball_just_saved:
      action: set
      int: 1
  
  # Clear the flag when ball leaves shooter lane (ball is back in play)
  s_shooter_lane_inactive{current_player.ball_just_saved==1}:
    ball_just_saved:
      action: set
      int: 0
  
  # Track remaining time for display
  timer_ball_save_countdown_tick:
    ball_save_time_remaining:
      action: set
      int: device.timers.ball_save_countdown.ticks
  
  timer_mode_ball_save_countdown_tick:
    ball_save_time_remaining:
      action: set
      int: device.timers.mode_ball_save_countdown.ticks

  timer_scoop_save_countdown_tick:
    ball_save_time_remaining:
      action: set
      int: device.timers.scoop_save_countdown.ticks

##############################################################################
# SHOW PLAYER - Accelerating light flash
##############################################################################
show_player:
  # Initial flash when NEW ball save timer starts (slow)
  # MPF event format: ball_save_<device_name>_timer_start
  ball_save_new_ball_save_timer_start:
    ball_save_flash_show:
      key: ball_save_flash
      speed: 1                    # 1000ms cycle (slow)
      loops: -1
      show_tokens:
        light: l_shoot_again
        color: white
  
  # Initial flash when MODE ball save timer starts
  # Modes post ball_save_mode_timer_start with time: X parameter
  ball_save_mode_timer_start:
    ball_save_flash_show:
      key: ball_save_flash
      speed: 1                    # Start slow, timer ticks will adjust
      loops: -1
      show_tokens:
        light: l_shoot_again
        color: white

  # Initial flash when SCOOP EJECT save starts (medium - only 5 seconds)
  # Suppressed if mode_ball_save or new_ball_save is already running — they have priority
  # (see priority note in the SCOOP EJECT SAVE LIGHT FLASH section below)
  ball_save_scoop_eject_save_timer_start{device.ball_saves.mode_ball_save.enabled==False and device.ball_saves.new_ball_save.enabled==False}:
    ball_save_flash_show:
      key: ball_save_flash
      speed: 2                    # Start at medium (500ms cycle)
      loops: -1
      show_tokens:
        light: l_shoot_again
        color: white
  
  # Slow flash (9+ seconds) - 1000ms cycle
  ball_save_flash_slow:
    ball_save_flash_show:
      key: ball_save_flash
      speed: 1
      loops: -1
      show_tokens:
        light: l_shoot_again
        color: white
  
  # Medium-slow flash (7-8 seconds) - 750ms cycle
  ball_save_flash_medium_slow:
    ball_save_flash_show:
      key: ball_save_flash
      speed: 1.33
      loops: -1
      show_tokens:
        light: l_shoot_again
        color: white
  
  # Medium flash (5-6 seconds) - 500ms cycle
  ball_save_flash_medium:
    ball_save_flash_show:
      key: ball_save_flash
      speed: 2
      loops: -1
      show_tokens:
        light: l_shoot_again
        color: white
  
  # Fast flash (3-4 seconds) - 350ms cycle
  ball_save_flash_fast:
    ball_save_flash_show:
      key: ball_save_flash
      speed: 2.86
      loops: -1
      show_tokens:
        light: l_shoot_again
        color: white
  
  # Grace period (0-2 seconds) - Light OFF
  ball_save_flash_off:
    ball_save_flash_show:
      key: ball_save_flash
      action: stop
  
  # Stop flash completely
  ball_save_flash_stop:
    ball_save_flash_show:
      key: ball_save_flash
      action: stop
  
  # Scoop eject save's own single-use net just caught a ball — stop the
  # flash UNLESS mode_ball_save or new_ball_save is still running concurrently,
  # in which case that save has priority and keeps its own flash going.
  ball_save_scoop_eject_save_saving_ball{device.ball_saves.mode_ball_save.enabled==False and device.ball_saves.new_ball_save.enabled==False}:
    ball_save_flash_show:
      key: ball_save_flash
      action: stop

##############################################################################
# LIGHT PLAYER - Ensure light is off when mode stops
##############################################################################
light_player:
  ball_save_flash_off:
    l_shoot_again:
      color: off
      fade: 0ms
  
  ball_save_flash_stop:
    l_shoot_again:
      color: off
      fade: 0ms
  
  mode_ball_save_stopped:
    l_shoot_again:
      color: off
      fade: 0ms

##############################################################################
# SLIDE PLAYER - Ball saved scenes for new ball saves
##############################################################################
slide_player:
  # 1st save in 20s window (video is ~3s)
  ball_saved_scene_play:
    ball_saved:
      action: play
      expire: 3s

  # 2nd save in same 20s window (video is 6s)
  ball_saved_2_scene_play:
    ball_saved_2:
      action: play
      expire: 6s

  # 3rd save in same 20s window (video is 5s)
  ball_saved_3_scene_play:
    ball_saved_3:
      action: play
      expire: 5s

##############################################################################
# COIL PLAYER - Auto-plunger for saved balls
##############################################################################
coil_player:
  # Auto-plunger fires 1 second after saved ball settles on shooter lane
  timer_ball_save_auto_plunger_delay_complete:
    c_plunger:
      action: pulse

##############################################################################
# SHOWS
##############################################################################
shows:
  ball_save_flash_show:
    - duration: 500ms
      lights:
        (light):
          color: (color)
          fade: 0ms
    - duration: 500ms
      lights:
        (light):
          color: off
          fade: 0ms