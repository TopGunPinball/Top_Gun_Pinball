####################################################################################
# EVENT PLAYER
####################################################################################
event_player:

  ##############################################
  ## INTRO - video requested 1s in (the penny_video slide must exist first)
  ##############################################
  mode_hard_deck_penny_started:
    - penny_play_intro|1s
    - penny_barrier_up|200ms   # hard deck start drops nothing, but make sure the barrier target is up
  penny_play_intro{current_player.penny_phase==0}:
    penny_video:
      video: penny_intro
      urgent: 1
  penny_barrier_up:
    - barrier_raise

  s_flipper_left_active{current_player.penny_phase==0 and device.timers.penny_intro_delay.running}:
    - penny_check_skip_intro
  s_flipper_right_active{current_player.penny_phase==0 and device.timers.penny_intro_delay.running}:
    - penny_check_skip_intro
  penny_check_skip_intro{device.switches.s_flipper_left.state and device.switches.s_flipper_right.state}:
    - penny_skip_intro
  penny_skip_intro:
    - penny_video_clear
    - penny_ball_released
