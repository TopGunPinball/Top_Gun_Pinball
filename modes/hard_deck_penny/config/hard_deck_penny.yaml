    - penny_gate_eval|50ms
  penny_gate_eval{((current_player.penny_phase==1 and current_player.penny_collected_count==14 and current_player.penny_ll_state!=2) or (current_player.penny_phase==2 and current_player.penny_complete_flag==0 and current_player.penny_ll_lit==1 and current_player.penny_ll_held==0 and current_player.penny_scoop_held==1) or (current_player.penny_phase==3 and current_player.penny_vic_count==14 and current_player.penny_ll_vic==0) or (current_player.penny_phase==4 and current_player.penny_ll_held==0 and current_player.penny_scoop_held==1)) and current_player.penny_step_locked==0}:
    - penny_gate_on
  penny_gate_eval{not (((current_player.penny_phase==1 and current_player.penny_collected_count==14 and current_player.penny_ll_state!=2) or (current_player.penny_phase==2 and current_player.penny_complete_flag==0 and current_player.penny_ll_lit==1 and current_player.penny_ll_held==0 and current_player.penny_scoop_held==1) or (current_player.penny_phase==3 and current_player.penny_vic_count==14 and current_player.penny_ll_vic==0) or (current_player.penny_phase==4 and current_player.penny_ll_held==0 and current_player.penny_scoop_held==1)) and current_player.penny_step_locked==0)}:
    - penny_gate_off
  s_orbit_upper_active{((current_player.penny_phase==1 and current_player.penny_collected_count==14 and current_player.penny_ll_state!=2) or (current_player.penny_phase==2 and current_player.penny_complete_flag==0 and current_player.penny_ll_lit==1 and current_player.penny_ll_held==0 and current_player.penny_scoop_held==1) or (current_player.penny_phase==3 and current_player.penny_vic_count==14 and current_player.penny_ll_vic==0) or (current_player.penny_phase==4 and current_player.penny_ll_held==0 and current_player.penny_scoop_held==1)) and current_player.penny_step_locked==0}:
    - penny_gate_open
  penny_gate_open:
    - left_orbit_diverter_open
  # Closed after 3s, or as soon as the ball reaches the left lane
  timer_penny_diverter_hold_complete:
    - left_orbit_diverter_closed
  s_lane_left_active{device.timers.penny_diverter_hold.running}:
    - penny_gate_close
  penny_gate_close:
    - left_orbit_diverter_closed

  ##############################################
  ## END PATHS
  ##############################################
  # Multiball down to one ball
  multiball_penny_multiball_ended{current_player.penny_complete_flag==1}:
    - penny_mode_end
  multiball_penny_multiball_ended{current_player.penny_complete_flag==0 and current_player.penny_step_locked==0}:
    - penny_failed

  # Last ball drained while the mode is still running
  penny_ball_ending_hold{current_player.penny_complete_flag==1}:
    - penny_drain_cleanup_complete
    - penny_mode_end
  penny_ball_ending_hold{current_player.penny_complete_flag==0 and current_player.penny_step_locked==0}:
    - penny_failed
  # (already failed -> the lost video is playing; penny_lost_done releases it)

  # FAILED - lost video; release a ball still held for the window
  penny_failed:
    penny_video:
      video: penny_lost
      urgent: 1
  penny_failed{current_player.penny_scoop_held==1}:
    - penny_scoop_disarm|3s
    - scoop_ball_release
    - penny_scoop_release|400ms

  # Lost video finished / skipped (both flippers) / fallback
  penny_video_done{video=="penny_lost"}:
    - penny_lost_done
  timer_penny_lost_fallback_complete:
    - penny_lost_done
  s_flipper_left_active{current_player.penny_step_locked==1}:
    - penny_check_skip_lost
  s_flipper_right_active{current_player.penny_step_locked==1}:
    - penny_check_skip_lost
  penny_check_skip_lost{device.switches.s_flipper_left.state and device.switches.s_flipper_right.state}:
    - penny_video_clear              # Godot answers penny_video_done -> penny_lost_done
  penny_lost_done:
    - penny_drain_cleanup_complete
    - penny_mode_end

  ##############################################
  ## EXTRA BALL / LEFT LANE POST SAFETY
  ## extra_ball.yaml drops c_left_lane_up_post on every ball_drain and when its
  ## collect hold ends. Put it back up if Penny is holding a window ball, and
  ## make sure an extra-ball hold never strands a ball at the post mid-mode.
  ##############################################
  ball_drain{current_player.penny_ll_held==1}:
    - penny_ll_reassert|100ms
  timer_extra_ball_hold_complete{current_player.penny_ll_held==1}:
    - penny_ll_reassert|100ms
  timer_extra_ball_hold_complete{current_player.penny_ll_held==0 and current_player.penny_phase>=1}:
    - penny_ll_free|100ms

  # Barrier on stop: leave it to the qualifier when a pilot mission is lit,
  # otherwise make sure it is UP (it may have been down for the window)
  mode_hard_deck_penny_will_stop{current_player.penny_phase==2 and current_player.penny_complete_flag==1}:
    - ball_search_unblock
  mode_hard_deck_penny_will_stop{device.timers.penny_diverter_hold.running}:
    - left_orbit_diverter_closed
  mode_hard_deck_penny_will_stop{current_player.qualified_mode_number==0 and current_player.scoop_release_pending==0}:
    - barrier_raise

