# COIL PLAYER
####################################################################################
coil_player:
  # Hold the ball at the left lane through the intro
  mode_hard_deck_penny_started:
    c_left_lane_up_post:
      action: enable
  penny_ball_released:
    c_left_lane_up_post:
      action: disable

