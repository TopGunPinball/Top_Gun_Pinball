#config_version=6
####################################################################################
# HARD DECK: MAVERICK & PENNY  (Hard Deck slot 3, purple insert)
# Priority 600 | 2-ball multiball | No mode timer | 30s multiball ball save
#
# QUALIFY (hard_deck_qualifiers.yaml): play 1 Hard Deck mission + hit the 31
#   tracked switches twice each. START: Left Lane while Penny is the lit
#   Hard Deck (ball held by c_left_lane_up_post through the intro).
#
# INTRO (17s, both flippers skip): penny_intro video + voice_penny_instructions.
#   Release -> post drops, 2-ball multiball starts (penny_multiball, shoot_again 30s).
#
# PART 1 - "FINDING PENNY" (purple):  15 shots lit SOLID
#   LL LO LR SP CNT(barrier target) TWR TL TR RR + ICEMAN I C E M A N
#   (Pilot Gear is NOT a Penny shot. Ramps stay DOWN the whole mode.)
#   1st hit : 250,000 x mult, insert flashes FAST, value starts at 1,500,000
#             and counts down 4,000 every 80ms -> 500,000 floor after 20s
#             (insert flashes SLOW at the floor)
#   2nd hit : current value x mult, insert OFF, shot-made callout (no per-shot videos)
#             raw value banked: penny_<key>_banked + penny_banked_total
#   The 2nd hit only counts 1s after the 1st (2s for the spinner) so a
#   bounce/double-switch can't collect the full 1,500,000 instantly.
#
# PART 2 - "OUT THE WINDOW" (all 15 collected):
#   Super jackpot value = penny_banked_total // 10 (10%), x mult when collected.
#   1st attempt : barrier drops, SCOOP lit -> ball held -> LEFT LANE lit (30s).
#   Time out    : held ball released, SCOOP + LEFT LANE both lit, either first;
#                 each first lock restarts the 30s. Repeats until a drain.
#                 penny_dont_break_heart video + voice_penny_window_retry (the
#                 callout's duck wins - that video doesn't duck the music).
#   Both locked : SUPER JACKPOT - both balls stay locked while the 33s
#                 penny_super_jackpot video plays (both flippers skip), then both
#                 are released -> PART 3.
#
# PART 3 - VICTORY (pink, penny_victory_background slide): all 15 lit, ONE hit
#   each = VICTORY JACKPOT (that shot's banked value // 5 = 20%, x mult).
#   All 15 made -> VICTORY LOCK (penny_phase 4): SCOOP + LEFT LANE lit, either
#   order, NO timer. Both locked -> VICTORY SUPER JACKPOT (same value as the
#   window super jackpot, x mult) + voice_penny_victory_super_jackpot -> both
#   released 3s later, all 15 relit. Repeats.
#
# LEFT LANE GATE: only when the Left Lane is the LAST shot still needed (part 1:
#   the other 14 collected | window/victory lock: the scoop ball already held |
#   part 3: the other 14 victory shots made) the Top Loop insert pulses and a
#   Top Loop hit opens the left orbit diverter for 3s (closes as soon as
#   the ball reaches the left lane). Never from the spinner / right orbit.
#
# SLIDES: penny_background (looping video) behind part 1; penny_victory_background
#   (static image - load it in the editor) behind parts 3/4.
#
# END: multiball drops to 1 ball (or the last ball drains)
#   escaped (penny_complete_flag==1) -> mode ends, back to the regular game (WIN)
#   not escaped -> penny_failed -> penny_lost video, mode ends when it finishes
#   (both flippers skip it). Points already scored are kept.
#
# VIDEOS: one queued player (penny_video slide, penny_video_queue.gd) - like Final
#   Battle: a shot video waits if one is playing (only the newest waits),
#   urgent videos (intro / super jackpot / lost) interrupt. Missing files show
#   a placeholder card. Files: res://addons/artwork/videos/hard_deck_penny/<name>.ogv
#   MPF -> Godot: penny_video (video, urgent)  penny_video_clear
#   Godot -> MPF: penny_video_started (video)  penny_video_done (video)
#
# MUSIC (base.yaml): music_hard_deck_penny on penny_ball_released, silence on
#   penny_failed, Danger Zone when the mode stops.
# NOT IN THIS FILE: hard_deck_active / letter_collection_paused / hd_mp_played
#   (hard_deck_qualifiers.yaml), multiball_active clear on stop (pilot_mission_qualifier.yaml)
####################################################################################

mode:
  start_events: start_mode_hard_deck_penny
  stop_events:
    - penny_mode_end          # every end path funnels through this one event
  priority: 600
  game_mode: true
  use_wait_queue: true

mode_settings:
  can_stack_with_multiball: false

####################################################################################
# MULTIBALL - 2 balls total (the post-held ball + 1 from the trough)
####################################################################################
# No mode_xxx_will_stop stop_event: MPF stops a RUNNING multiball itself when
# the mode ends (an explicit stop on a never-started multiball leaves a stray
# ball_drain handler behind).
# multiball_penny_multiball_ended fires when the 2nd-to-last ball drains
# (a ball held in the scoop / at the left lane post still counts as in play).
multiballs:
  penny_multiball:
    ball_count: 2
    ball_count_type: total
    shoot_again: 30s
    start_events: penny_mb_start

####################################################################################
# BALL HOLD - scoop half of the 'Out the Window' lock (part 2 only)
####################################################################################
ball_holds:
  penny_scoop_hold:
    balls_to_hold: 1
    hold_devices: bd_mode_scoop
    enable_events: penny_scoop_arm
    disable_events: penny_scoop_disarm
    release_one_events: penny_scoop_release
    release_all_events: mode_hard_deck_penny_will_stop

####################################################################################
# BALL SAVE - short save when both balls are released after the super jackpot
####################################################################################
# auto_launch false: penny_plunge_delay (below) pulses c_plunger for every ball
# that reaches the shooter lane during the mode (bd_plunger has no eject coil).
ball_saves:
  penny_victory_save:
    active_time: 10s
    hurry_up_time: 2s
    grace_period: 1s
    auto_launch: false
    balls_to_save: -1
    enable_events: penny_escape_release, penny_vsj_release
    disable_events: mode_hard_deck_penny_will_stop

####################################################################################
# QUEUE RELAY - hold ball_ending until the lost video is done
####################################################################################
queue_relay_player:
  ball_ending{mode.hard_deck_penny.active==True}:
    post: penny_ball_ending_hold
    wait_for: penny_drain_cleanup_complete
    priority: 1000

####################################################################################
# TIMERS
####################################################################################
timers:
  # Intro (17s) - ball held at the left lane post; both flippers skip
  penny_intro_delay:
    start_value: 0
    end_value: 17
    direction: up
    tick_interval: 1s
    start_running: false
    control_events:
      - event: mode_hard_deck_penny_started
        action: start
      - event: penny_skip_intro
        action: stop

  # Points countdown clock for part 1 (every 80ms each counting shot drops
  # 4,000 -> 1,500,000 to 500,000 in exactly 20s). No end value.
  penny_decay:
    start_value: 0
    direction: up
    tick_interval: 80ms
    start_running: false
    control_events:
      - event: penny_ball_released
        action: start
      - event: penny_window_start
        action: stop
      - event: penny_failed
        action: stop

  # Auto-plunge: 1s after any ball reaches the shooter lane during the mode
  penny_plunge_delay:
    start_value: 0
    end_value: 1
    direction: up
    tick_interval: 1s
    start_running: false
    control_events:
      - event: s_shooter_lane_active{current_player.penny_phase>=1}
        action: restart
      - event: s_shooter_lane_inactive
        action: stop

  # Out the Window: 30s from the first lock of an attempt.
  # Slide variable: player var hard_deck_penny_penny_window_timer_tick
  penny_window_timer:
    start_value: 30
    end_value: 0
    direction: down
    tick_interval: 1s
    start_running: false
    control_events:
      - event: penny_window_timer_start
        action: restart
      - event: penny_escape
        action: stop
      - event: penny_failed
        action: stop

  # Safety: releases the escape balls if the super jackpot video never reports done
  penny_escape_fallback:
    start_value: 0
    end_value: 36
    direction: up
    tick_interval: 1s
    start_running: false
    control_events:
      - event: penny_escape
        action: start
      - event: penny_escape_release
        action: stop

  # Left orbit diverter open time (Top Loop -> Left Lane gate)
  penny_diverter_hold:
    start_value: 0
    end_value: 3
    direction: up
    tick_interval: 1s
    start_running: false
    control_events:
      - event: penny_gate_open
        action: restart
      - event: penny_gate_close
        action: stop

  # Safety: ends the mode if the lost video never reports done
  penny_lost_fallback:
    start_value: 0
    end_value: 30
    direction: up
    tick_interval: 1s
    start_running: false
    control_events:
      - event: penny_failed
        action: start

