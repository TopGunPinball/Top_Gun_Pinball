####################################################################################
# SHOWS
####################################################################################
shows:
  penny_solid:
    - duration: -1
      lights:
        (led):
          color: (color)
          fade: 0ms

  # Counting down (first 20s) - fast
  penny_flash_fast:
    - duration: 150ms
      lights:
        (led):
          color: (color)
          fade: 0ms
    - duration: 150ms
      lights:
        (led):
          color: off
          fade: 0ms

  # Left Lane gate hint on the Top Loop insert - stepped pulse (no fades)
  penny_pulse:
    - duration: 120ms
      lights:
        (led): { color: (color), fade: 0ms }
    - duration: 120ms
      lights:
        (led): { color: (color)%60, fade: 0ms }
    - duration: 120ms
      lights:
        (led): { color: (color)%25, fade: 0ms }
    - duration: 240ms
      lights:
        (led): { color: off, fade: 0ms }
    - duration: 120ms
      lights:
        (led): { color: (color)%25, fade: 0ms }
    - duration: 120ms
      lights:
        (led): { color: (color)%60, fade: 0ms }

  # At the 500K floor - slow
  penny_flash_slow:
    - duration: 600ms
      lights:
        (led):
          color: (color)
          fade: 0ms
    - duration: 600ms
      lights:
        (led):
          color: off
          fade: 0ms
