#config_version=6

##
## BONUS MODE - End of Ball Bonus Countdown
## Uses MPF 0.80's built-in bonus system
## Priority: 500 (runs after ball ends, before next ball/player)
##
## TIMING ADJUSTMENTS:
## - display_delay_ms: Time for ALL bonus slides (now 1500ms - 8 entries fit in
##   the same total time the old 6 entries at 2000ms took)
## - light_show_speed: Speed multiplier for light show (default: 1.0, higher = faster)
##
## NOTE: MPF does not support per-entry display_delay_ms, only global setting
##

mode:
  # Skip bonus if ball was tilted (ball_tilted flag persists, unlike tilt_warnings which resets)
  start_events: ball_ending{current_player.ball_tilted==0}
  stop_events: bonus_done
  priority: 500
  game_mode: true
  use_wait_queue: true

##############################################
## Coil Player - Maintain barrier + diverters during bonus
## Without this, ball-level modes stopping during ball_ended
## revert their coil_player settings and briefly drop the barrier
## (~177ms gap between bonus end and next ball start).
## Priority 500 > qualifier's 200, so this holds even as lower
## priority modes revert during the transition.
##############################################

coil_player:
  mode_bonus_started:
    c_mode_barrier:
      action: disable
    c_left_orbit_diverter:
      action: disable
    c_right_orbit_diverter:
      action: disable

##############################################
## Sound Player - Silence music during bonus
##############################################

sound_player:
  # Silence any playing music when bonus starts
  mode_bonus_started:
    silence:
      bus: music
      loops: 0

##############################################
## Mode Settings - Bonus Entries
##############################################

mode_settings:
  # ADJUST THIS: Display time for ALL bonus slides (in milliseconds)
  # 1000 = 1 second, 2000 = 2 seconds, 3000 = 3 seconds, etc.
  # 1500 with 8 entries = same total time as the old 6 entries at 2000
  #   (start + 8 entries + total = 15s; was start + 6 + total = 16s)
  display_delay_ms: 1500
  
  # If player hits flipper, speed up to instant
  hurry_up_delay_ms: 0
  hurry_up_event: flipper_cancel
  
  # When false: prevents MPF from adding extra subtotal/multiplier steps
  # We use our own custom subtotal entry instead for consistent flow
  keep_multiplier: false
  
  # Define all bonus entries in order
  bonus_entries:
    # 1. Switches - count and points
    - entry: switches
      text: "Switches Hit"
      player_score_entry: bonus_switches_count
      score: 500
      skip_if_zero: false
    
    # 2. Ramps - count and points
    - entry: ramps
      text: "Ramps Made"
      player_score_entry: bonus_ramps_count
      score: 25000
      skip_if_zero: false
    
    # 3. Highest Mach - level and points
    - entry: highest_mach
      text: "Highest Mach Level"
      player_score_entry: bonus_highest_mach
      score: 150000
      skip_if_zero: false
    
    # 4. Hard Deck Awards - count and points (does NOT reset)
    - entry: hard_deck_awards
      text: "Hard Deck Awards"
      player_score_entry: hard_deck_awards_count
      score: 200000
      skip_if_zero: false
    
    # 5. Pilots Collected (pilot awards) - count and points (does NOT reset)
    #    pilots_collected_count is totaled from the 14 pilot_<n>_collected
    #    flags at bonus start (variable_player below)
    - entry: pilots_collected
      text: "Pilots Collected"
      player_score_entry: pilots_collected_count
      score: 200000
      skip_if_zero: false

    # 6. Training Missions Played - count and points (does NOT reset)
    - entry: training_missions
      text: "Training Missions Played"
      player_score_entry: training_missions_played
      score: 250000
      skip_if_zero: false
    
    # 7. Pilot Missions Won - count and points (does NOT reset)
    - entry: pilot_missions
      text: "Pilot Missions Won"
      player_score_entry: pilot_missions_won
      score: 500000
      skip_if_zero: false

    # 8. Navy Rank - flat points for the current rank (no count on the slide)
    #    rank_bonus_points is set from rank_level at bonus start (variable_player
    #    below) and multiplied by 1, so the "count" IS the points.
    - entry: navy_rank
      text: "Navy Rank"
      player_score_entry: rank_bonus_points
      score: 1
      skip_if_zero: false
    
    # NOTE: No custom subtotal entry - using MPF's built-in behavior
    # At 1x: goes straight from last entry to total (no subtotal slide)
    # At 2x+: MPF shows subtotal/multiplier automatically

##############################################
## Variable Player - Calculate Display Points
## AND RESET PER-BALL VARIABLES AFTER MODE ENDS
##############################################

variable_player:
  ##############################################
  ## Values for the two newer entries, set at bonus start (MPF reads each
  ## entry's player_score_entry when that entry is reached, well after this)
  ##############################################
  # Pilots collected this game (each pilot_<n>_collected is 0 or 1)
  mode_bonus_started:
    pilots_collected_count:
      action: set
      int: current_player.pilot_bob_collected + current_player.pilot_coyote_collected + current_player.pilot_fanboy_collected + current_player.pilot_goose_collected + current_player.pilot_hangman_collected + current_player.pilot_hollywood_collected + current_player.pilot_hondo_collected + current_player.pilot_iceman_collected + current_player.pilot_maverick_collected + current_player.pilot_phoenix_collected + current_player.pilot_rooster_collected + current_player.pilot_slider_collected + current_player.pilot_viper_collected + current_player.pilot_wolfman_collected

  # ADJUST HERE: Navy Rank bonus points by rank (rank_level 0-5)
  mode_bonus_started{current_player.rank_level==0}:     # Ensign
    rank_bonus_points:
      action: set
      int: 0
  mode_bonus_started{current_player.rank_level==1}:     # Lieutenant JG
    rank_bonus_points:
      action: set
      int: 750000
  mode_bonus_started{current_player.rank_level==2}:     # Lieutenant
    rank_bonus_points:
      action: set
      int: 1500000
  mode_bonus_started{current_player.rank_level==3}:     # Lt Commander
    rank_bonus_points:
      action: set
      int: 2000000
  mode_bonus_started{current_player.rank_level==4}:     # Commander
    rank_bonus_points:
      action: set
      int: 3500000
  mode_bonus_started{current_player.rank_level==5}:     # Captain
    rank_bonus_points:
      action: set
      int: 5000000

  # Calculate points variables when each bonus entry is shown
  bonus_entry{entry=="switches"}:
    bonus_switches_points:
      action: set
      int: current_player.bonus_switches_count * 500
  
  bonus_entry{entry=="ramps"}:
    bonus_ramps_points:
      action: set
      int: current_player.bonus_ramps_count * 25000
  
  bonus_entry{entry=="highest_mach"}:
    bonus_highest_mach_points:
      action: set
      int: current_player.bonus_highest_mach * 150000
  
  bonus_entry{entry=="hard_deck_awards"}:
    bonus_hard_deck_awards_points:
      action: set
      int: current_player.hard_deck_awards_count * 200000
  
  bonus_entry{entry=="pilots_collected"}:
    bonus_pilots_collected_points:
      action: set
      int: current_player.pilots_collected_count * 200000

  bonus_entry{entry=="training_missions"}:
    bonus_training_missions_points:
      action: set
      int: current_player.training_missions_played * 250000
  
  bonus_entry{entry=="pilot_missions"}:
    bonus_pilot_missions_points:
      action: set
      int: current_player.pilot_missions_won * 500000
  
  # Capture the running bonus subtotal into a player variable for the slide
  # This triggers on MPF's built-in subtotal event (only fires at 2x+ multiplier)
  bonus_entry{entry=="subtotal"}:
    bonus_subtotal_points:
      action: set
      int: score
  
  # Per-ball variables reset has been moved to base.yaml
  # (bonus mode stops before ball_ended fires, so base handles it)

##############################################
## Show Player - Light Show During Bonus
## SPEED ADJUSTMENT: Change 'speed' parameter to adjust light show speed
##############################################

show_player:
  mode_bonus_started:
    bonus_count_down_light_show:
      loops: -1          # Loop infinitely until mode stops
      speed: 40          # ADJUST THIS: 1.0 = normal, 2.0 = 2x speed, 0.5 = half speed
      key: bonus_lights
  
  mode_bonus_stopped:
    bonus_count_down_light_show:
      action: stop
      key: bonus_lights

##############################################
## Slide Player - Display Bonus Screens
##############################################

slide_player:
  # Initial "BONUS" screen
  mode_bonus_started:
    bonus_start:
      action: play
      priority: 510
  
  # Switches bonus slide
  bonus_entry{entry=="switches"}:
    bonus_switches:
      action: play
      priority: 510
  
  # Ramps bonus slide
  bonus_entry{entry=="ramps"}:
    bonus_ramps:
      action: play
      priority: 510
  
  # Highest Mach bonus slide (shows both count and points)
  bonus_entry{entry=="highest_mach"}:
    bonus_highest_mach:
      action: play
      priority: 510
  
  # Hard Deck Awards bonus slide
  bonus_entry{entry=="hard_deck_awards"}:
    bonus_hard_deck_awards:
      action: play
      priority: 510
  
  # Pilots Collected bonus slide
  bonus_entry{entry=="pilots_collected"}:
    bonus_pilots_collected:
      action: play
      priority: 510

  # Training Missions bonus slide
  bonus_entry{entry=="training_missions"}:
    bonus_training_missions:
      action: play
      priority: 510
  
  # Pilot Missions Won bonus slide
  bonus_entry{entry=="pilot_missions"}:
    bonus_pilot_missions:
      action: play
      priority: 510
  
  # Navy Rank bonus slide (label + points only)
  bonus_entry{entry=="navy_rank"}:
    bonus_navy_rank:
      action: play
      priority: 510

  # Subtotal slide - uses MPF's built-in subtotal event (only fires at 2x+ multiplier)
  # At 1x multiplier, this slide won't show (goes straight to total)
  bonus_entry{entry=="subtotal"}:
    bonus_subtotal:
      action: play
      priority: 510
  
  # Final Total slide
  bonus_entry{entry=="total"}:
    bonus_total:
      action: play
      priority: 510

##############################################
## Event Player - Flipper Cancel
##############################################

event_player:
  # Both flippers pressed = skip to end
  s_flipper_left_active{device.switches.s_flipper_right.state}:
    - flipper_cancel
  
  s_flipper_right_active{device.switches.s_flipper_left.state}:
    - flipper_cancel