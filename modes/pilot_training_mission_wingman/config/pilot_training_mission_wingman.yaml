#config_version=6

####################################################################################
# PILOT TRAINING MISSION: WINGMAN
# 
# A multiball training mission with tug-of-war zone-based shot mechanic.
# 
# THEME: Stay on ICEMAN's wing - make shots in the active "good zone"
# BALLS: 2 balls at start, 1 add-a-ball from ICEMAN completion (max 3)
# GI: Blue (odd lights) and Cyan (even lights)
#   - Good shots: strobe GI at current blue/cyan for 2 seconds
#   - Bad shots: strobe blue→red, cyan→orange for 2 seconds
# INSERT COLOR: (l_mode_wingman)
# POP BUMPERS: Cyan
# PERK: Earned when position reaches +6, stays active for rest of ball
#
# ZONE MECHANIC (Tug-of-War):
#   Position ranges from -6 (LOSE) to +6 (WIN)
#   Three shot zones rotate every 20 seconds:
#     LEFT:   LL, LO, LR
#     MIDDLE: SP, TWR, TL
#     RIGHT:  TL, TO, RR
#   TL is in BOTH Middle and Right - good if EITHER is the active zone
#   Good zone shots: green lights, +1 position, add to points bank
#   Bad zone shots:  red lights, -1 position, subtract from points bank
#
# SCORING (Live - points awarded immediately):
#   Position 0-1: 250,000 per good shot
#   Position 2-3: 500,000 per good shot
#   Position 4-5: 1,000,000 per good shot
#   Perfect run (0 bad shots): 3,500,000 scored + 5,000,000 bonus = 8,500,000
#   Bad shot penalty: -250,000 from score
#   WIN: perfect run bonus if applicable (points already scored live)
#   LOSE by bad shots (-6): 500,000 consolation
#   LOSE by drain: 500,000 consolation (points already scored live)
#
# ADD-A-BALL: ICEMAN letters (cleared at mode start)
#   1st completion: Add a ball, ICEMAN lights go orange permanently
#   Max 1 add-a-ball for this mode
#
# BALL SAVE: 15 seconds for initial launch and add-a-ball
#
# WIN CELEBRATION (v2 - VICTORY MODE, no draining):
#   Position +6 → voice_wingman_won callout plays immediately
#   All 9 shots (LL, LO, LR, SP, CNT, TWR, TO, 2X, RR) light up -
#   flippers/multiball keep running normally, player keeps shooting.
#   First hit on a shot = good (scores live, banks jackpot, shot turns
#   red, position/value ramp up). Hit an already-red shot = bad (position
#   -1). All 9 collected → barrier flashes for the super jackpot; hitting
#   it pays the bank and relights the set - loop repeats.
#   When the multiball naturally ends (down to 1 ball) → victory scoring
#   stops, pilot_training_mission_wingman_won slide plays for 18s, then
#   mode stops → base game (see VICTORY MODE section, ~line 875 onward)
#
# LOSS BY BAD SHOTS:
#   Position -6 → pilot_training_mission_wingman_lost_2 slide (9.1s)
#   Mode stops → base game
#
# LOSS BY DRAIN:
#   Multiball ends → pilot_training_mission_wingman_lost_1 slide (9.1s)
#   Mode stops → base game
#
# Adjustable Timing Values:
#   - Intro video delay: 13 seconds (line ~134)
#   - Ball save duration: 15 seconds (line ~96)
#   - Zone shift interval: 10 seconds (line ~142)
#   - Victory slide (win, plays when multiball ends): 18 seconds
#   - Lost slide duration: 10 seconds (lines ~192, ~202)
####################################################################################

mode:
  start_events: start_mode_training_wingman
  stop_events: 
    - wingman_drain_cleanup_complete
  priority: 600
  game_mode: true
  use_wait_queue: true

mode_settings:
  can_stack_with_multiball: false

####################################################################################
# BALL HOLD NOTE
####################################################################################
# Ball hold during intro is handled via coil_player (c_left_lane_up_post)
# The post is enabled on mode start and disabled on ball_released event

####################################################################################
# MULTIBALL DEVICE - 2 balls, add-a-ball from ICEMAN
####################################################################################

multiballs:
  wingman_multiball:
    ball_count: 2
    ball_count_type: total
    shoot_again: 15s
    start_events: wingman_start_multiball
    stop_events: 
      # NOTE: wingman_won_trigger REMOVED (v2 win flow) - the multiball
      # now keeps running through victory mode; it only stops naturally
      # (multiball_wingman_multiball_ended) or on loss/mode stop.
      - wingman_lost_bad_shots
      - mode_pilot_training_mission_wingman_will_stop
    add_a_ball_events: wingman_add_a_ball
    ball_locks: 
    source_playfield: playfield

####################################################################################
# BALL SAVES - 15 second multiball ball save
####################################################################################

ball_saves:
  wingman_multiball_ball_save:
    active_time: 15s
    hurry_up_time: 2s
    grace_period: 500ms
    auto_launch: false    # CHANGED: was true. MPF auto_launch fires c_plunger at 50%;
                          # we handle plunger ourselves via wingman_auto_plunger_delay
                          # timer below so we can use tuned 0.625 power / 22ms pulse
                          # for pop-bumper-target plunge.
    balls_to_save: -1
    enable_events: 
      - wingman_start_multiball
      - wingman_add_a_ball
    disable_events: 
      # NOTE: wingman_won_trigger REMOVED (v2 win flow) - normal ball-save
      # protection should keep working through victory mode, same as any
      # other point in the multiball.
      - wingman_lost_bad_shots
      - wingman_lost_drain
      - ball_will_end
    debug: true

  # DRAIN BALL SAVE: Catches the last ball when flippers are disabled
  # after a LOSS by bad shots.  This prevents ball_ending from
  # firing so the player does NOT lose their ball.
  # auto_launch: false → ball sits in shooter lane during video
  # We fire the plunger manually after the video completes.
  # NOTE: wingman_won_trigger REMOVED from enable_events (v2 win flow) -
  # winning no longer disables flippers/drains balls, so this device is
  # no longer needed on the win path. Still used by the loss path.
  wingman_drain_ball_save:
    active_time: 30s
    grace_period: 2s
    auto_launch: false
    balls_to_save: 1
    enable_events:
      - wingman_lost_bad_shots
    disable_events:
      - wingman_post_mode_plunge
      - mode_pilot_training_mission_wingman_will_stop

####################################################################################
# QUEUE RELAY PLAYER - Hold ball_ending until mode cleanup completes
####################################################################################
# This is CRITICAL for proper drain handling:
# - When ball drains, we need time to play the failure/victory video BEFORE bonus starts
# - queue_relay_player intercepts ball_ending and holds it
# - We release it when wingman_drain_cleanup_complete fires
# - Priority 1000 ensures this runs BEFORE bonus mode (priority 500) can start

queue_relay_player:
  ball_ending{mode.pilot_training_mission_wingman.active==True}:
    post: wingman_ball_ending_hold
    wait_for: wingman_drain_cleanup_complete
    priority: 1000

####################################################################################
# TIMERS
####################################################################################

timers:
  # Intro video delay - 13 seconds for instruction video
  wingman_intro_delay:
    start_value: 0
    end_value: 19
    direction: up
    tick_interval: 1s
    control_events:
      - event: mode_pilot_training_mission_wingman_started
        action: start
      - event: wingman_skip_intro
        action: stop

  # Zone shift timer - 6 seconds per zone (was 10s)
  wingman_zone_shift_timer:
    start_value: 0
    end_value: 6
    direction: up
    tick_interval: 1s
    control_events:
      - event: wingman_ball_released
        action: start
      - event: wingman_zone_shifted
        action: restart
      - event: wingman_won_trigger
        action: stop
      - event: wingman_lost_bad_shots
        action: stop
      - event: wingman_lost_drain
        action: stop
      - event: mode_pilot_training_mission_wingman_will_stop
        action: stop

  # Auto-plunger delay - 500ms after ball settles on shooter lane switch
  # Handles multiball start, add-a-balls, and saved balls returning
  # GUARD: Only restarts when mode_active==1 (disabled during win/loss drain phase)
  # CHANGED: was 1s (tick_interval: 1s, end_value: 1). Now 500ms via 1ms ticks
  # x 500 to keep balls moving quickly during multiball saves.
  wingman_auto_plunger_delay:
    start_value: 0
    end_value: 500
    direction: up
    tick_interval: 1ms
    control_events:
      - event: s_shooter_lane_active{current_player.wingman_mode_active==1}
        action: restart
      - event: s_shooter_lane_inactive
        action: stop
      - event: wingman_won_trigger
        action: stop
      - event: wingman_lost_bad_shots
        action: stop
      - event: mode_pilot_training_mission_wingman_will_stop
        action: stop

  # ICEMAN completion celebration - 1 second delay before resetting lights
  wingman_iceman_celebration_timer:
    start_value: 0
    end_value: 1
    direction: up
    tick_interval: 1s
    control_events:
      - event: wingman_iceman_complete
        action: restart

  # Win beaten animation delay - 5 seconds
  # NOTE: vestigial under win flow v2 - still starts on wingman_won_trigger
  # but nothing consumes its completion anymore (no beaten-animation step
  # in the new flow). Left in place/harmless; safe to remove later.
  wingman_beaten_animation_delay:
    start_value: 0
    end_value: 5
    direction: up
    tick_interval: 1s
    start_running: false
    control_events:
      - event: wingman_won_trigger
        action: start

  # Win video delay - 18 seconds
  # Now starts when the multiball naturally ends (down to 1 ball) with a
  # win, NOT immediately at wingman_won_trigger (see event_player:
  # wingman_victory_final_start).
  wingman_won_video_delay:
    start_value: 0
    end_value: 18
    direction: up
    tick_interval: 1s
    start_running: false
    control_events:
      - event: wingman_victory_final_start
        action: start
      - event: wingman_skip_won_video
        action: stop

  # Lost by bad shots - drain delay (5s for balls to drain with flippers disabled)
  wingman_lost_bad_shots_drain_delay:
    start_value: 0
    end_value: 5
    direction: up
    tick_interval: 1s
    start_running: false
    control_events:
      - event: wingman_lost_bad_shots
        action: start
      - event: mode_pilot_training_mission_wingman_will_stop
        action: stop

  # Lost by bad shots - callout delay (3s for voice callout to play before video)
  wingman_lost_callout_delay:
    start_value: 0
    end_value: 3
    direction: up
    tick_interval: 1s
    start_running: false
    control_events:
      - event: wingman_lost_bad_shots
        action: start
      - event: wingman_emergency_resume
        action: stop
      - event: mode_pilot_training_mission_wingman_will_stop
        action: stop

  # Lost by bad shots video delay - 10 seconds (9.1s video + margin)
  # Starts when video actually plays (after callout finishes)
  wingman_lost_bad_shots_delay:
    start_value: 0
    end_value: 10
    direction: up
    tick_interval: 1s
    start_running: false
    control_events:
      - event: wingman_play_lost_bad_shots_video
        action: start
      - event: wingman_skip_lost_bad_shots_video
        action: stop

  # Lost by drain delay - 10 seconds (9.1s video + margin)
  wingman_lost_drain_delay:
    start_value: 0
    end_value: 10
    direction: up
    tick_interval: 1s
    start_running: false
    control_events:
      - event: wingman_lost_drain
        action: start
      - event: wingman_skip_lost_drain_video
        action: stop

  # Plunge orbit lockout - 2 seconds after ball passes shooter lane
  # Prevents orbit shots from counting when ball auto-plunges
  wingman_plunge_lockout:
    start_value: 0
    end_value: 2
    direction: up
    tick_interval: 1s
    control_events:
      - event: wingman_start_plunge_lockout
        action: restart
      - event: mode_pilot_training_mission_wingman_will_stop
        action: stop

  # Pre-plunge delay - 3 seconds between "ball returning" callout and actual plunge
  # Gives the player warning before the ball comes back into play
  wingman_pre_plunge_delay:
    start_value: 0
    end_value: 3
    direction: up
    tick_interval: 1s
    start_running: false
    control_events:
      - event: wingman_ball_returning
        action: start

  # Manual plunge detection - 500ms debounce
  # If shooter lane goes inactive during drain phase and stays inactive for 500ms,
  # the player manually plunged. Emergency resume: kill video, re-enable game.
  # Switch going active again (flicker/shake) stops the timer.
  wingman_manual_plunge_detect:
    start_value: 0
    end_value: 1
    direction: up
    tick_interval: 500ms
    start_running: false
    control_events:
      - event: s_shooter_lane_inactive{current_player.wingman_balls_draining==1}
        action: restart
      - event: s_shooter_lane_active{current_player.wingman_balls_draining==1}
        action: stop
      - event: wingman_emergency_resume
        action: stop
      - event: mode_pilot_training_mission_wingman_will_stop
        action: stop

####################################################################################
# VARIABLE PLAYER - Initialize and track mode variables
####################################################################################

variable_player:
  ##############################################
  ## MODE INITIALIZATION
  ##############################################
  mode_pilot_training_mission_wingman_started:
    # Training mission tracking
    training_mission_active:
      action: set
      int: 1
    multiball_active:
      action: set
      int: 1
    letter_collection_paused:
      action: set
      int: 1
    
    # Tug-of-war position (-6 to +6)
    wingman_position:
      action: set
      int: 0
    
    # Display state flags
    wingman_balls_draining:
      action: set
      int: 0
    wingman_lost_bad_shots_flag:
      action: set
      int: 0
    
    # Zone tracking (1=LEFT, 2=MIDDLE, 3=RIGHT) - starts MIDDLE
    wingman_good_zone:
      action: set
      int: 2
    
    # Zone direction for ping-pong: 1=going right, 0=going left
    wingman_zone_direction:
      action: set
      int: 1
    
    # Mode active flag (0=intro, 1=playing)
    wingman_mode_active:
      action: set
      int: 0
    
    # Points bank (accumulated during mode, awarded at end)
    wingman_points_bank:
      action: set
      int: 0
    
    # Mode won/perk tracking
    wingman_won:
      action: set
      int: 0
    
    # Ball tracking
    wingman_balls_in_play:
      action: set
      int: 2
    
    # ICEMAN add-a-ball tracking (separate from main ICEMAN progress)
    wingman_iceman_i:
      action: set
      int: 0
    wingman_iceman_c:
      action: set
      int: 0
    wingman_iceman_e:
      action: set
      int: 0
    wingman_iceman_m:
      action: set
      int: 0
    wingman_iceman_a:
      action: set
      int: 0
    wingman_iceman_n:
      action: set
      int: 0
    wingman_iceman_completions:
      action: set
      int: 0
    
    # Mode points display variable
    mode_points_scored:
      action: set
      int: 0
    
    # Bad shot counter for perfect run bonus
    wingman_bad_shots_count:
      action: set
      int: 0
    
    # Good shot counter for HUD display
    wingman_good_shots_count:
      action: set
      int: 0
    
    # Drain handling guard - prevents double-triggering lost video
    wingman_drain_handled:
      action: set
      int: 0
    
    # Orbit lockout after plunge (prevents false orbit shots)
    wingman_orbit_locked_out:
      action: set
      int: 0
    
    # Post-win plunge flag (for base.yaml)
    wingman_post_win_plunge:
      action: set
      int: 0
    
    # Training mission played count
    training_missions_played:
      action: add
      int: 1
    training_wingman_complete:
      action: set
      int: 1

  ##############################################
  ## MODE ACTIVE FLAG
  ##############################################
  wingman_ball_released:
    wingman_mode_active:
      action: set
      int: 1

  ##############################################
  ## BALL DRAIN - Mark drain pending for qualifier
  ##############################################
  ball_will_end{mode.pilot_training_mission_wingman.active==True}:
    pilot_mode_drain_pending:
      action: set
      int: 1

  ##############################################
  ## ORBIT LOCKOUT - Prevent false shots after plunge
  ##############################################
  wingman_start_plunge_lockout:
    wingman_orbit_locked_out:
      action: set
      int: 1

  timer_wingman_plunge_lockout_complete:
    wingman_orbit_locked_out:
      action: set
      int: 0

  ##############################################
  ## DRAIN HANDLING GUARD - Set in existing entries below
  ##############################################

  ##############################################
  ## GOOD SHOT SCORING (by current position)
  ## Position checked BEFORE increment
  ##############################################
  
  # Position 0-1: 250,000 per good shot (not final shot)
  wingman_score_good{current_player.wingman_position>=0 and current_player.wingman_position<=1 and current_player.wingman_position<5}:
    wingman_points_bank:
      action: add
      int: 250000 * current_player.total_scoring_multiplier
    score:
      action: add
      int: 250000 * current_player.total_scoring_multiplier
    mode_points_scored:
      action: set
      int: 250000 * current_player.total_scoring_multiplier
  
  # Position 2-3: 500,000 per good shot (not final shot)
  wingman_score_good{current_player.wingman_position>=2 and current_player.wingman_position<=3 and current_player.wingman_position<5}:
    wingman_points_bank:
      action: add
      int: 500000 * current_player.total_scoring_multiplier
    score:
      action: add
      int: 500000 * current_player.total_scoring_multiplier
    mode_points_scored:
      action: set
      int: 500000 * current_player.total_scoring_multiplier
  
  # Position 4: 1,000,000 per good shot (not final shot — position 5 is final)
  wingman_score_good{current_player.wingman_position==4}:
    wingman_points_bank:
      action: add
      int: 1000000 * current_player.total_scoring_multiplier
    score:
      action: add
      int: 1000000 * current_player.total_scoring_multiplier
    mode_points_scored:
      action: set
      int: 1000000 * current_player.total_scoring_multiplier

  # Position is negative (recovering from bad shots): 250,000 per good shot
  wingman_score_good{current_player.wingman_position<0}:
    wingman_points_bank:
      action: add
      int: 250000 * current_player.total_scoring_multiplier
    score:
      action: add
      int: 250000 * current_player.total_scoring_multiplier
    mode_points_scored:
      action: set
      int: 250000 * current_player.total_scoring_multiplier

  ##############################################
  ## POSITION CHANGES
  ##############################################
  
  # Good shot: position +1 (capped at 6) and count
  wingman_position_up{current_player.wingman_position<6}:
    wingman_position:
      action: add
      int: 1
    wingman_good_shots_count:
      action: add
      int: 1

  # Bad shot: position -1 (capped at -6)
  wingman_position_down{current_player.wingman_position>-6}:
    wingman_position:
      action: add
      int: -1

  ##############################################
  ## BAD SHOT SCORING
  ##############################################
  
  wingman_score_bad:
    wingman_points_bank:
      action: add
      int: -250000
    wingman_bad_shots_count:
      action: add
      int: 1
    mode_points_scored:
      action: set
      int: -250000
  
  # Floor bank at 0
  wingman_check_bank_floor{current_player.wingman_points_bank<0}:
    wingman_points_bank:
      action: set
      int: 0

  ##############################################
  ## ZONE SHIFT
  ##############################################
  
  wingman_shift_to_zone_1:
    wingman_good_zone:
      action: set
      int: 1
  
  wingman_shift_to_zone_2:
    wingman_good_zone:
      action: set
      int: 2
  
  wingman_shift_to_zone_3:
    wingman_good_zone:
      action: set
      int: 3

  # Direction reversals for ping-pong
  wingman_reverse_to_left:
    wingman_zone_direction:
      action: set
      int: 0
  
  wingman_reverse_to_right:
    wingman_zone_direction:
      action: set
      int: 1

  ##############################################
  ## WIN SCORING - Points already scored live
  ##############################################
  
  wingman_won_trigger:
    wingman_won:
      action: set
      int: 1
    wingman_mode_active:
      action: set
      int: 0
    wingman_drain_handled:
      action: set
      int: 1
    # NOTE: wingman_balls_draining REMOVED (v2 win flow) - we no longer
    # drain balls or show the "BALLS DRAINING" banner at win.
    wingman_perk_active:
      action: set
      int: 1
    training_wingman_won:
      action: set
      int: 1
    training_missions_won:
      action: add
      int: 1
    # Pay out the full bank on the winning shot
    score:
      action: add
      int: current_player.wingman_points_bank * current_player.total_scoring_multiplier
    mode_points_scored:
      action: set
      int: current_player.wingman_points_bank * current_player.total_scoring_multiplier

  # Perfect run bonus: 5,000,000 if no bad shots were hit
  wingman_perfect_run_bonus:
    score:
      action: add
      int: 5000000 * current_player.total_scoring_multiplier
    wingman_points_bank:
      action: add
      int: 5000000

  ##############################################
  ## POST-VIDEO PLUNGE FLAG
  ## Set ONLY after pre-plunge delay ends so base mode
  ## doesn't auto-plunge the saved ball during video
  ##############################################
  timer_wingman_pre_plunge_delay_complete:
    wingman_post_win_plunge:
      action: set
      int: 1

  ##############################################
  ## EMERGENCY RESUME - Player manually plunged
  ## Ball is already in play, set plunge flag so
  ## base mode doesn't interfere
  ##############################################
  wingman_emergency_resume:
    wingman_post_win_plunge:
      action: set
      int: 1
    wingman_balls_draining:
      action: set
      int: 0

  ##############################################
  ## LOSE BY BAD SHOTS - 500K consolation
  ##############################################
  
  wingman_lost_bad_shots:
    wingman_mode_active:
      action: set
      int: 0
    wingman_drain_handled:
      action: set
      int: 1
    wingman_balls_draining:
      action: set
      int: 1
    wingman_lost_bad_shots_flag:
      action: set
      int: 1
    # training_wingman_complete now set on mode_started (played = started)
    score:
      action: add
      int: 500000

  ##############################################
  ## LOSE BY DRAIN - 500K consolation (points already scored live)
  ##############################################
  
  wingman_lost_drain:
    wingman_mode_active:
      action: set
      int: 0
    wingman_drain_handled:
      action: set
      int: 1
    # training_wingman_complete now set on mode_started (played = started)
    score:
      action: add
      int: 500000

  ##############################################
  ## ADD-A-BALL TRACKING
  ##############################################
  
  wingman_add_a_ball_qualified:
    wingman_add_a_ball_ready:
      action: set
      int: 1

  wingman_add_a_ball:
    wingman_balls_in_play:
      action: add
      int: 1
    wingman_add_a_ball_ready:
      action: set
      int: 0

  ##############################################
  ## CLEANUP - Clear perk slide (perk is ball-only)
  ##############################################
  
  # wingman_perk_active is NOT cleared here - it persists for rest of ball
  # Cleared by qualifier on ball_ending instead

  ##############################################
  ## ICEMAN LETTER COLLECTION
  ##############################################
  
  s_i_iceman_target_active{current_player.wingman_iceman_i==0 and current_player.wingman_mode_active==1}:
    wingman_iceman_i:
      action: set
      int: 1

  s_c_iceman_target_active{current_player.wingman_iceman_c==0 and current_player.wingman_mode_active==1}:
    wingman_iceman_c:
      action: set
      int: 1

  s_e_iceman_target_active{current_player.wingman_iceman_e==0 and current_player.wingman_mode_active==1}:
    wingman_iceman_e:
      action: set
      int: 1

  s_m_iceman_target_active{current_player.wingman_iceman_m==0 and current_player.wingman_mode_active==1}:
    wingman_iceman_m:
      action: set
      int: 1

  s_a_iceman_target_active{current_player.wingman_iceman_a==0 and current_player.wingman_mode_active==1}:
    wingman_iceman_a:
      action: set
      int: 1

  s_n_iceman_target_active{current_player.wingman_iceman_n==0 and current_player.wingman_mode_active==1}:
    wingman_iceman_n:
      action: set
      int: 1

  # ICEMAN completion - reset letters for display purposes
  wingman_iceman_complete:
    wingman_iceman_completions:
      action: add
      int: 1
    wingman_iceman_i:
      action: set
      int: 0
    wingman_iceman_c:
      action: set
      int: 0
    wingman_iceman_e:
      action: set
      int: 0
    wingman_iceman_m:
      action: set
      int: 0
    wingman_iceman_a:
      action: set
      int: 0
    wingman_iceman_n:
      action: set
      int: 0

  ##############################################
  ## VICTORY MODE - INIT (defaults each ball; real
  ## starting values are set by wingman_victory_start below)
  ##############################################
  wingman_victory_active:
    action: set
    int: 0
  wingman_victory_position:
    action: set
    int: 0
  wingman_victory_shot_value:
    action: set
    int: 0
  wingman_victory_next_shot_total:
    action: set
    int: 0
  wingman_victory_jackpot:
    action: set
    int: 0
  wingman_victory_jackpot_ready:
    action: set
    int: 0
  wingman_victory_hit_count:
    action: set
    int: 0
  wingman_victory_hit_ll:
    action: set
    int: 0
  wingman_victory_hit_lo:
    action: set
    int: 0
  wingman_victory_hit_lr:
    action: set
    int: 0
  wingman_victory_hit_sp:
    action: set
    int: 0
  wingman_victory_hit_cnt:
    action: set
    int: 0
  wingman_victory_hit_twr:
    action: set
    int: 0
  wingman_victory_hit_to:
    action: set
    int: 0
  wingman_victory_hit_gear:
    action: set
    int: 0
  wingman_victory_hit_rr:
    action: set
    int: 0

  ##############################################
  ## VICTORY MODE - START
  ## Position starts at 6 (closest to jet) since main mode
  ## can only be won by reaching position +6.
  ## Shot value starts at 50,000 and ramps every good hit,
  ## capped at 250,000 - this value NEVER resets for the
  ## rest of victory mode (persists across jackpot cycles).
  ##############################################
  wingman_victory_start:
    wingman_victory_active:
      action: set
      int: 1
    wingman_victory_position:
      action: set
      int: 6
    wingman_victory_shot_value:
      action: set
      int: 50000
    wingman_victory_next_shot_total:
      action: set
      int: 300000
    wingman_victory_jackpot:
      action: set
      int: 0
    wingman_victory_jackpot_ready:
      action: set
      int: 0
    wingman_victory_hit_count:
      action: set
      int: 0
    wingman_victory_hit_ll:
      action: set
      int: 0
    wingman_victory_hit_lo:
      action: set
      int: 0
    wingman_victory_hit_lr:
      action: set
      int: 0
    wingman_victory_hit_sp:
      action: set
      int: 0
    wingman_victory_hit_cnt:
      action: set
      int: 0
    wingman_victory_hit_twr:
      action: set
      int: 0
    wingman_victory_hit_to:
      action: set
      int: 0
    wingman_victory_hit_gear:
      action: set
      int: 0
    wingman_victory_hit_rr:
      action: set
      int: 0

  ##############################################
  ## VICTORY MODE - END (multiball naturally down to 1 ball)
  ## Stops further shot scoring while the 18s victory slide plays.
  ##############################################
  wingman_victory_active_off:
    wingman_victory_active:
      action: set
      int: 0

  ##############################################
  ## VICTORY MODE - PER-SHOT HIT FLAGS + COUNTER
  ## Each fires once, the FIRST time that shot is made
  ## since the set was last relit (mode start or jackpot reset)
  ##############################################
  wingman_victory_good_shot_ll:
    wingman_victory_hit_ll:
      action: set
      int: 1
    wingman_victory_hit_count:
      action: add
      int: 1
  wingman_victory_good_shot_lo:
    wingman_victory_hit_lo:
      action: set
      int: 1
    wingman_victory_hit_count:
      action: add
      int: 1
  wingman_victory_good_shot_lr:
    wingman_victory_hit_lr:
      action: set
      int: 1
    wingman_victory_hit_count:
      action: add
      int: 1
  wingman_victory_good_shot_sp:
    wingman_victory_hit_sp:
      action: set
      int: 1
    wingman_victory_hit_count:
      action: add
      int: 1
  wingman_victory_good_shot_cnt:
    wingman_victory_hit_cnt:
      action: set
      int: 1
    wingman_victory_hit_count:
      action: add
      int: 1
  wingman_victory_good_shot_twr:
    wingman_victory_hit_twr:
      action: set
      int: 1
    wingman_victory_hit_count:
      action: add
      int: 1
  wingman_victory_good_shot_to:
    wingman_victory_hit_to:
      action: set
      int: 1
    wingman_victory_hit_count:
      action: add
      int: 1
  wingman_victory_good_shot_gear:
    wingman_victory_hit_gear:
      action: set
      int: 1
    wingman_victory_hit_count:
      action: add
      int: 1
  wingman_victory_good_shot_rr:
    wingman_victory_hit_rr:
      action: set
      int: 1
    wingman_victory_hit_count:
      action: add
      int: 1

  ##############################################
  ## VICTORY MODE - COMMON GOOD SHOT SCORING
  ## Scored using the CURRENT shot_value/position
  ## (checked BEFORE increment - same pattern as main mode)
  ## Live score includes mach/pf multiplier. The jackpot bank
  ## banks the RAW value (no mach) so it isn't double-multiplied
  ## when collected later.
  ##############################################
  wingman_victory_good_shot:
    score:
      action: add
      int: current_player.wingman_victory_shot_value * current_player.wingman_victory_position * current_player.total_scoring_multiplier
    mode_points_scored:
      action: set
      int: current_player.wingman_victory_shot_value * current_player.wingman_victory_position * current_player.total_scoring_multiplier
    wingman_victory_jackpot:
      action: add
      int: current_player.wingman_victory_shot_value * current_player.wingman_victory_position

  ##############################################
  ## VICTORY MODE - COMMON BAD SHOT SCORING/MOVEMENT
  ## Hitting an already-collected (red) shot: moves one
  ## step away from the jet, multiplier drops by 1x, floors at 1x
  ##############################################
  wingman_victory_bad_shot_position{current_player.wingman_victory_position>1}:
    wingman_victory_position:
      action: add
      int: -1

  ##############################################
  ## VICTORY MODE - POSITION/VALUE RAMP (after good shot scoring)
  ##############################################
  wingman_victory_position_increment{current_player.wingman_victory_position<6}:
    wingman_victory_position:
      action: add
      int: 1
  wingman_victory_shot_value_increment{current_player.wingman_victory_shot_value<250000}:
    wingman_victory_shot_value:
      action: add
      int: 5000

  ##############################################
  ## VICTORY MODE - NEXT SHOT PREVIEW (recompute after any change)
  ##############################################
  wingman_victory_recompute_preview:
    wingman_victory_next_shot_total:
      action: set
      int: current_player.wingman_victory_shot_value * current_player.wingman_victory_position

  ##############################################
  ## VICTORY MODE - JACKPOT READY / COLLECT
  ## mach/pf multiplier IS applied at collection (only once,
  ## on the raw banked total) - the mode's own 1x-6x position
  ## multiplier is NOT re-applied since each hit already baked
  ## its own position multiplier in when it was banked.
  ##############################################
  wingman_victory_all_collected:
    wingman_victory_jackpot_ready:
      action: set
      int: 1

  wingman_victory_jackpot_hit:
    score:
      action: add
      int: current_player.wingman_victory_jackpot * current_player.total_scoring_multiplier
    mode_points_scored:
      action: set
      int: current_player.wingman_victory_jackpot * current_player.total_scoring_multiplier
    wingman_victory_jackpot:
      action: set
      int: 0
    wingman_victory_jackpot_ready:
      action: set
      int: 0
    wingman_victory_hit_count:
      action: set
      int: 0
    wingman_victory_hit_ll:
      action: set
      int: 0
    wingman_victory_hit_lo:
      action: set
      int: 0
    wingman_victory_hit_lr:
      action: set
      int: 0
    wingman_victory_hit_sp:
      action: set
      int: 0
    wingman_victory_hit_cnt:
      action: set
      int: 0
    wingman_victory_hit_twr:
      action: set
      int: 0
    wingman_victory_hit_to:
      action: set
      int: 0
    wingman_victory_hit_gear:
      action: set
      int: 0
    wingman_victory_hit_rr:
      action: set
      int: 0

####################################################################################
# EVENT PLAYER - Mode flow and shot detection
####################################################################################

event_player:
  ##############################################
  ## MODE START SEQUENCE
  ##############################################
  
  # Delayed GI reset and play instructions voice during ball hold
  mode_pilot_training_mission_wingman_started:
    - wingman_set_gi|200ms
    - wingman_play_instructions_voice
    - ball_search_block
  
  # Skip intro with both flippers
  s_flipper_left_active{current_player.wingman_mode_active==0 and device.timers.wingman_intro_delay.running}:
    - wingman_check_skip_intro
  s_flipper_right_active{current_player.wingman_mode_active==0 and device.timers.wingman_intro_delay.running}:
    - wingman_check_skip_intro
    
  wingman_check_skip_intro{device.switches.s_flipper_left.state and device.switches.s_flipper_right.state}:
    - wingman_skip_intro

  wingman_skip_intro:
    - wingman_ball_released
    - wingman_setup_zone_2

  # Intro timer complete - release ball and start gameplay
  timer_wingman_intro_delay_complete:
    - wingman_ball_released
    - wingman_setup_zone_2

  # Ball released - start multiball, raise top ramp for TO shot
  wingman_ball_released:
    - wingman_start_multiball
    - top_ramp_up
    - ball_search_unblock

  ##############################################
  ## ORBIT LOCKOUT ON PLUNGE
  ## Prevents false shots when ball auto-launches through orbit
  ##############################################
  s_shooter_lane_active{current_player.wingman_mode_active==1}:
    - wingman_start_plunge_lockout

  ##############################################
  ## ZONE SHIFT LOGIC (Ping-pong: M→R→M→L→M→R...)
  ##############################################
  
  # From MIDDLE going right → go to RIGHT
  timer_wingman_zone_shift_timer_complete{current_player.wingman_good_zone==2 and current_player.wingman_zone_direction==1}:
    - wingman_setup_zone_3
    - wingman_zone_shifted
  
  # From RIGHT → back to MIDDLE, reverse direction to left
  timer_wingman_zone_shift_timer_complete{current_player.wingman_good_zone==3}:
    - wingman_setup_zone_2
    - wingman_reverse_to_left
    - wingman_zone_shifted
  
  # From MIDDLE going left → go to LEFT
  timer_wingman_zone_shift_timer_complete{current_player.wingman_good_zone==2 and current_player.wingman_zone_direction==0}:
    - wingman_setup_zone_1
    - wingman_zone_shifted
  
  # From LEFT → back to MIDDLE, reverse direction to right
  timer_wingman_zone_shift_timer_complete{current_player.wingman_good_zone==1}:
    - wingman_setup_zone_2
    - wingman_reverse_to_right
    - wingman_zone_shifted
  
  # Zone setup events set the variable AND update lights
  wingman_setup_zone_1:
    - wingman_shift_to_zone_1
    - wingman_light_zone_1
  
  wingman_setup_zone_2:
    - wingman_shift_to_zone_2
    - wingman_light_zone_2
  
  wingman_setup_zone_3:
    - wingman_shift_to_zone_3
    - wingman_light_zone_3

  ##############################################
  ## ZONE WARNING - Green → Orange for the last 2 seconds
  ## (6s zone - 2s warning = tick 4)
  ## GUARDED with wingman_won==0: without this, a warning tick landing
  ## in the same instant as the win can turn a shot orange right as
  ## victory mode starts, racing victory_start's own light_player call.
  ##############################################
  
  timer_wingman_zone_shift_timer_tick{ticks==4 and current_player.wingman_good_zone==1 and current_player.wingman_won==0}:
    - wingman_warn_zone_1
  timer_wingman_zone_shift_timer_tick{ticks==4 and current_player.wingman_good_zone==2 and current_player.wingman_won==0}:
    - wingman_warn_zone_2
  timer_wingman_zone_shift_timer_tick{ticks==4 and current_player.wingman_good_zone==3 and current_player.wingman_won==0}:
    - wingman_warn_zone_3

  ##############################################
  ## SHOT DETECTION - Per-shot resolution
  ## GREEN=good, RED=bad, NEUTRAL=ignored (no event)
  ##############################################
  
  # LL (s_lane_left): LEFT=GOOD, MIDDLE=BAD, RIGHT=BAD
  s_lane_left_active{current_player.wingman_mode_active==1 and current_player.wingman_good_zone==1}:
    - wingman_good_shot
  s_lane_left_active{current_player.wingman_mode_active==1 and current_player.wingman_good_zone==2}:
    - wingman_bad_shot
  s_lane_left_active{current_player.wingman_mode_active==1 and current_player.wingman_good_zone==3}:
    - wingman_bad_shot

  # LO (left_orbit_shot_hit): LEFT=GOOD, MIDDLE=BAD, RIGHT=BAD
  left_orbit_shot_hit{current_player.wingman_mode_active==1 and current_player.wingman_orbit_locked_out==0 and current_player.wingman_good_zone==1}:
    - wingman_good_shot
  left_orbit_shot_hit{current_player.wingman_mode_active==1 and current_player.wingman_orbit_locked_out==0 and current_player.wingman_good_zone==2}:
    - wingman_bad_shot
  left_orbit_shot_hit{current_player.wingman_mode_active==1 and current_player.wingman_orbit_locked_out==0 and current_player.wingman_good_zone==3}:
    - wingman_bad_shot

  # LR (s_ramp_left_exit): LEFT=GOOD, MIDDLE=NEUTRAL, RIGHT=BAD
  s_ramp_left_exit_active{current_player.wingman_mode_active==1 and current_player.wingman_good_zone==1}:
    - wingman_good_shot
  s_ramp_left_exit_active{current_player.wingman_mode_active==1 and current_player.wingman_good_zone==3}:
    - wingman_bad_shot

  # SP (spinner_shot_made): LEFT=NEUTRAL, MIDDLE=GOOD, RIGHT=NEUTRAL
  spinner_shot_made{current_player.wingman_mode_active==1 and current_player.wingman_good_zone==2 and current_player.spinner_shot_locked==0}:
    - wingman_good_shot

  # TWR (s_ramp_tower_exit): LEFT=NEUTRAL, MIDDLE=GOOD, RIGHT=NEUTRAL
  s_ramp_tower_exit_active{current_player.wingman_mode_active==1 and current_player.wingman_good_zone==2}:
    - wingman_good_shot

  # TL (s_orbit_upper): LEFT=NEUTRAL, MIDDLE=GOOD, RIGHT=GOOD
  s_orbit_upper_active{current_player.wingman_mode_active==1 and current_player.wingman_orbit_locked_out==0 and current_player.wingman_good_zone==2}:
    - wingman_good_shot
  s_orbit_upper_active{current_player.wingman_mode_active==1 and current_player.wingman_orbit_locked_out==0 and current_player.wingman_good_zone==3}:
    - wingman_good_shot

  # TO (s_orbit_lower): LEFT=BAD, MIDDLE=NEUTRAL, RIGHT=GOOD
  s_orbit_lower_active{current_player.wingman_mode_active==1 and current_player.wingman_orbit_locked_out==0 and current_player.wingman_good_zone==3}:
    - wingman_good_shot
  s_orbit_lower_active{current_player.wingman_mode_active==1 and current_player.wingman_orbit_locked_out==0 and current_player.wingman_good_zone==1}:
    - wingman_bad_shot

  # RR (s_ramp_right_exit): LEFT=BAD, MIDDLE=BAD, RIGHT=GOOD
  s_ramp_right_exit_active{current_player.wingman_mode_active==1 and current_player.wingman_good_zone==3}:
    - wingman_good_shot
  s_ramp_right_exit_active{current_player.wingman_mode_active==1 and current_player.wingman_good_zone==1}:
    - wingman_bad_shot
  s_ramp_right_exit_active{current_player.wingman_mode_active==1 and current_player.wingman_good_zone==2}:
    - wingman_bad_shot

  ##############################################
  ## GOOD/BAD SHOT PROCESSING
  ##############################################
  
  # Good shot: score first, then increment position
  wingman_good_shot:
    - wingman_score_good
    - wingman_position_up
    - wingman_good_shot_gi_flash
    - wingman_check_good_callout

  # Bad shot: score first, then decrement position, then floor check
  # NOTE: bad shots no longer flash the GI (good-shot-only per latest design)
  wingman_bad_shot:
    - wingman_score_bad
    - wingman_position_down
    - wingman_check_bank_floor
    - wingman_check_bad_callout

  # Only play random callouts if position didn't reach a milestone or endpoint
  # wingman_check_good_callout{current_player.wingman_position!=4 and current_player.wingman_position!=6}:
  #   - play_shot_made_callout
  # wingman_check_bad_callout{current_player.wingman_position!=-4 and current_player.wingman_position!=-6}:
  #   - play_shot_missed_callout

  ##############################################
  ## POSITION MILESTONE CHECKS
  ##############################################
  
  # Position +4 milestone slide
  player_wingman_position{value==4}:
    - wingman_position_4_reached
  
  # Position -4 milestone slide
  player_wingman_position{value==-4}:
    - wingman_position_neg_4_reached

  ##############################################
  ## WIN CHECK (position +6)
  ##############################################
  
  player_wingman_position{value>=6}:
    - wingman_won_trigger

  # Perfect run bonus - only if zero bad shots
  wingman_won_trigger{current_player.wingman_bad_shots_count==0}:
    - wingman_perfect_run_bonus

  ##############################################
  ## WIN FLOW v2 - NO DRAINING
  ## voice_wingman_won still fires immediately on wingman_won_trigger
  ## (see sound_player - unchanged). Instead of disabling flippers and
  ## draining, we drop straight into victory mode and the multiball
  ## keeps running normally.
  ##############################################
  wingman_won_trigger:
    - wingman_victory_start

  # Multiball naturally winds down to 1 ball while the player has won ->
  # stop victory scoring, play the victory slide for 18s (reuses the
  # existing pilot_training_mission_wingman_won slide/timer), then clean
  # up and hand back to the base game.
  multiball_wingman_multiball_ended{current_player.wingman_won==1}:
    - wingman_victory_final_start

  wingman_victory_final_start:
    - wingman_victory_active_off
    - wingman_play_won_video

  timer_wingman_won_video_delay_complete{current_player.wingman_won==1}:
    - wingman_cleanup
    - pilot_mode_cleanup_complete
    - wingman_drain_cleanup_complete

  ##############################################
  ## SKIP WON VIDEO WITH BOTH FLIPPERS
  ## Same pattern as the intro skip - both flippers held while the 18s
  ## video timer is running jumps straight to the same cleanup the timer
  ## would normally trigger on its own.
  ##############################################
  s_flipper_left_active{device.timers.wingman_won_video_delay.running}:
    - wingman_check_skip_won_video
  s_flipper_right_active{device.timers.wingman_won_video_delay.running}:
    - wingman_check_skip_won_video

  wingman_check_skip_won_video{device.switches.s_flipper_left.state and device.switches.s_flipper_right.state}:
    - wingman_skip_won_video

  wingman_skip_won_video{current_player.wingman_won==1}:
    - wingman_cleanup
    - pilot_mode_cleanup_complete
    - wingman_drain_cleanup_complete

  ##############################################
  ## LOSE BY BAD SHOTS (position -6)
  ## Unchanged: disable flippers → balls drain →
  ## ball_save catches last ball → video plays → plunge ball → continue
  ##############################################
  
  player_wingman_position{value<=-6}:
    - wingman_lost_bad_shots

  # Disable flippers and play callout immediately (video comes after callout delay)
  wingman_lost_bad_shots:
    - disable_normal_flippers
    - disable_autofires
    - wingman_cleanup_lights

  # Callout finishes → now play the lost video
  timer_wingman_lost_callout_delay_complete:
    - wingman_play_lost_bad_shots_video

  # Lost video finishes → pre-plunge timer handles the rest
  timer_wingman_lost_bad_shots_delay_complete:
    - wingman_ball_returning

  ##############################################
  ## SKIP LOST-BY-BAD-SHOTS VIDEO WITH BOTH FLIPPERS
  ## Jumps to exactly what the timer's natural completion does
  ## (wingman_ball_returning) - does NOT skip the 3s pre-plunge warning
  ## after it, since that's a real-world "ball incoming" safety delay,
  ## not part of the video.
  ##############################################
  s_flipper_left_active{device.timers.wingman_lost_bad_shots_delay.running}:
    - wingman_check_skip_lost_bad_shots_video
  s_flipper_right_active{device.timers.wingman_lost_bad_shots_delay.running}:
    - wingman_check_skip_lost_bad_shots_video

  wingman_check_skip_lost_bad_shots_video{device.switches.s_flipper_left.state and device.switches.s_flipper_right.state}:
    - wingman_skip_lost_bad_shots_video

  wingman_skip_lost_bad_shots_video:
    - wingman_ball_returning

  # Pre-plunge delay complete → clean up mode FIRST, then plunge saved ball
  # Cleanup must happen before plunge so display is clear when ball launches
  # (shared tail - only the LOSS path feeds into this now; win no longer does)
  timer_wingman_pre_plunge_delay_complete:
    - wingman_cleanup
    - pilot_mode_cleanup_complete
    - wingman_drain_cleanup_complete
    - enable_normal_flippers
    - enable_autofires
    - wingman_post_mode_plunge

  ##############################################
  ## LOSE BY DRAIN (multiball ended)
  ##############################################
  
  # Check for multiball ending (only if not already won/lost)
  multiball_wingman_multiball_ended{current_player.wingman_won==0 and current_player.wingman_mode_active==1}:
    - wingman_lost_drain

  wingman_lost_drain:
    - wingman_cleanup

  timer_wingman_lost_drain_delay_complete:
    - wingman_cleanup
    - pilot_mode_cleanup_complete
    - wingman_drain_cleanup_complete

  ##############################################
  ## SKIP LOST-BY-DRAIN VIDEO WITH BOTH FLIPPERS
  ## No ball is being held/caught on this path, so skipping goes
  ## straight to the same cleanup the timer would trigger on its own.
  ##############################################
  s_flipper_left_active{device.timers.wingman_lost_drain_delay.running}:
    - wingman_check_skip_lost_drain_video
  s_flipper_right_active{device.timers.wingman_lost_drain_delay.running}:
    - wingman_check_skip_lost_drain_video

  wingman_check_skip_lost_drain_video{device.switches.s_flipper_left.state and device.switches.s_flipper_right.state}:
    - wingman_skip_lost_drain_video

  wingman_skip_lost_drain_video:
    - wingman_cleanup
    - pilot_mode_cleanup_complete
    - wingman_drain_cleanup_complete

  ##############################################
  ## BALL ENDING HOLD - Safety catch
  ## If ball_ending fires and no loss has been triggered yet,
  ## start the drain loss flow
  ##############################################
  wingman_ball_ending_hold{current_player.wingman_won==0 and current_player.wingman_drain_handled==0}:
    - wingman_lost_drain

  ##############################################
  ## EMERGENCY RESUME - Player manually plunged during video
  ## Shooter lane went inactive for 500ms = ball is in play
  ## Skip remaining video/timers, re-enable everything immediately
  ## Do NOT fire wingman_post_mode_plunge (ball already launched)
  ##############################################
  timer_wingman_manual_plunge_detect_complete:
    - wingman_emergency_resume

  wingman_emergency_resume:
    - wingman_cleanup
    - pilot_mode_cleanup_complete
    - wingman_drain_cleanup_complete
    - enable_normal_flippers
    - enable_autofires

  ##############################################
  ## ICEMAN ADD-A-BALL CHECK
  ##############################################
  
  # Check for ICEMAN completion after any letter hit
  s_i_iceman_target_active{current_player.wingman_iceman_i==0 and current_player.wingman_iceman_c==1 and current_player.wingman_iceman_e==1 and current_player.wingman_iceman_m==1 and current_player.wingman_iceman_a==1 and current_player.wingman_iceman_n==1 and current_player.wingman_mode_active==1}:
    - wingman_iceman_complete
  s_c_iceman_target_active{current_player.wingman_iceman_i==1 and current_player.wingman_iceman_c==0 and current_player.wingman_iceman_e==1 and current_player.wingman_iceman_m==1 and current_player.wingman_iceman_a==1 and current_player.wingman_iceman_n==1 and current_player.wingman_mode_active==1}:
    - wingman_iceman_complete
  s_e_iceman_target_active{current_player.wingman_iceman_i==1 and current_player.wingman_iceman_c==1 and current_player.wingman_iceman_e==0 and current_player.wingman_iceman_m==1 and current_player.wingman_iceman_a==1 and current_player.wingman_iceman_n==1 and current_player.wingman_mode_active==1}:
    - wingman_iceman_complete
  s_m_iceman_target_active{current_player.wingman_iceman_i==1 and current_player.wingman_iceman_c==1 and current_player.wingman_iceman_e==1 and current_player.wingman_iceman_m==0 and current_player.wingman_iceman_a==1 and current_player.wingman_iceman_n==1 and current_player.wingman_mode_active==1}:
    - wingman_iceman_complete
  s_a_iceman_target_active{current_player.wingman_iceman_i==1 and current_player.wingman_iceman_c==1 and current_player.wingman_iceman_e==1 and current_player.wingman_iceman_m==1 and current_player.wingman_iceman_a==0 and current_player.wingman_iceman_n==1 and current_player.wingman_mode_active==1}:
    - wingman_iceman_complete
  s_n_iceman_target_active{current_player.wingman_iceman_i==1 and current_player.wingman_iceman_c==1 and current_player.wingman_iceman_e==1 and current_player.wingman_iceman_m==1 and current_player.wingman_iceman_a==1 and current_player.wingman_iceman_n==0 and current_player.wingman_mode_active==1}:
    - wingman_iceman_complete

  # Add-a-ball QUALIFIED on 1st ICEMAN completion only (max 3 balls)
  # Lights pilot gear target flashing orange - player must hit it to collect
  player_wingman_iceman_completions{value==1 and current_player.wingman_balls_in_play<3}:
    - wingman_add_a_ball_qualified

  # Pilot gear target hit while add-a-ball is ready → collect add-a-ball
  s_flight_gear_target_active{current_player.wingman_add_a_ball_ready==1 and current_player.wingman_mode_active==1}:
    - wingman_add_a_ball

  ##############################################
  ## GI FLASH ANIMATIONS
  ##############################################
  
  # Pop bumper hits - cyan flash
  s_bumper_left_active{current_player.wingman_mode_active==1}:
    - wingman_pop_bumper_flash
  s_bumper_center_active{current_player.wingman_mode_active==1}:
    - wingman_pop_bumper_flash
  s_bumper_right_active{current_player.wingman_mode_active==1}:
    - wingman_pop_bumper_flash

  ##############################################
  ## MODE CLEANUP
  ##############################################
  
  wingman_cleanup:
    - wingman_cleanup_lights
    - barrier_raise
    - top_ramp_down
    - ball_search_unblock

  ##############################################
  ## AUTO-PLUNGER
  ##############################################
  
  # Auto-plunger fires 1 second after ball settles on shooter lane
  # (same pattern as inverted mode)

  ##############################################
  ## VICTORY MODE - SHOT DETECTION
  ## All 9 shots lit at once. First hit on a shot = good.
  ## Hitting an already-collected (red) shot again = bad.
  ## CNT (barrier) does double duty: normal shot until all 9
  ## are collected, then becomes the jackpot collect shot.
  ##############################################

  # LL (s_lane_left)
  s_lane_left_active{current_player.wingman_victory_active==1 and current_player.wingman_victory_hit_ll==0}:
    - wingman_victory_good_shot_ll
  s_lane_left_active{current_player.wingman_victory_active==1 and current_player.wingman_victory_hit_ll==1}:
    - wingman_victory_bad_shot_ll

  # LO (left orbit, composite) - respects post-plunge orbit lockout
  left_orbit_shot_hit{current_player.wingman_victory_active==1 and current_player.wingman_orbit_locked_out==0 and current_player.wingman_victory_hit_lo==0}:
    - wingman_victory_good_shot_lo
  left_orbit_shot_hit{current_player.wingman_victory_active==1 and current_player.wingman_orbit_locked_out==0 and current_player.wingman_victory_hit_lo==1}:
    - wingman_victory_bad_shot_lo

  # LR (s_ramp_left_exit)
  s_ramp_left_exit_active{current_player.wingman_victory_active==1 and current_player.wingman_victory_hit_lr==0}:
    - wingman_victory_good_shot_lr
  s_ramp_left_exit_active{current_player.wingman_victory_active==1 and current_player.wingman_victory_hit_lr==1}:
    - wingman_victory_bad_shot_lr

  # SP (spinner, composite - 3 spins)
  spinner_shot_made{current_player.wingman_victory_active==1 and current_player.wingman_victory_hit_sp==0}:
    - wingman_victory_good_shot_sp
  spinner_shot_made{current_player.wingman_victory_active==1 and current_player.wingman_victory_hit_sp==1}:
    - wingman_victory_bad_shot_sp

  # CNT (s_barrier_target) - jackpot shot once all 9 are collected
  s_barrier_target_active{current_player.wingman_victory_active==1 and current_player.wingman_victory_jackpot_ready==1}:
    - wingman_victory_jackpot_hit
  s_barrier_target_active{current_player.wingman_victory_active==1 and current_player.wingman_victory_jackpot_ready==0 and current_player.wingman_victory_hit_cnt==0}:
    - wingman_victory_good_shot_cnt
  s_barrier_target_active{current_player.wingman_victory_active==1 and current_player.wingman_victory_jackpot_ready==0 and current_player.wingman_victory_hit_cnt==1}:
    - wingman_victory_bad_shot_cnt

  # TWR (s_ramp_tower_exit)
  s_ramp_tower_exit_active{current_player.wingman_victory_active==1 and current_player.wingman_victory_hit_twr==0}:
    - wingman_victory_good_shot_twr
  s_ramp_tower_exit_active{current_player.wingman_victory_active==1 and current_player.wingman_victory_hit_twr==1}:
    - wingman_victory_bad_shot_twr

  # TO (s_orbit_lower) - respects post-plunge orbit lockout
  s_orbit_lower_active{current_player.wingman_victory_active==1 and current_player.wingman_orbit_locked_out==0 and current_player.wingman_victory_hit_to==0}:
    - wingman_victory_good_shot_to
  s_orbit_lower_active{current_player.wingman_victory_active==1 and current_player.wingman_orbit_locked_out==0 and current_player.wingman_victory_hit_to==1}:
    - wingman_victory_bad_shot_to

  # 2X / Pilot Gear (s_flight_gear_target)
  s_flight_gear_target_active{current_player.wingman_victory_active==1 and current_player.wingman_victory_hit_gear==0}:
    - wingman_victory_good_shot_gear
  s_flight_gear_target_active{current_player.wingman_victory_active==1 and current_player.wingman_victory_hit_gear==1}:
    - wingman_victory_bad_shot_gear

  # RR (s_ramp_right_exit)
  s_ramp_right_exit_active{current_player.wingman_victory_active==1 and current_player.wingman_victory_hit_rr==0}:
    - wingman_victory_good_shot_rr
  s_ramp_right_exit_active{current_player.wingman_victory_active==1 and current_player.wingman_victory_hit_rr==1}:
    - wingman_victory_bad_shot_rr

  ##############################################
  ## VICTORY MODE - GOOD SHOT CHAIN (per-shot events above
  ## all funnel here after setting their own hit flag)
  ## Order matters: score/bank FIRST (uses current values),
  ## THEN ramp position/value for the next shot.
  ##############################################
  wingman_victory_good_shot_ll:
    - wingman_victory_good_shot
    - wingman_victory_position_increment
    - wingman_victory_shot_value_increment
    - wingman_victory_recompute_preview
    - wingman_victory_check_all_collected
  wingman_victory_good_shot_lo:
    - wingman_victory_good_shot
    - wingman_victory_position_increment
    - wingman_victory_shot_value_increment
    - wingman_victory_recompute_preview
    - wingman_victory_check_all_collected
  wingman_victory_good_shot_lr:
    - wingman_victory_good_shot
    - wingman_victory_position_increment
    - wingman_victory_shot_value_increment
    - wingman_victory_recompute_preview
    - wingman_victory_check_all_collected
  wingman_victory_good_shot_sp:
    - wingman_victory_good_shot
    - wingman_victory_position_increment
    - wingman_victory_shot_value_increment
    - wingman_victory_recompute_preview
    - wingman_victory_check_all_collected
  wingman_victory_good_shot_cnt:
    - wingman_victory_good_shot
    - wingman_victory_position_increment
    - wingman_victory_shot_value_increment
    - wingman_victory_recompute_preview
    - wingman_victory_check_all_collected
  wingman_victory_good_shot_twr:
    - wingman_victory_good_shot
    - wingman_victory_position_increment
    - wingman_victory_shot_value_increment
    - wingman_victory_recompute_preview
    - wingman_victory_check_all_collected
  wingman_victory_good_shot_to:
    - wingman_victory_good_shot
    - wingman_victory_position_increment
    - wingman_victory_shot_value_increment
    - wingman_victory_recompute_preview
    - wingman_victory_check_all_collected
  wingman_victory_good_shot_gear:
    - wingman_victory_good_shot
    - wingman_victory_position_increment
    - wingman_victory_shot_value_increment
    - wingman_victory_recompute_preview
    - wingman_victory_check_all_collected
  wingman_victory_good_shot_rr:
    - wingman_victory_good_shot
    - wingman_victory_position_increment
    - wingman_victory_shot_value_increment
    - wingman_victory_recompute_preview
    - wingman_victory_check_all_collected

  ##############################################
  ## VICTORY MODE - BAD SHOT CHAIN
  ##############################################
  wingman_victory_bad_shot_ll:
    - wingman_victory_bad_shot_position
    - wingman_victory_recompute_preview
  wingman_victory_bad_shot_lo:
    - wingman_victory_bad_shot_position
    - wingman_victory_recompute_preview
  wingman_victory_bad_shot_lr:
    - wingman_victory_bad_shot_position
    - wingman_victory_recompute_preview
  wingman_victory_bad_shot_sp:
    - wingman_victory_bad_shot_position
    - wingman_victory_recompute_preview
  wingman_victory_bad_shot_cnt:
    - wingman_victory_bad_shot_position
    - wingman_victory_recompute_preview
  wingman_victory_bad_shot_twr:
    - wingman_victory_bad_shot_position
    - wingman_victory_recompute_preview
  wingman_victory_bad_shot_to:
    - wingman_victory_bad_shot_position
    - wingman_victory_recompute_preview
  wingman_victory_bad_shot_gear:
    - wingman_victory_bad_shot_position
    - wingman_victory_recompute_preview
  wingman_victory_bad_shot_rr:
    - wingman_victory_bad_shot_position
    - wingman_victory_recompute_preview

  ##############################################
  ## VICTORY MODE - ALL 9 COLLECTED -> ARM JACKPOT
  ##############################################
  wingman_victory_check_all_collected{current_player.wingman_victory_hit_count==9}:
    - wingman_victory_all_collected

####################################################################################
# SOUND PLAYER - Mode Voice Callouts
####################################################################################
# Music is handled in base.yaml (NOT here)
# Sound files in: modes/pilot_training_mission_wingman/sounds/voice/
####################################################################################

sound_player:
  # Instructions voice - plays during intro ball hold
  wingman_play_instructions_voice:
    voice_wingman_instructions:
      bus: voice
      loops: 0

  # Won voice callout - plays simultaneously with beaten animation
  wingman_won_trigger:
    voice_wingman_won:
      bus: voice
      loops: 0

  # Lost by bad shots voice - plays immediately on loss (video follows after callout delay)
  wingman_lost_bad_shots:
    voice_wingman_lost:
      bus: voice
      loops: 0

####################################################################################
# SLIDE PLAYER
####################################################################################

slide_player:
  # Main gameplay HUD - plays during entire mode at lower priority
  # Covered by instructions (800) during intro, becomes visible when instructions removed
  # Covered by win/loss videos (900) at end
  mode_pilot_training_mission_wingman_started:
    wingman_beaten_animation:
      action: play
      priority: 700
    pilot_training_mission_wingman_instructions:
      action: play
      priority: 800

  # Skip intro removes instructions (HUD becomes visible)
  wingman_skip_intro:
    pilot_training_mission_wingman_instructions:
      action: remove

  # Timer complete removes instructions (normal path, HUD becomes visible)
  timer_wingman_intro_delay_complete:
    pilot_training_mission_wingman_instructions:
      action: remove

  ##############################################
  ## VICTORY MODE - SLIDE SWAP
  ## wingman_beaten_animation's own win-overlay draw path is for the OLD
  ## drain-at-win flow (it just sits static once wingman_won==1) - swap
  ## it out for the dedicated wingman_victory slide as soon as victory
  ## mode starts, so the live victory HUD actually shows.
  ##############################################
  wingman_victory_start:
    wingman_beaten_animation:
      action: remove
    wingman_victory:
      action: play
      priority: 700

  # Multiball ends -> the 18s won video takes over at priority 900;
  # remove the victory HUD underneath it
  wingman_victory_final_start:
    wingman_victory:
      action: remove

  # Position +4 milestone
  wingman_position_4_reached:
    wingman_positive_4:
      action: play
      priority: 850
      expire: 9.1s

  # Position -4 milestone
  wingman_position_neg_4_reached:
    wingman_negative_4:
      action: play
      priority: 850
      expire: 9.1s

  # Good shot points display
  wingman_good_shot:
    mode_points_scored:
      action: play
      priority: 840
      expire: 2s

  # Bad shot points display
  wingman_bad_shot:
    mode_points_scored:
      action: play
      priority: 840
      expire: 2s

  # Add-a-ball notification (shared slide)
  wingman_add_a_ball:
    multiball_add_a_ball:
      action: play
      priority: 850
      expire: 3s

  # WIN: Victory slide (18 seconds) - now fires when the multiball
  # naturally ends (down to 1 ball), NOT immediately at win. See
  # event_player: wingman_victory_final_start.
  wingman_play_won_video:
    pilot_training_mission_wingman_won:
      action: play
      priority: 900
      expire: 18s

  # Skip won video - the slide's own "expire: 18s" is independent of the
  # game timer, so skipping early needs an explicit removal or it would
  # otherwise linger on screen for its remaining expire duration.
  wingman_skip_won_video:
    pilot_training_mission_wingman_won:
      action: remove

  # LOSE by bad shots: lost_2 slide (9.1 seconds) - starts AFTER drain delay
  wingman_play_lost_bad_shots_video:
    pilot_training_mission_wingman_lost_2:
      action: play
      priority: 900
      expire: 9.1s

  # Skip lost-by-bad-shots video - explicit removal, same reasoning as won video
  wingman_skip_lost_bad_shots_video:
    pilot_training_mission_wingman_lost_2:
      action: remove

  # LOSE by drain: lost_1 slide (9.1 seconds)
  wingman_lost_drain:
    pilot_training_mission_wingman_lost_1:
      action: play
      priority: 900
      expire: 9.1s

  # Skip lost-by-drain video - explicit removal, same reasoning as won video
  wingman_skip_lost_drain_video:
    pilot_training_mission_wingman_lost_1:
      action: remove

  # Victory mode - good shot points display (reuses same slide as tug-of-war)
  wingman_victory_good_shot:
    mode_points_scored:
      action: play
      priority: 840
      expire: 2s

  # Victory mode - jackpot collect points display
  wingman_victory_jackpot_hit:
    mode_points_scored:
      action: play
      priority: 840
      expire: 2s

  # Cleanup - remove all slides on mode end
  # NOTE: wingman_perk_active is NOT removed here - qualifier owns that slide's
  # lifecycle via player_wingman_perk_active{value==0/1} and clears on ball_ending
  wingman_cleanup:
    pilot_training_mission_wingman_instructions:
      action: remove
    wingman_beaten_animation:
      action: remove
    wingman_victory:
      action: remove
    mode_points_scored:
      action: remove

