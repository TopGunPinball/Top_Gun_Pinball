####################################################################################
# SHOW PLAYER - GI Animations and Mode Insert
####################################################################################

show_player:
  ##############################################
  ## SHOOT AGAIN FLASH
  ##############################################
  
  ball_save_wingman_multiball_ball_save_enabled:
    wingman_shoot_again_flash:
      show: sync_flash_mode
      key: wingman_shoot_again
      sync_ms: 500
      loops: -1
      show_tokens:
        led: l_shoot_again
        color: white
  
  ball_save_wingman_multiball_ball_save_disabled:
    stop_wingman_shoot_again:
      show: sync_flash_mode
      action: stop
      key: wingman_shoot_again

  ##############################################
  ## STATIC GI PATTERN
  ##############################################
  
  mode_pilot_training_mission_wingman_started:
    wingman_static_gi_show:
      show: wingman_static_gi
      key: wingman_static_gi
      loops: -1
      priority: 1000
    # Pulse the mode insert light during gameplay
    wingman_insert_pulse:
      show: sync_flash_mode
      key: wingman_insert_pulse
      sync_ms: 1000
      loops: -1
      show_tokens:
        led: l_mode_wingman
        color: white
      priority: 900

  ##############################################
  ## GOOD SHOT GI STROBE (blue/cyan, 2 seconds)
  ##############################################
  
  wingman_good_shot_gi_flash:
    wingman_good_gi_animation:
      show: wingman_good_shot_gi_strobe
      key: wingman_gi_animation
      loops: 11
      priority: 1100

  ##############################################
  ## BAD SHOT GI STROBE (red/orange, 2 seconds)
  ##############################################
  
  wingman_bad_shot_gi_flash:
    wingman_bad_gi_animation:
      show: wingman_bad_shot_gi_strobe
      key: wingman_gi_animation
      loops: 11
      priority: 1100

  ##############################################
  ## POP BUMPER FLASH
  ##############################################
  
  wingman_pop_bumper_flash:
    wingman_pop_flash:
      show: wingman_pop_bumper_gi_flash
      key: wingman_pop_flash
      loops: 0
      priority: 1100

  ##############################################
  ## ICEMAN COMPLETION CELEBRATION
  ##############################################
  
  wingman_iceman_complete:
    wingman_iceman_celebration:
      show: wingman_iceman_complete_flash
      key: wingman_iceman_celebration
      loops: 0
  
  timer_wingman_iceman_celebration_timer_complete:
    stop_wingman_iceman_celebration:
      show: wingman_iceman_complete_flash
      action: stop
      key: wingman_iceman_celebration

  ##############################################
  ## ADD-A-BALL PILOT GEAR TARGET (flashing orange)
  ##############################################

  wingman_add_a_ball_qualified:
    wingman_pilot_gear_flash:
      show: sync_flash_mode
      key: wingman_pilot_gear_flash
      sync_ms: 500
      loops: -1
      show_tokens:
        led: l_shot_pilot_gear
        color: FFA500

  wingman_add_a_ball:
    stop_wingman_pilot_gear_flash:
      show: sync_flash_mode
      action: stop
      key: wingman_pilot_gear_flash

  ##############################################
  ## CLEANUP
  ##############################################
  
  ##############################################
  ## VICTORY MODE - JACKPOT FLASH (barrier target)
  ## Flashes once all 9 shots are collected, cued to collect
  ## the super jackpot. Stops on collect (relight happens via
  ## light_player) or on mode cleanup.
  ## priority: 900 - MUST outrank the CNT good-shot light_player entry
  ## (priority 800, which sets the barrier red when CNT itself is one of
  ## the 9 hits and never auto-expires) or the red just sits on top of
  ## the flash and the barrier never visibly flashes light blue.
  ##############################################
  wingman_victory_all_collected:
    wingman_victory_jackpot_flash:
      show: sync_flash_mode
      key: wingman_victory_jackpot_flash
      priority: 900
      sync_ms: 500
      loops: -1
      show_tokens:
        led: l_shot_barrier
        color: lightblue

  wingman_victory_jackpot_hit:
    stop_wingman_victory_jackpot_flash:
      show: sync_flash_mode
      action: stop
      key: wingman_victory_jackpot_flash

  wingman_cleanup:
    stop_wingman_static_gi:
      show: wingman_static_gi
      action: stop
      key: wingman_static_gi
    stop_wingman_shoot_again_cleanup:
      show: sync_flash_mode
      action: stop
      key: wingman_shoot_again
    stop_wingman_insert:
      show: sync_flash_mode
      action: stop
      key: wingman_insert_pulse
    stop_wingman_pilot_gear_cleanup:
      show: sync_flash_mode
      action: stop
      key: wingman_pilot_gear_flash
    stop_wingman_victory_jackpot_flash_cleanup:
      show: sync_flash_mode
      action: stop
      key: wingman_victory_jackpot_flash

####################################################################################
# COIL PLAYER - Left lane post and auto-plunger
####################################################################################

coil_player:
  # Left lane post - hold ball during intro video
  mode_pilot_training_mission_wingman_started:
    c_left_lane_up_post:
      action: enable

  # Release ball after intro (or skip)
  wingman_ball_released:
    c_left_lane_up_post:
      action: disable

  # Auto-plunger - fires 500ms after ball settles on shooter lane
  # CHANGED: added pulse_power: 0.625 + pulse_ms: 22 (matches inverted/Top Gun MB).
  # 0.625 is the next FAST-quantized step above the 0.5 c_plunger default; 22ms
  # is a touch under the default 26ms to target pop-bumper energy. Without these,
  # the pulse used the coil's 50% default, which barely cleared the launch lane.
  timer_wingman_auto_plunger_delay_complete:
    c_plunger:
      action: pulse
      pulse_power: 0.625
      pulse_ms: 22

  # Post-mode plunge - fires plunger to launch saved ball after video ends
  wingman_post_mode_plunge:
    c_plunger:
      action: pulse

  # Mode cleanup - disable all coils
  wingman_cleanup:
    c_left_lane_up_post:
      action: disable

  # Safety - disable post on mode stop
  mode_pilot_training_mission_wingman_will_stop:
    c_left_lane_up_post:
      action: disable

