##############################################################################
## RANDOM EVENT PLAYER - shot callouts + missiles video between sets
##############################################################################
random_event_player:
  # Missiles video after an evaded set (the next set is already live)
  fb_p2_mvid_pick:
    force_all: true
    events:
      - fb_p2_mvid_1
      - fb_p2_mvid_2
      - fb_p2_mvid_3
  # Shot made callout (hits 1 and 2 of a set). The shot callout randomizer
  # mode is stopped during Final Battle, so phase 2 has its own copy.
  fb_p2_callout:
    force_different: true
    events:
      - fb_p2_co_beautiful_shot
      - fb_p2_co_bullseye
      - fb_p2_co_clean_hit
      - fb_p2_co_direct_hit
      - fb_p2_co_good_hit
      - fb_p2_co_nice_shot
      - fb_p2_co_perfect
      - fb_p2_co_right_on_target
      - fb_p2_co_smooth
      - fb_p2_co_solid_flying
      - fb_p2_co_thats_a_great_shot
      - fb_p2_co_thats_how_its_done
      - fb_p2_co_too_easy
      - fb_p2_co_you_nailed_it
      - fb_p2_co_youre_a_hell_of_a_pilot
  fb_p2_launch_missiles:
    force_all: true
    events:
      - fb_p2_mvid_1
      - fb_p2_mvid_2
      - fb_p2_mvid_3
