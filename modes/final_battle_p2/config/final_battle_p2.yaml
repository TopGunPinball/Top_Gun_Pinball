#config_version=6
##############################################################################
## FINAL BATTLE - PHASE 2: EVADE THE MISSILES   (runs inside final_battle)
##
## Multiball. Starts with 4 balls (2 locked jets + the scoop jet + the jet held
## at the left lane), 20s ball save. GI light blue, shots flash blue (lock /
## goose inserts flash white).
##
## MISSILE SETS 1-6: three shots lit, 30s to hit all three (+10s Inverted).
##   All three in time  -> missile evaded (2,000,000 + counts toward the total)
##   Time runs out      -> MISSILE FIRED: spinner flashes red, GI flashes red,
##                         20s (+10s Inverted) to hit the spinner for flares.
##                         Pop bumpers pause this timer.
##                         Spinner hit -> safe (flares video, rotates 1-3)
##                         No spinner  -> lose a jet
##   FLARES: the pilot only has 3 for the whole phase (each spinner save uses
##   one). With no flares left, a fired missile means BANK RIGHT instead:
##   voice_out_of_flares plays, the Top Loop flashes red, 15s (+10s Inverted)
##   to hit it. Hit -> safe (no video). Miss -> lose a jet.
##   After every EVADED set: one more ball (max 6 in play), 7s ball save.
##   (No extra ball after flares / bank right / a lost jet.)
##   Set evaded: the next set's shots light and go live right away (before
##   the extra ball and while the evade / missiles videos play).
##   VIDEOS: final_battle_phase2_intro when the balls are released (skippable,
##   final_battle_phase2_instructions slide on top). No per-shot videos: set
##   evaded -> final_battle_phase2_evade<set>; flares -> flare1-4; bank
##   right -> no video; then a missiles video (missiles1-3, random order).
##   After flares / bank right the next set lights after that video; after
##   an evade it is already lit. Missile fired = no video: the set's shots go
##   out, the spinner flashes, voice_final_battle_missile_lock plays.
##   Out of jets here -> final_battle_phase2_lost
##     1  Left Ramp, Right Ramp, Tower
##     2  Left Orbit, Barrier Target, Right Orbit  (right ramp up for this set)
##     3  Spinner, Tower, ICEMAN M
##     4  ICEMAN C, LOCK L, Top Loop
##     5  Left Ramp, Tower, GOOSE S
##     6  Right Ramp, Left Orbit, Top Orbit        (top ramp up until it's hit)
##   (the list above is where each missile STARTS - see MOVING MISSILES)
## MOVING MISSILES: every 2.5s the missiles move one spot. The spot just left
##   still counts for 2s (dark).
##   Main shots, left to right: LL LO LR SP CNT TWR TL TR/TO RR/RO
##     1 main shot in the set  -> starts moving LEFT, bounces end to end
##     2 main shots            -> leftmost starts RIGHT, rightmost starts LEFT
##     3 main shots            -> outer two as above, the middle one stays put
##   LOCK L-O-C-K   starts moving right, bounces
##   ICEMAN I-C-E-M-A-N  starts moving toward I, bounces (M: m,e,c,i,c,e,m,a,n)
##   GOOSE          left flipper = toward G, right flipper = toward E (wraps)
##   TR/TO and RR/RO count from either switch.
##   Missiles on the same spot: one hit takes them all, awarded 1s apart (one
##   fanfare, one callout); the insert flashes 2x for two, 4x for three.
## CALLOUTS: random shot-made voice on hits 1 and 2 of a set (not the hit that
##   finishes it - the evade video plays). Phase 2's own copy, because the shot
##   callout randomizer mode is stopped during Final Battle.
## FANFARE: every shot hit posts fb_fanfare (final_battle.yaml: GI flicker +
##   random light show). Not for the Missiles perk auto-shot.
## SET 7: barrier drops, 30s to shoot the scoop. Time runs out -> missile
##   fired (same flare rules) -> set 7 starts over, until the scoop is made or
##   the jets run out. Scoop made -> ball held, flippers off, the other balls
##   drain, phase won.
## ALL BALLS DRAINED: lose a jet, 4 balls back in play with a 20s save.
## SCORING: 500,000 per shot, 2,000,000 per set completed in time,
##   1,000,000 for the scoop  (18 + 6 + 1 = 22,000,000 max)
## MISSILES PERK: the first shot of every set is completed automatically.
##############################################################################

mode:
  start_events: fb_p2_begin
  stop_events: fb_p3_begin, fb_stop_phases, ball_will_end
  priority: 610
  game_mode: true

timers:
  fb_p2_set_timer:
    start_value: 30 + 10 * current_player.fb_perk_inverted
    end_value: 0
    direction: down
    tick_interval: 1s
    control_events:
      - event: fb_p2_set_go
        action: restart
      - event: fb_p2_set_timer_stop
        action: stop
      - event: mode_timers_idle_pause
        action: pause
      - event: mode_timers_resume{current_player.fb_p2_state==1}
        action: start
  fb_p2_flare_timer:
    start_value: 20 + 10 * current_player.fb_perk_inverted
    end_value: 0
    direction: down
    tick_interval: 1s
    control_events:
      - event: fb_p2_missile
        action: restart
      - event: fb_p2_flare_stop
        action: stop
      - event: fb_p2_flare_pause
        action: pause
      - event: fb_p2_flare_resume
        action: start
  # Fallback while waiting on a between-sets video
  fb_p2_await_timer:
    start_value: 0
    end_value: 30
    tick_interval: 1s
    control_events:
      - event: fb_p2_set_evaded
        action: restart
      - event: fb_p2_flare_ok
        action: restart
      - event: fb_p2_launch_missiles
        action: restart
      - event: fb_p2_next
        action: stop
      - event: fb_p2_set7_start
        action: stop
  # No flares left: bank right (Top Loop) window
  fb_p2_bank_timer:
    start_value: 15 + 10 * current_player.fb_perk_inverted
    end_value: 0
    direction: down
    tick_interval: 1s
    control_events:
      - event: fb_p2_bank
        action: restart
      - event: fb_p2_bank_stop
        action: stop
  # Ball in the pops: flare timer paused until 1.5s after the last bumper hit
  fb_p2_bumper_idle:
    start_value: 0
    end_value: 3
    tick_interval: 500ms
    control_events:
      - event: fb_p2_flare_pause
        action: restart
      - event: fb_p2_flare_stop
        action: stop

  # MOVING MISSILES: every 2.5s each moving missile steps one spot
  # (5 ticks x 500ms)
  fb_p2_move_timer:
    start_value: 0
    end_value: 5
    tick_interval: 500ms
    restart_on_complete: true
    control_events:
      - event: fb_p2_set_go{current_player.fb_p2_set<=6}
        action: restart
      - event: fb_p2_set_timer_stop
        action: stop
      - event: fb_p2_missile
        action: stop
      - event: fb_p2_bank
        action: stop
      - event: fb_p2_set_end
        action: stop
      - event: fb_p2_final
        action: stop
      - event: mode_timers_idle_pause
        action: pause
      - event: mode_timers_resume{current_player.fb_p2_state==1 and current_player.fb_p2_set<=6}
        action: start
  # Grace: the spot a missile just left still counts for 2s (dark)
  fb_p2_grace_timer:
    start_value: 0
    end_value: 2
    tick_interval: 1s
    control_events:
      - event: fb_p2_move
        action: restart
      - event: fb_p2_set_end
        action: stop

variable_player:
  mode_final_battle_p2_started:
    fb_p2_set: { action: set, int: 1 }
    fb_p2_state: { action: set, int: 0 }
    fb_p2_hit_1: { action: set, int: 0 }
    fb_p2_hit_2: { action: set, int: 0 }
    fb_p2_hit_3: { action: set, int: 0 }
    fb_p2_flare_vid: { action: set, int: 0 }
    fb_hud_count: { action: set, int: 0 }
    fb_hud_count_label: { action: set, string: "MISSILES EVADED" }
    fb_p2_flares: { action: set, int: 3 }
    fb_p2_await: { action: set, int: 0 }
    fb_info: { action: set, string: "FLARES LEFT: 3" }
  timer_fb_p2_set_timer_tick:
    fb_timer: { action: set, int: ticks }
  timer_fb_p2_flare_timer_tick:
    fb_timer: { action: set, int: ticks }
  timer_fb_p2_bank_timer_tick:
    fb_timer: { action: set, int: ticks }
  fb_p2_bank:
    fb_p2_state: { action: set, int: 3 }
    fb_objective: { action: set, string: "OUT OF FLARES! BANK RIGHT - SHOOT THE TOP LOOP" }
  fb_p2_bank_ok:
    fb_p2_state: { action: set, int: 0 }
  fb_p2_bank_fail:
    fb_p2_state: { action: set, int: 0 }
  player_fb_p2_flares{value==2}:
    fb_info: { action: set, string: "FLARES LEFT: 2" }
  player_fb_p2_flares{value==1}:
    fb_info: { action: set, string: "FLARES LEFT: 1" }
  player_fb_p2_flares{value==0}:
    fb_info: { action: set, string: "NO FLARES LEFT - BANK RIGHT TO EVADE" }
  fb_p2_set_start:
    fb_p2_state: { action: set, int: 1 }
    fb_p2_hit_1: { action: set, int: 0 }
    fb_p2_hit_2: { action: set, int: 0 }
    fb_p2_hit_3: { action: set, int: 0 }
  fb_p2_set7_start:
    fb_p2_state: { action: set, int: 1 }
    fb_objective: { action: set, string: "FINAL MISSILE - SHOOT THE SCOOP" }
  fb_p2_hit_1:
    fb_p2_hit_1: { action: set, int: 1 }
  fb_p2_hit_2:
    fb_p2_hit_2: { action: set, int: 1 }
  fb_p2_hit_3:
    fb_p2_hit_3: { action: set, int: 1 }
  fb_p2_set_evaded:
    fb_p2_await: { action: set, int: 0 }   # nothing waits on the evade video now
    fb_p2_state: { action: set, int: 0 }
    fb_missiles_evaded: { action: add, int: 1 }
    fb_hud_count: { action: add, int: 1 }
  fb_p2_missile:
    fb_p2_state: { action: set, int: 2 }
    fb_objective: { action: set, string: "MISSILE FIRED! HIT THE SPINNER FOR FLARES" }
  fb_p2_flare_ok:
    fb_p2_await: { action: set, int: 1 }
    fb_p2_state: { action: set, int: 0 }
    fb_p2_flares: { action: add, int: -1 }
  fb_p2_flare_vid_next:
    fb_p2_flare_vid: { action: add, int: 1 }
  fb_p2_flare_vid_wrap:
    fb_p2_flare_vid: { action: set, int: 0 }
  fb_p2_flare_fail:
    fb_p2_state: { action: set, int: 0 }
  fb_p2_after_missile:
    fb_p2_await: { action: set, int: 0 }
  fb_p2_launch_missiles:
    fb_p2_await: { action: set, int: 2 }
  fb_p2_missiles_done:
    fb_p2_await: { action: set, int: 0 }
  fb_p2_next:
    fb_p2_set: { action: add, int: 1 }
  fb_p2_final:
    fb_p2_state: { action: set, int: 9 }
    fb_objective: { action: set, string: "MISSILES EVADED - HOLD ON" }
  fb_p2_drained:
    fb_p2_state: { action: set, int: 10 }
  fb_p2_lights_1:
    fb_objective: { action: set, string: "MISSILE 1 OF 6 - HIT THE 3 MOVING SHOTS" }
  fb_p2_lights_2:
    fb_objective: { action: set, string: "MISSILE 2 OF 6 - HIT THE 3 MOVING SHOTS" }
  fb_p2_lights_3:
    fb_objective: { action: set, string: "MISSILE 3 OF 6 - HIT THE 3 MOVING SHOTS" }
  fb_p2_lights_4:
    fb_objective: { action: set, string: "MISSILE 4 OF 6 - HIT THE 3 MOVING SHOTS" }
  fb_p2_lights_5:
    fb_objective: { action: set, string: "MISSILE 5 OF 6 - FLIPPERS MOVE THE GOOSE MISSILE" }
  fb_p2_lights_6:
    fb_objective: { action: set, string: "MISSILE 6 OF 6 - HIT THE 3 MOVING SHOTS" }

  ##############################################
  ## MOVING MISSILES - slot state
  ##   fb_p2_loc_N  : where slot N's missile is (location code, 0 = gone)
  ##                  10-18 main shots LL..RR/RO, 20-23 LOCK, 30-35 ICEMAN,
  ##                  40-44 GOOSE (G, O left, O right, S, E)
  ##   fb_p2_prev_N : spot it just left (counts for 2s), 0 = none
  ##   fb_p2_dir_N  : +1 right / -1 left     fb_p2_mov_N : 1 = moves on the timer
  ##   fb_p2_min_N / fb_p2_max_N : ends of its row (bounce points)
  ##   fb_p2_claim_N: 1 = hit (award may still be pending the 1s stack delay)
  ##############################################
  fb_p2_set_start{current_player.fb_p2_set==1}:
    fb_p2_loc_1: { action: set, int: 12 }
    fb_p2_prev_1: { action: set, int: 0 }
    fb_p2_dir_1: { action: set, int: 1 }
    fb_p2_min_1: { action: set, int: 10 }
    fb_p2_max_1: { action: set, int: 18 }
    fb_p2_mov_1: { action: set, int: 1 }
    fb_p2_claim_1: { action: set, int: 0 }
    fb_p2_loc_2: { action: set, int: 18 }
    fb_p2_prev_2: { action: set, int: 0 }
    fb_p2_dir_2: { action: set, int: -1 }
    fb_p2_min_2: { action: set, int: 10 }
    fb_p2_max_2: { action: set, int: 18 }
    fb_p2_mov_2: { action: set, int: 1 }
    fb_p2_claim_2: { action: set, int: 0 }
    fb_p2_loc_3: { action: set, int: 15 }
    fb_p2_prev_3: { action: set, int: 0 }
    fb_p2_dir_3: { action: set, int: 0 }
    fb_p2_min_3: { action: set, int: 10 }
    fb_p2_max_3: { action: set, int: 18 }
    fb_p2_mov_3: { action: set, int: 0 }
    fb_p2_claim_3: { action: set, int: 0 }
  fb_p2_set_start{current_player.fb_p2_set==2}:
    fb_p2_loc_1: { action: set, int: 11 }
    fb_p2_prev_1: { action: set, int: 0 }
    fb_p2_dir_1: { action: set, int: 1 }
    fb_p2_min_1: { action: set, int: 10 }
    fb_p2_max_1: { action: set, int: 18 }
    fb_p2_mov_1: { action: set, int: 1 }
    fb_p2_claim_1: { action: set, int: 0 }
    fb_p2_loc_2: { action: set, int: 14 }
    fb_p2_prev_2: { action: set, int: 0 }
    fb_p2_dir_2: { action: set, int: 0 }
    fb_p2_min_2: { action: set, int: 10 }
    fb_p2_max_2: { action: set, int: 18 }
    fb_p2_mov_2: { action: set, int: 0 }
    fb_p2_claim_2: { action: set, int: 0 }
    fb_p2_loc_3: { action: set, int: 18 }
    fb_p2_prev_3: { action: set, int: 0 }
    fb_p2_dir_3: { action: set, int: -1 }
    fb_p2_min_3: { action: set, int: 10 }
    fb_p2_max_3: { action: set, int: 18 }
    fb_p2_mov_3: { action: set, int: 1 }
    fb_p2_claim_3: { action: set, int: 0 }
  fb_p2_set_start{current_player.fb_p2_set==3}:
    fb_p2_loc_1: { action: set, int: 13 }
    fb_p2_prev_1: { action: set, int: 0 }
    fb_p2_dir_1: { action: set, int: 1 }
    fb_p2_min_1: { action: set, int: 10 }
    fb_p2_max_1: { action: set, int: 18 }
    fb_p2_mov_1: { action: set, int: 1 }
    fb_p2_claim_1: { action: set, int: 0 }
    fb_p2_loc_2: { action: set, int: 15 }
    fb_p2_prev_2: { action: set, int: 0 }
    fb_p2_dir_2: { action: set, int: -1 }
    fb_p2_min_2: { action: set, int: 10 }
    fb_p2_max_2: { action: set, int: 18 }
    fb_p2_mov_2: { action: set, int: 1 }
    fb_p2_claim_2: { action: set, int: 0 }
    fb_p2_loc_3: { action: set, int: 33 }
    fb_p2_prev_3: { action: set, int: 0 }
    fb_p2_dir_3: { action: set, int: -1 }
    fb_p2_min_3: { action: set, int: 30 }
    fb_p2_max_3: { action: set, int: 35 }
    fb_p2_mov_3: { action: set, int: 1 }
    fb_p2_claim_3: { action: set, int: 0 }
  fb_p2_set_start{current_player.fb_p2_set==4}:
    fb_p2_loc_1: { action: set, int: 31 }
    fb_p2_prev_1: { action: set, int: 0 }
    fb_p2_dir_1: { action: set, int: -1 }
    fb_p2_min_1: { action: set, int: 30 }
    fb_p2_max_1: { action: set, int: 35 }
    fb_p2_mov_1: { action: set, int: 1 }
    fb_p2_claim_1: { action: set, int: 0 }
    fb_p2_loc_2: { action: set, int: 20 }
    fb_p2_prev_2: { action: set, int: 0 }
    fb_p2_dir_2: { action: set, int: 1 }
    fb_p2_min_2: { action: set, int: 20 }
    fb_p2_max_2: { action: set, int: 23 }
    fb_p2_mov_2: { action: set, int: 1 }
    fb_p2_claim_2: { action: set, int: 0 }
    fb_p2_loc_3: { action: set, int: 16 }
    fb_p2_prev_3: { action: set, int: 0 }
    fb_p2_dir_3: { action: set, int: -1 }
    fb_p2_min_3: { action: set, int: 10 }
    fb_p2_max_3: { action: set, int: 18 }
    fb_p2_mov_3: { action: set, int: 1 }
    fb_p2_claim_3: { action: set, int: 0 }
  fb_p2_set_start{current_player.fb_p2_set==5}:
    fb_p2_loc_1: { action: set, int: 12 }
    fb_p2_prev_1: { action: set, int: 0 }
    fb_p2_dir_1: { action: set, int: 1 }
    fb_p2_min_1: { action: set, int: 10 }
    fb_p2_max_1: { action: set, int: 18 }
    fb_p2_mov_1: { action: set, int: 1 }
    fb_p2_claim_1: { action: set, int: 0 }
    fb_p2_loc_2: { action: set, int: 15 }
    fb_p2_prev_2: { action: set, int: 0 }
    fb_p2_dir_2: { action: set, int: -1 }
    fb_p2_min_2: { action: set, int: 10 }
    fb_p2_max_2: { action: set, int: 18 }
    fb_p2_mov_2: { action: set, int: 1 }
    fb_p2_claim_2: { action: set, int: 0 }
    fb_p2_loc_3: { action: set, int: 43 }
    fb_p2_prev_3: { action: set, int: 0 }
    fb_p2_dir_3: { action: set, int: 0 }
    fb_p2_min_3: { action: set, int: 40 }
    fb_p2_max_3: { action: set, int: 44 }
    fb_p2_mov_3: { action: set, int: 0 }
    fb_p2_claim_3: { action: set, int: 0 }
  fb_p2_set_start{current_player.fb_p2_set==6}:
    fb_p2_loc_1: { action: set, int: 18 }
    fb_p2_prev_1: { action: set, int: 0 }
    fb_p2_dir_1: { action: set, int: -1 }
    fb_p2_min_1: { action: set, int: 10 }
    fb_p2_max_1: { action: set, int: 18 }
    fb_p2_mov_1: { action: set, int: 1 }
    fb_p2_claim_1: { action: set, int: 0 }
    fb_p2_loc_2: { action: set, int: 11 }
    fb_p2_prev_2: { action: set, int: 0 }
    fb_p2_dir_2: { action: set, int: 1 }
    fb_p2_min_2: { action: set, int: 10 }
    fb_p2_max_2: { action: set, int: 18 }
    fb_p2_mov_2: { action: set, int: 1 }
    fb_p2_claim_2: { action: set, int: 0 }
    fb_p2_loc_3: { action: set, int: 17 }
    fb_p2_prev_3: { action: set, int: 0 }
    fb_p2_dir_3: { action: set, int: 0 }
    fb_p2_min_3: { action: set, int: 10 }
    fb_p2_max_3: { action: set, int: 18 }
    fb_p2_mov_3: { action: set, int: 0 }
    fb_p2_claim_3: { action: set, int: 0 }
  # Move step 1: remember the spot being left + turn around at the ends
  fb_p2_mv_1{current_player.fb_p2_claim_1==0 and current_player.fb_p2_mov_1==1}:
    fb_p2_prev_1: { action: set, int: current_player.fb_p2_loc_1 }
    fb_p2_dir_1:
      action: set
      int: -1 if current_player.fb_p2_loc_1>=current_player.fb_p2_max_1 else (1 if current_player.fb_p2_loc_1<=current_player.fb_p2_min_1 else current_player.fb_p2_dir_1)
  fb_p2_mv_2{current_player.fb_p2_claim_2==0 and current_player.fb_p2_mov_2==1}:
    fb_p2_prev_2: { action: set, int: current_player.fb_p2_loc_2 }
    fb_p2_dir_2:
      action: set
      int: -1 if current_player.fb_p2_loc_2>=current_player.fb_p2_max_2 else (1 if current_player.fb_p2_loc_2<=current_player.fb_p2_min_2 else current_player.fb_p2_dir_2)
  fb_p2_mv_3{current_player.fb_p2_claim_3==0 and current_player.fb_p2_mov_3==1}:
    fb_p2_prev_3: { action: set, int: current_player.fb_p2_loc_3 }
    fb_p2_dir_3:
      action: set
      int: -1 if current_player.fb_p2_loc_3>=current_player.fb_p2_max_3 else (1 if current_player.fb_p2_loc_3<=current_player.fb_p2_min_3 else current_player.fb_p2_dir_3)
  # Move step 2 (separate event so the new direction is already set)
  fb_p2_stp_1:
    fb_p2_loc_1: { action: add, int: current_player.fb_p2_dir_1 }
  fb_p2_stp_2:
    fb_p2_loc_2: { action: add, int: current_player.fb_p2_dir_2 }
  fb_p2_stp_3:
    fb_p2_loc_3: { action: add, int: current_player.fb_p2_dir_3 }
  # GOOSE ring (flippers): left = toward G, right = toward E, wraps around
  fb_p2_gl_1:
    fb_p2_loc_1:
      action: set
      int: 44 if current_player.fb_p2_loc_1==40 else current_player.fb_p2_loc_1 - 1
  fb_p2_gr_1:
    fb_p2_loc_1:
      action: set
      int: 40 if current_player.fb_p2_loc_1==44 else current_player.fb_p2_loc_1 + 1
  fb_p2_gl_2:
    fb_p2_loc_2:
      action: set
      int: 44 if current_player.fb_p2_loc_2==40 else current_player.fb_p2_loc_2 - 1
  fb_p2_gr_2:
    fb_p2_loc_2:
      action: set
      int: 40 if current_player.fb_p2_loc_2==44 else current_player.fb_p2_loc_2 + 1
  fb_p2_gl_3:
    fb_p2_loc_3:
      action: set
      int: 44 if current_player.fb_p2_loc_3==40 else current_player.fb_p2_loc_3 - 1
  fb_p2_gr_3:
    fb_p2_loc_3:
      action: set
      int: 40 if current_player.fb_p2_loc_3==44 else current_player.fb_p2_loc_3 + 1
  # Hit: the missile is gone right away (the award follows, 1s apart if stacked)
  fb_p2_claim_1:
    fb_p2_claim_1: { action: set, int: 1 }
    fb_p2_loc_1: { action: set, int: 0 }
    fb_p2_prev_1: { action: set, int: 0 }
  fb_p2_claim_2:
    fb_p2_claim_2: { action: set, int: 1 }
    fb_p2_loc_2: { action: set, int: 0 }
    fb_p2_prev_2: { action: set, int: 0 }
  fb_p2_claim_3:
    fb_p2_claim_3: { action: set, int: 1 }
    fb_p2_loc_3: { action: set, int: 0 }
    fb_p2_prev_3: { action: set, int: 0 }
  timer_fb_p2_grace_timer_complete:
    fb_p2_prev_1: { action: set, int: 0 }
    fb_p2_prev_2: { action: set, int: 0 }
    fb_p2_prev_3: { action: set, int: 0 }
  # Set over / missile fired: every missile gone
  fb_p2_set_end:
    fb_p2_loc_1: { action: set, int: 0 }
    fb_p2_prev_1: { action: set, int: 0 }
    fb_p2_claim_1: { action: set, int: 1 }
    fb_p2_loc_2: { action: set, int: 0 }
    fb_p2_prev_2: { action: set, int: 0 }
    fb_p2_claim_2: { action: set, int: 1 }
    fb_p2_loc_3: { action: set, int: 0 }
    fb_p2_prev_3: { action: set, int: 0 }
    fb_p2_claim_3: { action: set, int: 1 }

event_player:
  ##############################################
  ## BEGIN: release every held jet into a 4-ball multiball
  ##############################################
  mode_final_battle_p2_started:
    - fb_vu_final_battle_phase2_intro
    - fb_left_post_release
    - lock_mech_release
    - scoop_ball_release
    - fb_p2_multiball_start
    - fb_scoop_hold_reset|3s   # the multiball took the scoop jet out
    - fb_p2_go|2s
  fb_p2_go:
    - fb_p2_set_start

  ##############################################
  ## MISSILE SETS 1-6
  ##############################################
  fb_p2_set_start:
    - fb_p2_set_lights
    - fb_p2_set_go
    - fb_shot_value_reset
  fb_p2_set_lights{current_player.fb_p2_set==1}:
    - fb_p2_lights_1
  fb_p2_set_lights{current_player.fb_p2_set==2}:
    - fb_p2_lights_2
  fb_p2_set_lights{current_player.fb_p2_set==3}:
    - fb_p2_lights_3
  fb_p2_set_lights{current_player.fb_p2_set==4}:
    - fb_p2_lights_4
  fb_p2_set_lights{current_player.fb_p2_set==5}:
    - fb_p2_lights_5
  fb_p2_set_lights{current_player.fb_p2_set==6}:
    - fb_p2_lights_6
  fb_p2_set_start{current_player.fb_p2_set==2}:
    - right_ramp_up
    - barrier_raise   # set 2 needs the barrier TARGET
  fb_p2_set_start{current_player.fb_p2_set==6}:
    - top_ramp_up
  fb_p2_set_start{current_player.fb_perk_missiles==1}:
    - fb_p2_perk_claim|1s

  fb_p2_hit_1:
    fb_step_made: {}
    fb_p2_check: {}
    fb_points_add:
      phase: 2
      points:
        value: current_player.fb_shot_value
        type: int
  fb_p2_hit_2:
    fb_step_made: {}
    fb_p2_check: {}
    fb_points_add:
      phase: 2
      points:
        value: current_player.fb_shot_value
        type: int
  fb_p2_hit_3:
    fb_step_made: {}
    fb_p2_check: {}
    fb_points_add:
      phase: 2
      points:
        value: current_player.fb_shot_value
        type: int
  fb_p2_check{current_player.fb_p2_hit_1==1 and current_player.fb_p2_hit_2==1 and current_player.fb_p2_hit_3==1 and current_player.fb_p2_state==1 and current_player.fb_p2_set<=6}:
    - fb_p2_set_evaded
  # One ordered list: MPF finishes each posted event (and everything it posts)
  # before the next one, so fb_p2_after_evade - which starts the next set -
  # must come LAST or the stop / lights-off above would hit the new set.
  fb_p2_set_evaded:
    fb_p2_set_timer_stop: {}
    fb_p2_voice_evaded: {}
    fb_p2_slots_off: {}
    fb_p2_play_evade: {}
    fb_points_add:
      phase: 2
      points: 2000000
    fb_p2_after_evade: {}

  ##############################################
  ## MISSILE FIRED -> FLARES
  ##############################################
  timer_fb_p2_set_timer_tick{ticks==10 and current_player.fb_p2_state==1}:
    - fb_voice_10_seconds
  timer_fb_p2_set_timer_complete{current_player.fb_p2_state==1 and current_player.fb_p2_flares>0}:
    - fb_p2_missile
  timer_fb_p2_set_timer_complete{current_player.fb_p2_state==1 and current_player.fb_p2_flares<=0}:
    - fb_p2_bank

  # Out of flares: bank right (Top Loop)
  fb_p2_bank:
    - fb_p2_slots_off
  s_orbit_upper_active{current_player.fb_p2_state==3}:
    - fb_p2_bank_ok
  timer_fb_p2_bank_timer_complete{current_player.fb_p2_state==3}:
    - fb_p2_bank_fail
  fb_p2_bank_ok:
    - fb_p2_bank_stop
    - fb_p2_voice_evaded
    - fb_p2_after_missile|1500ms
  fb_p2_bank_fail:
    - fb_p2_bank_stop
    - fb_loss_timer
    - fb_lose_jet
  fb_p2_missile:
    - fb_p2_slots_off
  s_spinner_active{current_player.fb_p2_state==2}:
    - fb_p2_flare_ok
  timer_fb_p2_flare_timer_complete{current_player.fb_p2_state==2}:
    - fb_p2_flare_fail

  # Pop bumpers pause the flare timer
  s_bumper_left_active{current_player.fb_p2_state==2}:
    - fb_p2_flare_pause
  s_bumper_center_active{current_player.fb_p2_state==2}:
    - fb_p2_flare_pause
  s_bumper_right_active{current_player.fb_p2_state==2}:
    - fb_p2_flare_pause
  timer_fb_p2_bumper_idle_complete{current_player.fb_p2_state==2}:
    - fb_p2_flare_resume

  fb_p2_flare_ok:
    - fb_p2_flare_stop
    - fb_p2_voice_evaded
    - fb_p2_flare_video
  # flare1-4 in order (only 3 flares per phase, but set 7 can repeat)
  fb_p2_flare_video{current_player.fb_p2_flare_vid==0}:
    - fb_vu_final_battle_phase2_flare1
    - fb_p2_flare_vid_next
  fb_p2_flare_video{current_player.fb_p2_flare_vid==1}:
    - fb_vu_final_battle_phase2_flare2
    - fb_p2_flare_vid_next
  fb_p2_flare_video{current_player.fb_p2_flare_vid==2}:
    - fb_vu_final_battle_phase2_flare3
    - fb_p2_flare_vid_next
  fb_p2_flare_video{current_player.fb_p2_flare_vid>=3}:
    - fb_vu_final_battle_phase2_flare4
    - fb_p2_flare_vid_wrap
  fb_p2_flare_fail:
    - fb_p2_flare_stop
    - fb_loss_timer
    - fb_lose_jet
  fb_jet_continue{current_player.fb_phase==2 and current_player.fb_loss_reason==2 and current_player.fb_p2_state==0}:
    - fb_p2_after_missile
  ##############################################
  ## BETWEEN SETS
  ##   set evaded (1-5)   -> next set lights + goes live NOW, then the
  ##                         evade<set> + a missiles video play over it and
  ##                         the extra ball comes 1s later (nothing waits)
  ##   flares / bank made -> flare<n> video (bank right: none)     (await 1)
  ##   jet lost           -> (explosion, handled by final_battle)
  ##   -> ramps down + one more ball -> a missiles video (missiles1-3 in a
  ##      random order, each once before repeating)          (await 2)
  ##   -> next set. 30s fallback if a video never reports done.
  ##############################################
  fb_p2_play_evade{current_player.fb_p2_set==1}:
    - fb_vq_final_battle_phase2_evade1
  fb_p2_play_evade{current_player.fb_p2_set==2}:
    - fb_vq_final_battle_phase2_evade2
  fb_p2_play_evade{current_player.fb_p2_set==3}:
    - fb_vq_final_battle_phase2_evade3
  fb_p2_play_evade{current_player.fb_p2_set==4}:
    - fb_vq_final_battle_phase2_evade4
  fb_p2_play_evade{current_player.fb_p2_set==5}:
    - fb_vq_final_battle_phase2_evade5
  fb_p2_play_evade{current_player.fb_p2_set==6}:
    - fb_vq_final_battle_phase2_evade6
  fb_video_done{(video=="final_battle_phase2_evade1" or video=="final_battle_phase2_evade2" or video=="final_battle_phase2_evade3" or video=="final_battle_phase2_evade4" or video=="final_battle_phase2_evade5" or video=="final_battle_phase2_evade6") and current_player.fb_p2_await==1}:
    - fb_p2_after_missile
  fb_video_done{(video=="final_battle_phase2_flare1" or video=="final_battle_phase2_flare2" or video=="final_battle_phase2_flare3" or video=="final_battle_phase2_flare4") and current_player.fb_p2_await==1}:
    - fb_p2_after_missile
  timer_fb_p2_await_timer_complete{current_player.fb_p2_await==1}:
    - fb_p2_after_missile
  # Missiles 1-5 evaded: the NEXT set lights and goes live immediately (timer
  # running, shots moving). The evade video, then a missiles video, play over
  # it; the extra ball comes 1s after the new shots light.
  fb_p2_after_evade{current_player.fb_p2_set<=5}:
    - fb_p2_roll
    - fb_p2_mvid_pick
  fb_p2_after_evade{current_player.fb_p2_set<=5 and game.balls_in_play<6}:
    - fb_p2_add_ball|1s
  fb_p2_roll:
    - fb_p2_slots_off
    - fb_p2_next
  # Ramps between sets (set 2 raises the right ramp and set 6 the top ramp in
  # fb_p2_set_start; only the right ramp has to come down, after set 2)
  fb_p2_roll{current_player.fb_p2_set==2}:
    - right_ramp_down
  # Missile 6 done: straight to the final missile (barrier drops right away,
  # no missiles video in between)
  fb_p2_after_evade{current_player.fb_p2_set==6}:
    - fb_p2_after_missile
  fb_p2_after_missile{current_player.fb_p2_set==6}:
    - fb_p2_set_end
    - fb_p2_next
  fb_p2_after_missile{current_player.fb_p2_set<=5}:
    - fb_p2_set_end
    - fb_p2_launch_missiles
  fb_p2_after_missile{current_player.fb_p2_set==7}:
    - fb_p2_launch_missiles
  fb_p2_mvid_1:
    - fb_vq_final_battle_phase2_missiles1
  fb_p2_mvid_2:
    - fb_vq_final_battle_phase2_missiles2
  fb_p2_mvid_3:
    - fb_vq_final_battle_phase2_missiles3
  fb_video_done{(video=="final_battle_phase2_missiles1" or video=="final_battle_phase2_missiles2" or video=="final_battle_phase2_missiles3") and current_player.fb_p2_await==2}:
    - fb_p2_missiles_done
  timer_fb_p2_await_timer_complete{current_player.fb_p2_await==2}:
    - fb_p2_missiles_done
  fb_p2_missiles_done{current_player.fb_p2_set<=6}:
    - fb_p2_next
  fb_p2_missiles_done{current_player.fb_p2_set==7}:
    - fb_p2_set7_start

  # Set over after a missile was fired (flares / bank right / jet lost):
  # ramps down, lights off. No extra ball here - only an evaded set earns one.
  fb_p2_set_end:
    - right_ramp_down
    - top_ramp_down|500ms
    - fb_p2_slots_off
  fb_p2_next:
    - fb_p2_next_go
  fb_p2_next_go{current_player.fb_p2_set<=6}:
    - fb_p2_set_start
  fb_p2_next_go{current_player.fb_p2_set==7}:
    - fb_p2_set7_start

  ##############################################
  ## SET 7: barrier down, shoot the scoop
  ##############################################
  fb_p2_set7_start:
    - fb_scoop_hold_reset   # room in the scoop hold before the shot
    - barrier_drop
    - fb_p2_lights_7
    - fb_p2_set_go
  s_mode_start_active{current_player.fb_p2_set==7 and current_player.fb_p2_state>=1 and current_player.fb_p2_state<=3}:
    - fb_p2_final
  fb_p2_final:
    fb_fanfare: {}
    fb_p2_set_timer_stop: {}
    fb_p2_flare_stop: {}
    fb_p2_bank_stop: {}
    fb_p2_slots_off: {}
    barrier_raise|1500ms: {}
    disable_normal_flippers: {}
    fb_mb_stop_saves: {}
    fb_grace_save_disable: {}
    fb_p2_drain_check|2s: {}
    fb_points_add:
      phase: 2
      points: 1000000
  balls_in_play{balls==1 and current_player.fb_p2_state==9}:
    - fb_p2_drained
  fb_p2_drain_check{game.balls_in_play<=1 and current_player.fb_p2_state==9}:
    - fb_p2_drained
  fb_p2_drained:
    - enable_normal_flippers
    - fb_p2_complete

  ##############################################
  ## ALL BALLS DRAINED -> jet lost -> 4 balls again
  ##############################################
  fb_jet_continue{current_player.fb_phase==2 and current_player.fb_loss_reason==1 and current_player.fb_p2_state<=3}:
    - fb_p2_relaunch
  fb_jet_continue{current_player.fb_phase==2 and current_player.fb_loss_reason==1 and current_player.fb_p2_state==1}:
    - fb_p2_set_go

  # Set lights: the moving-missile refresh lights every spot
  fb_p2_lights_1:
    - fb_p2_refresh_q
  fb_p2_lights_2:
    - fb_p2_refresh_q
  fb_p2_lights_3:
    - fb_p2_refresh_q
  fb_p2_lights_4:
    - fb_p2_refresh_q
  fb_p2_lights_5:
    - fb_p2_refresh_q
  fb_p2_lights_6:
    - fb_p2_refresh_q
  ##############################################
  ## MOVING MISSILES
  ##   Main shots (LL LO LR SP CNT TWR TL TR/TO RR/RO) and LOCK / ICEMAN bounce
  ##   end to end, one spot every 2.5s. The spot just left still counts for 2s
  ##   (dark). GOOSE moves with the flippers (ring, like the GOOSE letters).
  ##   Several missiles on one spot: one hit takes them all - awarded 1s apart,
  ##   one fanfare, one callout. The insert flashes 2x (two) / 4x (three).
  ##############################################
  timer_fb_p2_move_timer_complete{current_player.fb_p2_state==1}:
    - fb_p2_move
  # Order matters: mv_1..3 queue their steps, then refresh_q queues the
  # refresh behind those steps
  fb_p2_move:
    - fb_p2_mv_1
    - fb_p2_mv_2
    - fb_p2_mv_3
    - fb_p2_refresh_q
  fb_p2_mv_1{current_player.fb_p2_claim_1==0 and current_player.fb_p2_mov_1==1}:
    - fb_p2_stp_1
  fb_p2_mv_2{current_player.fb_p2_claim_2==0 and current_player.fb_p2_mov_2==1}:
    - fb_p2_stp_2
  fb_p2_mv_3{current_player.fb_p2_claim_3==0 and current_player.fb_p2_mov_3==1}:
    - fb_p2_stp_3
  fb_p2_refresh_q:
    - fb_p2_refresh
  # GOOSE ring - flipper buttons
  s_flipper_left_active{current_player.fb_p2_state==1 and current_player.fb_p2_claim_1==0 and current_player.fb_p2_loc_1>=40}:
    - fb_p2_gl_1
    - fb_p2_refresh_q
  s_flipper_right_active{current_player.fb_p2_state==1 and current_player.fb_p2_claim_1==0 and current_player.fb_p2_loc_1>=40}:
    - fb_p2_gr_1
    - fb_p2_refresh_q
  s_flipper_left_active{current_player.fb_p2_state==1 and current_player.fb_p2_claim_2==0 and current_player.fb_p2_loc_2>=40}:
    - fb_p2_gl_2
    - fb_p2_refresh_q
  s_flipper_right_active{current_player.fb_p2_state==1 and current_player.fb_p2_claim_2==0 and current_player.fb_p2_loc_2>=40}:
    - fb_p2_gr_2
    - fb_p2_refresh_q
  s_flipper_left_active{current_player.fb_p2_state==1 and current_player.fb_p2_claim_3==0 and current_player.fb_p2_loc_3>=40}:
    - fb_p2_gl_3
    - fb_p2_refresh_q
  s_flipper_right_active{current_player.fb_p2_state==1 and current_player.fb_p2_claim_3==0 and current_player.fb_p2_loc_3>=40}:
    - fb_p2_gr_3
    - fb_p2_refresh_q
  # Switches -> spot hit (only while a missile set is live)
  s_lane_left_active{current_player.fb_p2_state==1 and current_player.fb_p2_set<=6}:
    - fb_p2_at_10
  left_orbit_shot_hit{current_player.fb_p2_state==1 and current_player.fb_p2_set<=6}:
    - fb_p2_at_11
  s_ramp_left_exit_active{current_player.fb_p2_state==1 and current_player.fb_p2_set<=6}:
    - fb_p2_at_12
  spinner_shot_made{current_player.fb_p2_state==1 and current_player.fb_p2_set<=6}:
    - fb_p2_at_13
  s_barrier_target_active{current_player.fb_p2_state==1 and current_player.fb_p2_set<=6}:
    - fb_p2_at_14
  s_ramp_tower_exit_active{current_player.fb_p2_state==1 and current_player.fb_p2_set<=6}:
    - fb_p2_at_15
  s_orbit_upper_active{current_player.fb_p2_state==1 and current_player.fb_p2_set<=6}:
    - fb_p2_at_16
  s_orbit_lower_active{current_player.fb_p2_state==1 and current_player.fb_p2_set<=6}:
    - fb_p2_at_17
  s_ramp_inner_exit_active{current_player.fb_p2_state==1 and current_player.fb_p2_set<=6}:
    - fb_p2_at_17
  s_ramp_right_exit_active{current_player.fb_p2_state==1 and current_player.fb_p2_set<=6}:
    - fb_p2_at_18
  right_orbit_shot_hit{current_player.fb_p2_state==1 and current_player.fb_p2_set<=6}:
    - fb_p2_at_18
  s_l_lock_target_active{current_player.fb_p2_state==1 and current_player.fb_p2_set<=6}:
    - fb_p2_at_20
  s_o_lock_target_active{current_player.fb_p2_state==1 and current_player.fb_p2_set<=6}:
    - fb_p2_at_21
  s_c_lock_target_active{current_player.fb_p2_state==1 and current_player.fb_p2_set<=6}:
    - fb_p2_at_22
  s_k_lock_target_active{current_player.fb_p2_state==1 and current_player.fb_p2_set<=6}:
    - fb_p2_at_23
  s_i_iceman_target_active{current_player.fb_p2_state==1 and current_player.fb_p2_set<=6}:
    - fb_p2_at_30
  s_c_iceman_target_active{current_player.fb_p2_state==1 and current_player.fb_p2_set<=6}:
    - fb_p2_at_31
  s_e_iceman_target_active{current_player.fb_p2_state==1 and current_player.fb_p2_set<=6}:
    - fb_p2_at_32
  s_m_iceman_target_active{current_player.fb_p2_state==1 and current_player.fb_p2_set<=6}:
    - fb_p2_at_33
  s_a_iceman_target_active{current_player.fb_p2_state==1 and current_player.fb_p2_set<=6}:
    - fb_p2_at_34
  s_n_iceman_target_active{current_player.fb_p2_state==1 and current_player.fb_p2_set<=6}:
    - fb_p2_at_35
  s_outlane_left_active{current_player.fb_p2_state==1 and current_player.fb_p2_set<=6}:
    - fb_p2_at_40
  s_inlane_left_active{current_player.fb_p2_state==1 and current_player.fb_p2_set<=6}:
    - fb_p2_at_41
  s_inner_inlane_right_active{current_player.fb_p2_state==1 and current_player.fb_p2_set<=6}:
    - fb_p2_at_42
  s_outer_inlane_right_active{current_player.fb_p2_state==1 and current_player.fb_p2_set<=6}:
    - fb_p2_at_43
  s_outlane_right_active{current_player.fb_p2_state==1 and current_player.fb_p2_set<=6}:
    - fb_p2_at_44
  # Spot hit -> claim every missile there (now) and award them 1s apart.
  # Every condition below reads the values from BEFORE the claims.
  # 10: LEFT LANE
  fb_p2_at_10{(current_player.fb_p2_loc_1==10 or current_player.fb_p2_prev_1==10)}:
    - fb_p2_claim_1
    - fb_p2_award_1
  fb_p2_at_10{(current_player.fb_p2_loc_2==10 or current_player.fb_p2_prev_2==10) and not (current_player.fb_p2_loc_1==10 or current_player.fb_p2_prev_1==10)}:
    - fb_p2_claim_2
    - fb_p2_award_2
  fb_p2_at_10{(current_player.fb_p2_loc_2==10 or current_player.fb_p2_prev_2==10) and (current_player.fb_p2_loc_1==10 or current_player.fb_p2_prev_1==10)}:
    - fb_p2_claim_2
    - fb_p2_award_2|1s
  fb_p2_at_10{(current_player.fb_p2_loc_3==10 or current_player.fb_p2_prev_3==10) and ((current_player.fb_p2_loc_1==10 or current_player.fb_p2_prev_1==10)) + ((current_player.fb_p2_loc_2==10 or current_player.fb_p2_prev_2==10)) == 0}:
    - fb_p2_claim_3
    - fb_p2_award_3
  fb_p2_at_10{(current_player.fb_p2_loc_3==10 or current_player.fb_p2_prev_3==10) and ((current_player.fb_p2_loc_1==10 or current_player.fb_p2_prev_1==10)) + ((current_player.fb_p2_loc_2==10 or current_player.fb_p2_prev_2==10)) == 1}:
