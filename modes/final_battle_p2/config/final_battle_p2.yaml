shows:
  fb_fast_flash:
    - duration: 125ms
      lights:
        (led): (color)
    - duration: 125ms
      lights:
        (led): off
  fb_gi_red_flash:
    - duration: 250ms
      lights:
        gi_lights: FF0000
        l_gi_light_pop_left: FF0000
        l_gi_light_pop_right: FF0000
        l_gi_light_pop_bottom: FF0000
    - duration: 250ms
      lights:
        gi_lights: off
        l_gi_light_pop_left: off
        l_gi_light_pop_right: off
        l_gi_light_pop_bottom: off

