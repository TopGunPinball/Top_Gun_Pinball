      key: mode_l_shot_spinner
      sync_ms: 1000
      loops: -1
      show_tokens:
        led: l_shot_spinner
        color: FF6600
    cnt_mode_flash_s1:
      show: sync_flash_mode
      key: mode_l_shot_barrier
      sync_ms: 1000
      loops: -1
      show_tokens:
        led: l_shot_barrier
        color: FF6600

  ##############################################
  ## STEP 2: RO, 2X, TR, TL, TWR (ORANGE flash)
