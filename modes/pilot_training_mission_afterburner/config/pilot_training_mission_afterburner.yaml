#config_version=6

####################################################################################
# PILOT TRAINING MISSION: AFTERBURNER
# 
# A single-ball timed training mission with no-hold flipper mechanics.
# 
# THEME: Afterburner training - flippers fire but cannot be held up
# BALLS: 1 (no-hold flippers - pulse only, no holding)
# TIMER: 120 seconds
# GI: Yellow → gradually shifts to Red with each step (afterburner fire effect)
# INSERT COLORS: Orange (active shots)
# PERK: Afterburner perk earned when step 9 completed, active for rest of ball
# CANNOT STACK WITH MULTIBALL
#
# NO-HOLD FLIPPER MECHANIC:
# Normal flippers are disabled after intro. Flipper buttons pulse coils
# via coil_player instead, so flippers fire up but immediately drop back.
# Player cannot hold flippers in the up position.
#
# MODE PROGRESSION (v3 - wide-open at the start, narrows to single
# shots by the end. Difficulty ramps via shrinking shot count, not
# just shot placement. Each step advances on ANY listed shot.):
# Step 1: LO, LR, SP, or CNT (Barrier)                        -   800K
# Step 2: RO (right ramp UP), 2X (Pilot Gear), TR, TL, or TWR -   900K
# Step 3: SP, CNT (Barrier), TWR, or TL (right ramp lowered)  - 1,000K
# Step 4: LL, LO, or LR                                       - 1,100K
# Step 5: TWR, TL, TO, or 2X (Pilot Gear) (top ramp raised)   - 1,300K
# Step 6: LR or SP (top ramp lowered)                         - 1,500K
# Step 7: RR or TWR                                           - 1,800K
# Step 8: LR only                                             - 2,600K
# Step 9: CNT (Barrier Target) only                           - 4,000K + perk
# TOTAL: 15,000,000 points (before multipliers)
#
# SERVO CONTROL (single servo move per step, no stagger needed):
# Step 2: Right ramp UP   (enables RO)
# Step 3: Right ramp DOWN (resets for later RR shot, step 7)
# Step 5: Top ramp UP     (enables TO)
# Step 6: Top ramp DOWN   (resets for later LR/step 8, no ramp dependency)
#
# GI PROGRESSION (afterburner heating effect):
# Start: All yellow
# Each step hit: Flash GI strobe, then set new GI state with more orange/red
# Scattered light changes simulate engine fire gradually intensifying
# Step 9: All red
#
# COMPLETION:
# Step 9 hit → afterburner_step_9 video plays (4 seconds)
# → mode ends → voice_afterburner_completed plays on voice bus
# No separate mode won video
#
# SHOT LIGHTS:
#   LL  = l_shot_left_lane       RR  = l_shot_right_orbit
#   LR  = l_shot_left_ramp       RO  = l_shot_right_orbit
#   LO  = l_shot_left_orbit      TWR = l_shot_tower_ramp
#   TR  = l_shot_middle_ramp     TO  = l_shot_middle_ramp
#   TL  = l_shot_upper_orbit     SP  = l_shot_spinner
#   2X  = l_shot_pilot_gear      CNT = l_shot_barrier
####################################################################################

mode:
  start_events: start_mode_pilot_training_mission_afterburner
  stop_events: 
    - afterburner_video_complete
    - timer_afterburner_failed_delay_complete
    - afterburner_drain_cleanup_complete
  priority: 600
  game_mode: true
  use_wait_queue: true

mode_settings:
  can_stack_with_multiball: false

####################################################################################
# BALL HOLD - Left lane post only (training mission pattern).
# Ball is held at c_left_lane_up_post (see coil_player below), NOT via
# bd_mode_scoop ball_holds. Barrier is left UP the entire mode, so CNT
# (barrier target) is hittable from Step 1 with no barrier_raise call.
####################################################################################

####################################################################################
# QUEUE RELAY PLAYER - Hold ball_ending until mode cleanup completes
####################################################################################

queue_relay_player:
  ball_ending{mode.pilot_training_mission_afterburner.active==True}:
    post: afterburner_ball_ending_hold
    wait_for: afterburner_drain_cleanup_complete
    priority: 1000

####################################################################################
# TIMERS
####################################################################################

timers:
  afterburner_timer:
    start_value: 120
    end_value: 0
    direction: down
    tick_interval: 1s
    start_running: false
    control_events:
      - event: afterburner_ball_released
        action: start
      - event: afterburner_complete
        action: stop
      - event: timer_afterburner_failed_delay_start
        action: stop
      - event: afterburner_drain_detected
        action: stop
      - event: lock_sequence_timer_pause
        action: pause
      # Resume gated to this timer's live phase. MPF start() can't tell paused
      # from stopped/never-started/completed, so an unconditional resume
      # revives it out of phase (and re-fires _complete if it already finished).
      - event: lock_sequence_timer_resume{current_player.afterburner_complete_flag==0 and current_player.afterburner_step_locked==0 and not device.timers.afterburner_intro_video_delay.running}
        action: start
      - event: mode_timers_idle_pause
        action: pause
      - event: mode_timers_resume{current_player.afterburner_complete_flag==0 and current_player.afterburner_step_locked==0 and not device.timers.afterburner_intro_video_delay.running}
        action: start

  afterburner_intro_video_delay:
    start_value: 0
    end_value: 5
    direction: up
    tick_interval: 1s
    control_events:
      - event: mode_pilot_training_mission_afterburner_started
        action: start
      - event: afterburner_skip_intro
        action: stop

  afterburner_complete_delay:
    start_value: 0
    end_value: 4
    direction: up
    tick_interval: 1s
    start_running: false
    control_events:
      - event: timer_afterburner_complete_delay_start
        action: start

  afterburner_failed_delay:
    start_value: 3
    end_value: 0
    direction: down
    tick_interval: 1s
    start_running: false
    control_events:
      - event: timer_afterburner_failed_delay_start
        action: start

  afterburner_drain_delay:
    start_value: 0
    end_value: 3
    direction: up
    tick_interval: 1s
    control_events:
      - event: afterburner_drain_detected
        action: start

####################################################################################
# VARIABLE PLAYER
####################################################################################

variable_player:
  ##############################################
  ## LEFT ORBIT SAFE RETURN — arm/clear (Steps 1 and 4, one of several valid shots)
  ##############################################
  orbit_left_safe_return_arm:
    orbit_left_shot_armed:
      action: set
      int: 1

  orbit_left_safe_return_clear:
    orbit_left_shot_armed:
      action: set
      int: 0

  mode_pilot_training_mission_afterburner_started:
    training_mission_active:
      action: set
      int: 1
    letter_collection_paused:
      action: set
      int: 1
    afterburner_step:
      action: set
      int: 0
    afterburner_complete_flag:
      action: set
      int: 0
    # Cleared at mode start; set the instant afterburner_failed fires so every
    # step's shot switches stop scoring immediately, even though the mode stays
    # "active" for the full lost-video delay (stop_events waits on
    # timer_afterburner_failed_delay_complete).
    afterburner_step_locked:
      action: set
      int: 0
    afterburner_shots_remaining:
      action: set
      int: 9
    afterburner_no_hold_active:
      action: set
      int: 0
    mode_points_scored:
      action: set
      int: 0
    training_missions_played:
      action: add
      int: 1
    training_afterburner_complete:
      action: set
      int: 1

  # Set no-hold flipper flag when ball released (after intro)
  afterburner_ball_released:
    afterburner_no_hold_active:
      action: set
      int: 1

  # Clear no-hold flipper flag on cleanup
  afterburner_cleanup:
    afterburner_no_hold_active:
      action: set
      int: 0

  ball_will_end{mode.pilot_training_mission_afterburner.active==True}:
    pilot_mode_drain_pending:
      action: set
      int: 1

  # Lock all shot scoring the instant the mode fails (timer expiry or drain
  # both route through this event). The mode stays "active" for the full
  # lost-video delay, so without this flag any switch matching the current
  # step still scores during the lost video even though the shots/lights
  # are already killed by afterburner_cleanup.
  afterburner_failed:
    afterburner_step_locked:
      action: set
      int: 1

  ##############################################
  ## Step scoring
  ## 500K → 550K → 600K → 700K → 800K → 900K → 1M → 1.2M → 2.25M
  ##############################################

  # Step 1: LO, LR, SP, or CNT - 800,000
  afterburner_step_1_complete:
    afterburner_step:
      action: set
      int: 1
    score: 800000 * current_player.total_scoring_multiplier
    mode_points_scored:
      action: set
      int: 800000 * current_player.total_scoring_multiplier
    afterburner_shots_remaining:
      action: add
      int: -1

  # Step 2: RO, 2X, TR, TL, or TWR - 900,000
  afterburner_step_2_complete:
    afterburner_step:
      action: set
      int: 2
    score: 900000 * current_player.total_scoring_multiplier
    mode_points_scored:
      action: set
      int: 900000 * current_player.total_scoring_multiplier
    afterburner_shots_remaining:
      action: add
      int: -1

  # Step 3: SP, CNT, TWR, or TL - 1,000,000
  afterburner_step_3_complete:
    afterburner_step:
      action: set
      int: 3
    score: 1000000 * current_player.total_scoring_multiplier
    mode_points_scored:
      action: set
      int: 1000000 * current_player.total_scoring_multiplier
    afterburner_shots_remaining:
      action: add
      int: -1

  # Step 4: LL, LO, or LR - 1,100,000
  afterburner_step_4_complete:
    afterburner_step:
      action: set
      int: 4
    score: 1100000 * current_player.total_scoring_multiplier
    mode_points_scored:
      action: set
      int: 1100000 * current_player.total_scoring_multiplier
    afterburner_shots_remaining:
      action: add
      int: -1

  # Step 5: TWR, TL, TO, or 2X - 1,300,000
  afterburner_step_5_complete:
    afterburner_step:
      action: set
      int: 5
    score: 1300000 * current_player.total_scoring_multiplier
    mode_points_scored:
      action: set
      int: 1300000 * current_player.total_scoring_multiplier
    afterburner_shots_remaining:
      action: add
      int: -1

  # Step 6: LR or SP - 1,500,000
  afterburner_step_6_complete:
    afterburner_step:
      action: set
      int: 6
    score: 1500000 * current_player.total_scoring_multiplier
    mode_points_scored:
      action: set
      int: 1500000 * current_player.total_scoring_multiplier
    afterburner_shots_remaining:
      action: add
      int: -1

  # Step 7: RR or TWR - 1,800,000
  afterburner_step_7_complete:
    afterburner_step:
      action: set
      int: 7
    score: 1800000 * current_player.total_scoring_multiplier
    mode_points_scored:
      action: set
      int: 1800000 * current_player.total_scoring_multiplier
    afterburner_shots_remaining:
      action: add
      int: -1

  # Step 8: LR only - 2,600,000
  afterburner_step_8_complete:
    afterburner_step:
      action: set
      int: 8
    score: 2600000 * current_player.total_scoring_multiplier
    mode_points_scored:
      action: set
      int: 2600000 * current_player.total_scoring_multiplier
    afterburner_shots_remaining:
      action: add
      int: -1

  # Step 9: CNT (Barrier Target) only - 4,000,000 - MODE WON + perk
  afterburner_step_9_complete:
    afterburner_step:
      action: set
      int: 9
    afterburner_complete_flag:
      action: set
      int: 1
    score: 4000000 * current_player.total_scoring_multiplier
    mode_points_scored:
      action: set
      int: 4000000 * current_player.total_scoring_multiplier
    afterburner_shots_remaining:
      action: add
      int: -1
    training_afterburner_won:
      action: set
      int: 1
    training_missions_won:
      action: add
      int: 1
    afterburner_perk_active:
      action: set
      int: 1

####################################################################################
# EVENT PLAYER - Mode flow and shot detection
####################################################################################

event_player:
  ##############################################
  ## MODE START SEQUENCE
  ##############################################
  mode_pilot_training_mission_afterburner_started:
    - afterburner_set_gi_step_0|200ms
    - afterburner_play_instructions_voice

  ##############################################
  ## SKIP INTRO - Both flippers pressed during intro
  ##############################################
  s_flipper_left_active{current_player.afterburner_step==0 and device.timers.afterburner_intro_video_delay.running and current_player.afterburner_step_locked==0}:
    - afterburner_check_skip_intro
  s_flipper_right_active{current_player.afterburner_step==0 and device.timers.afterburner_intro_video_delay.running and current_player.afterburner_step_locked==0}:
    - afterburner_check_skip_intro

  afterburner_check_skip_intro{device.switches.s_flipper_left.state and device.switches.s_flipper_right.state}:
    - afterburner_skip_intro

  # SKIP PATH: Stop intro timer, release ball, setup shots
  afterburner_skip_intro:
    - afterburner_ball_released
    - afterburner_setup_step_1

  # NORMAL PATH: Timer completes -> release ball AND setup shots
  timer_afterburner_intro_video_delay_complete:
    - afterburner_ball_released
    - afterburner_setup_step_1

  ##############################################
  ## NO-HOLD FLIPPERS
  ## Swap to no-hold flippers when ball is released (after intro).
  ## No-hold flippers pulse up then drop immediately (hold_power: 0.0).
  ## Defined in config_no_hold_flippers.yaml
  ## Restored to normal in afterburner_cleanup.
  ##############################################
  afterburner_ball_released:
    - disable_normal_flippers
    - enable_no_hold_flippers
    - ball_save_mode_timer_start
  ##############################################
  ## DRAIN HANDLING
  ##############################################
  afterburner_ball_ending_hold:
    - afterburner_failed
    - afterburner_drain_detected

  timer_afterburner_drain_delay_complete:
    - afterburner_drain_cleanup_complete
    - afterburner_cleanup

  ##############################################
  ## STEP 1: LO, LR, SP, or CNT (Barrier) — wide open start
  ##############################################
  afterburner_setup_step_1:
    - orbit_left_safe_return_arm

  s_ramp_left_exit_active{current_player.afterburner_step==0 and current_player.afterburner_step_locked==0}:
    - afterburner_step_1_complete
    - afterburner_step_1_shot_hit
    - afterburner_setup_step_2

  left_orbit_shot_hit{current_player.afterburner_step==0 and current_player.afterburner_step_locked==0}:
    - afterburner_step_1_complete
    - afterburner_step_1_shot_hit
    - afterburner_setup_step_2
    - orbit_left_safe_return_clear|700ms

  spinner_shot_made{current_player.afterburner_step==0 and current_player.afterburner_step_locked==0}:
    - afterburner_step_1_complete
    - afterburner_step_1_shot_hit
    - afterburner_setup_step_2

  s_barrier_target_active{current_player.afterburner_step==0 and current_player.afterburner_step_locked==0}:
    - afterburner_step_1_complete
    - afterburner_step_1_shot_hit
    - afterburner_setup_step_2

  ##############################################
  ## STEP 2: RO (right ramp UP), 2X (Pilot Gear), TR, TL, or TWR
  ##############################################
  afterburner_setup_step_2:
    - orbit_left_safe_return_clear
    - right_ramp_up

  s_orbit_right_active{current_player.afterburner_step==1 and current_player.afterburner_step_locked==0}:
    - afterburner_step_2_complete
    - afterburner_step_2_shot_hit
    - afterburner_setup_step_3

  s_flight_gear_target_active{current_player.afterburner_step==1 and current_player.afterburner_step_locked==0}:
    - afterburner_step_2_complete
    - afterburner_step_2_shot_hit
    - afterburner_setup_step_3

  s_ramp_inner_exit_active{current_player.afterburner_step==1 and current_player.afterburner_step_locked==0}:
    - afterburner_step_2_complete
    - afterburner_step_2_shot_hit
    - afterburner_setup_step_3

  s_orbit_upper_active{current_player.afterburner_step==1 and current_player.afterburner_step_locked==0}:
    - afterburner_step_2_complete
    - afterburner_step_2_shot_hit
    - afterburner_setup_step_3

  s_ramp_tower_exit_active{current_player.afterburner_step==1 and current_player.afterburner_step_locked==0}:
    - afterburner_step_2_complete
    - afterburner_step_2_shot_hit
    - afterburner_setup_step_3

  ##############################################
  ## STEP 3: SP, CNT (Barrier), TWR, or TL — right ramp lowered
  ##############################################
  afterburner_setup_step_3:
    - right_ramp_down

  spinner_shot_made{current_player.afterburner_step==2 and current_player.afterburner_step_locked==0}:
    - afterburner_step_3_complete
    - afterburner_step_3_shot_hit
    - afterburner_setup_step_4

  s_barrier_target_active{current_player.afterburner_step==2 and current_player.afterburner_step_locked==0}:
    - afterburner_step_3_complete
    - afterburner_step_3_shot_hit
    - afterburner_setup_step_4

  s_ramp_tower_exit_active{current_player.afterburner_step==2 and current_player.afterburner_step_locked==0}:
    - afterburner_step_3_complete
    - afterburner_step_3_shot_hit
    - afterburner_setup_step_4

  s_orbit_upper_active{current_player.afterburner_step==2 and current_player.afterburner_step_locked==0}:
    - afterburner_step_3_complete
    - afterburner_step_3_shot_hit
    - afterburner_setup_step_4

  ##############################################
  ## STEP 4: LL, LO, or LR
  ##############################################
  afterburner_setup_step_4:
    - orbit_left_safe_return_arm

  s_lane_left_active{current_player.afterburner_step==3 and current_player.afterburner_step_locked==0}:
    - afterburner_step_4_complete
    - afterburner_step_4_shot_hit
    - afterburner_setup_step_5

  left_orbit_shot_hit{current_player.afterburner_step==3 and current_player.afterburner_step_locked==0}:
    - afterburner_step_4_complete
    - afterburner_step_4_shot_hit
    - afterburner_setup_step_5
    - orbit_left_safe_return_clear|700ms

  s_ramp_left_exit_active{current_player.afterburner_step==3 and current_player.afterburner_step_locked==0}:
    - afterburner_step_4_complete
    - afterburner_step_4_shot_hit
    - afterburner_setup_step_5

  ##############################################
  ## STEP 5: TWR, TL, TO, or 2X (Pilot Gear) — top ramp raised
  ##############################################
  afterburner_setup_step_5:
    - orbit_left_safe_return_clear
    - top_ramp_up

  s_ramp_tower_exit_active{current_player.afterburner_step==4 and current_player.afterburner_step_locked==0}:
    - afterburner_step_5_complete
    - afterburner_step_5_shot_hit
    - afterburner_setup_step_6

  s_orbit_upper_active{current_player.afterburner_step==4 and current_player.afterburner_step_locked==0}:
    - afterburner_step_5_complete
    - afterburner_step_5_shot_hit
    - afterburner_setup_step_6

  s_orbit_lower_active{current_player.afterburner_step==4 and current_player.afterburner_step_locked==0}:
    - afterburner_step_5_complete
    - afterburner_step_5_shot_hit
    - afterburner_setup_step_6

  s_flight_gear_target_active{current_player.afterburner_step==4 and current_player.afterburner_step_locked==0}:
    - afterburner_step_5_complete
    - afterburner_step_5_shot_hit
    - afterburner_setup_step_6

  ##############################################
  ## STEP 6: LR or SP — top ramp lowered
  ##############################################
  afterburner_setup_step_6:
    - top_ramp_down

  s_ramp_left_exit_active{current_player.afterburner_step==5 and current_player.afterburner_step_locked==0}:
    - afterburner_step_6_complete
    - afterburner_step_6_shot_hit
    - afterburner_setup_step_7

  spinner_shot_made{current_player.afterburner_step==5 and current_player.afterburner_step_locked==0}:
    - afterburner_step_6_complete
    - afterburner_step_6_shot_hit
    - afterburner_setup_step_7

  ##############################################
  ## STEP 7: RR or TWR
  ##############################################
  s_ramp_right_exit_active{current_player.afterburner_step==6 and current_player.afterburner_step_locked==0}:
    - afterburner_step_7_complete
    - afterburner_step_7_shot_hit
    - afterburner_setup_step_8

  s_ramp_tower_exit_active{current_player.afterburner_step==6 and current_player.afterburner_step_locked==0}:
    - afterburner_step_7_complete
    - afterburner_step_7_shot_hit
    - afterburner_setup_step_8

  ##############################################
  ## STEP 8: LR only
  ##############################################
  s_ramp_left_exit_active{current_player.afterburner_step==7 and current_player.afterburner_step_locked==0}:
    - afterburner_step_8_complete
    - afterburner_step_8_shot_hit
    - afterburner_setup_step_9

  ##############################################
  ## STEP 9: CNT (Barrier Target) only
  ##############################################
  s_barrier_target_active{current_player.afterburner_step==8 and current_player.afterburner_step_locked==0}:
    - afterburner_step_9_complete
    - afterburner_step_9_shot_hit

  ##############################################
  ## GI RESTORE AFTER SHOT HIT FLASH
  ## Each shot hit fires the GI flash show, then restores to new step colors
  ##############################################
  afterburner_step_1_shot_hit:
    - afterburner_set_gi_step_1|300ms
  afterburner_step_2_shot_hit:
    - afterburner_set_gi_step_2|300ms
  afterburner_step_3_shot_hit:
    - afterburner_set_gi_step_3|300ms
  afterburner_step_4_shot_hit:
    - afterburner_set_gi_step_4|300ms
  afterburner_step_5_shot_hit:
    - afterburner_set_gi_step_5|300ms
  afterburner_step_6_shot_hit:
    - afterburner_set_gi_step_6|300ms
  afterburner_step_7_shot_hit:
    - afterburner_set_gi_step_7|300ms
  afterburner_step_8_shot_hit:
    - afterburner_set_gi_step_8|300ms
  afterburner_step_9_shot_hit:
    - afterburner_set_gi_step_9|300ms

  ##############################################
  ## TIMER EXPIRED - Mode failed
  ##############################################
  timer_afterburner_timer_complete:
    - afterburner_failed

  ##############################################
  ## MODE COMPLETION AND FAILURE
  ##############################################
  afterburner_complete:
    - afterburner_cleanup
    - timer_afterburner_complete_delay_start
    - afterburner_mode_ended

  timer_afterburner_complete_delay_complete:
    - afterburner_video_complete
    - pilot_mode_cleanup_complete

  afterburner_failed:
    - afterburner_cleanup
    - timer_afterburner_failed_delay_start
    - afterburner_mode_ended
    - orbit_left_safe_return_clear

  timer_afterburner_failed_delay_complete:
    - afterburner_video_complete
    - pilot_mode_cleanup_complete

  ##############################################
  ## STEP 9 COMPLETE → MODE WON
  ##############################################
  afterburner_step_9_complete:
    - afterburner_complete

  ##############################################
  ## MODE CLEANUP
  ##############################################
  afterburner_cleanup:
    - right_ramp_down
    - top_ramp_down
    - disable_no_hold_flippers
    - enable_normal_flippers

####################################################################################
# SOUND PLAYER - Voice Callouts ONLY (Music handled in base.yaml)
####################################################################################

sound_player:
  afterburner_play_instructions_voice:
    voice_afterburner_training_mission_instructions:
      bus: voice
      loops: 0

  afterburner_failed:
    voice_afterburner_failed:
      bus: voice
      loops: 0

  # NOTE: voice_afterburner_completed is played from base.yaml on 
  # mode_pilot_training_mission_afterburner_stopped because the mode
  # is tearing down when timer_afterburner_complete_delay_complete fires

####################################################################################
# SLIDE PLAYER - Mode Slides (Godot GMC)
# afterburner_instructions plays the ENTIRE mode (from start to end)
# afterburner_shots_remaining shows remaining shot count
# afterburner_perk_active shown on victory
####################################################################################

slide_player:
  mode_pilot_training_mission_afterburner_started:
    afterburner_timer:
      action: play
      priority: 1000
    afterburner_instructions:
      action: play
      priority: 850
    afterburner_shots_remaining:
      action: play
      priority: 800

  ##############################################
  ## Step Videos + mode_points_scored display
  ##############################################
  afterburner_step_1_shot_hit:
    afterburner_step_1:
      action: play
      priority: 800
    mode_points_scored:
      action: play
      priority: 840
      expire: 2s

  afterburner_step_2_shot_hit:
    afterburner_step_1:
      action: remove
    afterburner_step_2:
      action: play
      priority: 800
    mode_points_scored:
      action: play
      priority: 840
      expire: 2s

  afterburner_step_3_shot_hit:
    afterburner_step_2:
      action: remove
    afterburner_step_3:
      action: play
      priority: 800
    mode_points_scored:
      action: play
      priority: 840
      expire: 2s

  afterburner_step_4_shot_hit:
    afterburner_step_3:
      action: remove
    afterburner_step_4:
      action: play
      priority: 800
    mode_points_scored:
      action: play
      priority: 840
      expire: 2s

  afterburner_step_5_shot_hit:
    afterburner_step_4:
      action: remove
    afterburner_step_5:
      action: play
      priority: 800
    mode_points_scored:
      action: play
      priority: 840
      expire: 2s

  afterburner_step_6_shot_hit:
    afterburner_step_5:
      action: remove
    afterburner_step_6:
      action: play
      priority: 800
    mode_points_scored:
      action: play
      priority: 840
      expire: 2s

  afterburner_step_7_shot_hit:
    afterburner_step_6:
      action: remove
    afterburner_step_7:
      action: play
      priority: 800
    mode_points_scored:
      action: play
      priority: 840
      expire: 2s

  afterburner_step_8_shot_hit:
    afterburner_step_7:
      action: remove
    afterburner_step_8:
      action: play
      priority: 800
    mode_points_scored:
      action: play
      priority: 840
      expire: 2s

  # Step 9 hit: Show step 9 video, remove HUD
  # No mode_won video - step_9 video IS the completion video (4 seconds)
  # NOTE: afterburner_perk_active slide is triggered by qualifier via player variable change
  afterburner_step_9_shot_hit:
    afterburner_step_8:
      action: remove
    afterburner_step_9:
      action: play
      priority: 800
    afterburner_timer:
      action: remove
    afterburner_instructions:
      action: remove
    afterburner_shots_remaining:
      action: remove
    mode_points_scored:
      action: play
      priority: 840
      expire: 2s

  ##############################################
  ## Failure - remove HUD slides
  ##############################################
  afterburner_failed:
    afterburner_timer:
      action: remove
    afterburner_instructions:
      action: remove
    afterburner_shots_remaining:
      action: remove

  # Safety cleanup on mode stop
  mode_pilot_training_mission_afterburner_stopped:
    afterburner_timer:
      action: remove
    afterburner_instructions:
      action: remove
    afterburner_shots_remaining:
      action: remove
    # NOTE: afterburner_perk_active slide is managed by pilot_mission_qualifier

####################################################################################
# SHOW PLAYER - Flashing shot lights and GI effects
####################################################################################

show_player:
  ##############################################
  ## AFTERBURNER INSERT - White pulse during mode play
  ##############################################
  afterburner_ball_released:
    afterburner_insert_pulse:
      show: afterburner_pulse
      loops: -1
      speed: 1
      show_tokens:
        led: l_mode_afterburner
        color: white
      key: afterburner_pulse

  ##############################################
  ## STEP 1: LO, LR, SP, CNT (ORANGE flash)
  ## Every step below stops ALL possible flash keys first, then starts
  ## exactly what's needed - safer than tracking "stop just the previous
  ## one(s)" now that most steps flash several shots at once.
  ##############################################
  afterburner_setup_step_1:
    stop_ll: {show: sync_flash_mode, action: stop, key: mode_l_shot_left_lane}
    stop_lr: {show: sync_flash_mode, action: stop, key: mode_l_shot_left_ramp}
    stop_lo: {show: sync_flash_mode, action: stop, key: mode_l_shot_left_orbit}
    stop_rr: {show: sync_flash_mode, action: stop, key: mode_l_shot_right_orbit}
    stop_twr: {show: sync_flash_mode, action: stop, key: mode_l_shot_tower_ramp}
    stop_tl: {show: sync_flash_mode, action: stop, key: mode_l_shot_upper_orbit}
    stop_to: {show: sync_flash_mode, action: stop, key: mode_l_shot_middle_ramp}
    stop_sp: {show: sync_flash_mode, action: stop, key: mode_l_shot_spinner}
    stop_2x: {show: sync_flash_mode, action: stop, key: mode_l_shot_pilot_gear}
    stop_cnt: {show: sync_flash_mode, action: stop, key: mode_l_shot_barrier}
    lo_mode_flash_s1:
      show: sync_flash_mode
      key: mode_l_shot_left_orbit
      sync_ms: 1000
      loops: -1
      show_tokens:
        led: l_shot_left_orbit
        color: FF6600
    lr_mode_flash_s1:
      show: sync_flash_mode
      key: mode_l_shot_left_ramp
      sync_ms: 1000
      loops: -1
      show_tokens:
        led: l_shot_left_ramp
        color: FF6600
    sp_mode_flash_s1:
